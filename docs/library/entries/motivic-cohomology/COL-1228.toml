[entry]
id = "COL-1228"
title = "Exact derived Nisnevich-to-etale finite motivic comparison"
kind = "comparison"
section = "motivic-hypercohomology"
order = 90
primary = "AlgebraicGeometry.PresheafWithTransfers.motivicFiniteEtaleCohomologyComparison"
review = "author_checked"
statement = '''
Exact ordinary etale sheafification induces an additive comparison from the
existing finite motivic cohomology group to derived-Hom into the actual etale
sheafification of its finite motivic cone, in every integer cohomological degree.
The free representing source is identified canonically after change of topology.
The comparison is natural in the actual scheme restriction and coefficient maps,
and commutes with the original signed Bockstein, including its normalization
from finite motivic cohomology in degree p to integral motivic cohomology in
degree p + 1 and the corresponding actual etale derived-Hom groups.
Composing with COL-1232 at the identity etale neighborhood gives an additive map
to derived-Hom from the terminal full-small free source into the literal
restriction of that same finite motivic cone.
'''
proof = '''
Compose the Nisnevich sheafification adjunction with the ordinary change-of-topology
adjunction. Uniqueness of left adjoints identifies this composite with etale
sheafification and hence identifies the lifted free representing sources.
Apply the exact functor's native unbounded derived lift, then its single-complex,
localization and shift comparison isomorphisms. Package the source and target
identifications as natural isomorphisms and use functoriality of derived-Hom
precomposition and postcomposition. Normalize the signed cone boundary using
the native localization-shift and iterated-shift comparison isomorphisms.
The canonical finite-cone comparison identifies its etale image with the
original signed Bockstein on the target cone. For the full-small target, compose this
comparison with exact restriction at the original smooth scheme, using its
canonical identity-neighborhood source transport.
'''
scope = '''
The source is motivicFiniteCohomology itself and the target uses
motivicFiniteEtaleSheafComplex, not an unspecified isomorphic complex.
The full-small composite has source motivicFiniteCohomology and target
motivicFiniteFullSmallEtaleCohomology; its coefficient complex is exactly
motivicFiniteFullSmallEtaleComplex. It permits arbitrary integer p and natural
q and n, including n = 0, with three independent derived-category universes.
These are comparison maps, not proofs that they are isomorphisms.
No invertibility or perfectness hypothesis is needed for this map.
The degree-normalized Bockstein square retains the original finite and integral
motivic groups and the actual etale sheafified complexes. It holds for every
integer p and natural q and n, including n = 0, with independent Nisnevich and
smooth-etale derived-category universes. This consecutive-degree compatibility
is established for the smooth Nisnevich-to-etale comparison; no additional
full-small Bockstein compatibility is asserted here.
It does not identify the target with Tate coefficients or ordinary small-etale
cohomology and does not use the ordinary right adjoint as a derived right adjoint.
'''
