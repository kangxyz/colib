[entry]
id = "COL-0213"
title = "Homotopy extension for realized simplicial monomorphisms"
kind = "theorem"
section = "geometric-realization"
order = 290
statement = "Every actual geometric realization of a simplicial monomorphism has the homotopy extension property. The proof starts from the explicit geometric simplex-boundary retraction and extends lifting along the actual relative skeletal cell complex."
scope = 'All simplicial sets in an arbitrary universe, including infinite-dimensional ones. No compactness of the whole realization or auxiliary cofibration hypothesis is assumed. The canonical realized map is retained. [@HatcherAT, Chapter 0, Proposition 0.16, page 15] supplies the cellular HEP construction being adapted; the formalization uses the actual pinned simplicial relative cell complex and finite-simplex comparison.'
review = "author_checked"
