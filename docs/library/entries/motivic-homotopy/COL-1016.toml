[entry]
id = "COL-1016"
title = "Conditional affine-line representability"
kind = "comparison"
section = "affine-line-representatives"
order = 10
primary = "AlgebraicGeometry.MotivicHomotopy.affineLineCochainRepresentativeHomEquiv"
review = "author_checked"
statement = '''
Let \(S\) be a quasi-separated scheme with the smooth Nisnevich site. Use
the simplicial Yoneda presheaf of the native affine line over \(S\) in the
coefficient universe as the interval \(I\). Write \(Q_I\) for the pointed
stalkwise interval localization. For a cochain complex \(K\) of ordinary
Nisnevich abelian sheaves and an integer \(p\), let \(R_p(K)\) be the
pointed representative formed from the shifted K-injective resolution.

Suppose that for every pointed simplicial presheaf \(X\), the actual
pointed cylinder projection \(\pi_X\colon X\times I\,/\,(*\times I)\to X\)
induces a bijection on reduced hypercohomology in degree \(p\) with
coefficients in \(K\). Then
\[
\operatorname{Hom}(Q_I X,Q_I R_p(K))
  \simeq \widetilde{\mathbb H}^{p}_{\mathrm{Nis}}(X,K).
\]
For the freely pointed smooth representable \(h_{U,+}\), the target
identifies with ordinary Nisnevich hypercohomology of \(U\).
Precomposition by the image of an actual smooth-site map
\(f\colon U\to V\) corresponds to restriction along \(f\).
'''
proof = '''
Use the natural stalkwise K-injective comparison of COL-1014 on \(X\)
and its pointed cylinder. Naturality identifies precomposition by
\(\pi_X\) with the indicated cohomology pullback, so its bijectivity makes
the coefficient representative interval-local. Maps into that object
are preserved by the interval localization. On a smooth representable,
the reduced derived chains identify with the original free representing
sheaf in degree zero. That identification gives ordinary hypercohomology
and its original restriction.
'''
scope = '''
The coefficient sheaves take values in abelian groups in universe \(u+1\)
for \(S\colon\mathrm{Scheme}\,u\). The sheafification, Grothendieck abelian
structure, and independent derived category universe are explicit. The
cohomological hypothesis concerns all pointed cylinders in the given degree.
'''
