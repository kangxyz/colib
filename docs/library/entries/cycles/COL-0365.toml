[entry]
id = "COL-0365"
title = "Full componentwise identity laws"
kind = "theorem"
section = "finite-correspondences"
order = 40
primary = "Stacks.Chow.incidenceTorPairing_graphIdentity_right"
statement = '''
Let \(X,Y\) be smooth schemes over a field \(k\), with \(Y\) separated,
and let \(\alpha\in\operatorname{Cor}_k(X,Y)\). If \(Y\) has finitely many
generic points, the sum \(\Delta_Y\) of its diagonal component cycles satisfies
\(\Delta_Y\circ\alpha=\alpha\). If \(X\) is also separated and has finitely
many generic points, its diagonal sum satisfies \(\alpha\circ\Delta_X=\alpha\).
'''
scope = '''
Each diagonal is `graphCorrespondenceOfComponents` applied to the identity.
The finiteness hypothesis is separate for each unit law. Quasi-compact smooth
schemes satisfy it by Noetherian component finiteness. An infinite identity sum
is not asserted, and empty or disconnected schemes are allowed.
'''
review = "author_checked"
