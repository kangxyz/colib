[entry]
id = "COL-1041"
title = "The actual signed principal polynomial correspondence"
kind = "definition"
section = "principal-polynomial-families"
order = 20
primary = "Stacks.Chow.PrincipalPolynomialFamily.correspondence"
review = "author_checked"
statement = '''
Let \(X\) be affine over \(\operatorname{Spec}R\), let \(q:C\to X\)
be proper, and let \(V\hookrightarrow C\) be a quasi-affine open smooth
of relative dimension one over \(X\). Let \(Y\to\operatorname{Spec}R\)
be separated and locally of finite type, with a compatible morphism
\(g:V\to Y\). A function \(f\) on a boundary neighborhood restricting
to \(1\) on the whole nonempty boundary, together with the full boundary
cover condition, constructs an actual native finite correspondence from
\(X\times_R\mathbb A^1_R\) to \(Y\). Assume the actual ambient
parameter product \(C\times_R\mathbb A^1_R\) is integral and Noetherian.
The correspondence is the signed sum of the principal coefficients of
\(t f+(1-t)\), pushed from their original integral supports with their
actual residue-field degrees.
'''
proof = '''
COL-1039 proves finiteness of each nonzero native principal-cycle support.
The coefficient can be nonzero only at coheight one. Finiteness supplies
an algebraic residue-field extension, hence a closed point in the actual
smooth curve fibre. Native local dimension one and preservation of generic
points by flat morphisms show that the support maps onto a component of the
source. Thus finiteness and component dominance are produced rather than
assumed. Lift each whole support into the retained open and use \(g\) to
form its actual map into the source-target product. Each summand equals
the native finite pushforward of the original signed coefficient. Sum over
the finite support set; distinct supports with the same image add their
weighted coefficients.
'''
scope = '''
The carrier is Stacks.Chow.finiteCorrespondences for the original source
and target structure maps. The cycle is the native principalCycle and every
pushforward retains its residueDegree. The integralComponentAt support is
the native reduced integral subscheme supported on the closure of its
generic point; principal orders remain in the signed coefficients. This does not reduce the input boundary,
whose normalization remains equality of sections on the full scheme.
No support flatness, finiteness or dominance certificate is supplied.
Integrality and Noetherianness of the actual parameter product are explicit.
Graph-endpoint composition, Tor/local-length comparison, identification
with the existing affine-cylinder maps and the final homotopy identity are
not asserted here.
'''
