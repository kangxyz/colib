[entry]
id = "COL-0234"
title = "Finite admissible resolutions and strata"
kind = "definition"
section = "exact-categories"
order = 110
statement = '''A finite admissible resolution records conflations \(X_{j+1}\hookrightarrow P_j\twoheadrightarrow X_j\), with each \(P_j\) and the final syzygy in the resolving class. The length counts these conflations. The adjacent strata admit resolutions of length at most one under the stated closure hypotheses.'''
scope = "The existing exact structure on native categories and short complexes. Resolving kernel closure requires both middle and quotient objects in the property. The objectwise hypothesis has no uniform bound."
review = "author_checked"
