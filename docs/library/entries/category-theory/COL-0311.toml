[entry]
id = "COL-0311"
title = "Coherent opposite cylinders on actual complexes"
kind = "definition"
section = "waldhausen-categories"
order = 1550
statement = "The degree-reversing equivalence transports the identity-cone cylinder to the literal opposite of the complex subcategory under negative-shift closure. The comparison for exact degreewise functors, including perfect-complex restriction along an open immersion, preserves both endpoints and the weak projection."
scope = "Independent object and morphism universes in the generic abelian categories. The opposite structure is compatible with the original zero-corner cofiber squares. Native Stacks perfect complexes on every ringed space of the stated universe have actual perfect kernels, so opposite cofibrations are ambient epimorphisms. Actual restriction of native perfect complexes along any open immersion has the proved coherent comparison, without finiteness, separatedness, regularity or resolution assumptions. The global finite-free-retract predicate called IsStrictlyPerfect in Stacks is not substituted for the source's bounded finite-locally-free predicate; that strict-to-perfect instance remains outside this item's scope. No localization or K-equivalence is asserted."
review = "author_checked"
provenance = "quillen"
primary = "CategoryTheory.Waldhausen.oppositeComplexJointData"
