[entry]
id = "COL-0353"
title = "Cocartesian sections and identity evaluation"
kind = "theorem"
section = "functor-constructions"
order = 40
statement = '''For a Cat-valued pseudofunctor \(F\) and an object \(R\), evaluation at \(1_R\) identifies the category of actual cocartesian sections over \(R/\mathcal C\) with \(F(R)\). Precomposition along coslice functors gives restriction with literal identity and composition laws.'''
scope = """
Strict sections are native functor fibers, and cocartesian sections form their
full subcategory. Full faithfulness is proved by cocartesian extension and
uniqueness; canonical pullback sections establish essential surjectivity.
Evaluation transitions are natural isomorphisms with their actual fiber maps.
Chosen zero evaluation and reindexing retain literal equality. This generic
foundation assumes only an actual pseudofunctor and the stated zero-preservation
hypotheses, not an evaluation equivalence profile. It does not construct the
geometric bounded-flat coefficient row, its Waldhausen structure or spectra.
"""
review = "author_checked"
provenance = "quillen"
