[entry]
id = "COL-0074"
title = "Kernels and pullbacks of conflations"
kind = "proposition"
section = "exact-categories"
order = 30
statement = '''Pulling back \(K\xrightarrow{k}B\xrightarrow{p}D\) along \(A\to D\) gives a conflation \(K\to A\times_D B\to A\). Its first arrow is the specified pullback lift of \((0,k)\). A kernel of any deflation determines a conflation with that actual kernel arrow.'''
scope = "The selected exact structure is on a preadditive category with finite biproducts and independent object and hom universes. The given pullback square and lift of zero and the original kernel map are retained. The same-kernel assertion adapts the dual of Proposition 2.12 (i) implies (iv); the remaining statements implement kernel universal properties and isomorphism closure. This is not Proposition 2.15 on mixed admissible pullbacks, nor a claim that arbitrary kernels or cokernels exist. Source correspondence was checked against the cited scope on 2026-11-05; this does not record independent mathematical review or compilation."
review = "author_checked"
