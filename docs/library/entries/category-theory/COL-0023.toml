statement = '''An exact additive functor maps each selected conflation to a conflation in the target exact structure. The identity functor and the composite of two exact functors carry the same interface.'''
scope = "Chosen exact structures at the stated universes; this interface does not require preservation of arbitrary finite limits or colimits. Preservation of admissible pushout and pullback squares is not asserted here. Source correspondence was checked against the cited clauses on 2026-11-05; this does not record independent mathematical review or compilation."
