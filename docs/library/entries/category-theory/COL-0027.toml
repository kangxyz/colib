statement = '''An additive localization at the isomorphisms modulo a Serre class preserves short exact sequences. This equips the supplied localization functor with the canonical abelian exact structures, using the exactness clause of [@stacks, Tag 02MS].'''
scope = 'An actual functor L between abelian source and target categories with independent object and hom universes, an additive structure on L, and its localization instance. This packages the exact-functor clause of [@stacks, Tag 02MS] and does not independently construct the full categorical quotient universal property. Source correspondence was checked against the cited clauses on 2026-11-05; this does not record independent mathematical review or compilation.'
