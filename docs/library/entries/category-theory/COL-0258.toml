[entry]
id = "COL-0258"
title = "Actual identity-cone cylinder for complex subcategories"
kind = "theorem"
section = "waldhausen-categories"
order = 1510
statement = '''For \(f\colon K\to L\), the joint cylinder has middle term \(\operatorname{Cone}(1_K)\oplus L\). The source endpoint maps by the native cone inclusion and \(f\), the target endpoint by the right biproduct inclusion, and the weak projection is \(\pi_L\). The target endpoint is a section of that projection.'''
scope = "The replete full complex subcategory contains zero and is closed under extensions, actual mapping cones and the positive unit shift. Its fine weak maps are isomorphisms and coarse weak maps are genuine quasi-isomorphisms. The middle object, endpoint inclusions, quotient maps and cone signs are the original Mathlib maps. Genuine relative cofibrations and exact middle functors are proved; no row factorization or K-equivalence is assumed."
review = "author_checked"
provenance = "quillen"
