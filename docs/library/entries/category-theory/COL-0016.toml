title = "Mixed pullbacks of admissible maps"
kind = "proposition"
section = "exact-categories"
order = 40
statement = '''In a pullback of an inflation \(i\colon A\hookrightarrow T\) along a deflation \(p\colon B\twoheadrightarrow T\), the actual projection \(A\times_T B\to B\) is an inflation. This is the mixed pullback needed to compose exact spans.'''
scope = "The specified pullback square and its actual projection maps. This is derived from the exact-structure axioms, not assumed as a new axiom. Source correspondence was checked against the cited clauses on 2026-11-05; this does not record independent mathematical review or compilation."
