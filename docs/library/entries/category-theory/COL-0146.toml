statement = '''The diagonal \(S\)-set uses diagrams \([n]\times\operatorname{Int}([n])\to\mathcal C\), with zero diagonal objects, cofibration rows, quotient pushouts and pointwise weak transitions. Simplicial operators reindex the diagrams and exact functors act by postcomposition.'''
scope = "Diagonal objects need only be zero, not equal to the specified zero object. This is an unnormalized model, not an identification with the strict original S-construction. Arbitrary predicates define this lower simplicial-set construction. COL-0154 separately identifies it with the diagonal of actual pointwise-weak row nerves under a Waldhausen structure. Maps retain the same-universe assumptions. Realization and homotopy results have their own subsequent items; no strict chosen-zero normalization is asserted. Source correspondence was checked against the cited scope on 2026-11-05; this does not record independent mathematical review or compilation."
