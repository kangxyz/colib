[entry]
id = "COL-1223"
title = "The effective geometric subcategory"
kind = "definition"
section = "geometric-motives"
order = 10
primary = "AlgebraicGeometry.MotivicHomotopy.EffectiveGeometricMotives"
review = "author_checked"
source_checked_on = "2026-11-13"
statement = '''
Let \(k\) be a perfect field. The category
\(DM_{\mathrm{gm}}^{\mathrm{eff}}(k)\) is realized as the thick full
subcategory of \(DM_-^{\mathrm{eff}}(k)\) generated by the motives
\(M(X)\) of smooth separated finite-type \(k\)-schemes.
'''
scope = '''
The coefficient ring is \(\mathbb Z\). The definition uses the singular
representatives in the existing category of bounded-above effective
motives. This is the realization in the last assertion of
[@Voevodsky2000TriangulatedMotives, Theorem 3.2.6].
'''
proof = '''
Take the triangulated envelope of the object property given by the
image of the smooth motive functor. The envelope is closed under
retracts. Its universal property characterizes the smallest thick
subcategory containing the original smooth motives.
'''
