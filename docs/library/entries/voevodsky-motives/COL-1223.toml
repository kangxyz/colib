[entry]
id = "COL-1223"
title = "Effective geometric motives as a thick subcategory"
kind = "definition"
section = "geometric-motives"
order = 10
primary = "AlgebraicGeometry.MotivicHomotopy.EffectiveGeometricMotives"
review = "author_checked"
source_checked_on = "2026-11-16"
statement = '''
Let \(k\) be a perfect field. Write \(M(X)\) for the integral motive of a
smooth separated finite-type \(k\)-scheme \(X\) in \(DM_-^{\mathrm{eff}}(k)\).
The category \(DM_{\mathrm{gm}}^{\mathrm{eff}}(k)\) is the smallest thick
full subcategory of \(DM_-^{\mathrm{eff}}(k)\) containing every \(M(X)\).
It has the ambient morphisms between its objects. Its distinguished
triangles are the ambient distinguished triangles with all three objects
in the subcategory.
'''
scope = '''
Here \(M(X)\) is the Nisnevich singular complex of the transfer representable.
The motive functor acts on finite correspondences via these same
representatives. In [@Voevodsky2000TriangulatedMotives, Definition 2.1.1]
the effective geometric category is presented by a localization of
bounded complexes of finite correspondences and then idempotent
completion. The embedding of [@Voevodsky2000TriangulatedMotives, Theorem 3.2.6]
takes the smooth generators of that presentation to these singular
motives. The definition here starts with their thick full subcategory
in the target of that embedding.
'''
proof = '''
Take the triangulated envelope of the object property given by the image
of the effective motive functor. Its objects are closed under shifts,
extensions in distinguished triangles and retracts. For a thick
triangulated object property \(P\), the envelope lies in \(P\) precisely
when every \(M(X)\) belongs to \(P\). The full subcategory inherits its
morphisms and triangles through the inclusion.
'''
