[entry]
id = "COL-0360"
title = "Laurent unit homotopy on affine sections"
kind = "theorem"
section = "bass-k-theory-and-geometric-delooping"
order = 20
statement = '''The actual constant Laurent inclusion carries a native zero-preserving exact section-model
map. Its pointwise forward Laurent unit yields a based structure-compatible self-homotopy
of the entire native iterated-S section prespectrum map. Every coefficient morphism commutes
strictly with the model maps and intertwines the units through the equality-transported
comparison. Consequently the whole track, every time-slice prespectrum map, and the explicitly
endpoint-transported homotopy are coefficient-natural. Degree zero retains the compact-open
`Path` and its independent loop coordinate; positive degrees retain actual iterated-S realizations.
'''
scope = '''Arbitrary commutative rings and coefficient morphisms. The inclusion is `LaurentPolynomial.C`,
the coefficient map is the existing `laurentCoefficientMap`, and the forward action is the
existing Laurent-coordinate unit. Structure coordinate and homotopy time remain independent.
No supplied action, square, naturality bundle, legacy-model adapter or K-group-only replacement.
This does not construct the two-chart Bass seed, an evaluation comparison, supported
localization or Thomason--Trobaugh 7.4.
'''
review = "author_checked"
provenance = "quillen"
primary = "AlgebraicGeometry.Scheme.Modules.boundedAboveFlatAffineSectionLaurentUnitHomotopy"
