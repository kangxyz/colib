[entry]
id = "COL-0598"
title = "Thomason\u2013Trobaugh localization for an open immersion"
kind = "theorem"
section = "thomason-trobaugh-localization"
order = 1
statement = "Let $j:U\\hookrightarrow X$ be an open immersion with $U$ quasi-compact and $X$ quasi-compact and quasi-separated, and put $Z=X\\setminus U$. Write $K^{B}$ for the Bass construction of perfect-complex K-theory in this library, evaluated at $\\operatorname{Spec}(\\operatorname{ULift}\\mathbb Z)$. The support map and restriction, with their specified null-homotopy, give a stable fiber sequence\n\\[K^{B}(X\\text{ on }Z)\\longrightarrow K^{B}(X)\\longrightarrow K^{B}(U).\\]\nPrecisely, the induced map from the supported construction to the homotopy fiber is a stable equivalence, hence an isomorphism on $\\pi_d^{\\mathrm{st}}$ for every $d\\in\\mathbb Z$. For an open pair over integral Spec the same fiber-lift statement holds at every integral Spec-row coefficient. Here support denotes ambient perfect complexes acyclic on $U$, not K-theory of a closed subscheme."
scope = '''
This is the ordinary current-stage lift, without an auxiliary open. The proof preserves the original iterated, twisted and current models and their same-null comparisons. This proves the ordinary localization sequence of [@ThomasonTrobaugh1990, Theorem 7.4] for this particular model of the Bass construction. This result does not identify this model with an independently specified nonconnective K-theory spectrum or point-set tower, and does not give additional formulas for the negative-degree boundary maps. The ordinary-colimit presentation is treated separately in COL-0599 and COL-0600.
'''
proof = '''
Use the three actual stable Spec telescope comparisons and their support-forgetting,
full-restriction and whole-null squares in the fiber-lift stability equivalence. Ordinary
coefficient full-open localization gives stability of the original iterated lift. Transfer it
through the existing iterated-twisted and current-twisted equivalences, then use the integral
terminal structural maps and identity coefficient to obtain the current integer-base result.
'''
proof_kind = "outline"
review = "author_checked"
primary = "AlgebraicGeometry.Scheme.Modules.ParameterFullCurrentNull.currentLift_integer_isStableEquivalence"
provenance = "quillen"
