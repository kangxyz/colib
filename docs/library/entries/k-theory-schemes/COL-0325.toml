[entry]
id = "COL-0325"
title = "Relative approximation by flat perfect complexes"
kind = "comparison"
section = "derived-pullback-and-flat-resolutions"
order = 30
statement = "On a quasi-compact ringed space, a chain map $A\\to E$ from a bounded-above flat perfect complex to a perfect complex factors as\n\\[A\\rightarrowtail B\\xrightarrow{\\sim}E,\\]\nwhere $B$ is bounded-above flat perfect, the first map is an admissible cofibration with bounded-above flat perfect quotient, the second is a quasi-isomorphism, and the composite is the given chain map. Thus inclusion of the flat model satisfies approximation and induces an isomorphism on $K_n$ for every $n\\ge0$. The comparison is induced by inclusion, not an unspecified isomorphism of groups."
scope = '''Only `CompactSpace` of the underlying ringed space is assumed for approximation and K-comparison, in particular only `CompactSpace` X for schemes. No quasi-separatedness, resolution property, lower term bound, finite local freeness or quasicoherence of the flat terms is required. Relative factorization between termwise upper-bounded complexes is geometric-hypothesis-free and retains the explicit bound b+1 and strict original triangle. It is constructed through projective presheaves and exact sheafification, rather than assumed or inferred from object replacements.'''
review = "author_checked"
