[entry]
id = "COL-0334"
title = "Supported fine comparison and the actual degree-zero image"
kind = "theorem"
section = "supported-localization"
order = 40
statement = '''For an open immersion \(j\colon U\to X\) and an auxiliary open T, form the actual
complexes derived-isomorphic to restrictions of global perfect complexes
acyclic on T. Genuine supported roofs give its exact structure and actual
incoming factorization. Supported shift complements yield cofinality. If X
is quasi-compact and quasi-separated and \(W=j(U)\cup T\) is quasi-compact,
the actual supported relative-coarse restriction is bijective in positive
K-degrees and injective in degree zero. Degree zero identifies exactly with
the image of the actual fine global restriction. The existing coarse boundary
then gives all three fine exactness positions, including \(K_1\) to \(K_0\). Compact U
and compact T suffice for the compact-union hypothesis.
'''
scope = '''Native Stacks perfectness, literal `Scheme.Modules` restriction, actual ambient
monomorphisms and quasi-isomorphisms. Original global witnesses retain support;
no image object is replaced by an arbitrary local supported perfect object.
Native opposite closure, exactness and coherent cylinder comparison discharge
the dual-approximation input omitted from COL-0331. The always-valid degree-zero
range and quotient-image identities require no compactness. Their identification
with coarse \(K_0\) itself additionally uses the proved geometric injectivity.
The union-compact form requires no compactness of U. This is fixed-pair group
comparison and connective exactness, not a coherent supported prespectrum fiber,
full [@ThomasonTrobaugh1990, 5.1.2]/Bass, arbitrary-pair naturality, or general nonzero cover reflection.
Compilation and review status are recorded separately in the migration note.
'''
review = "author_checked"
provenance = "quillen"
