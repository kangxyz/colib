[entry]
id = "COL-0380"
title = "Affine evaluation with support"
kind = "comparison"
section = "affine-and-global-section-models"
order = 30
statement = '''
Let \(R\) be a commutative ring and \(j\colon U\hookrightarrow\operatorname{Spec}R\)
an open immersion. Identity evaluation identifies cocartesian affine bounded-above-flat
perfect sections whose evaluated complex is acyclic on \(U\) with the actual
bounded-above-flat perfect complexes acyclic on \(U\). Both directions are exact:
cofibrations have short exact quotients in this same supported class, and weak
equivalences are quasi-isomorphisms. Lift evaluation to the common small universe
and normalize it at the original pointwise section zero. This specified prespectrum
map has a canonically normalized inverse, with whole coherent left and right inverse
homotopies. It is a complete weak equivalence at every level, including level zero,
and induces isomorphisms on stable homotopy groups in every integer degree.
'''
scope = '''
No compactness assumption on \(U\), Noetherianity, resolution property, nontriviality
or supplied evaluation equivalence is required. Support means actual acyclicity after
termwise open restriction. The explicit normalization isomorphism compares original
evaluation with its rebased functor; it does not identify independently chosen zeros
by equality. The inverse tracks retain independent level, homotopy time and structure
time. This is the fixed-open bounded-flat section comparison. Coefficient and
relative-open squares, all-perfect approximation, Bass completion and
[@ThomasonTrobaugh1990, 7.4] remain separate. The eventual supported theory concerns
\(K^B(X\text{ on }X\setminus U)\), not \(K^B(X\setminus U)\).
'''
proof = '''
Restrict the categorical evaluation equivalence of COL-0355 by the inverse image
of open acyclicity, then flatten the nested full subcategory. Exact restriction
preserves short exact sequences, so supported bounded-flat complexes form an
extension-closed exact subcategory. Transport this Waldhausen structure to the
actual supported sections with their pointwise zero. The original unit and counit,
pasted with the canonical zero normalization isomorphisms, give coherent inverse
prespectrum homotopies. Their level homotopy equivalences include level zero;
levelwise complete weak equivalence gives the integer-graded stable equivalence.
'''
