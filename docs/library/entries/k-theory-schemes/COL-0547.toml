id = "COL-0547"
title = "Global evaluation and the parameter tensor-model unit comparison"
kind = "comparison"
section = "tensor-unit-prisms"
order = 60
statement = "Global identity evaluation lifts to an exact chosen-zero-preserving small Waldhausen model map and preserves the original unit action. Its tensor-evaluation isomorphism compares genuine tensor pullback with internal global reindexing followed by evaluation and intertwines their scalar actions. At each fixed product scheme parameter, these comparisons give an isomorphism from the underlying internal coefficient model functor to the normalized evaluated tensor model functor. This actual isomorphism intertwines the corresponding model-unit transformations."
scope = "Arbitrary schemes and the displayed fixed factor and parameter. The final comparison is an objectwise natural isomorphism between the two specified underlying functors; no naturality in the external scheme parameter is claimed by this batch. It preserves genuine unit tensor, evaluation and selected zeros. This is not a returned/qualified generator, an iterated Bass comparison, a stable equivalence theorem or TT localization."
proof_kind = "outline"
proof = "Lift global identity evaluation through the small model and normalize its chosen zero. The rebasing lemma preserves the original scalar action. The tensor unitor and geometric evaluation comparison produce the displayed isomorphism between the internal coefficient route and the normalized evaluated tensor route. Their component scalar equations imply the unit-intertwining equation for that isomorphism."
review = "author_checked"
primary = "AlgebraicGeometry.Scheme.Modules.ParameterTensorEvaluationRow.internalTensorModelIso_unit"
provenance = "quillen"
