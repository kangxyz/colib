[entry]
id = "COL-0335"
title = "Connective localization with auxiliary support"
kind = "theorem"
section = "support-and-connective-localization"
order = 140
statement = "Let $j:U\\hookrightarrow X$ be an open immersion and $T\\subseteq X$ an auxiliary open. Suppose $X$ is qcqs and $j(U)\\cup T$ is quasi-compact. Put $W=X\\setminus T$ and $Z=X\\setminus j(U)$. The supported relative-open model is a connective image cover: its map to the fine theory of $U$ with support in $W\\cap U$ is an isomorphism in positive stable degrees and injective in degree zero, with exactly the restriction image. The homotopy fiber of $K(X\\text{ on }W)\\to K^{\\mathrm{im}}(U\\text{ on }W\\cap U;X)$ is stably equivalent to the theory of perfect complexes acyclic on $T\\cup j(U)$, that is, supported on $W\\cap Z$. This comparison preserves the chosen acyclic null-homotopy and the degree-one to degree-zero boundary. Separate quasi-compactness of $U$ is not required by this compact-union form."
scope = '''Fixed additional-support open pair; compact ambient space; quasi-separated ambient space;
compact union \(j(U)\cup T\). The strong endpoint does not assume `CompactSpace` U.
Compact U and compact T give wrappers. Native derived geometry and supported cofinality
supply the fine profile; no roof, density, complement, cover-profile or fiber-equivalence
proof fields are assumed. The actual coarse model is the [@ThomasonTrobaugh1990, 5.1.2] image cover in this
compact-union setting, following [@ThomasonTrobaugh1990, 5.2]. Support is ambient perfect complexes acyclic on
the indicated open, not K-theory of a closed subscheme. Support-forgetting boundary and
arbitrary global-pair naturality, general two-piece supported gluing, and Bass [@ThomasonTrobaugh1990, 7.4] are
excluded. No identification of a signed stable connecting homomorphism is asserted here.
'''
review = "author_checked"
provenance = "quillen"
