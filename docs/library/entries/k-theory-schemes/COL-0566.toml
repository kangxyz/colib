[entry]
id = "COL-0566"
title = "Comparison of geometric and normalized Bass telescopes"
kind = "theorem"
section = "thomason-trobaugh-localization"
order = 40
statement = '''
For a Model-valued functor on schemes and a Laurent coefficient track on its associated
prespectrum diagram, the actual current-to-normalized telescope map is a stable equivalence at
every scheme.
'''
scope = '''
An arbitrary contravariant scheme-indexed zero-preserving Model functor and the specified whole
Laurent track. This comparison requires no open immersion or quasi-compactness assumption.
'''
proof_kind = "outline"
proof = '''
Equip the actual strict and normalized stages with their finite Model T1 instances. The
current-transition identity supplies the commuting stage squares, and finite normalization
supplies their stable components. Apply the telescope stable-equivalence theorem to precisely
those maps and transitions.
'''
review = "author_checked"
primary = "KTheory.Bass.SchemeNaturalSeed.model_telescopeMap_stable"
provenance = "quillen"
source_checked_on = "2026-11-11"
