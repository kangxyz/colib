[entry]
id = "COL-0323"
title = "Bounded Above Flat Perfect Complexes"
kind = "theorem"
section = "perfect-pullback"
order = 20
statement = "Native perfect sheaf complexes with an upper term bound and flat terms form an inherited exact and Waldhausen category, with actual quotient cofibrations, quasi-isomorphisms and constructed joint cylinders. Its literal inclusion induces the canonical connective K-map. A cohomologically upper-bounded perfect complex has an actual bounded-above flat perfect augmentation with the same bound; quasi-compactness alone supplies this bound for every perfect complex."
scope = '''Ringed spaces with the native sheaf universe, in particular all schemes. No lower term bound, finite local freeness or quasicoherence of the terms is required. Closure, cylinders and inclusion K-maps require no geometric hypothesis. Actual object replacements require only quasi-compactness; the sharper bounded-input theorem retains the chosen upper bound. The strict-to-flat-to-perfect composite is the original inclusion K-map, including degree zero. COL-0325 proves relative factorization and, under `CompactSpace` alone, App2 and bijectivity of this same flat-to-perfect K-map in every natural degree, including zero.'''
review = "author_checked"
