[entry]
id = "COL-0614"
title = "Coherent G2 with finite residue fields"
kind = "theorem"
section = "coherent-g-theory-localization"
order = 40
statement = 'For a finite field F, the actual public coherent G2 group of Spec F is trivial. For a Dedekind domain with finite actual height-one residue fields, the original public generic G2 pullback is injective, also for a supplied fraction field and its original algebra map.'
scope = 'Actual affine global sections identify this unchanged public coherent group with the previously proved native finite-module G2 group. This is a degree-two statement, not a computation of all higher coherent G-groups. Generic G1 injectivity is neither assumed nor concluded.'
review = "author_checked"
provenance = "quillen"
