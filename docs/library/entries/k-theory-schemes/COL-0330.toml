[entry]
id = "COL-0330"
title = "Connective localization for a quasi-compact open immersion"
kind = "theorem"
section = "support-and-connective-localization"
order = 90
statement = "Let $j:U\\hookrightarrow X$ be an open immersion, with $X$ quasi-compact and quasi-separated and $U$ quasi-compact. Put $Z=X\\setminus U$. The connective relative-open model $K^{\\mathrm{im}}(U;X)$ fits into a stable fiber sequence\n\\[K(X\\text{ on }Z)\\longrightarrow K(X)\\longrightarrow K^{\\mathrm{im}}(U;X).\\]\nIts map to the fine open theory is an isomorphism on positive stable homotopy groups and is injective in degree zero, with image $\\operatorname{im}(K_0(X)\\to K_0(U))$. The supported fiber map retains the restriction null-homotopy and is a stable equivalence in every integer degree; this gives the connective localization sequence with the indicated image-valued degree-zero tail."
scope = '''Fixed open immersion; compact ambient and open spaces; quasi-separated ambient space; an
arbitrary chosen derived category of modules on the open. Native qcqs geometry discharges
roofs and complements. Uses the existing coarse model as the [@ThomasonTrobaugh1990, 5.1.1] image-cover target,
following the proof in [@ThomasonTrobaugh1990, 5.2], rather than stipulating a separate cover or a spectrum profile.
The support is perfect complexes on the ambient scheme acyclic on the open, not K-theory of
the closed complement. No additional closed support ([@ThomasonTrobaugh1990, 5.1.2]), arbitrary open-pair pullback
naturality, or Bass nonconnective theorem ([@ThomasonTrobaugh1990, 7.4]) is claimed.
'''
review = "author_checked"
provenance = "quillen"
