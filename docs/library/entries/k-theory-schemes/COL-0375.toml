title = "Finite affine Bass connectivity and cone-fiber excision"
kind = "theorem"
section = "affine-bass-constructions"
order = 110
statement = '''Let \(E\) be the strict bounded-above-flat affine-section prespectrum functor, \(B\) the polynomial and Laurent Bass endofunctor, and \(D_i=B^i(E)\). For every commutative ring \(R\), every finite stage \(i\), and every level \(m\), the inclusion of the literal chosen point of \(D_i(R)_m\) has the homotopy extension property. For every point \(x\in D_i(R)_{n+i+2}\), the homotopy set \(\pi_k(D_i(R)_{n+i+2},x)\) is a singleton whenever \(k<n+2\). Equivalently, at a level \(m\geq i+2\), this holds for \(k+i<m\).

For any prespectrum map \(f:D_i(R)\to D_j(S)\), the canonical map \(D_i(R)\to\operatorname{hofib}(D_j(S)\to\operatorname{Cone}(f))\), whose path is the original cone cylinder, is \((2n+2)\)-connected at level \(n+\max(i,j)+2\). It induces an isomorphism on stable homotopy groups in every integer degree. This applies to every actual coefficient map and every iterated Laurent-seed transition.'''
scope = '''All point HEP and finite connectivity premises are discharged for the actual affine section construction. The initial degree-zero based path space and all positive levels are included in the point HEP assertion. Vanishing is at every point above the explicit stage-dependent cutoff. The comparison retains its actual source, projection and full cone-cylinder path. No uniform connectivity or point HEP of the telescope, comparison with classical negative K-groups, supported localization, or [@ThomasonTrobaugh1990, 7.4] is asserted.'''
proof = '''Transport finite connectivity along genuine homotopy-pullback fibers and their basepoint paths. Double-cylinder gap connectivity and actual cylinder paths give all-point vanishing. Collapse the literal chosen-point interval through its HEP pushout to obtain the actual reduced pushout, and use the analogous cone reduction. The strict-square Bass operation preserves chosen-point HEP and loses one degree through parameter looping. Induction on the whole diagram and offset gives the displayed stage bound from the proved Waldhausen S-level growth. Apply genuine finite cone-fiber excision and the eventual linear-connectivity criterion for signed stable groups.'''
