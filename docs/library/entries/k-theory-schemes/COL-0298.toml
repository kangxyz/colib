[entry]
id = "COL-0298"
title = "Perfect complexes with open support"
kind = "comparison"
section = "support-and-connective-localization"
order = 20
statement = "For any open immersion, native perfect complexes with weak equivalences detected by actual restriction form the relative coarse Waldhausen structure. Its acyclic subcategory is exactly equivalent to the actual perfect complexes acyclic on the open. The induced equivalence on every nonnegative K-group preserves the original supported inclusion, and original restriction factors through the coarse K-map. A scalar restricting to a specified unit has its original signed cone in the supported category; the positive Laurent open preserves the forward T coordinate on the existing native schemes."
scope = '''\(j\colon Y\to X\) is any open immersion of schemes in the same universe; n : Nat includes zero. The underlying category is the existing full category of native Stacks perfect chain complexes, with ambient Mono cofibrations. Fine weak equivalences are genuine `QuasiIso`; coarse weak equivalences are detected by literal degreewise `Scheme.Modules.restrictFunctor` j. Support means acyclic on the specified open. Neither quasi-compactness, quasi-separatedness, regularity, Noetherianity nor a scalar non-zero-divisor hypothesis is assumed. Scalar cones preserve ambient short exact sequences. Coordinates use the existing `additiveGroupBaseChange` and `multiplicativeGroupBaseChange`, not new affine or Laurent models. This item does not prove the relative fiber theorem, identify coarse K with fine K of the open, define the independent [T] K-one class, or compute its connecting boundary.'''
review = "author_checked"
provenance = "quillen"
