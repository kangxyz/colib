[entry]
id = "COL-0358"
title = "Affine evaluation over a fixed ring"
kind = "comparison"
section = "affine-and-global-section-models"
order = 20
statement = "For each commutative ring \\(R\\), actual affine bounded-above-flat cocartesian section evaluation followed by the genuine `AsSmall` lift defines the unchanged native prespectrum map. Its actual exact categorical inverse is canonically normalized at the chosen zero. The original unit and counit induce two complete based prespectrum inverse homotopies, retaining every level and independent homotopy and structure-map parameters. The same forward map is a homotopy equivalence at every natural level including zero, and induces an isomorphism of stable homotopy groups in every integer degree. Its K-equivalence has the exact lifted-evaluation followed by `AsSmall`-descent formula, and agrees with the original zero-space and stable maps in every natural K-degree including zero."
scope = '''
For each commutative ring \(R\), use the original bounded-above-flat affine
section model and the bounded-above-flat perfect-complex Waldhausen category
on \(\operatorname{Spec}R\), followed by the genuine small-model lift.
The original evaluation functor, its actual inverse, and the canonical
normalization at the chosen zeros are retained. Stable homotopy groups are
integer-graded; the stated K-equivalence formulas concern natural K-degrees.
This fixed-ring comparison does not assert coefficient naturality, relative-open
comparison or its composition and unit laws, supported-open evaluation, or
all-perfect approximation. No Laurent seed, Bass identification, negative
localization, or [@ThomasonTrobaugh1990, 7.4] is asserted.
'''
review = "author_checked"
provenance = "quillen"
