[entry]
id = "COL-0338"
title = "Strict-square cone-loop functor and finite Bass diagram iteration"
kind = "definition"
section = "bass-construction"
order = 10
statement = """
The reduced double mapping cylinder of actual loop-prespectrum maps has quotient topology,
continuous loop structure, coherent overlap homotopy and strict functorial descent.
A strict commuting square gives its actual comparison, reduced cone and parameter-looped
cone functor. The canonical source nullhomotopy is natural as a whole coherent homotopy.
A specified scalar self-track gives the original null/unit/null seed, natural under an
explicit equality of the scalar tracks at every time. A strictly natural square of evaluation
objects gives an endofunctor on prespectrum diagrams, its finite iterates and natural
transition squares for a supplied seed transformation, including stage zero.
"""
scope = """
All maps use native Topology.LoopPrespectrum and Mathlib Arrow and functor categories.
Cylinder time, structure-loop time and scalar-track time are independent. The source null
is constructed, not assumed. The scalar track and its naturality, evaluation-square functor
and diagram seed transformation are explicit inputs. This does not construct scheme
coefficient squares or units, rectify homotopy-commuting diagrams, build a telescope,
identify nonconnective K-theory, prove Bass localization or prove Thomason-Trobaugh 7.4.
"""
review = "author_checked"
provenance = "quillen"
