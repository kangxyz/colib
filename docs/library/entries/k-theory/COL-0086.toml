[entry]
id = "COL-0086"
title = "Object loops and the Grothendieck comparison"
kind = "proposition"
section = "quillen-k-theory"
order = 60
statement = '''
The canonical object loops \(\ell_X\) in \(BQ\mathcal E\) satisfy
\(\ell_B=\ell_A\ell_C\) for a conflation \(A\hookrightarrow B\twoheadrightarrow C\),
and their classes commute pairwise. Hence
\[
[X]\longmapsto[\ell_X]
\]
defines a homomorphism \(K_0^{\mathrm{Gr}}(\mathcal E)\to\pi_1(BQ\mathcal E,0)\).
Its image is the subgroup generated by these loops; surjectivity and
injectivity are established separately in COL-0162 and COL-0240.
'''
scope = 'The category is preadditive with finite biproducts, a selected exact structure, and independent object and hom universes. Each loop traverses the whole-apex edge and then the reverse zero-apex edge. Mathlib multiplication is retained without identifying it verbatim with the printed loop convention. The existing pi1-to-path-quotient equivalence is not an algebraic Grothendieck comparison. Only the canonical object-loop subgroup is proved commutative. The adaptation covers the object-loop relations and comparison-map construction, not the whole conclusion of Proposition 6.2: no injectivity, surjectivity onto all homotopical \(K_{0}\), equality of the subgroup with the ambient group, or full algebraic \(K_{0}\)-to-fundamental-group isomorphism is established. Source correspondence was checked against the cited scope on 2026-11-05; this does not record independent mathematical review or compilation.'
review = "author_checked"
