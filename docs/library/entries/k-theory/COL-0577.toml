[entry]
id = "COL-0577"
title = "Finite Bass iteration preserves exact equivalences"
kind = "theorem"
section = "bass-delooping-diagrams-and-functoriality"
order = 150
statement = '''
Let \(\eta\colon F\to G\) be a map of zero-preserving Waldhausen Model
diagrams. If every component \(\eta_X\) is the forward functor of an
equivalence whose inverse is exact, then its induced map on every finite
strict Bass iterate is a stable equivalence at each coefficient object \(X\).
The forward functors are the given components, rather than replacement equivalences.
'''
scope = '''
Exact categorical equivalences whose forward functors are exactly the given zero-preserving model
maps induce stable equivalences of every finite Bass iterate; the inverse functors must be exact.
The general linear-growth version retains its topology and growth hypotheses.
'''
proof_kind = "outline"
proof = '''
Supply the established point HEP, T1 and all-point growth properties of the original iterated-S
models to finite Bass preservation, then identify the actual forward map with the
exact-equivalence comparison.
'''
review = "author_checked"
primary = "KTheory.Bass.modelDiagramIterate_map_isStableEquivalence_of_exactEquivalence"
provenance = "quillen"
