[entry]
id = "COL-0257"
title = "Bounded-complex acyclic and single-term decomposition"
kind = "theorem"
section = "waldhausen-k-theory"
order = 350
statement = "The original fine K-group of bounded termwise-P complexes is the product of the original fine acyclic K-group and the term K-group. The forward map is literally the product of the actual acyclic-inclusion and degree-zero single-insertion KMaps."
scope = "An abelian ambient category with independent object and hom universes and a zero-containing, replete, extension-closed and kernel-of-surjections-closed object property. Finite term and cycle evaluation equivalences retain actual coordinates; their adjacent incidence and alternating Euler maps give unique finite decompositions. Compact based cubes and homotopies pass to the bounded union without a categorywide uniform bound. Every nonnegative K-degree, including zero. Weak maps in this decomposition are isomorphisms, not quasi-isomorphisms."
review = "author_checked"
provenance = "quillen"
