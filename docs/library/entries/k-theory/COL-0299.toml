id = "COL-0299"
title = "Original automorphism K-one and whole change-of-weak transport"
kind = "theorem"
section = "waldhausen-k-theory"
order = 86
statement = "The actual weak-object composition cube gives the specified endpoint-relative homotopy from the concatenated weak-arrow square paths to the literal composite square path. Normalizing a weak-endomorphism loop at its actual object component defines its original K-one class, with class(f ≫ g) = class(g) * class(f), intertwining-isomorphism invariance and an automorphism monoid homomorphism. Both weak-endomorphism and automorphism classes are natural for the canonical KMap of every exact functor in the stated universe range, without a strict chosen-zero equality. For nested weak equivalences, the original changeWeak map preserves whole bisimplex families, displayed cofiber tracks, weak-arrow squares and identity-cofiber suffix paths; the prescribed component equivalence is natural in every homotopy degree."
scope = "C : Type u with Category.{v} C, independent u and v, and the original realization universe max u v. Composition retains arbitrary objects A, B, D, weak f : A ⟶ B and g : B ⟶ D, all comparison/nerve/object-loop coordinates and the exact half-interval concatenation. Individual classes use weak endomorphisms; automorphismKOneHom has native domain Aut A. Exact-functor statements retain C D : Type u and Category.{v} on both categories. Only intermediate whole-square naturality and the of_zeroEq lemma require F.obj V.zero = W.zero; final KMap statements use canonical rebasing. NestedWeakEquivalences retains equal cofibrations, equal chosen zeros and fine-to-coarse weakness. Cofiber and identity-suffix branches require HasZeroMorphisms C; general bisimplex, weak-square and K-one branches do not. Cofiber transport keeps both displayed cofibration certificates and both pushout certificates for the same i, q and Q. Bisimplex degrees and barycentric coordinates, suffix times s,t and component degree n remain arbitrary. No fibration, canonical-comparison weakness, cylinder, connectivity, saturation, extension or factorization premise is added. This supplies general inputs only, with no scalar, Laurent, supported-boundary, boundary-sign or nonconnective conclusion."
