[entry]
id = "COL-0270"
title = "The K-zero obstruction to an exact-functor image"
kind = "comparison"
section = "waldhausen-k-theory"
order = 80
statement = '''
Let \(F\colon\mathcal C\to\mathcal D\) be exact, and assume the stated
functorial factorization on the small-model target. The associated coarse
K-zero grading identifies
\[
K_0(\mathcal D_{\mathrm{coarse}})\cong
K_0(\mathcal D)/\operatorname{im}(F_*).
\]
Under the Grothendieck comparison, change of weak equivalences is the
quotient map. In particular it is surjective and its kernel is precisely
\(\operatorname{im}(F_*)\).
'''
scope = '''Exact functor between original Waldhausen categories with independent object and morphism universes and genuine functorial factorization of the target `AsSmall` structure. The original exact-functor K-zero image is exactly the kernel of the original `changeWeak` `KMap`, which is surjective. No density, localization-fibration or source-factorization hypothesis is added; no higher-degree image-quotient or spectrum statement is asserted. The native quotient, range inclusion and universe lowering remain explicit.'''
review = "author_checked"
provenance = "quillen"
