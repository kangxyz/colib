[entry]
id = "COL-0002"
title = "Additivity on short exact sequences"
statement = '''
For every short exact sequence \(0\to A\to B\to C\to0\), the object classes in
the Grothendieck group satisfy \([B]=[A]+[C]\).
'''
scope = "The relation clause of the definition."
review = "author_checked"
kind = "lemma"
section = "grothendieck-groups"
order = 20
