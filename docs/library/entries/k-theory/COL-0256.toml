id = "COL-0256"
title = "Waldhausen approximation"
kind = "theorem"
section = "additivity-approximation-and-comparison-theorems"
order = 40
statement = '''
Let \(F\colon\mathcal C\to\mathcal D\) be an exact functor reflecting weak
equivalences (App1) and satisfying the cofibration factorization condition
(App2). Assume target two-out-of-three and the stated exact joint-cylinder
data on the source. The induced map on Waldhausen deloopings is a weak
homotopy equivalence, and
\[
F_*\colon K_n(\mathcal C)\xrightarrow{\sim}K_n(\mathcal D)\quad(n\geq0).
\]
The forward homomorphism is the canonically based map of \(F\).
'''
scope = '''Source and target categories share object and morphism universe bounds, which remain independent. The target weak equivalences satisfy two-out-of-three, and the source has the stated genuine exact joint-cylinder data. App1/App2 does not silently supply cylinder data. Actual relative flags, quotient-row lifting and finite-poset comma cones prove the row hypotheses; complete weak Theorem A and weak bisimplicial realization retain the original maps. Native `AsSmall` transports only universe bounds and returns to the unchanged original delooping. K-zero is included. This is the weak-equivalence and connective K-map conclusion, not a chosen homotopy inverse or a nonconnective theorem. Author source comparison checked against pinned Quillen c561118b and [@Waldhausen1985, Theorem 1.6.7] on 2026-11-06; compilation and independent mathematical review are separate evidence.'''
review = "author_checked"
