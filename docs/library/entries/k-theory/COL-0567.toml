[entry]
id = "COL-0567"
title = "Preservation of a selected nullhomotopy under normalization"
kind = "theorem"
section = "bass-delooping-normalization-and-telescopes"
order = 60
statement = '''
Finite cone–loop normalization preserves a selected diagram nullhomotopy:
its comparison square commutes for every spectrum level, every point and
every null time \(t\in[0,1]\). The conclusion identifies the prescribed
nullhomotopies themselves, not only their endpoints or homotopy classes.
'''
scope = '''
Any category-indexed composable pair of prespectrum maps, a chosen DiagramNullHomotopy and a
square functor. The statement preserves the selected null itself, not merely its homotopy class.
'''
proof_kind = "outline"
proof = '''
Write the strict iterated null at a fixed time as the induced time-slice map. Apply stage-map
naturality to that same time slice, and rewrite the normalized side with the normalized-null
time-slice identity. Their composite is the stated pointwise equality for arbitrary time.
'''
review = "author_checked"
primary = "KTheory.Bass.NormalizedStageMap.stageMap_null"
provenance = "quillen"
source_checked_on = "2026-11-11"
