[entry]
id = "COL-0028"
title = "Localization of Grothendieck groups by a Serre class"
kind = "theorem"
section = "resolution-devissage-and-serre-localization"
order = 10
statement = '''
Let \(\mathcal P\) be a Serre class in an abelian category \(\mathcal A\), and
let \(L\colon\mathcal A\to\mathcal B\) be an additive localization at the
maps invertible modulo \(\mathcal P\). Then \(K_0(L)\) is surjective and
\[
\ker K_0(L)=\langle[P]\mid P\in\mathcal P\rangle.
\]
It induces an isomorphism from the quotient of \(K_0(\mathcal A)\) by this
subgroup to \(K_0(\mathcal B)\), sending the residue class of \([A]\) to \([L(A)]\).
'''
scope = '''Abelian source and target categories with independent object and hom universes, a Serre class P, and an additive localization functor L at `P.isoModSerre`. The transported equivalence equals the actual quotient lift. [@stacks, Tag 02MX(1)] is used through the pinned Stacks proof and the inclusion-image comparison; no claim about [@stacks, Tag 02MX(2)], inclusion injectivity, or homotopy-theoretic K-groups is made. Source correspondence was checked against the cited clauses on 2026-11-05; this does not record independent mathematical review or compilation.'''
review = "author_checked"
