[entry]
id = "COL-0219"
title = "Waldhausen additivity"
kind = "theorem"
section = "additivity-approximation-and-comparison-theorems"
order = 20
statement = '''
Let \(F\hookrightarrow G\twoheadrightarrow H\) be a cofibration sequence
of exact functors between Waldhausen categories. For every \(n\geq0\),
\[
G_*(x)=F_*(x)H_*(x),\qquad x\in K_n(\mathcal C).
\]
The homotopy on realized S-constructions compares the middle functor with
\(H\amalg F\). Its based version, the product comparison and commutativity
identify this map with the displayed subobject-then-quotient product.
'''
scope = 'Source and target categories have the same object and morphism universe bounds, Waldhausen structures, and binary coproducts in the target. Exactness, objectwise cofiber pushout squares and the relative comparison cofibration condition are retained. No comparison-equivalence or surjectivity assumption appears in the final theorem. The ordinary subdivision comparison is proved, and the actual product comparison identifies coproduct with the existing group multiplication. The intermediate sum is quotient-before-subobject; proved commutativity gives the original F then H order, including K-zero. This is an adaptation of [@WeibelKBook, V, Additivity Theorem 1.2 and proof, page 2], without a strict normalized S-construction or full Quillen-Waldhausen comparison.'
review = "author_checked"
