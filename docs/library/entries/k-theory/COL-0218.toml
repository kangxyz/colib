[entry]
id = "COL-0218"
title = "The based additivity homotopy"
kind = "definition"
section = "additivity-approximation-and-comparison-theorems"
order = 10
statement = "A genuine cofibration sequence of exact functors gives a three-stage homotopy after ordinary horizontal subdivision, relative to the actual chosen-zero point. Its endpoint is the common normalized separated coproduct of the quotient and subobject functors."
scope = 'The input is objectwise cofiber pushout data and the relative cofibration condition, with no K-theory or realization hypothesis. Every stage has a proved constant chosen-zero track. The deformation uses the actual mixed ordinal cylinder and coherent endpoint isomorphisms. The cofibration-sequence definition admits independent category universes; the realized deformation uses common source and target object and morphism universe bounds. It is a proof construction for [@WeibelKBook, V, Definition 1.1(b) and Theorem 1.2, pages 1-2], not a strict S-model comparison.'
review = "author_checked"
