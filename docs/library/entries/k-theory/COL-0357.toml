[entry]
id = "COL-0357"
title = "Prespectrum invariance under exact equivalence"
kind = "comparison"
section = "waldhausen-k-theory"
order = 100
statement = '''
An equivalence of small Waldhausen categories, exact in both directions
and preserving the forward chosen zero strictly, induces a homotopy
equivalence at every level of its K-theory prespectrum map. The inverse
is canonically zero-normalized; unit and counit provide structure-compatible
inverse homotopies. The induced zero-space and stable maps agree with the
canonical K-theory map in every nonnegative degree.
'''
scope = '''Native `WideSubcategory` of `SmallWaldhausenCategory.preservesZero` only. Direct-small and `AsSmall` presentations are compared by a proved categorical isomorphism and functorial square. Original target formulas use the actual lifted exact equivalence and `AsSmall` K-equivalence, respecting independent original object and morphism universes. The concrete two-zero indiscrete consumer detects nonliteral inverse-zero preservation and actual rebasing; it is not a nonzero K-group computation. No supplied geometric equivalence profile, actual affine evaluation, Bass identification or [@ThomasonTrobaugh1990, 7.4] conclusion is asserted.'''
review = "author_checked"
provenance = "quillen"
