statement = "A genuine equivalence of native small Waldhausen categories, exact in both directions and strictly preserving the forward chosen zero, induces an actual homotopy equivalence at every level of its unchanged prespectrum map. The canonical zero-normalized inverse, actual unit and counit give both whole structure-compatible inverse homotopies. The canonical K-map in every degree, including zero, agrees with the zero-space and stable maps."
scope = "Native WideSubcategory of SmallWaldhausenCategory.preservesZero only. Direct-small and AsSmall presentations are compared by a proved categorical isomorphism and functorial square. Original target formulas use the actual lifted exact equivalence and AsSmall K-equivalence, respecting independent original object and morphism universes. The concrete two-zero indiscrete consumer detects nonliteral inverse-zero preservation and actual rebasing; it is not a nonzero K-group computation. No supplied geometric equivalence profile, actual affine evaluation, Bass identification or TT7.4 conclusion is asserted."
