id = "COL-0292"
title = "The actual stable localization and its K-map criterion"
kind = "theorem"
section = "waldhausen-k-theory"
order = 70
statement = "The native loop prespectra admit their actual coherent-homotopy quotient and categorical localization at all-integer stable equivalences. Every functor respecting those whole homotopies and inverting those stable equivalences has a constructed strict universal lift, uniquely determined by its composite. An original exact Waldhausen functor becomes invertible in this localization exactly when its original KMap is bijective in every nonnegative degree, including K-zero."
scope = "The construction uses Mathlib's existing categorical quotient and localization, retaining the native prespectra and actual integer stable-group functors. The universal target has independent object and morphism universes. The original Waldhausen structures retain their common independent universe pair and normalized exact-functor maps; canonical zero rebasing introduces no strict chosen-zero premise. Identity, composition, weak-transformation invariance and the original K-map comparison are preserved. Positive-degree equivalences alone do not suffice without K-zero. The inverse is categorical, not an asserted continuous inverse prespectrum map. No model structure, triangulation, nonconnective completion or new spectrum model is claimed."
review = "author_checked"
provenance = "quillen"
