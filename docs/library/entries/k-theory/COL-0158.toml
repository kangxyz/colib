[entry]
id = "COL-0158"
title = "Functoriality of Waldhausen K-theory"
kind = "proposition"
section = "waldhausen-k-theory"
order = 40
statement = '''
After rebasing by the unique isomorphism of zero objects, every exact
functor \(F\colon\mathcal C\to\mathcal D\) induces a canonical homomorphism
\(F_*\colon K_n(\mathcal C)\to K_n(\mathcal D)\). For all \(n\geq0\),
\[
(\mathrm{id})_*=\mathrm{id},\qquad (G\circ F)_*=G_*\circ F_*.
\]
Pointwise weak natural transformations give equal homomorphisms, and the
zero functor gives the trivial homomorphism. Thus \(K_n\) is group-valued
functorial on small Waldhausen categories with exact functors.
'''
scope = '''The original exact functors need not preserve chosen zeros strictly. Functor rebasing is explicit and does not normalize the `IsZero` S-model. Equality of maps uses the actual conjugated weak transformation and based realization homotopy. C, D and intermediate categories retain the common object and hom universes; the packaged category is small. No arbitrary basepoint-path independence or strict-model comparison is asserted. Source correspondence was checked on 2026-11-05; compilation and independent review are recorded separately.'''
review = "author_checked"
