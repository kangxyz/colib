[entry]
id = "COL-0354"
title = "\\(T_1\\) separation of finite Bass constructions"
kind = "theorem"
section = "bass-delooping-diagrams-and-functoriality"
order = 20
statement = '''
Reduced mapping cones of based maps between \(T_1\) spaces are \(T_1\).
Reduced double mapping cylinders of loop-prespectrum maps are \(T_1\)
at each level, and parameter looping preserves this property. Consequently,
if a prespectrum diagram has \(T_1\) levels, every finite strict Bass
iterate does as well, including stage zero and level zero. No injectivity
or Hausdorff hypothesis on the maps is required.
'''
scope = '''No injectivity, Hausdorff, point HEP, cofibration, or closed-map hypothesis is imposed.
Quotient normal forms compute fibers without replacing their topologies. A checked consumer
forms the literal tower from an arbitrary supplied seed, applies COL-0350 in every integer
stable degree, and retains the actual stage inclusion equality. Original small-Waldhausen
rows discharge the initial \(T_1\) premise using the existing native realization and path proofs.
A supplied proved seed square gives actual comparison naturality, not stable equivalence of
iterated maps. No seed existence, geometric Laurent coefficient row, point HEP, excision,
nonbasepoint transport, Bass localization or [@ThomasonTrobaugh1990, 7.4] is asserted.
'''
review = "author_checked"
provenance = "quillen"
