[entry]
id = "COL-0254"
title = "Waldhausen fibration"
kind = "theorem"
section = "waldhausen-fibration-and-boundary-maps"
order = 30
statement = '''
Let \(v\subseteq w\) be nested Waldhausen weak-equivalence classes on
\(\mathcal C\), with the same cofibrations and chosen zero. Write \(\mathcal C^w\)
for the full subcategory of objects weakly equivalent to zero for \(w\), equipped
with the fine class \(v\). Under the coarse extension, two-out-of-three and
joint-cylinder hypotheses, the canonical map
\[
|vS_\bullet\mathcal C^w|\longrightarrow
\operatorname{hofib}\bigl(|vS_\bullet\mathcal C|\to|wS_\bullet\mathcal C|\bigr)
\]
is a weak homotopy equivalence. Its projection is inclusion and its fiber path
is the specified reversed zero-to-inclusion nullhomotopy.
'''
scope = '''Arbitrary and possibly distinct object and morphism universes; nested weak-equivalence classes; coarse two-out-of-three and extension; explicit exact base-category joint-cylinder data and its second-endpoint section. These are structural assumptions, not fiber or realization conclusions. The full original reversed zero-to-inclusion nullhomotopy is retained. Mathlib `AsSmall` and actual based homeomorphisms transport the proved small-category theorem. This is a precise adaptation of [@Waldhausen1985, Theorem 1.6.4] for the existing unnormalized `IsZero` S-construction; no strict-model comparison or connective long exact sequence is asserted here.'''
review = "author_checked"
provenance = "quillen"
