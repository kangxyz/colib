[entry]
id = "COL-0155"
title = "The S-construction and Waldhausen K-groups"
kind = "definition"
section = "waldhausen-k-theory"
order = 10
statement = '''
For a Waldhausen category \(\mathcal C\), let \(|wS_\bullet\mathcal C|\)
be the realization of its diagonal S-set with the specified zero vertex.
Define
\[
K_n(\mathcal C)=\pi_{n+1}(|wS_\bullet\mathcal C|,0),\qquad n\geq0.
\]
Exact functors induce realization maps and homomorphisms based at the image
of the source zero. Rebasing to a prescribed target zero is additional data
at this stage.
'''
scope = '''`groups n` is \(\pi_{n+1}\), and K-zero commutativity is not asserted. `groupsMap` has the image-zero target; `groupsMapOfZeroEq` requires an explicit equality to a prescribed target zero. No strict-model comparison or additivity theorem is claimed. Map constructions use C and D in the same object and hom universes. Source correspondence was checked on 2026-11-05; compilation and independent review are recorded separately.'''
review = "author_checked"
