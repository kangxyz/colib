[entry]
id = "COL-0078"
title = "Object generators determine Grothendieck-group homomorphisms"
kind = "proposition"
section = "grothendieck-groups"
order = 90
statement = '''
Let \(G\) be any group. Two homomorphisms from the multiplicative form of
\(K_0^{\mathrm{Gr}}(\mathcal E)\) to \(G\) agree if they agree on every object
class \([X]\). Commutativity of \(G\) is not required; the assertion concerns
homomorphisms already defined on the Grothendieck group.
'''
scope = "The source category is preadditive with finite biproducts, a selected exact structure, and independent object and hom universes. The target need not be commutative. This uses the existing free-abelian quotient presentation without adding relations. It is extensionality for already defined homomorphisms, not an unrestricted lifting universal property into noncommutative groups. The citation is limited to the object-generation consequence of the definition. Source correspondence was checked against the cited scope on 2026-11-05; this does not record independent mathematical review or compilation."
review = "author_checked"
