[entry]
id = "COL-0240"
title = "The Grothendieck–Quillen K-zero isomorphism"
kind = "theorem"
section = "quillen-k-theory"
order = 80
statement = '''
For every exact category \(\mathcal E\), the object-loop map is an isomorphism
\[
K_0^{\mathrm{Gr}}(\mathcal E)\xrightarrow{\sim}\pi_1(BQ\mathcal E,0).
\]
Its forward homomorphism is the comparison of COL-0086: the class of an object
is sent to its specified Q-construction loop, not to a separately chosen representative.
'''
scope = 'A preadditive category with finite biproducts and an exact structure, in independent object and morphism universes. The target is the actual homotopical \(K_0\) of the realized Q-category at its original zero vertex. The result concerns K-zero, not higher comparison maps.'
review = "author_checked"
