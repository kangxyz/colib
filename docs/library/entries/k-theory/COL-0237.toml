[entry]
id = "COL-0237"
title = "Quillen resolution"
kind = "theorem"
section = "resolution-devissage-and-serre-localization"
order = 50
statement = '''
Let \(\mathcal P\subseteq\mathcal E\) be a full exact subcategory containing
zero and closed under isomorphisms, extensions, admissible kernels and finite
products. If every object of \(\mathcal E\) has a finite admissible resolution
by objects of \(\mathcal P\), the inclusion induces
\[
BQ\mathcal P\simeq BQ\mathcal E,\qquad
K_n(\mathcal P)\xrightarrow{\sim}K_n(\mathcal E)\quad(n\geq0).
\]
The forward maps are induced by inclusion. Resolution lengths may depend on the object.
'''
scope = "Small categories with preadditivity and finite biproducts. The object property contains zero, is isomorphism-, extension-, kernel- and finite-product-closed. Resolution lengths may be unbounded. This is not Waldhausen Resolution, a Q/S comparison, or a claim that all Quillen migration is complete."
review = "author_checked"
