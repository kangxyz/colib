[entry]
id = "COL-0001"
title = "Grothendieck group of an abelian category"
statement = '''
Let \(\mathcal A\) be an abelian category. Its Grothendieck group is generated by
symbols \([A]\), one for each object, subject to
\[
[B]=[A]+[C]
\quad\text{for every short exact sequence }0\to A\to B\to C\to0.
\]
Thus \(K_0(\mathcal A)\) is the free abelian group on objects modulo these relations.
'''
scope = "The implementation is defined for categories with zero morphisms. The source's abelian case is included."
review = "author_checked"
kind = "definition"
section = "grothendieck-groups"
order = 10
