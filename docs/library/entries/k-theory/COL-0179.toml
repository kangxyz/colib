[entry]
id = "COL-0179"
title = "Invariance under exact equivalence"
kind = "theorem"
section = "waldhausen-k-theory"
order = 50
statement = '''
If \(F\colon\mathcal C\rightleftarrows\mathcal D\colon G\) is a categorical
equivalence and both functors are exact for the chosen Waldhausen structures,
then \(F_*\) and \(G_*\) are inverse isomorphisms on \(K_n\) for every \(n\geq0\).
They are the canonical K-theory maps, without a strict chosen-zero-preservation hypothesis.
'''
scope = '''Both categories share the same object and morphism universe parameters, which may differ from one another. The maps are exactly the existing canonical `KMap` of the original functor and inverse; strict chosen-zero preservation is not required. These are the connective groups of the unnormalized `IsZero`-diagonal S-construction. Package tests apply the reflexive equivalence directly to the native perfect-complex Waldhausen structure and check its actual canonical K-map. No equality with archived named `PerfectK`, global strict-perfect comparison, Q/S comparison or nonconnective spectrum is asserted. Exact-equivalence invariance is the formal consequence of functoriality and [@Waldhausen1985, Proposition 1.3.1, pages 330-331], applied to the actual unit and counit. The earlier Lean implementation is cited separately. Author source comparison was checked on 2026-11-07; independent review and compilation are separate evidence.'''
review = "author_checked"
