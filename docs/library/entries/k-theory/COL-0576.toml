[entry]
id = "COL-0576"
title = "Change of index for Bass telescopes"
kind = "comparison"
section = "bass-delooping-normalization-and-telescopes"
order = 70
statement = '''
Let \(K\colon\mathcal C\to\mathcal D\) be an index functor, and let
\(Q_1,Q_2\) be square functors intertwined by the specified natural
isomorphism. Suppose a row isomorphism \(K^*F\cong G\) intertwines the
seeds \(\eta_2\) and \(\eta_1\). It induces a natural isomorphism
\[
K^*\operatorname{Tel}_{Q_2}(F,\eta_2)
\cong\operatorname{Tel}_{Q_1}(G,\eta_1).
\]
The comparison preserves the finite-stage inclusions and the prescribed
cylinder formulas.
'''
scope = '''
An index functor K, an isomorphism between the actual square functors, a row isomorphism rho and
its specified seed square give compatible finite-stage isomorphisms and inverse whole-cylinder
telescope maps.
'''
proof_kind = "outline"
proof = '''
Iterate the square comparison, whisker with the row isomorphism, use the given seed square to
prove both transition squares, then descend the explicit cylinder maps to mutually inverse
telescope maps.
'''
review = "author_checked"
primary = "KTheory.Bass.StrictDiagramIndexRow.telescopeIso"
provenance = "quillen"
source_checked_on = "2026-11-11"
