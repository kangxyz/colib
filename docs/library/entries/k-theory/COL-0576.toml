[entry]
id = "COL-0576"
title = "Index change for strict-square Bass telescopes"
kind = "comparison"
section = "bass-construction"
order = 1576
statement = '''
Let K : C → D be a functor between categories, let Q₁ and Q₂ be square functors, and let α : K ⋙
Q₂ ≅ Q₁ ⋙ K.mapArrow.mapArrow. Given ρ : K ⋙ F ≅ G and seeds η₂ and η₁ satisfying the displayed
seed compatibility square, there is a natural isomorphism K ⋙ telescope Q₂ η₂ ≅ telescope Q₁ η₁.
Its maps retain the specified finite-stage inclusions and whole-cylinder formulas.
'''
scope = '''
An index functor K, an isomorphism between the actual square functors, a row isomorphism rho and
its specified seed square give compatible finite-stage isomorphisms and inverse whole-cylinder
telescope maps.
'''
proof_kind = "outline"
proof = '''
Iterate the square comparison, whisker with the row isomorphism, use the given seed square to
prove both transition squares, then descend the explicit cylinder maps to mutually inverse
telescope maps.
'''
review = "author_checked"
primary = "KTheory.Bass.StrictDiagramIndexRow.telescopeIso"
provenance = "quillen"
