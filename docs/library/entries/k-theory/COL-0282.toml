title = "The actual Waldhausen S-construction is an Omega-spectrum"
kind = "theorem"
section = "waldhausen-k-theory"
order = 48
statement = "Every original iterated S-construction loop structure map is a weak homotopy equivalence, including path components and all finite based homotopy sets. The unchanged prespectrum therefore defines an Omega-spectrum, functorially for exact chosen-zero-preserving maps."
scope = "The actual quotient rows, full path-space comparison and original cylinder are retained. No saturation, cylinder, extension or Omega hypothesis is added. Original object and morphism universes remain independent; source and target exact functors retain their common universe pair. Arbitrary exact functors use the existing canonical zero rebase and retain the original KMap. For small categories, the literal first relative-total cylinder and full fiber-coordinate comparison give the original degreeRaisingMap as a group equivalence in every nonnegative K-degree, including K-zero. This is a connective Omega-spectrum result, not a nonconnective or spectrum-localization theorem."
review = "author_checked"
