[entry]
id = "COL-0025"
title = 'Naturality of the short-exact-sequence comparison'
kind = "comparison"
section = "grothendieck-groups"
order = 70
statement = '''
Let \(F\colon\mathcal A\to\mathcal B\) be an exact functor between abelian
categories. Write \(F_{\mathrm{ex},*}\) for its map on the Grothendieck groups
of the standard exact structures and \(F_{\mathrm{ses},*}\) for its map on
the short-exact-sequence presentations.

For the comparison isomorphisms \(\iota_{\mathcal A}\) and
\(\iota_{\mathcal B}\) of COL-0019, one has
\[
\iota_{\mathcal B}\circ F_{\mathrm{ex},*}
=F_{\mathrm{ses},*}\circ\iota_{\mathcal A}.
\]
Equivalently, the inverse comparisons satisfy
\[
F_{\mathrm{ex},*}\circ\iota_{\mathcal A}^{-1}
=\iota_{\mathcal B}^{-1}\circ F_{\mathrm{ses},*}.
\]
'''
scope = 'The map \(F_{\mathrm{ses},*}\) is induced by the object-class formula of [@stacks, Tag 02MV].'
proof_kind = "proof"
proof = '''
Both composites in the displayed equality send \([X]_{\mathcal E_{\mathrm{ab}}}\)
to \([F(X)]\) in \(K_0(\mathcal B)\). The classes of objects generate the
source group, so the homomorphisms agree. Composing with the inverse isomorphisms
gives the second equality.
'''
source_checked_on = "2026-11-05"
review = "author_checked"
