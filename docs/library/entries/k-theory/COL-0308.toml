id = "COL-0308"
title = "Dual approximation for the original Waldhausen K-map"
kind = "theorem"
section = "waldhausen-k-theory"
order = 330
statement = "Compatible dual Waldhausen structures have S-constructions identified by simultaneous reversal of all grid coordinates. Structural dual approximation gives a weak homotopy equivalence of the original delooping and bijectivity of its canonical KMap in every nonnegative degree. For genuine inverse-image weak classes, strict fine incoming lifts suffice without fine weak reflection."
scope = "Compatibility uses literal weak maps and actual zero-corner cofiber/fiber squares. The simplicial comparison is natural for every simplex operator and for the actual exact functors. Original canonical K-maps, chosen-zero rebasing and independent object/hom universe bounds are retained. Both the functor and its opposite must be exact; target saturation and genuine fine dual source joint-cylinder data remain structural hypotheses. The inverse-image endpoint derives coarse joint exactness by endpoint coproduct gluing and projection two-out-of-three, using COL-0306. It assumes only saturation in the final target and strict fine incoming lifts, not fine reflection. No geometric lift, perfect-complex duality, qcqs localization, homotopy inverse or nonconnective conclusion is asserted."
review = "author_checked"
