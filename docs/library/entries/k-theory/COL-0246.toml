[entry]
id = "COL-0246"
title = "Quillen dévissage"
kind = "theorem"
section = "resolution-devissage-and-serre-localization"
order = 60
statement = '''
Let \(\mathcal A\) be a small abelian category and \(\mathcal B\) its full
subcategory defined by an object property containing zero and closed under
subobjects, quotients and finite products. Suppose every object of \(\mathcal A\)
has a finite filtration whose factors lie in \(\mathcal B\). Inclusion induces
\[
BQ\mathcal B\simeq BQ\mathcal A,\qquad
K_n(\mathcal B)\xrightarrow{\sim}K_n(\mathcal A)\quad(n\geq0).
\]
No extension-closure or uniform filtration-length hypothesis is required.
'''
scope = "A small abelian category and an object property containing zero and closed under subobjects, quotients and finite products. There is no extension-closure assumption, uniform filtration bound or assumed homotopy inverse. Degree zero is the actual pi-one of BQ. Negative K-theory and a Quillen-Waldhausen comparison are not asserted."
review = "author_checked"
