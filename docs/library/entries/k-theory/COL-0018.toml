[entry]
id = "COL-0018"
title = 'The Grothendieck group of an exact category'
kind = "definition"
section = "grothendieck-groups"
order = 50
statement = '''
Let \(\mathcal C\) be a preadditive category with finite biproducts, and let
\(\mathcal E\) be an exact structure on \(\mathcal C\). Write \(e_X\) for the free
abelian generator indexed by an object \(X\). Let \(R_{\mathcal E}\) be the subgroup
of the free abelian group on objects generated by \(e_Y-e_X-e_Z\) as
\(X\hookrightarrow Y\twoheadrightarrow Z\) runs over the conflations of
\(\mathcal E\). The Grothendieck group of the exact category is
\[
K_0(\mathcal C,\mathcal E)=
\mathbb Z^{(\operatorname{Ob}\mathcal C)}\big/R_{\mathcal E}.
\]
Write \([X]_{\mathcal E}\) for the image of \(e_X\).

Let \(A\) be an abelian group. A function \(a\colon\operatorname{Ob}\mathcal C\to A\)
extends to a homomorphism
\[
\widetilde a\colon K_0(\mathcal C,\mathcal E)\longrightarrow A,
\qquad \widetilde a([X]_{\mathcal E})=a(X),
\]
if and only if \(a(Y)=a(X)+a(Z)\) on every conflation. This extension is unique.
'''
scope = 'The object and morphism universes of \(\mathcal C\) and the universe of \(A\) are independent.'
proof_kind = "proof"
proof = '''
Extend \(a\) linearly to the free abelian group on objects. The defining relation
for a conflation maps to \(a(Y)-a(X)-a(Z)=0\), so this extension descends to the
quotient. The object classes generate the quotient, which gives uniqueness.

Conversely, applying a homomorphism to \([Y]_{\mathcal E}=[X]_{\mathcal E}+[Z]_{\mathcal E}\)
gives the required additivity of its values on objects.
'''
source_checked_on = "2026-11-05"
review = "author_checked"
