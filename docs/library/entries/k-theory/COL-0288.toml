[entry]
id = "COL-0288"
title = "Cone excision for Waldhausen K-theory spectra"
kind = "theorem"
section = "waldhausen-fibration-and-boundary-maps"
order = 70
statement = '''
For a map \(f\colon E\to F\) between iterated-S prespectra, the
cone-to-inclusion-fiber comparison is \(2n\)-connected at level \(n+1\),
and is a stable equivalence. Under the structural hypotheses of Waldhausen
fibration, the specified acyclic nullhomotopy induces a stable equivalence
\[
\operatorname{cofib}\bigl(E(\mathcal C^w,v)\to E(\mathcal C,v)\bigr)
\longrightarrow E(\mathcal C,w).
\]
The construction retains the given cone face and the signed connecting square.
'''
scope = "S-model connectivity, Omega structure and point HEP are proved, not assumed. The Waldhausen cone conclusion retains exactly coarse two-out-of-three, the coarse extension axiom, genuine joint cylinder data and its separate second-endpoint section. The actual target face, entire nullhomotopy, independent cone and loop parameters and signed stable connecting square are retained. This is connective cone excision, not Bass nonconnective K-theory or all-degree cofinality for an arbitrary exact functor."
review = "author_checked"
provenance = "quillen"
