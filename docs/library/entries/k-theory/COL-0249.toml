[entry]
id = "COL-0249"
title = "The Serre localization homotopy fiber"
kind = "theorem"
section = "resolution-devissage-and-serre-localization"
order = 70
statement = '''
Let \(\mathcal P\) be a Serre subcategory of a small abelian category
\(\mathcal A\), and let \(q\colon\mathcal A\to\mathcal A/\mathcal P\) be the
canonical quotient. The based comparison
\[
BQ\mathcal P\longrightarrow\operatorname{hofib}(BQq)
\]
is a weak homotopy equivalence, with the quotient Q-map normalized at zero.
It induces the corresponding group isomorphism in every nonnegative K-degree.
'''
scope = '''C : Type u with `Category.{u}` C and Abelian C, and P : `ObjectProperty` C with `P.IsSerreClass`. The weak-equivalence conclusion covers all components and all source basepoints; the canonical based theorem includes every finite homotopy degree, including zero. No Noetherian, finite-length, filtration, quotient-comparison or cartesian-square hypothesis is added. No global continuous homotopy inverse is claimed.'''
review = "author_checked"
provenance = "quillen"
