[entry]
id = "COL-0026"
title = "Object-generated subgroups and inclusion images"
kind = "comparison"
section = "grothendieck-groups"
order = 80
statement = '''
For a full subcategory \(\mathcal B\subseteq\mathcal A\) whose inclusion \(i\)
preserves short exact sequences, the induced map satisfies
\[
\operatorname{im}K_0(i)=\langle[B]\mid B\in\mathcal B\rangle\subseteq K_0(\mathcal A).
\]
When the ambient category is abelian, the comparison with the conflation
presentation carries the corresponding object-generated subgroup to this image.
'''
scope = 'The general range theorem requires zero morphisms and explicit preservation of short exact sequences by the inclusion. The presentation comparison requires an abelian ambient category. The Serre-class specialization uses the upstream inclusion exactness proof. [@stacks, Tag 02MX(1)] supplies localization context only: no quotient-localization exactness, surjectivity, inclusion injectivity or [@stacks, Tag 02MX(2)] is claimed. Source correspondence was checked against the cited clauses on 2026-11-05; this does not record independent mathematical review or compilation.'
review = "author_checked"
