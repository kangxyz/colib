[entry]
id = "COL-0269"
title = "The Grothendieck presentation of Waldhausen K-zero"
kind = "comparison"
section = "waldhausen-k-theory"
order = 70
statement = '''
The object-loop map identifies Waldhausen \(K_0(\mathcal C)\) with the
abelian group generated by object classes, subject to
\[
[0]=0,\qquad [A]=[B]\ \text{if }A\xrightarrow{\sim}B,\qquad
[B]+[C]=[A]+[B\amalg_A C]
\]
for each cofibration pushout. This comparison sends each object class to its
specified S-construction loop and is natural for exact functors.
'''
scope = '''Independent object and morphism universes; no cylinder, factorization, saturation or extension hypothesis beyond the Waldhausen structure. The inverse in matching universes is the actual realized universal grading. The general comparison preserves every object-loop generator, commutes with the original canonical exact-functor `KMap`, and agrees with the matching-universe comparison. The cofiber presentation of [@ThomasonTrobaugh1990, 1.5.6] is expressed by the equivalent full pushout relations in the unnormalized `IsZero` S-construction.'''
review = "author_checked"
provenance = "quillen"
