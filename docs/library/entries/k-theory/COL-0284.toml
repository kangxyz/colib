[entry]
id = "COL-0284"
title = "The stable Waldhausen fiber sequence and boundary sign"
kind = "theorem"
section = "delooping-and-stable-localization"
order = 60
statement = '''
Under the structural hypotheses of COL-0254, the map
\[
E(\mathcal C^w,v)\longrightarrow
\operatorname{hofib}\bigl(E(\mathcal C,v)\to E(\mathcal C,w)\bigr)
\]
is a stable equivalence. If \(\kappa\) denotes the comparison between K-groups
and stable homotopy groups, the stable boundary satisfies
\[
\partial_{\mathrm{st}}\circ\kappa=-\kappa\circ\partial_K
\]
in the corresponding nonnegative K-degrees, including the map from \(K_1\)
to \(K_0\). The sign uses the fixed fiber nullhomotopy and loop conventions.
'''
scope = "The structural theorem assumes coarse two-out-of-three, the coarse extension axiom, genuine joint cylinder data, and its separate second-endpoint section. It adds no stable-equivalence, K-zero-surjectivity or connectivity premise. The negative-one case derives actual K-zero surjectivity; lower degrees use proved connectivity. The full original acyclic nullhomotopy, independent structure and path parameters, degree casts, canonical maps and explicit single minus sign are retained. This is the connective spectrum fiber theorem, not cone localization or a nonconnective theorem."
review = "author_checked"
provenance = "quillen"
