[entry]
id = "COL-0003"
title = "Functoriality of the Grothendieck group"
statement = '''
A zero-preserving functor \(F\colon\mathcal A\to\mathcal B\) that preserves short
exact sequences induces
\[
F_*\colon K_0(\mathcal A)\longrightarrow K_0(\mathcal B),\qquad [A]\longmapsto[F(A)].
\]
'''
scope = "The source's exact functor between abelian categories supplies the implementation's short-exact-sequence hypothesis."
review = "author_checked"
kind = "proposition"
section = "grothendieck-groups"
order = 30
