[entry]
id = "COL-0328"
title = "Literal Perfect Pullback Compatibility"
kind = "comparison"
section = "k-theory-of-schemes"
order = 3280
statement = "Arbitrary perfect K-pullback equals the existing canonical KMap of exact flat pullback for flat morphisms, and the existing ordinary restriction KMap for open immersions and open subsets. The proof uses the actual chain inclusion square, the geometric restriction natural isomorphism, and the proved literal inclusion comparison. The existing coarse restriction composite agrees with that same map. Composition and commuting ambient open squares hold in every natural degree, including zero."
scope = "Single-map comparisons require only target compactness. Flatness is retained for the all-perfect exact pullback. Composition with an exact flat left factor needs only final-target compactness. A commuting open square needs compactness only of the two targets of arbitrary perfect pullback. No source compactness, quasi-separatedness, regularity or resolution property is imposed. These group-map identities do not assert whole-prespectrum homotopy, supported or relative pullback, localization, TT geometry or Bass results."
review = "author_checked"
