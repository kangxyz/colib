[entry]
id = "COL-0325"
title = "Relative Flat Perfect Approximation"
kind = "comparison"
section = "k-theory-of-schemes"
order = 290
statement = "Every chain map from a bounded-above flat perfect complex to a perfect complex on a quasi-compact ringed space factors strictly through an admissible cofibration with bounded-above flat perfect quotient followed by a genuine quasi-isomorphism. Thus the literal inclusion satisfies App1 and App2, and its canonical connective K-map is bijective in every natural degree, including zero. The resulting group equivalence has precisely that unchanged inclusion K-map as its forward map."
scope = '''Only `CompactSpace` of the underlying ringed space is assumed for approximation and K-comparison, in particular only `CompactSpace` X for schemes. No quasi-separatedness, resolution property, lower term bound, finite local freeness or quasicoherence of the flat terms is required. Relative factorization between termwise upper-bounded complexes is geometric-hypothesis-free and retains the explicit bound b+1 and strict original triangle. It is constructed through projective presheaves and exact sheafification, rather than assumed or inferred from object replacements.'''
review = "author_checked"
