statement = 'The original right-projective Quillen \(K_{2}\) group and upper finite-module Quillen \(K_{2}\) group have one element over every finite field. Every class is the identity.'
scope = '''The actual exact-category K 2 of right finite projective modules and `SmallK.{u+1}` of the abelian exact structure on `FGModuleCat.{u}` F. Surjectivity of the original native Milnor comparison and integral Milnor \(K_{2}\) vanishing supply the proof. Includes \(F_{2}\) and \(F_{3}\), with no external perfectness or generation premise. Lower-universe \(G_2\) and coherent scheme \(G_2\) are separate comparisons.'''
