[entry]
id = "COL-0345"
title = "Native rational Milnor decomposition and bounded normalized lifting"
kind = "theorem"
section = "milnor-k-theory"
order = 410
statement = "The original total residue identifies the quotient by the actual constant image with the native direct sum of residue-field Milnor groups. Together with the original constant retraction it gives an integer-linear product decomposition. A residue vector supported in degrees at most d has a unique lift in F_d after its constant component is prescribed."
scope = "Every field and every positive source degree n+1, including degree-zero residues. The native point index, literal polynomial quotient fields, constant inclusion, constant retraction and total residue are unchanged. No equality with Aglib origin specialization is asserted. The residue map alone is not injective on F_d. No perfectness, separability or characteristic assumptions are added."
review = "author_checked"
