[entry]
id = "COL-0004"
title = "K₀ of finite-dimensional vector spaces"
statement = 'Dimension identifies the Grothendieck group of \(\mathrm{FGModuleCat}\,k\) with \(\mathbb{Z}\), preserving every object class.'
scope = "A field k in Type u and finite modules with carriers in Type u. The group is the categorical presentation of Tag 02MU. The equivalence is normalized by dimension."
review = "author_checked"
kind = "theorem"
section = "k-zero-of-fields"
order = 40
proof = "Dimension descends by additivity on short exact sequences. Every Grothendieck class is a difference of object classes. Equal dimensions give an isomorphism of the finite-dimensional vector spaces, which proves injectivity. The class of the one-dimensional space gives surjectivity."
