[entry]
id = "COL-0396"
title = "Finite separable Milnor norm presentations and towers"
kind = "theorem"
section = "milnor-k-theory"
order = 425
primary = "Stacks.Chow.milnorKNorm_comp_milnorKNorm_of_isSeparable"
statement = '''
Let \(L/k\) be a finite separable field extension. Write \(N_{L/k}\) for the original recursive additive norm on the native Milnor ring. For every monic irreducible polynomial \(p\) and every actual \(k\)-algebra equivalence \(\varepsilon:L\simeq k[X]/(p)\),
\[
N_{L/k}=N_p\circ\varepsilon_*.
\]
Here \(N_p\) is the original simple norm, with normalization \(N_p(\alpha)=-\partial_\infty(y)\) for a rational class \(y\) with single finite residue \(\alpha\) at \(p\). Field transport sends each ordered symbol \(\{a_1,\ldots,a_n\}\) to \(\{\varepsilon(a_1),\ldots,\varepsilon(a_n)\}\).

For a finite extension \(M/k\) and a \(k\)-algebra equivalence \(f:L\simeq M\), one has \(N_{M/k}\circ f_*=N_{L/k}\). For a tower \(k\to M\to L\) with its given compatible scalar actions, finite-dimensional at all three levels, and with \(L/k\) separable,
\[
N_{M/k}\circ N_{L/M}=N_{L/k}.
\]
These equalities hold on the whole Milnor ring as additive maps and on every homogeneous group \(K_n^M\), for every \(n\geq0\).
'''
scope = '''
All fields lie in the same universe `Type u`, as required by the native chosen-norm API. The original `milnorKNormRing`, `milnorKNorm`, `simpleMilnorNorm`, fields and scalar actions are retained. Separability of the total extension supplies separability of the lower and relative extensions. No characteristic-zero, normality, prime-degree or assumed norm-compatibility condition is imposed.

The Aglib presentation, algebra-equivalence and tower statements cited in the Lean attributes use its separate Milnor model and assume characteristic zero. Their mathematical conclusions are adapted here to the native Stacks model in finite separable scope; no formal equality with Aglib's norm is asserted. [@stacks, Tag 0EAY] supplies background on Milnor groups, tame residues and norm maps, not this presentation or tower theorem. General inseparable towers and independent field universes are outside this item. `author_checked` records source correspondence, not independent mathematical review.
'''
proof = '''
First prove the simple-norm tower by restriction to the Sylow fixed fields of a splitting field of the separable upper polynomial. Complete nested scalar-factor sums give the restricted equation, and finite-restriction detection descends it. Pull the canonical relative factor back to the original intermediate field, retaining the actual coefficient maps.

Strong induction on the extension degree follows the selected witness in the original recursive norm. The nontrivial branch uses the pulled-back relative presentation and its smaller degree; the trivial branch identifies both norms with the inverse of the bijective structure map. This proves comparison with every actual presentation. Composing presentations proves algebra-equivalence naturality. Applying the comparison to the lower, relative and total extensions proves the tower equation, and restriction to homogeneous components includes degree zero.
'''
review = "author_checked"
