[entry]
id = "COL-0351"
title = "Bounded-above flat perfect prespectrum comparison"
kind = "comparison"
section = "k-theory-of-schemes"
order = 121
statement = '''
The actual canonically zero-normalized prespectrum map of the literal inclusion
of bounded-above flat perfect complexes into perfect complexes is a stable
equivalence on compact ringed spaces. Every connective stable and zero-space
K-map is the unchanged inclusion K-map, including K0. This applies to Spec R
for every commutative ring. For flat scheme morphisms, the actual geometric
pullback and inclusion square commutes by a whole based prespectrum homotopy.
'''
scope = '''
Native ringed spaces with equal space and ring universes. Compactness is needed
only for the inclusion equivalence. The pullback square has no compactness
hypothesis, but retains flatness for exact pullback on perfect complexes.
Canonical zero normalization and composition tracks are included, with
independent level, homotopy-time and structure-time parameters, also at zero.
Stable equivalence does not assert levelwise homotopy equivalence. Negative
degrees use connectivity, not Bass localization. Coefficient section models,
strict derived-pullback prespectrum functors and TT 7.4 are not constructed.
'''
review = "author_checked"
provenance = "quillen"
