statement = '''Matsumoto's theorem in the implemented characteristic-zero case: over such a field, the original maps from native Milnor \(K_{2}\) to right-projective Quillen \(K_{2}\) and upper finite-module Quillen \(K_{2}\) are additive equivalences. They retain their literal forward homomorphisms, commute with the original field-extension maps in both directions, and send ordered symbols to the positive scalar unit product. The negative normalization is minus the positive inverse.'''
scope = "The right-projective target is the existing exact-category K 2; the upper target is literally SmallK.{u+1} of FGModuleCat.{u} F. No fiber-perfectness, generation, detector-law or comparison premise is added. The ordered scalar-product marking holds for every field, including the ZMod 5 regression. Bijectivity retains the pinned source's characteristic-zero hypothesis; no positive-characteristic Milnor equivalence is claimed. Field-change statements retain the original common-universe scope."
