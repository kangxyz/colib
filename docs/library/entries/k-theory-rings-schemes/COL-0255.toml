[entry]
id = "COL-0255"
title = 'Native Milnor \(K_{2}\) symbols in the Steinberg kernel'
kind = "definition"
section = "milnor-k-theory"
order = 430
statement = 'The canonical native Milnor \(K_{2}\) map sends each ordered symbol \(\{a,b\}\) to the literal stable Steinberg kernel word h(a) h(b) h(ab)⁻¹. It commutes with actual field change and retains the positive rank-three commutator marking.'
scope = 'Every field, including characteristics two and three. The target is the central kernel of the proved surjective stable Steinberg-to-elementary map on native PresentedGroup and DirectLimit constructions. This item records the canonical kernel map. Characteristic-zero bijectivity and the actual Quillen \(K_{2}\) comparison use this same map and are registered separately.'
review = "author_checked"
