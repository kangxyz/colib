title = "The affine-section Bass telescope and its signed stable colimit"
kind = "comparison"
section = "k-theory-of-schemes"
order = 3510
statement = '''Let \(E\) be the strict bounded-above-flat affine-section prespectrum functor, \(B\) the polynomial and Laurent Bass endofunctor, and \(\eta:E\to B(E)\) its proved Laurent seed. Put \(D_i=B^i(E)\) and \(\tau_i=B^i(\eta)\). The actual reduced quotient telescope \(T(R)=\operatorname{Tel}(D_i(R),\tau_i(R))\) is a strict functor of commutative rings. Its coefficient map sends \([i,s,x]\) to \([i,s,D_i(f)(x)]\), and its stage inclusion is \(j_i(x)=[i,0,x]\), with homotopy \([i,s,x]\) from \(j_i\) to \(j_{i+1}\tau_i\).

For every \(d\in\mathbb Z\), there is a canonical natural isomorphism \(\alpha_{R,d}:\operatorname*{colim}_i\pi_d^{\mathrm{st}}D_i(R)\cong\pi_d^{\mathrm{st}}T(R)\), determined by \(\alpha_{R,d}\iota_i=\pi_d^{\mathrm{st}}(j_i)\). It commutes with every ring homomorphism \(f:R\to S\), including nonflat and noninjective maps.'''
scope = '''The actual native section Waldhausen values and their degree-zero based path spaces give T1 separation. Native finite Bass separation and telescope separation discharge every topological premise. Iteration uses \(B^{i+1}=B^i\circ B\); the Laurent seed, quotient cylinder and all signed degrees are unchanged. No supplied diagram, seed, separation profile, point HEP, cofibration, closed embedding or evaluation-relative comparison occurs in the concrete hypotheses. This ambient construction does not assert comparison with classical negative K-groups, supported localization, another telescope model, or Thomason–Trobaugh 7.4.'''
proof = '''Apply the original strict telescope construction to the actual iterated seed. Quotient-cylinder extensionality proves its coefficient functor laws, and the literal cylinder gives the natural inclusion homotopy. The initial Waldhausen realization is T1; finite Bass iteration preserves this property, so COL-0350 applies in every signed degree. Its canonical colimit descent retains each inclusion leg. Strict coefficient naturality then assembles these comparisons into the stated natural isomorphism.'''
