[entry]
id = "COL-0383"
title = "Coefficient cones and Bockstein maps"
kind = "definition"
section = "finite-coefficients"
order = 10
primary = "CochainComplex.finiteCoefficients"
statement = '''
For a cochain complex \(K\) in a preadditive category with binary biproducts and
\(n\in\mathbb N\), put \(K/n=\operatorname{Cone}(n\,\operatorname{id}_K)\).
With \(a\) the second cone coordinate and \(b\) the negative first coordinate, the differential is
\((a,b)\mapsto(da-nb,-db)\). The integral map \(i\colon K\to K/n\)
and the connecting map \(\partial\colon K/n\to K[1]\) give
\(\beta_n=i[1]\circ\partial\), with \(\beta_n[1]\circ\beta_n=0\).

Insertion from \(K/n\) to \(K/n^2\) sends \((a,b)\) to \((na,b)\),
and reduction sends \((a,b)\) back to \((a,nb)\). Together with \(\beta_n\)
these maps form the cone-composition triangle
\[
 K/n\longrightarrow K/n^2\longrightarrow K/n\longrightarrow (K/n)[1].
\]
'''
scope = '''
The triangle is distinguished in the homotopy category when the coefficient
category has a zero object, and in the derived category when the coefficient
category is abelian and has the indicated derived category. Here \(K/n\) denotes
the multiplication cone. Identifying it with a derived tensor product is a
separate comparison.
'''
review = "author_checked"
