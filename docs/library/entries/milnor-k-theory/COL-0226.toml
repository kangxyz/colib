[entry]
id = "COL-0226"
title = "Native mixed-symbol spans and split evaluations"
kind = "theorem"
section = "milnor-symbols-field-change"
order = 130
statement = "The integer submodule of the native homogeneous Milnor group generated by a base-unit prefix and one final extension unit contains every tuple obtained by nonzero evaluation of split polynomials at one element. Membership yields an actual finitely supported signed integer expansion."
scope = "Fields in independent universes and any positive Milnor degree, including an empty base prefix. No irreducible modulus, perfectness, separability, prime degree or finite extension is required. Repeated entries retain the negative-one correction. The span is a submodule of the existing Milnor group, not another presentation. Native degree at most d corresponds arithmetically to the former strict bound below d+1; linear factors have native bound one. No equality of filtration models or copied specialization construction is asserted."
review = "author_checked"
