[entry]
id = "COL-0262"
title = '''Matsumoto's theorem for \(K_{2}\)'''
kind = "theorem"
section = "matsumoto-theorem"
order = 10
primary = "MilnorKTheory.upperModuleKTwoEquiv"
statement = '''
For every field \(F\), the canonical homomorphisms from \(K_2^M(F)\) to
right-projective Quillen \(K_2\) and to finite-module Quillen \(K_2\) are
additive isomorphisms. Both directions commute with extension of scalars.
In the finite-module model, the ordered symbol \(\{a,b\}\) maps to the
scalar action of \(a\) on the positive \(K_1\)-class of \(b\).
The negative normalization is the negative of the inverse isomorphism.
'''
scope = '''
The source is the degree-two component of the Stacks Milnor ring. The
right-projective target is the exact-category \(K_2\) of finite projective
right modules. The finite-module target is `SmallK.{u+1} 2` of the abelian
exact category `FGModuleCat.{u} F`. The field-change squares use fields in a
common Lean universe.
'''
proof = '''
Over an infinite field, choose \(q\in F^\times\) with \(q\ne 1\). A
balanced diagonal scales the relevant lifted roots by \(q\). For a root
parameter \(a\), comparing the conjugates at \(t=a/(q-1)\) uses
\(qt=t+a\) to cancel the central difference in the commutator relation.
The resulting Bruhat action detects each Milnor coefficient in the
stable Steinberg kernel and gives injectivity. Over a finite field,
injectivity follows from COL-0279.

The original torus defects generate the stable Steinberg kernel, so
the map of COL-0255 is also surjective. The stable-fiber comparison
identifies this kernel with the two Quillen groups using the original
maps. Scalar extension and the ordered scalar action agree with those
maps, which gives the naturality and normalization formulas.
'''
review = "author_checked"
provenance = "quillen"
