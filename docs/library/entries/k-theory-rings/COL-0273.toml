[entry]
id = "COL-0273"
title = "Localization of finite modules"
kind = "theorem"
section = "g-theory-of-rings"
order = 330
statement = "Let $R$ be a commutative Noetherian ring and $S\\subseteq R$ a multiplicative submonoid. Write $\\mathcal T_S$ for the exact category of finite $R$-modules annihilated by one element of $S$. The localization functor induces connecting homomorphisms and exact sequences\n\\[\\cdots\\to G_{n+1}(S^{-1}R)\\xrightarrow{\\partial}K_n(\\mathcal T_S)\\to G_n(R)\\to G_n(S^{-1}R)\\to\\cdots\\qquad(n\\ge0),\\]\nwith exact degree-zero tail $K_0(\\mathcal T_S)\\to G_0(R)\\to G_0(S^{-1}R)\\to0$. For $S$ generated by $r$, the supported objects are exactly the modules killed by some power $r^m$, including $m=0$."
scope = '''R : Type u, `CommRing` R, `IsNoetherianRing` R, S : Submonoid R, and `Small.{v,u}` R, using actual `FGModuleCat.{v}`, Localization S and native `SmallModel.{u}`. Equal module and ring universes need no additional smallness premise. No domain, nontriviality or exclusion of zero from S is assumed. The functor is the literal restriction of `ModuleCat.localizedModuleFunctor` S; its exactness and categorical localization are proved, not theorem inputs. Its K-map is the original `exactFunctor.smallKMap`. At nonzerodivisors of a domain this is definitionally the existing native fraction-field K-map. Essential surjectivity and the finite-module uniform-annihilator lemma require no Noetherian hypothesis. The supported term is K-theory of the actual torsion subcategory; no identification with \(G(R/(r))\), general scheme-open localization, scheme K/G equivalence, or negative G-theory is claimed.'''
review = "author_checked"
provenance = "quillen"
