[entry]
id = "COL-0394"
title = "Exterior extension along the algebraic simplex"
kind = "theorem"
section = "algebraic-simplices"
order = 50
primary = "AlgebraicGeometry.Cor.simplexExterior_graph"
statement = '''
For smooth schemes \(X,Y\) over a field \(k\), extension along the algebraic
simplex takes a signed prime correspondence with support \(Z\subset X\times_k Y\)
to the corresponding cycle with support \(Z\times_k\Delta_k^n\) inside
\((X\times_k\Delta_k^n)\times_k(Y\times_k\Delta_k^n)\), with equal simplex
coordinates. It keeps the integer coefficient. For a smooth-site morphism
\(f\colon X\to Y\), extension sends \(\Gamma_f\) to
\(\Gamma_{f\times\operatorname{id}}\) and in particular preserves identities.
'''
scope = '''
This is the additive operation in a fixed simplex degree. Composition of
arbitrary correspondences and mixed interchange with maps of simplices are
separate comparisons.
'''
review = "author_checked"
