[entry]
id = "COL-0385"
title = "Pointed simplicial presheaves and reduced cofibers"
kind = "definition"
section = "pointed-motivic-inputs"
order = 10
primary = "CategoryTheory.PointedSimplicialPresheaf.reducedMappingCofiber"
statement = '''
A pointed simplicial presheaf on \(\mathcal C\) is a simplicial presheaf with
a map from the terminal presheaf. Free pointing adjoins a disjoint basepoint,
giving in particular the pointed representable \(U_+\).

For \(f\colon X\to Y\), the reduced mapping cofiber is the strict pushout
\[
 Y\amalg_X \bigl(X\wedge(\Delta^1,1)\bigr),
\]
where the map out of \(X\) on the cone side uses vertex \(0\).
'''
scope = '''
The constructions take place in the native under category of the terminal
presheaf. Objectwise weak equivalence tests the realization at each object of
\(\mathcal C\). The local homotopy cofiber comparison is a separate assertion.
'''
review = "author_checked"
