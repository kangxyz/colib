[entry]
id = "COL-1213"
title = "Section-divisor differences under arbitrary base change"
kind = "comparison"
section = "meromorphic-section-divisors"
order = 20
primary = "Stacks.Divisors.sectionKernelDifferencePullbackIso"
review = "author_checked"
statement = '''
Let \(q:X\to S\) be separated and smooth of relative dimension one,
let \(s,t:S\to X\) be actual sections, and let \(g:T\to S\) be any
base change. Write \(s_T,t_T:T\to X_T=X\times_ST\) for the canonical
pullback-lift sections and \(p:X_T\to X\) for the first projection.
There is an actual module isomorphism
\[p^*(\mathcal O(\ker s)\otimes\mathcal O(-\ker t))
\simeq\mathcal O(\ker s_T)\otimes\mathcal O(-\ker t_T).\]
The kernels here are the full scheme-theoretic image ideals.
'''
proof = '''
The section equations identify the image subscheme with the base, so its
structure map is finite locally free. Native relative Cartier theory
[@stacks, Tag 0B9D] supplies the Cartier condition before and after base
change. The Cartesian square of the actual sections gives the literal ideal
equality \(\ker s_T=(\ker s)\mathcal O_{X_T}\), and likewise for \(t\).
Compose the native pullback tensor comparison, positive Cartier-sheaf
pullback [@stacks, Tag 0C4U], negative-twist pullback, and these ideal
equalities, preserving the positive and negative factors in order.
'''
scope = '''
No flatness of \(g\), properness of \(q\), strict henselianity, or
reducedness assumption is needed. Cartier inverse-image conditions are
proved from the section geometry, not added as certificates. All schemes
have universe \(u\). The lower difference-sheaf comparison also applies to
any two effective Cartier divisors whose inverse images are Cartier.
The result supplies the relative-to-closed-fibre identification required
before applying COL-1210 and COL-1206; it does not itself produce a tensor root.
'''
