[entry]
id = "COL-0343"
title = "Exact base-field evaluation and unbounded Nisnevich cohomology"
kind = "theorem"
section = "nisnevich-sites"
order = 30
statement = '''Every Nisnevich covering sieve of the actual smooth base object \(\operatorname{Spec}k\) is maximal. Local surjectivity and injectivity therefore become actual surjectivity and injectivity on its sections. The original abelian sheafification unit is an isomorphism there, and the native section-evaluation functor preserves epimorphisms, homology and exact sequences. The native free representing sheaf at this object is projective, and every positive-degree ordinary Ext cohomology group of every ordinary abelian coefficient sheaf is zero.

For every unbounded integer-indexed complex \(K\) of abelian sheaves and \(n\in\mathbb Z\), the projective evaluation comparison of COL-0394 gives \(E_{K,n}\colon\mathbb H^n(\operatorname{Spec}k,K)\xrightarrow{\sim}H^n(K(\operatorname{Spec}k))\). For an actual coefficient cochain map \(f\colon K\to L\), it satisfies \(E_{L,n}(\mathbb H^n(f)(x))=H^n(f(\operatorname{Spec}k))(E_{K,n}(x))\).'''
scope = '''An arbitrary field `k : Type u`, on its own smooth separated finite-type Nisnevich site over \(\operatorname{Spec}k\), with all actual morphisms over the base. The local-surjectivity and local-injectivity clauses allow an arbitrary concrete coefficient category with independent universes. The abelian clauses retain coefficients `AddCommGrpCat.{u + 1}`; their sheafification is available on the actual site. Ordinary cohomology uses an explicit independent `HasExt.{w}` instance and degree \(n+1\) for \(n\in\mathbb N\). Hypercohomology additionally uses an explicit independent `HasDerivedCategory` instance and every integer degree, with no boundedness or K-injectivity hypothesis on the coefficient complex. No perfection, characteristic or separable-closedness hypothesis is imposed. This is evaluation at the base field itself, not a claim that arbitrary extension fields lie in its smooth finite-type site, nor an affine-line or henselian-stalk computation. No transfers or motivic-cohomology vanishing is asserted.'''
source_checked_on = "2026-11-10"
review = "author_checked"
proof = '''Lift the genuine split Nisnevich cover of \(\operatorname{Spec}k\) to a morphism in the actual smooth over-category. Maximal covering sieves turn Mathlib's local image and equalizer criteria into global ones. Reuse native sheafSections, its finite-limit comparison and the projectivity criterion for Stacks freeYoneda; apply Mathlib's `Ext.eq_zero_of_projective`. The same projective free representing sheaf then satisfies COL-0394, whose inverse comparison gives the unbounded evaluation equivalence and its naturality. [@MVW2006, Lecture 12, Example 12.2, p. 89] supplies field-cover splitting and hence projectivity, not the unbounded comparison itself. The latter application specializes [@motivic_source_a6805c4, Motivic/Aglib/AlgebraicGeometry/Sites/Hypercohomology/FieldEvaluation.lean:45-53].'''
