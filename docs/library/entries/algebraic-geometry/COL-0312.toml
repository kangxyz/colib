[entry]
id = "COL-0312"
title = "Native derived restriction image and strict incoming factorization"
kind = "theorem"
section = "perfect-complexes"
order = 100
statement = "The actual chain complexes derived-isomorphic to open restrictions of native Stacks perfect complexes form the honest derived-image full subcategory. Membership implies native perfectness and is invariant under derived isomorphisms and quasi-isomorphisms. Given the displayed roof property between global perfect models, this image is closed under all three distinguished-triangle and short-exact endpoints, inherits ambient monomorphisms and quasi-isomorphisms, and receives the actual exact restriction corestriction. Two literal homotopy pullbacks give strict incoming factorization equations, degreewise split epimorphisms, and membership of their actual categorical kernels. Separately, for every open immersion, the coarse and original fine restriction K-maps have equal ranges in degree zero."
scope = 'Any open immersion of schemes in one universe, using actual Mathlib chain complexes and any supplied derived-category model on the open. The honest image, its weak invariance and weak cospans need no roof hypothesis. Triangle/short-exact closure, the inherited Waldhausen structure, exact corestriction and strict incoming factorization explicitly assume HasDerivedRoofs j: every derived morphism between two restricted global native perfect complexes is represented by actual global chain maps with perfect source and an open-quasi-isomorphic denominator. This item does not prove that geometric roof hypothesis, qcqs complement existence, dense/cofinal K-equivalence, or fine-open localization. It never replaces derived equality by chain-map equality and does not assert outgoing strict App2. The independent degree-zero range equality has no qcqs assumption and does not assert surjectivity onto \(K_{0}\) of the open. No Noetherianity, regularity, separatedness, resolution property, globally strictly perfect model or K-projectivity is assumed.'
review = "author_checked"
provenance = "quillen"
