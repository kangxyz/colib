[entry]
id = "COL-1210"
title = "Tensor roots of actual section-divisor differences"
kind = "theorem"
section = "proper-etale-specialization"
order = 50
primary = "Stacks.Kummer.exists_schemeTensorPower_iso_differenceSheaf_of_length_eq"
review = "author_checked"
statement = '''
Let \(X\to\operatorname{Spec}k\) be a smooth proper curve over a separably
closed field, and let \(n\) be invertible in \(k\). For actual effective
Cartier divisors \(D,E\) of equal full length, there is an invertible
module \(M\) with an actual isomorphism
\(M^{\otimes n}\simeq\mathcal O(D)\otimes\mathcal O(-E)\).
Equal finite locally free ranks imply the length condition. Under smoothness
of relative dimension one, the kernels of two actual sections satisfy the
Cartier and length conditions without additional certificates.
'''
proof = '''
Define the difference module by the native tensor product, in the stated
order. Native Picard-class tensor additivity and the negative-twist formula
give its class as \([\mathcal O(D)]-[\mathcal O(E)]\). Transport through the
native additive Picard-model equivalence. The divisor-degree formula of
[@stacks, Tag 0AYY] computes its degree as the difference of the full
\(k\)-dimensions of \(\Gamma(D,\mathcal O_D)\) and
\(\Gamma(E,\mathcal O_E)\), so equal lengths imply degree zero. Apply
COL-1209. For section kernels, native relative Cartier theory supplies the
Cartier instances and the closed-immersion image factorization identifies
each divisor with \(\operatorname{Spec}k\), proving length one.
'''
scope = '''
The field and scheme have universe \(u\), and the exact curve hypotheses
are IsCurve, Smooth and IsProper. The section endpoint additionally states
SmoothOfRelativeDimension 1 explicitly. Full scheme lengths retain all
nonreduced multiplicities; supports are never replaced by their reductions.
The conclusion is an isomorphism to the specified tensor product, not merely
Picard-class divisibility. This is the closed-curve supplier, not the relative
base-change identification, moving-divisor identity, or transfer-action
rigidity theorem. Native divisor classes, degree and section kernels come
from DivisorPicardClass, DivisorSheafDegree and DiagonalFibreDivisor in
[@axiom_stacks_5ed82d14].
'''
