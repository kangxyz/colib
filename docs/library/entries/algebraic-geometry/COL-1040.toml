[entry]
id = "COL-1040"
title = "Framed tensor roots of relative section-divisor differences"
kind = "theorem"
section = "proper-etale-specialization"
order = 80
primary = "Stacks.Kummer.exists_relativeSectionKernel_root_compatible_frame"
review = "author_checked"
statement = '''
Let \(q:X\to\operatorname{Spec}R\) be proper and smooth of relative
dimension one over a strictly henselian local ring. Assume its closed
fibre is a curve in the native sense. For actual sections \(s,t\), a
positive integer \(n\) invertible in \(R\), and a boundary
\(i:\operatorname{Spec}B\to X\) with \(B\) module-finite over \(R\)
and image disjoint from both section images, there exist an invertible
module \(M\), an actual isomorphism
\[\alpha:M^{\otimes n}\simeq\mathcal O(\ker s)\otimes\mathcal O(-\ker t),\]
and a frame \(e:i^*M\simeq\mathcal O_B\). Its tensor power equals the
pullback of \(\alpha\), composed with the native tensor-power comparison
and the specified evaluation trivialization away from the two section images.
'''
proof = '''
Construct the closed-fibre sections as actual pullback lifts. COL-1035
gives a root of their divisor difference. COL-1038 identifies that module
with the closed-fibre pullback of the original difference. COL-1031 then
produces an actual global root. Avoidance of the section images makes each
full inverse-image ideal the unit ideal, so the native Cartier pullback
comparison and empty-divisor evaluation pairing give a specific boundary
trivialization. Apply the lower endpoint of COL-1037 to that trivialization
and the actual global root, retaining the exact equality of isomorphisms.
'''
scope = '''
The geometric closed-fibre hypothesis is IsCurve over the residue field;
it is not inferred merely from smooth relative dimension one. Strict
henselianity supplies separable closedness of that residue field. No
Picard-divisibility, degree-zero, Cartier, fibre-root or boundary-frame
certificate is supplied by the caller. The boundary may be nonreduced,
nonflat or the zero finite algebra. All schemes and rings have universe
\(u\). The result asserts existence of a root, not extension of a chosen
closed-fibre root. Producing moving finite-flat divisors and a principal
correspondence identity from this framed root is a separate step.
'''
