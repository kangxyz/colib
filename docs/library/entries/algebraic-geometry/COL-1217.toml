[entry]
id = "COL-1217"
title = "Eventual lifting of prescribed quotient sections"
kind = "theorem"
section = "projective-section-lifting"
order = 10
primary = "AlgebraicGeometry.Scheme.Modules.exists_surjective_twisted_evaluation_of_coherent_epi"
review = "author_checked"
statement = '''
Let \(R\) be a noetherian commutative ring, and let \(\varphi:G\to F\)
be an epimorphism of coherent module sheaves on the native projective space
\(\operatorname{Proj}(\mathrm{polyGrading}\ R\ n)\). There exists one
integer \(B\) such that, for every integer \(d\ge B\), the actual map
of global sections \(\Gamma(G(d))\to\Gamma(F(d))\) induced by
\(\varphi(d)\) is surjective. In particular, every prescribed section
of the twisted quotient lifts.
'''
proof = '''
The actual kernel of \(\varphi\) is coherent. Native Serre vanishing
[@stacks, Tag 01YS] supplies a uniform lower bound for the vanishing of
its first cohomology after twisting. Exactness of the native twist functor
carries the kernel short exact sequence to the corresponding twisted
sequence. Identify native sheaf cohomology with the derived evaluation
functor, and apply the native evaluation-surjectivity theorem. Both the
bound and the cohomology vanishing are produced, not supplied as inputs.
'''
scope = '''
The projective-space dimension parameter is a natural number and the twist
parameter is an integer. The underlying ring need not be reduced or a field.
The modules and ring have the same universe. The conclusion concerns the
actual native evaluation map, rather than an abstractly isomorphic group.
Two prescribed quotient maps can use the maximum of their two bounds.
Applying this result to a full boundary under a finite projective presentation
still requires the actual pushforward, restriction and projection-formula
comparisons, supplied for a projective closed embedding by COL-1219.
No finite-flat divisor pair is asserted here.
'''
