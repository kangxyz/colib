[entry]
id = "COL-1032"
title = "Krull dimension bounds smooth Nisnevich cohomology"
kind = "theorem"
review = "author_checked"
source_checked_on = "2026-11-12"
section = "nisnevich-sites"
order = 25
primary = "AlgebraicGeometry.Scheme.SmoothSite.nisnevichCohomology_eq_zero_of_krullDim_lt"
statement = '''
Let \(S\) be a noetherian scheme and \(X\) a smooth separated finite-type
\(S\)-scheme. For every ordinary abelian sheaf \(F\) on the smooth Nisnevich
site, \(H^n_{\mathrm{Nis}}(X,F)=0\) if \(n>\dim X\), where \(\dim X\)
is the topological Krull dimension. If \(\dim X\leq d\) for a natural
number \(d\), the free Nisnevich representing sheaf of \(X\) has
projective dimension at most \(d\).
'''
scope = '''
The coefficients are ordinary abelian sheaves in universe \(u+1\) for
schemes in universe \(u\). The groups and their restriction maps are
the native Ext groups from the free Nisnevich representing sheaf.
'''
proof = '''
Noetherian induction produces a finite splitting sequence for each
normalized étale cover, which gives a finite refinement by the geometric
distinguished squares of COL-0341. Their open refinements preserve the
standard density filtration. A positive-degree class dies on a cover.
Induction on the cover and on the cohomological degree, using the natural
Mayer–Vietoris boundary, kills it on an open in the corresponding density
degree. Above the Krull dimension this open is the whole scheme.
'''
