[entry]
id = "COL-0390"
title = "Stalkwise and interval homotopy localizations"
kind = "definition"
section = "pointed-motivic-inputs"
order = 40
primary = "CategoryTheory.PointedSimplicialPresheaf.toIntervalHomotopyCategory"
statement = '''
On a site \((\mathcal C,J)\), invert the maps that become realization weak
equivalences at every native site fiber. For a chosen simplicial presheaf \(I\),
a local object in that category is tested by precomposition with each cylinder
projection \(C_I(X)\to X\), where \(C_I(X)=(X\times I)\amalg_I *\)
collapses the basepoint axis. The interval localization inverts the maps that
induce bijections against all such local objects. When simplicial
sheafification exists and is left exact, its pointed unit induces an
isomorphism on each site fiber.
'''
scope = '''
On the smooth site over a quasi-separated scheme, the affine basis supplies
ordinary sheafification in the scheme universe and simplicial sheafification
is degreewise. For \(I=\mathbb A^1_R\), the contraction
\((x,t)\mapsto 1+t(x-1)\) identifies the pointed affine line with the point
after localization. Comparison with the Morel–Voevodsky homotopy category
and local replacement are separate obligations.
'''
review = "author_checked"
