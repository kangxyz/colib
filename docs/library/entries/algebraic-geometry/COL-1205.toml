[entry]
id = "COL-1205"
title = "Proper restriction over a strictly henselian local ring"
kind = "theorem"
section = "proper-etale-specialization"
order = 10
primary = "Stacks.EtaleCohomology.bijective_etaleCohomologyRestrictionMap_closedFibre_of_strictlyHenselian"
review = "author_checked"
statement = '''
Let \(R\) be a strictly henselian local ring and let
\(f\colon X\to\operatorname{Spec}R\) be proper. Write
\(i\colon X_0\to X\) for its actual closed-fibre inclusion. If an abelian
sheaf \(F\) on the small étale site of \(X\) is killed by a positive
integer \(n\), then the canonical restriction
\[
H^q_{\mathrm{\acute et}}(X,F)\longrightarrow
H^q_{\mathrm{\acute et}}(X_0,i^*F)
\]
is bijective for every natural degree \(q\).
'''
proof = '''
The residue field of \(R\) is separably closed, so the ordinary closed fibre
is already a geometric fibre for proper base change. For an injective sheaf
of \(\mathbb Z/n\)-modules, the higher direct images of its underlying
abelian sheaf vanish. The native proper geometric-fibre stalk isomorphism
therefore makes its restriction acyclic on \(X_0\). Apply the native
dimension-shifting criterion to these injective-module embeddings. Its
degree-zero input and connecting maps are the canonical restriction maps,
so the result is bijectivity of that actual map, not merely the existence
of an isomorphism between the two groups.
'''
scope = '''
Rings and schemes have universe \(u\), and abelian coefficients and Ext
have universe \(u+1\). No invertibility of \(n\), smoothness, dimension,
Noetherian or primality hypothesis is used. The input proper base change
theorem and its geometric stalk form are the pinned Stacks implementations
of [@stacks, Tag 095T] and [@stacks, Tag 0DDF]. This is the ordinary étale
specialization supplier; comparison with Picard classes and the smooth-site
transfer sheaf remains a separate construction.
'''
