[entry]
id = "COL-1221"
title = "Finite locally free prescribed divisor pairs"
kind = "theorem"
section = "projective-section-lifting"
order = 30
primary = "AlgebraicGeometry.Scheme.Modules.exists_boundary_framed_finiteLocallyFree_section_pair"
review = "author_checked"
statement = '''
Let \(X\) admit a closed embedding into projective space over a noetherian
commutative ring. Let \(q:X\to S\) be proper with \(S\) affine, and let
\(j:U\to X\) be a quasi-affine open subscheme, smooth of relative dimension
one over \(S\). Suppose the images of \(U\) and a closed boundary
\(i:Z\to X\) cover \(X\). For two invertible modules \(M,N\) on \(X\),
one integer twist bound works for every pair of full-boundary frames of
their twists. There exist actual global sections with both frame coordinates
equal to one, whose whole zero schemes lie in \(U\), are relative effective
Cartier divisors, and are finite locally free over the original base \(S\).
'''
proof = '''
COL-1219 produces the sections with their exact full-boundary values.
Those values force the whole zero schemes into \(U\); properness and
quasi-affineness make them finite over \(S\). A locally quasi-finite closed
subscheme of a smooth relative curve has discrete fibres. At each supported
fibre point its nonzero ideal in a one-dimensional regular local ring is
generated by a nonzerodivisor. Local principality of the original zero
scheme and the native fibre criterion [@stacks, Tag 062Y] then produce
Cartier regularity and relative flatness. The smooth-relative-curve
criterion [@stacks, Tag 0B9D] supplies finite presentation, yielding finite
local freeness. The zero scheme is unchanged by restriction to \(U\),
and Cartier regularity extends across its empty complement.
'''
scope = '''
The geometric criterion itself works over an arbitrary base: a locally
principal closed subscheme of a smooth relative curve that is locally
quasi-finite over the base is a relative effective Cartier divisor.
No reducedness, integrality, perfectness or noetherianity of that base is
assumed. No smoothness of the compactification away from \(U\) is needed.
The projective noetherian hypotheses belong only to the section-lifting
step. All rings and schemes share one universe. The pair theorem is still
conditional on the two full-boundary twist frames; it does not construct
their compatibility with a given tensor root. The subsequent meromorphic
signed divisor identity and principal-correspondence identity are not
asserted here.
'''
