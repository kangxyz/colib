[entry]
id = "COL-0386"
title = "The Laurent complement and pointed Tate quotient"
kind = "definition"
section = "pointed-motivic-inputs"
order = 30
primary = "AlgebraicGeometry.MotivicHomotopy.tateSphere"
statement = '''
Over a commutative ring \(R\), the Laurent open \(D(t)\subset\mathbb A^1_R\)
is the complement of the zero section. The point \(t=1\) makes the inclusion
\(j\colon(\mathbb G_m,1)\to(\mathbb A^1,1)\) pointed. Collapsing its source
gives the strict quotient \(T=\mathbb A^1/(\mathbb A^1-0)\).
The map from the reduced mapping cone of \(j\) to \(T\) is a weak equivalence
at each Nisnevich site fiber, so it becomes invertible in COL-0390.
'''
scope = '''
The map to \(T\) collapses the attached simplicial cone. The other map from
the cone to the simplicial suspension of \((\mathbb G_m,1)\) requires an
affine-line homotopy pushout comparison.
'''
review = "author_checked"
