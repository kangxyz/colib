[entry]
id = "COL-1028"
title = "The étale topology on smooth schemes"
kind = "definition"
section = "smooth-etale-sites"
order = 10
primary = "AlgebraicGeometry.Scheme.SmoothSite.ofArrows_mem_etalePrecoverage_iff"
review = "author_checked"
statement = '''
Let \(S\) be a scheme. On the existing category of smooth separated finite-type
\(S\)-schemes, a family \(\{U_i\to X\}\) is an étale covering family exactly
when its original scheme maps are étale and jointly surjective. These covers
are stable under composition and base change. They generate a Grothendieck
topology finer than the Nisnevich topology of COL-0340.

Restriction from étale sheaves to Nisnevich sheaves is fully faithful and
retains the literal underlying presheaves and their morphisms. The forgetful
functor to schemes is continuous for the étale topologies.
'''
proof = '''
Pull back the native scheme étale precoverage along the forgetful functor.
Its covering arrows have the cover-specific pullbacks already constructed
in the smooth category, and the forgetful functor preserves these pullbacks.
The native precoverage axioms therefore restrict to the same objects.
Every Nisnevich family is such an étale family, giving the topology
inequality and the full inclusion of the corresponding sheaf categories.
'''
scope = '''
The base scheme is arbitrary. Cover indices and coefficient categories may
have independent universes. This is the étale topology on the smooth site,
not an identification with the base scheme's small étale site. The result
uses [@stacks, Tag 0215] on the existing smooth objects and actual scheme maps.
'''
