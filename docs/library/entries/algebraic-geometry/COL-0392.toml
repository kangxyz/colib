[entry]
id = "COL-0392"
title = "The smooth Nisnevich point at the base field"
kind = "definition"
section = "nisnevich-sites"
order = 50
primary = "AlgebraicGeometry.Scheme.SmoothSite.nisnevichBasePoint"
statement = '''
On the smooth Nisnevich site over a field \(k\), the constant one-object
diagram at \(\operatorname{Spec}k\) gives a site point. Its presheaf and
sheaf fiber functors are naturally isomorphic to evaluation at
\(\operatorname{Spec}k\). The map from evaluation to the presheaf fiber
takes a section to the germ represented by the identity at the base.
'''
scope = '''
The comparison uses the colimits of the native point construction in the
coefficient category. It applies in particular to simplicial sets.
'''
review = "author_checked"
