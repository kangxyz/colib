[entry]
id = "COL-0393"
title = "Affine Nisnevich refinement and sheafification restriction"
kind = "comparison"
section = "nisnevich-sites"
order = 15
primary = "AlgebraicGeometry.Scheme.SmoothSite.nisnevichTopology_eq_restrictedTopology"
review = "author_checked"
source_checked_on = "2026-11-10"
statement = '''
Let \(S\) be an affine scheme and let \(j\colon\mathrm{Sm}/S\to\mathrm{Sch}/S\)
include the smooth separated finite-type schemes with all morphisms over \(S\).
Write \(J\) for the family-generated smooth Nisnevich topology of COL-0340 and
\(K\) for the big Nisnevich topology on schemes over \(S\). Every \(K\)-covering
sieve \(R\) on \(jX\) contains the image of a \(J\)-covering presieve on \(X\).
Consequently \(J\) is both the restricted and the induced topology along \(j\),
and \(j\) is continuous and cocontinuous. For a sieve \(T\) on \(X\),
\[
T\in J(X)\quad\Longleftrightarrow\quad j_*T\in K(jX),
\]
where \(j_*T\) is the sieve generated by the image of \(T\).

Let \(A\) be a category admitting weak sheafification on both sites, and suppose
every \(A\)-valued presheaf on \(\mathrm{Sm}/S\) has a pointwise right Kan extension
along \(j^{\mathrm{op}}\). With \(j^*\) denoting restriction, Mathlib's canonical
comparison is a natural isomorphism
\[
\alpha_P\colon a_J(j^*P)\xrightarrow{\sim}j^*(a_KP),
\qquad \alpha_P\circ\eta_{J,j^*P}=j^*(\eta_{K,P}).
\]
The unit identity is an equality of the underlying presheaf maps, not merely an
unspecified isomorphism of the two sheaves.
'''
scope = '''
The affine-base hypothesis ensures that affine open refinements belong to the
chosen smooth category. The original big covering sources need not be separated
or quasi-compact. Refinement is a statement about covering sieves, not raw
restriction of arbitrary covering presieves. Local cover density is asserted at
objects in the image of \(j\), not for all schemes over \(S\).

The coefficient category has independent object and morphism universes, and both
`HasWeakSheafify` instances and the pointwise right Kan extension hypothesis are
retained. The comparison and its unit are the original Mathlib declarations,
registered directly here; no wrapper or alternative sheafification is defined.
No transfer structure, cohomology comparison or nonaffine extension is asserted.
'''
proof = '''
Choose a Nisnevich family generating a subsieve of \(R\), then refine each source
by its affine open cover. The composite of an affine-open immersion, the original
etale arrow and the smooth structure map of \(X\) is smooth. Its source and \(S\)
are affine, so the composite to \(S\) is separated and quasi-compact and hence is
an object of \(\mathrm{Sm}/S\). Composition stability makes the refined family
Nisnevich covering; downward closure keeps it in \(R\).

The native sieve image and pullback identities for the over-category transport
this refinement to \(\mathrm{Sch}/S\). The general precoverage comparison gives
one inclusion of topologies, and refinement gives the reverse inclusion. Mathlib
then identifies restricted and induced topology and supplies cocontinuity.
Continuity and cocontinuity identify the two left adjoints to the same functor;
the uniqueness comparison preserves their adjunction units.

The geometric proof adapts [@motivic_source_a6805c4, Motivic/Aglib/AlgebraicGeometry/Sites/Smooth/Nisnevich/Refinement.lean:39-61,65-76,81-91,95-109,113-116,120-123,126-129].
The final two maps are used directly from [@mathlib_stable_localization_pin, Mathlib/CategoryTheory/Sites/CoverLifting.lean:367-371,376-397].
'''
