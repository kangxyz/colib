[entry]
id = "COL-1031"
title = "Kummer specialization of Picard divisibility"
kind = "theorem"
section = "proper-etale-specialization"
order = 20
primary = "Stacks.Kummer.picard_nsmul_exists_iff_closedFibre"
review = "author_checked"
statement = '''
Let \(X\to\operatorname{Spec}R\) be proper over a strictly henselian
local ring, let \(i\colon X_0\to X\) be its actual closed-fibre inclusion,
and let \(n>0\) be invertible in \(\Gamma(X,\mathcal O_X)\).
A class \(L\in\operatorname{Pic}(X)\) is an \(n\)-fold multiple if and
only if \(i^*L\in\operatorname{Pic}(X_0)\) is an \(n\)-fold multiple.
'''
proof = '''
Compose the native inverse Picard-to-first-cohomology equivalence with the
Kummer connecting map. Native Kummer exactness identifies its kernel with
\(n\operatorname{Pic}(X)\), yielding the canonical injection
\(\operatorname{Pic}(X)/n\hookrightarrow H^2(X,\mu_n)\).
Native Picard and Kummer naturality identify the pullback square with the
actual invertible-module pullback. COL-1030 and the roots-of-unity coefficient
comparison make the right-hand vertical map bijective. It therefore reflects
zero Kummer classes, which is precisely the required divisibility assertion.
Native Picard representatives and equality-as-isomorphism then extract a
global invertible module and tensor-power isomorphism whenever such a root
exists on the closed fibre.
'''
scope = '''
The general Kummer injection and its naturality allow independent coefficient
and Ext universes. Proper specialization uses scheme universe \(u\) and
coefficient and Ext universe \(u+1\). No vanishing of \(H^2(X,\mathbb G_m)\),
primality, dimension or smoothness assumption is used. The input Kummer
sequence is [@stacks, Tag 03PL]; exactness and naturality use the pinned
[@axiom_stacks_5ed82d14] implementations. The extracted global tensor root
need not extend the specified fibre root or its specified isomorphism.
No compatible boundary frame is supplied.
'''
