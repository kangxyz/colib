[chapter]
id = "algebraic-geometry"
title = "Algebraic Geometry"
order = 40
introduction = "Scheme constructions retain their actual morphisms and geometric hypotheses."

[[sections]]
id = "affine-open-pairs"
title = "Affine open pairs"
order = 10
introduction = "Chosen pullbacks retain the coefficient functor and quasi-compactness over affine bases."

[[sections]]
id = "perfect-complexes"
title = "Perfect complexes"
order = 20
introduction = "Native Stacks perfect complexes carry the actual monomorphism/quasi-isomorphism Waldhausen structure. No legacy perfectness predicate or comparison layer is maintained. The honest open-derived image uses actual chain complexes and derived isomorphisms. Its triangle and short-exact closure, Waldhausen structure, exact corestriction and strict incoming factorization retain the explicit global-perfect-model roof input. Bounded finite locally free complexes retain global term bounds, actual extensions, shifts, signed cones, vector-bundle inclusion, native perfect inclusion and compatible opposite joint data over arbitrary schemes. Finite local freeness is not replaced by global finite-free retraction."

[[sections]]
id = "nisnevich-sites"
title = "Nisnevich sites and descent"
order = 30
introduction = "Native schemes and smooth separated finite-type objects carry the actual Nisnevich topology. Distinguished-square sheaf gluing and field evaluation preserve their original morphisms and coefficient categories."

[[sections]]
id = "algebraic-simplices"
title = "Algebraic simplices and ordinary singular chains"
order = 40
introduction = "Actual barycentric simplices, Cartesian coefficient change and ordinary singular chains retain their original maps. A geometric prism and interval contraction prove ordinary A1 homotopy invariance without assuming transfers."

[[sections]]
id = "finite-correspondences"
title = "Finite correspondences and the graph functor"
order = 50
introduction = "Actual signed native cycles, incidence Tor composition and full component identities define Cor over arbitrary fields."

[[sections]]
id = "transfers-nisnevich"
title = "Transfers and Nisnevich sheafification"
order = 60
introduction = "Additive transfer presheaves satisfy genuine signed Cech local exactness and ordinary Nisnevich comparison. Transfer-preserving sheafification retains its universe and canonical units."
