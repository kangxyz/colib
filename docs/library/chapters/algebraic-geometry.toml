[chapter]
id = "algebraic-geometry"
title = "Algebraic Geometry"
order = 40
introduction = "Scheme constructions retain their actual morphisms and geometric hypotheses. The smooth and Nisnevich foundations here are used by the separate correspondence and transfer constructions beginning with COL-0374 and COL-0368."

[[sections]]
id = "affine-open-pairs"
title = "Affine open pairs"
order = 10
introduction = "Chosen pullbacks retain the coefficient functor and quasi-compactness over affine bases."

[sections.transitions]
COL-0149 = '''
Let \(U\hookrightarrow\operatorname{Spec}R\) be the fixed open immersion. For an
\(R\)-algebra \(A\), put \(U_A=U\times_{\operatorname{Spec}R}\operatorname{Spec}A\).
The pullback projections give the maps for a change of \(A\), and the map to
\(\operatorname{Spec}A\) remains the open immersion of the coefficient pair.
'''

[[sections]]
id = "perfect-complexes"
title = "Perfect complexes"
order = 20
introduction = "Native perfect complexes form a Waldhausen subcategory of cochain complexes. Open restriction, bounded vector-bundle models and the derived image of restriction are described using actual complexes and chain maps."

[sections.transitions]
COL-0229 = '''
For an open immersion \(j\colon U\hookrightarrow X\), restriction takes the local
finite locally free models of a perfect complex to models on \(U\). Applied
degreewise, \(j^*\) preserves the monomorphisms, quasi-isomorphisms and pushout
squares of the Waldhausen structure.
'''
COL-0313 = '''
A bounded complex of finite locally free modules supplies a perfect model with
specified global term bounds. Closure under extensions, shifts and signed cones
gives a category of these models on which vector bundles act by the degree-zero
inclusion and whose inclusion into perfect complexes is exact.
'''
COL-0312 = '''
The derived image of \(j^*\) consists of actual complexes on \(U\) that are
derived-isomorphic to some \(j^*P\) with \(P\) perfect on \(X\). To use this class
as a Waldhausen category and obtain strict incoming factorizations, the
global-perfect-model roof hypothesis supplies representatives for the relevant
derived maps.
'''

[[sections]]
id = "nisnevich-sites"
title = "Nisnevich sites and descent"
order = 30
introduction = "Native schemes and smooth separated finite-type objects carry the actual Nisnevich topology. Distinguished-square sheaf gluing and field evaluation preserve their original morphisms and coefficient categories. Ordinary Nisnevich descent precedes the additional transfer structure in COL-0369 and its sheafification in COL-0372, as in [@MVW2006, Lectures 12 and 13]."

[sections.transitions]
COL-0393 = '''
Keep the smooth category and the Nisnevich topology of COL-0340. Over an affine
base, refine each source of a big Nisnevich cover by affine opens. These sources
remain smooth, separated and finite type over the base. The resulting comparison
of covering sieves makes restriction compatible with ordinary sheafification.
'''
COL-0341 = '''
In a distinguished square, an open immersion \(U\hookrightarrow X\) and an étale
map \(V\to X\) that is an isomorphism over the closed complement give a Nisnevich
cover. On \(V\times_X V\), the diagonal and the part lying over \(U\) provide
the cover used to check compatibility of the two restrictions.
'''
COL-0343 = '''
For the base object \(\operatorname{Spec}k\), the residue-field condition gives
a lift of its field point through any Nisnevich cover. The resulting section
puts the identity into the covering sieve. Local lifting conditions for sheaves
at this object are consequently conditions on their actual sections. For abelian
sheaves the native representing object is projective. Apply COL-0394 to compute
unbounded hypercohomology from the literal sections complex at the base field.
'''

COL-1010 = '''
The field-valued lifting test of COL-0340 applies in each affine étale
neighborhood of a scheme point. The marked neighborhood diagrams give actual
Nisnevich fibers. Conservativity relates their lifts back to the same covers.
'''

[[sections]]
id = "smooth-etale-sites"
title = "Étale topology on smooth schemes"
order = 35
introduction = '''
Keep the smooth separated finite-type objects and their original scheme maps
from COL-0340. Jointly surjective étale families give a finer topology on this
same category. Restriction of its sheaves to the Nisnevich topology changes
neither their sections nor their morphisms.
Native sheafification on this same smooth category gives the ordinary
change-of-topology left adjoint with its canonical unit and counit.
Affine etale neighborhoods marked by a separably closed field point give
actual point fibers on this smooth category. Their original colimit maps
retain representatives, refinement equations and the sheafification unit.
'''

[sections.transitions]
COL-1060 = '''
The full small etale site contains objects outside the finite-type smooth
category. Use its genuine separated finite-type basis and affine cover
density to compare sheaves while retaining literal restriction.
'''
COL-1061 = '''
Insert this basis equivalence into the actual extension/restriction
adjunction. Its canonical unit and counit remain the original Kan and
sheafification maps; proving the counit invertible for HI torsion transfers
is the remaining rigidity assertion, not a consequence of the adjunction alone.
'''

[[sections]]
id = "normal-curve-compactifications"
title = "Normal compactifications and retained charts"
order = 34
introduction = '''
Relative normalization extends an original finite chart over a proper Nagata
target without replacing its source. The full boundary is the Cartesian
pullback of the original finite boundary, preserving its scheme structure
and its map to the unchanged base. When a smaller retained open contains
the whole marked affine fibre, the proper finite-fibre theorem produces
a base shrink on which its closed boundary is finite.
'''

[sections.transitions]
COL-1067 = '''
The boundary of the original finite chart need not equal the complement of
a smaller smooth open. Whole-fibre containment makes the new missing fibre
finite, so the native proper finite-fibre theorem supplies the required base
neighborhood. A specified thickened boundary is retained; a separately
constructed closed complement uses its chosen vanishing ideal.
'''
COL-1069 = '''
Apply the normal finite-chart construction to the native projective line
and its actual infinity section. The original finite polynomial coordinates
and whole-fibre smooth open then feed the same principal-neighborhood
construction, preserving both affine coordinate and base maps.
'''

[[sections]]
id = "projective-section-lifting"
title = "Projective section lifting"
order = 36
introduction = '''
Coherent kernels and native Serre vanishing give eventual surjectivity of
actual global-section maps after twisting. Prescribed quotient sections
therefore lift with a uniform integer bound. Boundary restriction along a
finite projective presentation uses this result together with its specific
pushforward and projection-formula comparisons. For a projective closed
embedding these comparisons identify the original full-boundary restriction
map, so prescribed sections lift simultaneously with one common bound.
Boundary-normalized sections on a proper compactification then give finite
locally free Cartier zero schemes inside its smooth relative-curve open.
'''

[sections.transitions]
COL-1044 = '''
Apply the coherent-quotient lifting theorem to the actual closed-boundary
adjunction unit. Affine pushforward and the closed-immersion projection
formula identify its twisted global-section map with restriction on the
original scheme. The full boundary values, including nilpotents, are retained.
'''
COL-1046 = '''
The lifted sections have coordinate one in their full-boundary frames, so
their whole zero schemes lie in the retained open. Properness and
quasi-affineness make them finite. Smooth relative dimension one and local
principality then produce Cartier regularity and relative flatness rather
than requiring those properties as inputs.
'''
COL-1048 = '''
Over a module-finite boundary of a local base, semilocal Picard triviality
provides a frame for the auxiliary twist. Tensor it with the fixed original
frame to prescribe the numerator, and use the same auxiliary frame for the
denominator. This produces compatible divisor pairs without a new frame
choice for the original line bundle.
'''

[[sections]]
id = "proper-etale-specialization"
title = "Proper étale specialization"
order = 37
introduction = '''
For a proper scheme over a strictly henselian local base, its closed fibre
is a geometric fibre. Native proper base change and dimension shifting
identify the canonical restriction on ordinary small-site étale cohomology
with finite-exponent coefficients. The native Kummer boundary embeds the
Picard group modulo n into roots-of-unity cohomology and reflects divisibility
from the closed fibre. Actual section-kernel pullback identifies the divisor
difference under arbitrary base change. Finite-algebra unit roots then supply
a compatible frame on the full finite affine boundary, preserving nilpotents
and the original tensor-power equation. For sections with the same
closed-fibre morphism, the actual difference is already the unit module
on that fibre. The direct proper Kummer route then needs smoothness only
on the open containing their images.
'''

[[sections]]
id = "meromorphic-section-divisors"
title = "Meromorphic sections and divisor identities"
order = 38
introduction = '''
On an integral scheme, generic-stalk tensor division constructs actual
meromorphic quotient sections. Under local noetherianity, native tensor
powers and the ratio of two regular sections retain the original
Weil-divisor coefficients and the orientation of the principal correction.
These identities are used before comparing with finite correspondences.
'''

[sections.transitions]
COL-1050 = '''
For an actual Cartier difference, construct the correcting numerator rather
than supplying its divisor as a premise. The original canonical Cartier
sections and their tensor pairing give a regular meromorphic section with
exactly the full positive-minus-negative local quotient lengths.
'''
COL-1052 = '''
Return from the generic stalk to the original denominator's nonvanishing
open. Its actual trivialization produces an ordinary tensor quotient with
a literal recovery equation, including nilpotents. Under the stated integral
hypotheses, its generic germ is the previous meromorphic quotient.
A denominator framed as one contains the full boundary in this open;
tensor recovery computes coordinate one in the original frame of the quotient module.
'''

COL-1058 = '''
Keep the ordinary quotient on its original open when forming powers.
The native successor comparisons and the exact Kummer power frame carry
coordinate one to coordinate one, including on a nonreduced boundary.
The original integer-power pullback square and root-frame compatibility
then preserve this coordinate in the target. Integrality is needed only
for the separate comparison with positive meromorphic powers.
'''

COL-1059 = '''
The canonical numerator now has an ordinary representative on the original
denominator complement. Its full-boundary pullback has coordinate exactly
one in the original Cartier difference frame, so no replacement frame or
merely divisor-equivalent section enters the later ratio.
'''

COL-1063 = '''
The two ordinary representatives now determine their own common generator
open and actual unit ratio. Pullback of the defining equation preserves
value one on the full boundary. Generic regularity makes this same open
dense and identifies its unit with the original meromorphic ratio.
'''

COL-1066 = '''
Use the canonical numerator and the actual framed power of the original
quotient a/b. The same correction function gives the positive principal
term in the signed Cartier identity and an ordinary unit equal to one on
the entire boundary. Restriction to the retained open and its finite
correspondence interpretation remain separate.
'''

[[sections]]
id = "algebraic-simplices"
title = "Algebraic simplices and ordinary singular chains"
order = 40
introduction = "Actual barycentric simplices, Cartesian coefficient change and ordinary singular chains retain their original maps. A geometric prism and interval contraction prove ordinary A1 homotopy invariance without assuming transfers."

[sections.transitions]
COL-0348 = '''
The cosimplicial maps of the barycentric simplices induce simplicial restriction
maps on \(P(U\times\Delta^n)\). Taking the alternating sum of face restrictions
gives the ordinary singular differential, with its endpoint difference in degree one.
'''
COL-0349 = '''
The prism extends the comparison of the two endpoints from degree one to a chain
homotopy on the whole singular complex. For the interval projection, multiplication
on the interval gives the contraction to the vertex zero and identifies that
vertex restriction as the chain homotopy inverse.
'''

COL-0395 = '''
Retain the ordinary chain complex of COL-0348 and its actual barycentric face
signs. Exact sheafification now gives a complex of ordinary sheaves and a
canonical homology comparison. To use integer cochain degrees, place chain
degree \(r\) in degree \(q-r\); the specified term isomorphisms carry the original
differential, without yet identifying this placement with a signed shift.
'''

[[sections]]
id = "scheme-products-and-index-squares"
title = "Scheme products and geometric index squares"
order = 15
introduction = "Products over the integral terminal scheme retain their fixed-factor maps. Their interchange defines the geometric polynomial and Laurent index squares and the projection equations used by scheme K-theory."

[sections.transitions]
COL-0532 = '''
For two schemes over the integral terminal scheme, the two nested pullbacks have
three coordinate projections. Their interchange fixes the base coordinate and
exchanges the two independent factors. Applied to the polynomial and Laurent
charts, these maps assemble into the opposite index square and retain the
projection to its original source leg.
'''
COL-0536 = "The independent-factor products of COL-0532 also transport an open immersion in the fixed factor. As the scheme parameter varies, the two product maps retain the entire commuting square. This gives the actual open-pair family used for supported sections in COL-0534."
COL-0578 = "Polynomial and Laurent base-change squares provide the geometric comparison required to apply the index-change construction to the integral Spec functor."

