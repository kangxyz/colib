[chapter]
id = "category-theory"
title = "Category Theory"
order = 5
introduction = "Categorical foundations retain their chosen objects, universal properties and admissible maps. Exact structures supply the conflations used by algebraic K-theory without requiring an ambient abelian category."

[[sections]]
id = "exact-categories"
title = "Exact categories"
order = 10
introduction = "A chosen class of kernel-cokernel pairs determines an exact structure. Its admissible maps satisfy the Quillen axioms and the mixed pullback theorem. Abelian categories provide the canonical example using all short exact sequences. Additive Serre localization functors preserve these canonical conflations. Matrix rows extend admissible epimorphisms, and exact functors preserve pullbacks along admissible epimorphisms. Actual finite conflation towers retain their factors and give additive telescoping formulas. Bounded native complexes quasi-isomorphic to a single object supply actual finite towers for replete kernel-closed classes containing zero; lifting to an exact full subcategory retains every arrow and the tower length."

[[sections]]
id = "bicategories"
title = "Bicategories"
order = 20
introduction = "Passing from a bicategory to isomorphism classes of its 1-morphisms gives an ordinary category. The quotient retains the original objects and only identifies arrows joined by invertible 2-morphisms."

[[sections]]
id = "restricted-spans"
title = "Restricted spans"
order = 30
introduction = "Restricted spans compose by mixed pullbacks and become ordinary morphisms after quotienting by apex isomorphisms. Admissible epimorphisms on the left and admissible monomorphisms on the right recover the shape of Quillen's Q-construction once the exact-category structure supplies the hypotheses. In the abelian case, quotient spans identify devissage layers with the actual inclusion comma category."

[[sections]]
id = "functor-constructions"
title = "Functor constructions"
order = 40
introduction = "Specified object isomorphisms can replace selected functor values while retaining an explicit natural-isomorphism comparison. Actual cocartesian sections over a coslice recover the original pseudofunctor fiber by identity evaluation. Canonical sections prove essential surjectivity, cocartesian extension proves full faithfulness, and literal reindexing retains identities, composites and preserved chosen zeros."

[[sections]]
id = "waldhausen-categories"
title = "Waldhausen categories"
order = 50
introduction = "Structures and exact functors support inheritance, transport and an explicitly unnormalized diagonal S-construction. The original fine-exact joint cylinder becomes coarse-exact under coarse two-out-of-three, by endpoint gluing and projection naturality, with its actual functor and endpoint maps unchanged. Coherent component joint data constructs a genuinely exact joint cylinder on the literal opposite weak-arrow category. The original endpoint equations remain explicit; heterogeneous exact projections detect its actual relative cofibrations. Actual opposite complexes retain their degree-reversing equivalence and exact-category duality. Exact additive functors and native perfect open restriction carry coherent joint comparisons, both endpoint orientations and the actual opposite weak-arrow construction."
