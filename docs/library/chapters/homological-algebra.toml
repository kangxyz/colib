[chapter]
id = "homological-algebra"
title = "Homological Algebra"
order = 30
introduction = "Native resolutions and derived invariants supply the bounds used in cohomological applications. Each result retains its actual objects, coefficients and size assumptions."

[[sections]]
id = "projective-dimension"
title = "Projective resolutions and dimension"
order = 10
introduction = "The finite exterior-power Koszul resolution of a weakly regular sequence gives projective dimension and Ext vanishing bounds for its actual ideal quotient. The underlying resolution and Ext groups are those of Stacks and Mathlib."

[[sections.topics]]
id = "resolution-bounds"
title = "Resolution length and Ext bounds"
start = "COL-0021"

[[sections.topics]]
id = "principal-connecting-classes"
title = "Principal connecting classes and their signs"
start = "COL-0120"

[[sections.topics]]
id = "top-koszul-classes"
title = "Top exterior classes and quotient coefficients"
start = "COL-0118"

[[sections.topics]]
id = "top-ext-localization"
title = "Localization and flat base change"
start = "COL-0142"

[sections.transitions]
COL-0041 = '''
For a single ring-regular element \(a\), the resolution length is one.
The remaining degree-zero term is \(\operatorname{Hom}_R(R/(a),N)\).
Evaluation at \(1\) identifies it with the elements of \(N\) killed by \(a\),
so regularity on the coefficients is the condition that removes degree zero.
'''
COL-0120 = '''
Applying \(\operatorname{Hom}_R(-,N)\) to the principal short exact sequence
gives multiplication by \(a\) on the two copies of \(N\). The connecting
homomorphism therefore identifies the cokernel \(N/aN\) with
\(\operatorname{Ext}^1_R(R/(a),N)\).
'''
COL-0126 = '''
To compare this connecting class with a projective-resolution cocycle, choose
compatible lifts through the augmentation and the extension. In the native
cochain convention the resulting \(\operatorname{Ext}\) class is the negative
of the extension class. This sign enters the principal comparison.
'''
COL-0121 = '''
The resolution and the principal sequence can have isomorphic quotient
objects. Precomposition by the inverse quotient isomorphism puts the
resolution class on the source \(R/(a)\) of the standard connecting class.
'''
COL-0117 = '''
For the singleton Koszul resolution the coordinate cocycle gives the
degree-one representative. The canonical augmentation quotient comparison
supplies the transport required in COL-0121.
'''
COL-0110 = '''
The quotient map \(R/(ca)\to R/(a)\) extends to a map of the two principal
sequences. Its map between the left copies of \(R\) is multiplication by
\(c\), since \(a(cx)=(ca)x\). Naturality of the
connecting class gives the same factor \(c\) on coefficients.
'''
COL-0114 = '''
Under the singleton quotient identifications, the map of quotient sources
is the one used for the principal connecting classes. Both singleton
cocycles have the negative sign from COL-0117, so the coefficient factor
in the transported equation is still \(c\).
'''
COL-0118 = '''
For a sequence of length \(r\), the wedge of the \(r\) basis vectors gives the
top exterior coordinate. A coefficient \(m\) specifies a map out of that
coordinate and thus a top cocycle. The image of the preceding differential
controls which of these cocycles represent the same Ext class.
'''
COL-0112 = '''
A matrix acting on the degree-one generators acts on their top exterior
power by its determinant. The augmented comparison uses this exterior
map in the top degree, so pulling back the coordinate cocycle multiplies
its coefficient by the determinant.
'''
COL-0119 = '''
For positive length and ring coefficients, the top boundaries are the
ideal \(I\) generated by the sequence. Hence the standard coordinate
class depends exactly on the residue in \(R/I\).
'''
COL-0134 = '''
With coefficients in an \(R\)-module \(N\), the same boundary calculation
has image \(IN\). The quotient \(N/IN\) then records the coefficients of
the top classes, and postcomposition of the cocycle describes the map
induced by a coefficient homomorphism.
'''
COL-0137 = '''
For the empty sequence the ideal is zero and the resolution is in degree
zero. The coordinate class gives the degree-zero Ext comparison, which
fits the same coefficient-quotient formula.
'''
COL-0138 = '''
A coefficient map sends a representative of \(N/IN\) to the representative
of the induced quotient map. For scalars, multiplication on the source
\(R/I\) acts by Yoneda precomposition and agrees with multiplication on
the coefficient representative.
'''
COL-0142 = '''
Localizing the coefficients sends \(N/IN\) to the quotient of the localized
module by the localized image of \(IN\). With the source still \(R/I\),
the top comparison identifies this operation with Yoneda postcomposition.
'''
COL-0164 = '''
To change the base ring, one also changes the resolution and its augmented
object. An augmented comparison and equality of the relevant cocycle
components identify the Ext class obtained by applying an exact functor.
'''
COL-0165 = '''
For a localization \(R\to A\), scalar extension is exact. Applying it to
the native resolution transports the top cocycle and gives an Ext class
with the scalar-extended source.
'''
COL-0166 = '''
The scalar-extended augmentation has source quotient object
\(A\otimes_R(R/I)\). The canonical tensor quotient isomorphism identifies
it with \(A/IA\). Its inverse gives the required precomposition on Ext.
'''
COL-0167 = '''
After this source transport, the coefficient of the extended top
coordinate is \(1\otimes m\). The normalization identifies the class
with that very coordinate in the target Koszul resolution.
'''

[[sections]]
id = "koszul-coefficients"
title = "Koszul complexes with coefficients"
order = 5
introduction = "Native exterior-power Koszul complexes retain coefficient finiteness and annihilators. Degree-zero homology is the actual coefficient quotient without regularity; the original augmentation is a quasi-isomorphism under coefficient Koszul regularity. Noetherianity is used only for finiteness of homology."

[sections.transitions]
COL-0136 = '''
In degree \(q\), the Koszul term is the \(q\)-th exterior power of a finite
free module tensored with the coefficients. A basis of that exterior
power makes the effect of a coefficient-regular scalar degreewise
injective, with the scalar quotient as cokernel.
'''
COL-0141 = '''
Freeness of the exterior powers also gives exactness for an arbitrary
short exact sequence of coefficient modules. The maps in the resulting
sequence of complexes are the coefficient maps tensored with the
identity on the exterior factor.
'''
COL-0163 = '''
In degree zero, the image of the first differential is \(IM\), where
\(I\) is the sequence ideal and \(M\) the coefficient module. Thus the
augmentation has target \(M/IM\). Koszul regularity supplies the
vanishing of the other homology groups needed for the quasi-isomorphism.
'''
COL-0265 = '''
For a finite injective choice of polynomial variables the Koszul
augmentation resolves the variable-ideal quotient. Tensoring with flat
coefficients or along a flat algebra map preserves this quasi-isomorphism
and identifies its target with the corresponding coefficient quotient.
'''

[[sections]]
id = "ext-scalars"
title = "Scalar actions on Ext"
order = 20
introduction = "Native Yoneda composition determines scalar actions on Ext. Explicit quotient actions preserve the original ring action and record the actual source multiplication maps."

[sections.transitions]
COL-0123 = '''
Take \(I=(a)\) in the quotient scalar action. The coefficient quotient
\(N/aN\) already carries the \(R/(a)\)-action, and its connecting class
commutes with the scalar action on Ext induced by source multiplication.
'''

[[sections]]
id = "homology-colimits"
title = "Homology and exact colimits"
order = 30
introduction = "Canonical comparisons identify module homology across filtered colimits and coproducts with explicit universe bounds."

[sections.transitions]
COL-0148 = '''
A coproduct of modules is the filtered colimit of the finite subsums.
Finite sums commute with kernels and cokernels, and the filtered
comparison then identifies homology of the full coproduct. This
comparison takes a coproduct of quasi-isomorphisms to isomorphisms on homology.
'''

[[sections]]
id = "derived-hom-comparisons"
title = "Derived Hom and sheaf cohomology"
order = 15
introduction = "Supplied native injective resolutions identify Ext with the actual right-derived additive Hom functor. Comparisons retain independent Ext universes and are normalized on the original cocycles and degree-zero transformation. Unbounded sheaf hypercohomology uses native free representing sheaves, retaining signed shifts and the single-sheaf ordinary Ext comparison without an injective-resolution hypothesis."

[sections.transitions]
COL-0342 = '''
For sheaves, the free representing sheaf of an object represents its
section functor. Derived Hom from this sheaf allows the coefficient to
be an unbounded complex. Specializing to a single sheaf recovers
ordinary Ext cohomology, and the cochain shift determines the change
of hypercohomological degree.
'''


COL-0394 = '''
The free representing sheaf in COL-0342 also describes literal sections. When
that sheaf is projective, its degree-zero single complex is K-projective, so
localization loses no morphisms from it. The same argument first applies to any
projectively corepresented additive functor, then identifies hypercohomology at
the site object with the cohomology of its sections complex.
'''

COL-1011 = '''
For a pointed simplicial presheaf, replace the single representing sheaf of
COL-0342 by its reduced normalized chains. The fiber comparison retains the
simplex generators and the specified basepoint when passing to the stalk.
'''

COL-1014 = '''
COL-1013 supplies the weak-equivalence invariance used with COL-1011. The
reduced cochains therefore descend to the stalkwise localization. Apply
Dold–Kan to the good truncation of the shifted K-injective coefficient to
identify maps into its actual pointed representative with reduced derived Hom.
'''

[[sections]]
id = "ext-products"
title = "External Ext products"
order = 25
introduction = "Biexact functors carry native Ext classes to their external Yoneda products. Graded interchange, endpoint naturality and the signs of source connecting maps are retained without choosing resolutions."

[sections.transitions]
COL-1000 = '''
For a biexact bifunctor, apply the partially evaluated exact functors
to an Ext class in each variable. Their images can be composed in two
orders. The comparison of the two Yoneda composites has sign
\((-1)^{pq}\) for classes of degrees \(p\) and \(q\).
'''
