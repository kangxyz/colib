[chapter]
id = "homological-algebra"
title = "Homological algebra"
order = 30
introduction = "Native resolutions and derived invariants supply the bounds used in cohomological applications. Each result retains its actual objects, coefficients and size assumptions."

[[sections]]
id = "projective-dimension"
title = "Projective resolutions and dimension"
order = 10
introduction = "The finite exterior-power Koszul resolution of a weakly regular sequence gives projective dimension and Ext vanishing bounds for its actual ideal quotient. The underlying resolution and Ext groups are those of Stacks and Mathlib."

[[sections]]
id = "koszul-coefficients"
title = "Koszul complexes with coefficients"
order = 5
introduction = "Native exterior-power Koszul complexes retain coefficient finiteness and annihilators. Degree-zero homology is the actual coefficient quotient without regularity; the original augmentation is a quasi-isomorphism under coefficient Koszul regularity. Noetherianity is used only for finiteness of homology."

[[sections]]
id = "ext-scalars"
title = "Scalar actions on Ext"
order = 20
introduction = "Native Yoneda composition determines scalar actions on Ext. Explicit quotient actions preserve the original ring action and record the actual source multiplication maps."

[[sections]]
id = "homology-colimits"
title = "Homology and exact colimits"
order = 30
introduction = "Canonical comparisons identify module homology across filtered colimits and coproducts with explicit universe bounds."

[[sections]]
id = "derived-hom-comparisons"
title = "Derived Hom and sheaf cohomology"
order = 15
introduction = "Supplied native injective resolutions identify Ext with the actual right-derived additive Hom functor. Comparisons retain independent Ext universes and are normalized on the original cocycles and degree-zero transformation. Unbounded sheaf hypercohomology uses native free representing sheaves, retaining signed shifts and the single-sheaf ordinary Ext comparison without an injective-resolution hypothesis."

[[sections]]
id = "ext-products"
title = "External Ext products"
order = 25
introduction = "Biexact functors carry native Ext classes to their external Yoneda products. Graded interchange, endpoint naturality and the signs of source connecting maps are retained without choosing resolutions."
