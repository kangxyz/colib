[chapter]
id = "k-theory-schemes"
title = "Algebraic K-Theory of Schemes"
order = 13
introduction = "Scheme K-theory uses the existing vector-bundle, coherent-sheaf and native perfect-complex constructions. Geometric restriction, support and pullback lead to connective localization and its specified boundary. Affine section evaluation compares the geometric and ring-side perfect-complex models. The entries retain the distinction between their proved connective comparisons and full nonconnective localization [@ThomasonTrobaugh1990, 5.1.2 and 7.4]."

[[sections]]
id = "scheme-k-and-g"
title = "Vector bundles, coherent sheaves and the K-to-G comparison"
order = 10
introduction = "Vector bundles and coherent sheaves give the specified K-to-G map. Regularity and the resolution property enter precisely in the equivalence COL-0286; they are not assumptions of the remaining perfect-complex constructions."

[sections.transitions]
COL-0286 = "On a quasi-compact regular scheme with the resolution\nproperty, a coherent sheaf has a finite resolution by\nfinite locally free sheaves. Resolution applies to\nthe exact inclusion in COL-0285, so the comparison\nuses that inclusion on \\(K\\)-groups.\n"

[[sections]]
id = "perfect-open-localization"
title = "Perfect complexes and open localization"
order = 20
introduction = "Actual restriction on the native perfect complexes gives the open-support comparisons and connective localization sequences. The honest derived image and its degree-zero obstruction remain explicit. The fixed-pair qcqs result COL-0330 is a connective image-cover statement, not an identification with the full nonconnective theorem [@ThomasonTrobaugh1990, 7.4]."

[sections.transitions]
COL-0230 = "For perfect complexes, an open immersion\n\\(j\\colon U\\hookrightarrow X\\) gives ordinary restriction\n\\(j^*\\) on actual cochain complexes. Exactness for the\nfine Waldhausen structures gives its canonical \\(K\\)-map.\n"
COL-0298 = "Write \\(w_j\\) for the weak class detected by quasi-isomorphisms\nafter \\(j^*\\). An object is acyclic for \\(w_j\\) exactly when\nits restriction is acyclic. The corresponding support\ncategory thus identifies with the acyclic category for\nthe change from the fine weak class to \\(w_j\\).\n"
COL-0300 = "For this change of weak equivalences, the identity-cone\ncylinder and extension give the acyclic-to-fiber comparison.\nIts inclusion and path-space boundary give the relative\nexact sequence, with a degree-zero tail in the coarse\nrelative theory.\n"
COL-0307 = "For fine restriction, one needs roofs for the actual\nrestricted derived morphisms and a complement for a perfect\ncomplex on the open. For a quasi-compact open in a qcqs\nscheme, the roofs have global perfect denominators becoming\nquasi-isomorphisms on the open. The complements give\nstabilizations that are derived restrictions of global complexes.\n"
COL-0314 = "The derived image consists of the actual complexes on\nthe open that are derived-isomorphic to restrictions.\nThe roof hypothesis supplies its exact structure and the\nincoming lifts used by approximation for the relative\nrestriction corestriction.\n"
COL-0315 = "Perfect complements give density of that image in the\nfine category on the open. The cofinality comparison\nidentifies its positive groups with the fine groups and\nits degree-zero group with the subgroup of actual\nrestriction classes.\n"
COL-0318 = "Under the roof and complement hypotheses, the positive\ncomparison inverses carry the relative boundary to the\nfine theory on the open. In degree zero the exact tail\nends at the actual global restriction image. This is\nalso the degree-zero image of the connective spectrum map.\n"
COL-0319 = "The supported category identifies with the relative\nacyclic category by the original exact flattening.\nIterating \\(S\\) transports the fiber map with its\ninclusion coordinate and the entire original null path.\n"
COL-0330 = "For a quasi-compact open in a qcqs scheme, the geometric\nroofs and complements of COL-0307 supply the preceding\nhypotheses. The coarse connective spectrum maps to the\nfine open spectrum with the positive isomorphisms and\nthe degree-zero restriction image just described.\n"

[[sections]]
id = "scalar-operations-and-boundaries"
title = "Scalar operations and the signed boundary"
order = 30
introduction = "Scalar cone maps, complete additivity tracks and prescribed return paths determine the actual supported boundary. The direction of the unit action and the null-conjugation sign are retained, rather than absorbed into a new normalization."

[sections.transitions]
COL-0303 = "Let a global scalar \\(r\\) act on a perfect complex \\(P\\)\nand suppose it restricts to a unit on \\(U\\). Its signed cone\nrestricts to an acyclic complex. The scalar cylinder presents\nthat cone as an actual cofiber, so additivity applies to the\nmap from the identity sequence to the scalar sequence.\n"
COL-0316 = "Passing to positive-dimensional generalized loops carries\nthe full additivity square to a square of cubes with two\nindependent times. The fine identity and scalar cofiber\npaths give its coarse edges, which identify the boundary\nroutes with the stipulated orientation.\n"
COL-0317 = "The coproduct in the sum comparison is ordered with\nthe quotient first. The normalized endpoint and the reversed\nnull path of the supported cone supply the two coordinates\nof a cube in the canonical homotopy fiber.\n"
COL-0304 = "In degree one, take the independently defined forward scalar\nloop. Its canonical fiber comparison gives the object class\nof the signed cone. With the boundary of COL-0300, the cone\nenters with positive sign.\n"
COL-0305 = "On \\(U\\) the scalar acts by the given global-unit\nautomorphism. The forward scalar class restricts to its\nfine \\(K_1\\) class. The rank-one comparison identifies\nthe unit coordinate for structure sheaves and in the\naffine and relative Laurent cases.\n"
COL-0320 = "On an original subdivision cube, the return path uses\nthe prescribed inverse inclusion and projection class.\nThe coordinate-zero connecting map compares its normalized\ncube with the canonical fiber cube of the actual acyclic cone.\n"
COL-0324 = "The complete scalar tracks give raw and zero-normalized\nself-track operations. Transport of the stored paths compares\nthese operations with the prescribed return on every\nsubdivision cube, preserving the positive cone image.\n"
COL-0329 = "The subdivision inputs represent every connective\n\\(K\\)-class. Thus the cube calculation and injectivity of\nthe supported-to-fiber comparison identify the relative\nboundary of the two scalar operations as homomorphisms\nin each connective degree.\n"

[[sections]]
id = "supported-localization"
title = "Auxiliary support, excision and relative-open fibers"
order = 40
introduction = "For a fixed open pair and auxiliary support condition, the supported and bounded-flat models give approximation and comparison results with their original admissible quotients. Each entry states the support, compactness and connective scope actually proved."

[sections.transitions]
COL-0331 = "Fix an auxiliary open \\(T\\subseteq X\\) and start with\nperfect complexes acyclic on \\(T\\). Detect weak equivalences\nby restriction along \\(j\\). The acyclic objects for the\nnew class are then the perfect complexes acyclic on\n\\(T\\cup j(U)\\), by the actual support flattening.\n"
COL-0332 = "When \\(T\\cup j(U)=X\\), restriction and extension by zero\ngive exact adjoint functors on the supported categories.\nTheir unit and counit are quasi-isomorphisms, so the\ninduced realization maps are homotopy inverses.\n"
COL-0333 = "Suppose \\(W=T\\cup j(U)\\) is quasi-compact in a qcqs\nscheme. The supported roof has a perfect source\nacyclic on \\(T\\), and its two legs are chain maps on \\(X\\).\nFor a perfect \\(E\\) on \\(U\\) with the prescribed support,\nthe stabilized extension restricts to \\(E\\oplus E[1]\\),\nwith the shifted complement carrying the same support.\n"
COL-0334 = "The supported roofs give the exact derived-image model\nand its incoming lifts. The shifted complements give\ncofinality of the image, so coarse restriction is an\nisomorphism in positive degrees and has exactly the\nfine restriction image in degree zero.\n"
COL-0335 = "With the same compact union, the actual coarse spectrum\nrealizes this image comparison. The union-support\nidentification carries the whole acyclic nullhomotopy\nand its fiber lift, also after canonical zero rebasing.\n"
COL-0336 = "Forgetting auxiliary support is the inclusion of one\nsupported category into the other. It commutes with\nchange of weak equivalences and the relative boundary.\nWhen \\(U\\) and \\(W\\) are compact, this yields the fine\nboundary square through the positive comparison inverses.\n"
COL-0337 = "At the prespectrum level, support inclusion carries\nevery time of the original nullhomotopy. The resulting\nfiber square compares the signed stable boundaries,\nwhose relation to the connective boundaries retains\nthe minus sign in the \\(K_1\\)-to-\\(K_0\\) degree.\n"
COL-0382 = "The supported evaluation of COL-0380 lands in bounded-flat perfect complexes.\nFor a quasi-compact scheme \\(X\\), bounded-flat replacement preserves acyclicity\non any open \\(U\\), including that of the admissible quotient. Thus the literal\ninclusion into all supported perfect complexes satisfies approximation. Its\noriginal \\(K\\)-map determines a stable equivalence, and the support-forgetting\nsquare retains a whole coherent homotopy.\n"
COL-0505 = "Keep acyclicity on an auxiliary open \\(T\\), but test weak equivalences after\nrestriction to a second open \\(U\\). The same supported replacement of COL-0382\nstill gives approximation, with its original admissible quotient. Retargeting\nthe actual cylinder to this larger weak class compares the relative K-groups;\ncanonical zero normalization retains the whole change-of-weak square.\n"
COL-0506 = "The relative-acyclic objects are precisely the bounded-flat perfect complexes\nsupported outside the union of the two opens. Their exact equivalence preserves\nthe original admissible quotient. The canonical coarse-fiber comparison then\nretains the original K-theory boundary and the whole null path, with chosen-zero\nnormalization made explicit at the spectrum level and no compactness hypothesis.\n"
COL-0507 = "Arbitrary commuting open squares pull back the original supported bounded-flat\ncomplexes, their same admissible quotients and restricted weak equivalences.\nThe resulting supported and coarse K-maps preserve restriction and the boundary.\nA single canonical normalization retains the entire fiber path; the original\nunion-supported comparison is transported by explicit coherent homotopies.\n"
COL-0508 = "Without a support condition on its objects, the bounded-flat relative model has\nweak equivalences detected on the specified open. Arbitrary commuting open squares\ninduce its original K-pullback, with identity, composition and change-of-weak\nnaturality. On a compact ambient scheme, the literal inclusion into the relative\nperfect model is a K-equivalence with its original forward map.\n"

[[sections]]
id = "perfect-pullback"
title = "Flat perfect models and geometric pullback"
order = 50
introduction = "The native bounded-above flat perfect complexes and their actual quotient complexes support geometric pullback. Their comparison with all perfect complexes and the pullback pseudofunctor retain the original zero normalizations, structure isomorphisms and exact hypotheses. They do not introduce a parallel perfect-complex model."

[sections.transitions]
COL-0322 = "For a morphism \\(f\\colon Y\\to X\\), termwise pullback\ntakes bounded finite locally free complexes on \\(X\\)\nto such complexes on \\(Y\\). Flat quotients control\nthe inherited exact sequences and give the exact\npullback functor on these models.\n"
COL-0323 = "For arbitrary perfect complexes, an upper term bound\nand flatness of the terms give a model for termwise\npullback. A bounded-above flat augmentation can use\nthe given cohomological bound, which exists for perfect\ncomplexes on a quasi-compact space.\n"
COL-0325 = "On a quasi-compact ringed space, a map from a flat\nmodel to a perfect complex factors through a cofibration\nwith flat perfect quotient followed by a quasi-isomorphism.\nThis supplies App2 for the literal inclusion of the\nbounded-above flat models.\n"
COL-0326 = "Termwise pullback on the flat models composes by the\ngeometric pullback comparison, with exactness from\nthe flat quotients. When the morphism target \\(X\\)\nis quasi-compact, the inverse of the inclusion comparison\non \\(X\\) gives the resulting pullback on all-perfect\n\\(K\\)-theory.\n"
COL-0328 = "For a flat morphism or an open immersion, the flat-model\npullback square commutes with the literal inclusions\nby the actual geometric natural isomorphism. This\nidentifies the transported map with the previously\ndefined exact pullback or fine restriction map.\n"
COL-0351 = "The same inclusion has a canonically zero-normalized\nprespectrum map. On a compact ringed space its connective\n\\(K\\)-isomorphisms identify the stable map as an\nequivalence. Flat pullback carries the inclusion square\nby a whole based prespectrum homotopy.\n"
COL-0352 = "The composition and unit isomorphisms of termwise\npullback satisfy the pseudofunctor coherence equations.\nRestricting this pseudofunctor along \\(\\operatorname{Spec}\\)\ngives the affine coefficient diagram, with its identity\nand composition transports.\n"

[[sections]]
id = "affine-evaluation"
title = "Affine sections, coefficients and evaluation"
order = 60
introduction = "For a fixed base ring, affine evaluation compares the actual bounded-flat and perfect-complex models. The comparison retains the specified maps and open-support conditions of COL-0358 and COL-0380."

[sections.transitions]
COL-0355 = "Evaluation at the identity of \\(R\\) identifies the\ncocartesian sections with the original coefficient\nfiber. Restriction along a ring map is literal\nprecomposition and preserves the chosen pointwise\nzero. These exact restrictions give the strict\ncoefficient prespectrum after small models and\niteration of \\(S\\).\n"
COL-0380 = "For an open immersion \\(j\\colon U\\hookrightarrow\\operatorname{Spec}R\\), impose\nacyclicity after \\(j^*\\) on identity evaluation in COL-0355. Restricting its\ncategorical equivalence preserves the original sections and complexes. Their\nindependently chosen zeros are compared by a canonical normalization isomorphism,\nwhich makes the actual evaluation a strict model map with coherent inverse tracks.\n"
COL-0358 = "For a fixed commutative ring \\(R\\), the evaluation equivalence of COL-0355,\nfollowed by the small-model lift, gives the specified prespectrum map.\nNormalize its actual categorical inverse at the chosen zero. The original\nunit and counit then give whole inverse homotopies, hence level equivalences\nand isomorphisms of stable homotopy groups in every integer degree.\n"
COL-0501 = "The actual supported affine coefficient reindexing preserves support across every\nspecified open square. Its geometric comparison retains the inverse original\ncocartesian transition. Exactness and literal preservation of the chosen zero give\nthe strict model diagram on fixed coefficient pullbacks and its full iterated-S\nprespectrum functor. The identity-algebra object remains its actual pullback.\n"
COL-0511 = "With fixed-ring evaluation in COL-0358 established, every ring map has an actual\ncoefficient comparison with normalized geometric pullback. Reverse the total-to-split\ncomparison and then compose with the total-to-whiskered comparison to recover the\noriginal relative comparison from the geometric split route to the whiskered route. The identity coefficient route contracts to the\nconstant evaluation track. These are whole relative homotopies, retaining the\nbasepoint and independent structure coordinates. Actual perfect inclusion preserves\nthe relative tracks; only termwise perfect pullback naturality requires flatness.\n"

[[sections]]
id = "affine-bass-constructions"
title = "Affine Laurent seeds and Bass constructions"
order = 70
introduction = "The Laurent square gives the finite Bass constructions and their stabilization. The existing cone and telescope comparisons retain their signed boundaries and precise finite-stage hypotheses. These statements do not identify the full nonconnective localization sequence."

[sections.transitions]
COL-0359 = "Fully faithful identity evaluation lifts a global-unit\nautomorphism to the actual affine cocartesian sections.\nFor a commutative ring \\(R\\), the Laurent coordinate\n\\(T\\) gives this action over \\(R[T,T^{-1}]\\).\nEvaluation along a Laurent ring map identifies the two\ndirections with multiplication by the images of \\(T\\)\nand \\(T^{-1}\\), and coefficient reindexing preserves\nthe whole isomorphism strictly.\n"
COL-0360 = "Reindex the forward unit of COL-0359 along the constant\ninclusion \\(c_R\\colon R\\to R[T,T^{-1}]\\).\nThe zero-preserving exact section map and its unit\nisomorphism give a based self-homotopy of the induced\nprespectrum map. The strict coefficient square carries\nthe entire track, with homotopy time independent of the\nstructure coordinate and, in degree zero, the input-loop\ncoordinate.\n"
COL-0361 = "The two polynomial charts map \\(R[X]\\) to\n\\(R[T,T^{-1}]\\) by \\(X\\mapsto T\\) on the right\nand \\(X\\mapsto T^{-1}\\) on the bottom. Both source\ncomposites are \\(c_R\\). In the mapping cone of the\nstrict-square comparison, let \\(N\\) be its source-cylinder\nnullhomotopy and \\(V\\) the forward track of COL-0360\nfollowed by cone inclusion. The loop is the reverse of\n\\(N\\), followed by \\(V\\) followed by \\(N\\), with\nright-associated concatenation. Naturality of both tracks\ngives the coefficient-natural one-step Bass seed.\n"
COL-0379 = "To use the Laurent square of COL-0361 with a fixed affine open over\n\\(R\\), retain the specified structure arrow \\(R\\to A\\) at every corner.\nBoth routes from \\(A\\) to \\(A[t,t^{-1}]\\) are the coefficient inclusion,\nalthough the two polynomial charts have opposite coordinates. Forgetting\n\\(R\\) recovers the ring square, while its actual algebra arrows also\ninduce the contravariant maps between the chosen open pullbacks.\n"
COL-0362 = "Iterate the strict polynomial and Laurent Bass functor\non the affine section prespectrum, carrying the proved\nLaurent seed at every transition. Each original stage\nis \\(T_1\\), and finite Bass separation propagates this to\nall stages. The reduced quotient telescope therefore\nhas the canonical signed stable-group colimit comparison\nof COL-0350, now natural for every coefficient map.\n"
COL-0375 = "The finite stages in COL-0362 retain more than \\(T_1\\) separation.\nTheir chosen points have the homotopy extension property. At level\n\\(n+i+2\\), stage \\(i\\) has singleton homotopy sets in degrees below\n\\(n+2\\), at every point. For a map from stage \\(i\\) to stage \\(j\\),\nfinite cone-fiber excision gives connectivity \\(2n+2\\) at level\n\\(n+\\max(i,j)+2\\). This increasing bound makes the original\nsource-to-cone-fiber comparison a stable equivalence.\n"
COL-0376 = "For a coefficient map \\(f\\colon R\\to S\\), apply COL-0375 to\n\\(f_i=D_i(f)\\) at each finite Bass stage. The actual cone of the\ntelescope map identifies with the telescope of these cones. Their\n\\(T_1\\) separation permits the stable-colimit comparison, so the\nfinite signed boundaries descend to\n\\(\\delta_{f,d}\\colon\\pi_{d+1}^{\\mathrm{st}}C(f)\\to\\pi_d^{\\mathrm{st}}T(R)\\).\nSequential colimits preserve the three finite exactness positions.\nThe stage formula identifies this descended map with the original\nsigned cone boundary, and coefficient squares preserve that formula.\n"
COL-0503 = "The fixed-base Laurent square also acts on sections acyclic over the specified pullback open.\nThe forward coordinate gives the same unit track on these sections, while the original cone\ncylinder supplies its null legs. Carrying both tracks through the actual support inclusion\ncompares the constructed supported seed with the ambient section seed before any affine\nevaluation or nonconnective localization comparison.\n"
COL-0502 = "Use the actual affine coefficient homotopies of COL-0511 to compare the strict\nsection and raw geometric Laurent Bass squares. Moving-boundary pushout descent\nand its cone map give the one-step evaluation. The forward Laurent unit and the\noriginal positive-source cone null compare as whole tracks, so the original\nsection seed followed by this map is homotopic to evaluation followed by the\noriginal raw seed. No weak or stable equivalence of the Bass evaluation map is\nasserted.\n"
COL-0504 = "COL-0504 constructs the relative-open section diagram using the original evaluation and\nopen-detected weak equivalences. Its actual Laurent seed commutes strictly with the unchanged\nfine-to-coarse section maps, preserving the whole unit and null tracks. Together with the\nsupport-forgetting seed square of COL-0503, this supplies the two actual seed arrows for the\nlocalization diagram; the supported cone comparison and the nonconnective localization\nidentification remain separate obligations.\n"
COL-0509 = "The original supported-section inclusion also admits a specified initial cone comparison with the relative-open section model. Its null track is the reversed original weak zero-to-section transformation, not an arbitrary replacement. Actual evaluation preserves the inherited acyclic zero, the literal inclusion square and the entire null cylinder; the resulting cone descent is a native stable equivalence in every integer degree and retains the signed connecting formula through this same track's fiber lift. This initial comparison does not identify the coarse endpoint with full open K-theory or establish Bass nonconnective localization.\n"
COL-0510 = "The actual affine section evaluation also compares the original polynomial span, moving-square cone and parameter-looped one-step Bass construction. Each named map is a weak homotopy equivalence at every level, including zero, and a stable equivalence in every integer degree. This preserves the original coefficient homotopies and square filler; it does not yet compare iterated Bass towers or identify nonconnective K-theory.\n"

[[sections]]
id = "global-sections-and-parameters"
title = "Global sections and scheme parameters"
order = 55
introduction = "Global cocartesian sections retain the original bounded-flat perfect fibers while organizing their exact pullbacks over all schemes. Support, joint coefficient restriction and the raw parameter Laurent unit use the same evaluation and selected zero. These constructions precede the affine and Bass comparisons below."

[sections.transitions]
COL-0533 = "The perfect pullbacks above can also be organized over all schemes at once. Identity evaluation retains the geometric fiber, while the original cocartesian sections make reindexing strict. The same evaluation lifts global units without changing their scalar components."
COL-0534 = "Impose acyclicity on an open in the sections of COL-0533. Reindexing retains that condition along a commuting open-pair square. The support-forgetting maps then form a single natural transformation, which can be restricted to the product families of COL-0536."
COL-0535 = "Apply the global sections of COL-0533 to the full scheme-and-coefficient family. Restriction keeps identity evaluation and the selected zero literally. Its coefficient naturality is already an equality of the original functors, before any additional Waldhausen model bundling."
COL-0537 = "Pull the Laurent coordinate through the same fixed-factor projection used in COL-0536. The global scalar lift of COL-0533 turns it into an ambient section unit. Its two naturalities keep the parameter map and the fixed-factor map separate; no returned-action or localization identification is supplied here."
COL-0538 = "The restriction of COL-0535 can now retain its Waldhausen data as well as its underlying category. Use the same joint zero and evaluation to transport the fiber classes. This yields a strict model diagram and the exact global restriction before any claim about a Bass or stable comparison."
COL-0539 = "The ambient and supported diagrams of COL-0534 retain the global section objects. To form the relative-open diagram, change only which maps become weak after the original open restriction. Its factorization remembers that the relative model and the actual model on the open are different objects."
COL-0540 = "The raw unit of COL-0537 now supplies a whole realized track. Restricting the same unit, rather than choosing another automorphism, gives the supported track. Its comparison with the ambient track keeps every homotopy time through the actual support-forgetting map."
COL-0541 = "Carry the track of COL-0540 through the weak-class change in COL-0539. The first comparison is the identity on the original unit, while the second uses its fixed-factor pullback law. Thus both arrows of the restriction factorization retain the entire Laurent track without claiming a localization equivalence."
COL-0548 = "Global sections retain the original geometric fibers while making reindexing strict. Their identity evaluation now has its actual exact inverse. The whole comparison with geometric pullback retains both chosen zeros and the forward scalar action, so the later tensor cell can be returned to the same section category."

[[sections]]
id = "tensor-unit-prisms"
title = "Tensor-unit actions and coefficient prisms"
order = 58
introduction = "The actual sheafified tensor unit acts on bounded-flat perfect complexes. Its unitor and scalar comparison determine the original nerve and iterated-S prisms. Coefficient-row normalization and global evaluation compare the two parameter model routes and their unit actions, before external parameter naturality and Bass comparisons. The normalized rank-one coefficient square also computes the original forward global-unit K-one class through the literal perfect inclusion."

[sections.transitions]
COL-0542 = "Retain the actual structure-module tensor before passing to its unitor. The scalar comparison identifies its components with the global unit action already used on sections, so the later prisms can keep the original tensor edge."
COL-0543 = "Normalize the chosen zero of the actual tensor-pullback map without changing its original coefficient crossing. The categorical two-time interchange lets the prism pass through each S-construction stage, with the structure interval and tensor interval still separate."
COL-0544 = "Insert the tensor coefficient as a genuine first row rather than replacing that row by an identity model. The row isomorphism transports exactness and compares the complete scalar automorphism; those are the data needed for the two-dimensional coefficient prism."
COL-0545 = "Use the first-row scalar comparison to identify the coefficient prism while preserving its endpoints. Reindexing the two grid directions and the nerve-cylinder direction separately gives the simultaneous naturality equation, before any later parameter normalization."
COL-0546 = "After the coefficient-row and prism comparisons, normalize the chosen zero of the same tensor-pullback functor. Whiskering by actual parameter evaluation retains the prism formula. No change of parameter or coefficient coordinates is hidden in this normalization."
COL-0547 = "Use global identity evaluation with its chosen-zero normalization to compare the internal coefficient route and the evaluated tensor route at a parameter. The original tensor unitor and scalar formula then show that this particular isomorphism preserves the model-unit action. Its naturality as the external parameter varies is a separate next step."
COL-0556 = "COL-0544 and COL-0546 retain the actual coefficient row and its zero normalization. Specialize that construction to the degree-zero structure complex. Identifying the whole weak-object square, before taking a homotopy class, fixes the forward Laurent-unit orientation needed by returned-tensor recognition."
COL-0560 = "Support preservation allows the actual tensor unit and its parameter tracks to restrict to the supported categories."
COL-0561 = "With those supported units fixed, the coefficient rows retain their exactness and the input maps carry the corresponding normalization."
COL-0562 = "The normalized coefficient rows then give whole coefficient cylinders, whose two time coordinates survive realization and native AsSmall transport."
COL-0563 = "Finally, the raw evaluation-forget square passes through the specified zero-object rebases and native Model maps to the parameter forget rectangle."

[[sections]]
id = "returned-tensor-cells"
title = "Returned tensor cells and current Bass boundaries"
order = 59
introduction = '''
The independently realized tensor-unit cell is returned through the exact global-evaluation
inverse to the original section category. The same actual returned action supplies the finite Bass
row-cell recursion. Its normalized forwards first agree with the original scheme-model boundaries;
the whole prescribed null and the actual suspension backward triangle then compare those
boundaries with the current finite Bass transitions. The four corner-generator formulas recognize
this actual returned action, and its generator-defined finite left recursion retains the original
index and loop/row coordinates. Stable equivalence and nonconnective localization remain outside
this section.
'''

[sections.transitions]
COL-0550 = "The coefficient prisms of COL-0547 provide a comparison of the actual tensor action with evaluated section units. Realize that comparison in the original first row, with both cylinder directions still visible. The exact evaluation inverse returns the entire cell and its moving endpoint to the original section category, yielding an endpoint-relative comparison there."
COL-0551 = "The returned tensor action now supplies the concrete data required by the abstract returned-action iteration of COL-0531. Run that original recursion on each finite geometric Bass square, then normalize its whole cell before the original cone inclusion. The resulting map agrees with the existing normalized forward at every finite stage, without yet claiming generated-trace recognition or localization."

COL-0555 = '''
COL-0551 identifies the returned-tensor normalized `forward` with the existing scheme-model
normalized boundary. Now retain the original whole source null, natural seed and actual backward
triangle. The independent `forward` comparison and the complete normalization prism connect that
boundary with the literal current Bass transition.
'''
COL-0557 = "COL-0550 returns the whole independently realized tensor cell, and COL-0555 supplies the current-boundary comparison for the original scheme model. Keep that same returned model and proved unit intertwining. The four-generator recognition theorem COL-0514 can now be applied to its actual geometric square; the coefficient calculation fixes the forward Laurent action rather than leaving it as additional input."
COL-0558 = "The preceding item recognizes the actual starting cone action, including its forward coefficient and return prism. Feed those concrete data into the original finite generator recipe COL-0528. Carry the index map, row strength and old-loop conversion through each left-recursive step. The whole boundary comparison of COL-0555 then applies to these tensor-rooted cells without replacing their prescribed null or backward map."

