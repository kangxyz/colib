[chapter]
id = "k-theory"
title = "General Algebraic K-Theory"
order = 10
introduction = 'Grothendieck presentations and the realized \(Q\)- and \(S\)-constructions give the general K-theory of exact and Waldhausen categories. The comparison, resolution, dévissage, localization and cofinality results identify their maps on the original models.'

[[sections]]
id = "grothendieck-groups"
title = "Grothendieck groups"
order = 10
introduction = '''Object classes and their additivity relations give algebraic K-zero. The exact-category and abelian presentations agree on generators, and span weights relate them to the object loops of the Q-category.'''

[[sections.topics]]
id = "abelian-presentations"
title = "Short exact sequences and object classes"
start = "COL-0001"

[[sections.topics]]
id = "conflation-presentations"
title = "Conflation presentations and their maps"
start = "COL-0018"

[[sections.topics]]
id = "grothendieck-localization"
title = "Subcategory images and Serre localization"
start = "COL-0026"

[[sections.topics]]
id = "grothendieck-object-loops"
title = "Span weights and object loops"
start = "COL-0078"

[sections.transitions]
COL-0003 = '''
On the free abelian group of objects, a functor acts by \(e_X\mapsto e_{F(X)}\).
Preservation of short exact sequences sends each defining relation to a
defining relation, so this action descends to the quotient.
'''
COL-0018 = '''
The construction only needs a specified collection of pairs on which
additivity is imposed. In an exact category those pairs are its
conflations. The free presentation then represents invariants additive
on that particular exact structure.
'''
COL-0019 = '''
For the standard exact structure on an abelian category, each conflation
is a short exact sequence. The two presentations have the same relations
on the same objects, so sending each generator to its namesake gives
inverse maps in both directions.
'''
COL-0024 = '''
If \(F\) preserves the selected conflations, the function
\(X\mapsto[F(X)]\) is additive on them. The universal property yields
the induced map, and its identity and composition laws are checked on
the object generators.
'''
COL-0025 = '''
For a short-exact-sequence-preserving \(F\), both routes through the
comparison send the class of \(X\) to that of \(F(X)\). The equality
on generators gives the naturality equation.
'''
COL-0026 = '''
The image of an inclusion is generated by the images of its object
classes. The comparison between the two presentations therefore
identifies the subgroup from the conflation presentation with the
same subgroup in the short-exact-sequence presentation.
'''
COL-0028 = '''
In the localization at a Serre class, an object of the class maps to
zero. The subgroup generated by these objects is thus contained in
the kernel. The quotient calculation identifies the entire kernel
and tracks the image of each original object.
'''
COL-0029 = '''
Taking the canonical Serre quotient as the target gives this
calculation on the canonical quotient functor. Its induced
equivalence sends the residue class of \([X]\) to the class of the
actual image of \(X\).
'''
COL-0078 = '''
The based loops of the \(Q\)-category multiply by composition.
To compare them with object classes, use the multiplicative form of
the algebraic Grothendieck group. A homomorphism out of this group is
determined by its values on the objects, also for a group-valued target.
'''
COL-0079 = '''
For a span \(X\leftarrow U\to Y\) in \(Q\), the left deflation has
kernel class \([U]-[X]\). In the pullback defining a composite,
the conflation relations add the two weights. This gives the
cocycle on the span category.
'''
COL-0080 = '''
The cocycle takes values in a one-object groupoid, so it extends
over localization at every \(Q\)-arrow. At zero, its values on
the canonical object loops recover the Grothendieck generators.
'''
COL-0086 = '''
Realizing the object loops takes these classes to the fundamental
group at zero. Their conflation relations and commutativity give the
map from the algebraic group to homotopical \(K_0\).
'''

[[sections]]
id = "quillen-k-theory"
title = "Quillen K-theory"
order = 30
introduction = '''Quillen's groups are \(\pi_{n+1}(BQ,0)\). Their based maps and algebraic degree-zero comparison lead to Resolution, dévissage, Serre localization and the calculation for finite-support families.'''

[[sections.topics]]
