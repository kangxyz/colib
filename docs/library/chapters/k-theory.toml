[sections.transitions]
COL-0156 = '''
A pointwise weak transformation compares the images of each
quotient row. In the nerve direction its components give the
simplicial cylinder between the two exact-functor maps.
'''
COL-0275 = '''
For two composable transformations, the three sides of the
nerve triangle correspond to the two transformations and their
composite. Keeping these sides as the original cylinders
provides the comparison between composition and concatenation.
'''
COL-0157 = '''
When the two functors carry the chosen zero to the specified
target zero by object equalities, the cylinder is constant on
that vertex. The resulting homotopy can then be applied to
homotopy groups at the equality-rebased point.
'''
COL-0158 = '''
Exactness sends the chosen source zero to a zero object. Its
unique isomorphism to the target zero gives the rebasing used
for the canonical \(K\)-map, and the composition comparison
tracks that same choice of vertex.
'''
COL-0218 = '''
For a cofibration sequence \(F\hookrightarrow G\twoheadrightarrow H\)
of exact functors, compare the middle row with the separated
row of quotient and subobject. Ordinary horizontal subdivision
allows the three stages of this deformation to be taken
relative to the chosen zero.
'''
COL-0219 = '''
The deformation ends at the actual coproduct functor
\(H\amalg F\). The based comparison identifies its map
on the original groups with the product of the maps of
\(F\) and \(H\) in subobject-then-quotient order.
'''
COL-0212 = '''
The product comparison has the two canonical projections
as its forward coordinates. Under that comparison the
coproduct map gives the original group multiplication.
Coproduct symmetry then gives commutativity, including in degree zero.
'''
COL-0301 = '''
A weak transformation between cofibration sequences gives
two ways to combine the deformation with the transformation
tracks. The square compares the tracks on the middle rows with
those on the separated rows, retaining the once-reversed identity
prefix and the half, quarter, quarter subdivision of time.
'''
COL-0302 = '''
For families of coproducts the product comparison must lift
the whole compact family of based cubes, including every
prescribed face. These lifts give the unit and supplied-null
squares used for the coherence of the normalized endpoint.
'''
COL-0276 = '''
Finite iteration of the quotient-row construction supplies
the levels of the \(S\)-prespectrum. The zero-space comparison
recovers the original \(K\)-groups. At the chosen zero, general
exact-functor maps use the same canonical rebasing as before.
'''
COL-0277 = '''
The weak-transformation cylinder and its composition triangle
must commute with the prespectrum structure maps. Retaining
every structure parameter gives the homotopies of the actual
prespectrum maps and their relative composition comparison.
'''
COL-0282 = '''
Adding an initial row gives a contraction whose path-fiber
comparison identifies each original loop structure map.
The comparison includes path components as well as positive
based homotopy groups.
'''
COL-0283 = '''
For the resulting connective Omega-spectrum, the nonnegative
stable groups are computed by the original \(K\)-groups.
Connectivity gives zero in the negative degrees, and the
comparison uses the same exact-functor maps.
'''
COL-0293 = '''
Distinguished-row stabilization uses the actual quotient-row
transpose and, in degree zero, the original double loop.
Its compatibility with weak transformations is an equation
of whole tracks through these structure maps.
'''
COL-0292 = '''
An original exact-functor map acts on stable groups by its
nonnegative \(K\)-maps and the zero maps in negative degrees.
Thus bijectivity of all the original \(K\)-maps, including
\(K_0\), is the criterion for this map in the stable localization.
'''
COL-0252 = '''
Let \(v\subseteq w\) be weak classes for the same cofibrations and
chosen zero. On the full subcategory of \(w\)-acyclic objects,
the maps from zero give a nullhomotopy after changing from \(v\)
to \(w\). The full reversed nullhomotopy is the path in the
canonical lift to the homotopy fiber.
'''
COL-0296 = '''
Translation by an object's fine and coarse loops moves the
fiber over the constant loop to the fiber over its coarse
object loop followed by the constant loop. When zero
morphisms are available, the identity-cofiber suffix gives
the specified comparison to the fiber over the object loop itself.
'''
COL-0297 = '''
For a displayed weak cofibration, its cofiber prism compares
the quotient prefix with the identity-cofiber suffix.
In the canonical fiber the quotient prefix is reversed.
The relative homotopy identifies the degree-one transport with
the standard unit removal on that component.
'''
COL-0299 = '''
The weak-object square path of a composite is compared to
the concatenation of the two square paths by the composition
cube. Normalizing at the actual object component gives the
reversed product law for the weak-endomorphism \(K_1\) classes.
'''
COL-0253 = '''
For relative quotient rows, compare the total row with its
tail. The split fibers and their ordinal transitions identify
the homotopy fiber of the original row comparison, including
its constant path and its components.
'''
COL-0254 = '''
To compare the acyclic model with the change-of-weak fiber,
apply the relative-row calculation using coarse two-out-of-three,
extension, the joint cylinder and its second-endpoint section.
The comparison retains the same acyclic inclusion and the
reversed nullhomotopy of COL-0252.
'''
COL-0259 = '''
With the acyclic realization identified with the fiber, its
path-space boundary gives the connecting homomorphism on the
acyclic \(K\)-groups. The resulting exact sequence includes
the \(K_1\)-to-\(K_0\) map and the surjective \(K_0\) tail.
'''
COL-0291 = '''
A functor exact for both weak classes induces a map of the
canonical fibers by carrying their entire paths. Under the
two fiber comparison equivalences, naturality of the
path-space connecting map gives the original boundary equation.
'''
COL-0294 = '''
Small-model transport uses homeomorphisms of deloopings and
of the actual canonical fibers. Their effect on the
stored paths carries the same boundary across the specified
morphism universes.
'''
COL-0284 = '''
Iterating \(S\) gives the stable version of the same acyclic
comparison under the fibration hypotheses. Under the
original group comparisons, the stable fiber boundary is
the negative of the transported connective boundary,
including its degree-one endpoint.
'''
COL-0288 = '''
At level \(n+1\) the cone-to-fiber comparison has connectivity
\(2n\). This increasing range gives the stable comparison.
For the acyclic inclusion, its full null track supplies the
map from that cone to the coarse prespectrum.
'''
COL-0295 = '''
Parameter looping can be applied before or after taking
the reduced cone. The comparison comes from the original
cylinder and the fiber-loop transpose, which determine its
compatibility with the signed boundary.
'''
COL-0179 = '''
For an equivalence exact in both directions, its unit and
counit give weak transformations on the \(S\)-models.
Their based comparisons make the two induced canonical
\(K\)-maps mutual inverses.
'''
COL-0357 = '''
On small models with strict forward zero preservation, the
same equivalence can be taken levelwise through the iterated
\(S\)-construction. The normalized inverse and the original
unit and counit provide the structure-compatible homotopies.
'''
COL-0243 = '''
An exact category has its associated Waldhausen structure.
Reversed edgewise subdivision of the \(S\)-model gives the
prescribed comparison with \(Q\). Its naturality compares
the original two \(K\)-maps of each exact functor.
'''
COL-0256 = '''
For an approximation functor, App1 detects weak maps and
the cofibration form of App2 gives the incoming lifts.
With the target two-out-of-three and the source joint data,
these lifts give the quotient-row comparisons used on the
original delooping.
'''
COL-0308 = '''
Compatible duality reverses the coordinates of the full
quotient grid. The incoming lifting condition for the
opposite comparison can be checked on the fine arrows.
For inverse-image weak classes, the passage to coarse exactness
uses endpoint gluing and projection naturality as in COL-0306.
'''
COL-0309 = '''
For an exact functor \(F\), consider triples
\((A,B,F(A)\xrightarrow{\sim}B)\). The source projection
and the identity-arrow diagonal compare through the stored weak arrow.
The target projection then gives the factorization of the
original \(K\)-map.
'''
COL-0257 = '''
For bounded termwise complexes with isomorphisms as weak
maps, term and cycle evaluations record the finite coordinates.
Their alternating Euler maps give the decomposition by
acyclic complexes and the degree-zero single-term insertion.
'''
COL-0260 = '''
Upon changing the weak maps to quasi-isomorphisms, the
acyclic factor is removed by the fiber comparison. With
the stated closure hypotheses on the terms, the remaining
map is the original degree-zero insertion on \(K\)-groups.
'''
COL-0267 = '''
An additive grading of objects that is invariant under weak
maps defines a coarse model. Its realized values form the
subgroup that appears in the nerve comparison for the
coarse delooping.
'''
COL-0268 = '''
For a dense full subcategory, coproduct complements supply
the grading by common-complement classes. The change-of-weak
map to this coarse model has the image of the original
inclusion as its kernel, including the exact tail in degree zero.
'''
COL-0269 = '''
In degree zero, the canonical loop of an object satisfies
the zero, weak-arrow and cofibration-pushout relations.
These are the relations of the object presentation, and
the comparison keeps the loop of each original object as
its generator image.
'''
COL-0270 = '''
For an exact functor with genuine target factorization,
the original Grothendieck comparison identifies the
image-quotient class map with change of weak equivalences
followed by the coarse value map.
'''
COL-0290 = '''
The image-quotient grading prespectrum is the unshifted target
of the specified cone comparison. On stable degree zero,
the previous quotient calculation identifies that map,
using the original reversed null track in its construction.
'''
COL-0278 = '''
In the grading-coarse target the zero endotransformation is
weak. It supplies a contraction of the normalized self-track
relative to both endpoints and the whole basepoint line.
The prescribed null-conjugate carries this contraction to
the parameter-looped target.
'''
COL-0321 = '''
A complete based self-track gives a degree-raising operation
on finite based cubes. Its successor comparison has the
inverse sign, so alternating the stage operations gives
the stable map. The original \(S\)-comparison transports
that operation to the canonical \(K\)-groups.
'''

[[sections]]
id = "bass-construction"
title = "Strict-square Bass constructions"
order = 50
introduction = '''Strict squares of loop prespectra give cone–loop comparisons and finite Bass iteration. The stage maps retain the supplied scalar seeds and their nullhomotopies.'''

[sections.transitions]
COL-0354 = '''
In the reduced quotient, the basepoint fibre includes the inverse
images of the basepoints under the endpoint maps. These closed
fibres enter the \(T_1\) verification for the cone and double
cylinder. Looping preserves the resulting separation condition,
which can then be propagated through the finite iterates.
'''

COL-0514 = '''
The strict-square construction also transports four compatible moving corner maps.
Keeping both quotient heights separate from the moving parameter gives the whole cone
action. Its four generator formulas characterize that action uniquely, providing the
recognition input used later by the tensor-generated Bass recipe.
'''

COL-0516 = '''
The four-corner action can now be assembled over an indexing category. Literal zero
preservation fixes the transported null endpoints; the specified inverse index
interchange gives the natural cone track and its original source-null formula.
Source-seed transport additionally retains the stated scalar-track intertwining
condition, rather than supplying an unproved seed compatibility.
'''

COL-0517 = '''
The original row interchange then descends through the reduced span, cone and old
parameter loop. Its finite Bass iteration is computed recursively, with point and
ordinary naturality laws carried by the recursion. Induction proves the all-stage
two-structure exchange from the initial equation, without assuming a generated trace.
'''

COL-0519 = '''
A based row interchange also constructs the original distinguished-row refinement,
with an explicit degree-zero double loop. Its comparison, pointwise maps and whole
homotopies are coefficient-natural under their stated exchange and all-time row-square
hypotheses. This supplies the actual refinement needed by the subsequent strength maps.
'''

COL-0521 = '''
The refined inclusions, glue and nullhomotopies now descend to actual pushout and
cone strengths. Their coefficient-natural comparison and source-null equations survive
the explicit row/old-loop coordinate isomorphism, producing the original first-Bass
strength without claiming a generated trace or stability of that strength.
'''

COL-0523 = '''
The original loop strength next preserves the actual cone action at every unchanged
time. Natural whole tracks and their intertwining maps are consequently closed under
cone, loop and Bass transport, supplying the local action data needed before the
constructed row-cell successor and its separate finite iteration.
'''

COL-0525 = '''
The whole-cell comparison now passes through the original cone and Bass maps.
Its computed endpoints yield the next cell without changing its time slices, and
its comparison with the actual next track proves coefficient naturality. This
local successor construction precedes the separate generated finite iteration.
'''

COL-0527 = '''
The whole-cell successor now iterates on every finite stage of the original Bass
diagram. The recursion retains the full naturality and time-slice comparison, not
only endpoint equalities. The separate generated-trace construction must still
identify these recursively produced cells with its geometric generators.
'''

COL-0528 = '''
The finite row-cell iterator now realizes an independently defined generator
trace. The induction changes the starting diagram at each successor and thus
retains the whole construction, rather than checking only a final endpoint.
Identification and geometric instantiation of these generated recipes remain
separate steps before the final localization comparison.
'''

