[chapter]
id = "k-theory"
title = "General Algebraic K-Theory"
order = 10
introduction = "The general theory of exact and Waldhausen categories: Grothendieck presentations, Quillen and Waldhausen K-groups, functoriality, comparison, resolution, devissage, localization and cofinality. These results use the actual categorical objects and canonical maps. Ring, field and scheme specializations have a separate chapter."

[[sections]]
id = "grothendieck-groups"
title = "Grothendieck groups"
order = 10
introduction = "Begin with the presentation by objects and short exact sequences. Additivity, functoriality and the comparison with homotopical K-zero retain the original object classes. Exact-functor maps and the inclusion-image comparison lead to algebraic localization by a Serre class, including the actual canonical quotient. Dimension computations for finite modules over fields belong to the rings-and-schemes chapter."

[[sections]]
id = "quillen-k-theory"
title = "Quillen K-theory"
order = 30
introduction = "Quillen K-groups are the shifted homotopy groups of the realized Q-category, based at the original zero vertex. The Q-classifying space BQ is distinguished from its loop space. The objectwise-finite Resolution theorem retains the canonical inclusion map in every degree. The canonical Grothendieck-to-Quillen K-zero map is a proved equivalence on the same actual homotopical K-zero. Classical devissage proves the actual inclusion equivalence from objectwise finite filtrations without extension closure. Quillen-Waldhausen comparisons remain separate results. Canonical Serre localization identifies the actual quotient homotopy fiber and yields the connective long exact sequence with its original inclusion, quotient and path-space boundary maps. The actual localization target and the original small-model map inherit this sequence through proved categorical and exact-structure comparisons. For finite-support families, every positive Quillen K-group is the direct sum of the coordinate groups through the original evaluation and singleton inclusion maps."

[[sections]]
id = "waldhausen-k-theory"
title = "Waldhausen K-theory"
order = 40
introduction = "The current model realizes the unnormalized diagonal IsZero S-construction. Actual weak-row nerves and coherent weak-transformation cylinders retain its maps. The genuine simplicial composition triangle has those original cylinders as all three faces and fixes its entire zero-vertex triangle under explicit chosen-zero equalities. Image-zero homotopy-group maps precede explicit based maps; ordinary subdivision and the based three-stage deformation prove additivity for the original canonical KMap. The whole based-additivity transformation square retains both original cofibration sequences, three pointwise weak transformations and both commuting squares. Its four complete faces and two-time fixed-zero surface preserve the original once-reversed prefix, half/quarter/quarter clock and quotient-first sum, with no extra fibration, cylinder or strict-zero premise. The actual product comparison identifies this with the original group multiplication, which is commutative even in K-zero. Strict object-loop translation and the prescribed identity-cofiber suffix give genuine homotopy equivalences between actual fibers of the original localization loop map, with exact transposed canonical-object values. Only the suffix step needs zero morphisms; neither equivalence requires a fibration theorem or weakness of the canonical acyclic comparison. The actual cofiber prism supplies a prescribed endpoint-relative boundary homotopy, its exact reversed canonical-fiber quotient prefix and degree-one identity-cofiber normalization. All prism faces and independent parameters remain; no fibration or canonical-comparison weakness assumption is added. The actual weak-object composition cube supplies the specified whole-path homotopy and the original reversed K-one multiplication law. Independently normalized weak-endomorphism and automorphism classes are natural for the canonical KMap of arbitrary exact functors in the original universe range, without strict chosen-zero preservation. The literal change-of-weak map preserves full bisimplex families, cofiber tracks, weak squares and identity-cofiber suffixes; the prescribed component equivalence is natural in every homotopy degree. Actual acyclic subcategories and relative quotient rows now give the fibration theorem for the original canonical path-space comparison under coarse two-out-of-three, extension, joint cylinder data and its second-endpoint section. The full nullhomotopy and distinct universes are retained. Approximation proves weak equivalence of the unchanged delooping and bijectivity of its canonical KMap in every nonnegative degree from exactness, App1/App2, target two-out-of-three and genuine source joint-cylinder data; no row-equivalence or homotopy-inverse premise is added. The actual connective change-of-weak long exact sequence retains its path-space boundary and K-zero tail. For termwise extension- and kernel-closed subcategories of an abelian category, native bounded-complex filtrations and the actual identity-cone cylinder prove Gillet-Waldhausen on the original degree-zero single KMap in every nonnegative degree. Dense cofinality constructs the actual complement grading and compares its coarse delooping with the nerve of its realized-value subgroup. The original full inclusion is an equivalence in positive K-degrees and injective in K-zero; its exact tail retains the actual coarse K-zero group. The original object-loop map now identifies the universal weak-arrow and pushout presentation with actual K-zero, without additional cylinder hypotheses. Under genuine target factorization, its naturality identifies the actual coarse K-zero obstruction with the quotient by the original exact-functor image and retains the unchanged changeWeak KMap. Finite S-iteration uses the native strict chosen-zero subcategory, while arbitrary exact functors use canonical zero rebasing. The actual loop prespectrum has the original K-groups as its zero-space homotopy sets. Whole weak-transformation homotopies and relative composition preserve every structure parameter. In the grading-coarse target, the genuine weak zero endotransformation contracts original normalized self-tracks, and the supplied null-conjugate gives the actual zero-loop homotopy. The genuine added-initial-row contraction and full path-fiber comparison prove that every original iterated-S loop structure map is a weak equivalence, including path components. The resulting connective Omega-spectrum retains the exact-functor maps and original KMap. The actual integer-graded stable groups recover every original K-group, including K-zero and its group law, naturally for the original KMap; all negative groups vanish by proved connectivity. The original canonical acyclic-to-fiber spectrum map is a stable equivalence in every integer degree under the same four structural fibration hypotheses. Its complete nullhomotopy and signed boundary comparison retain the original K-one to K-zero endpoint. Actual S-model connectivity and point HEP prove stable cone-to-fiber excision without an extra excision premise. The original acyclic null track gives the actual coarse-spectrum cone comparison under the same four fibration hypotheses, with its target face, whole cylinder and signed boundary retained. For an arbitrary exact functor, genuine target factorization also identifies the specified image-quotient cone map on stable degree zero, retaining its unshifted target and entire reversed null track; no all-degree equivalence of that cone map is claimed. The original first relative-total cylinder preserves the complete fiber paths and yields the unchanged degree-raising K-group map as an equivalence, including K-zero. For functors exact on both nested structures, the complete canonical fiber paths give naturality of the original connecting maps, including K-one to K-zero, under explicit weakness of both canonical comparisons. The actual coherent-homotopy quotient and categorical stable localization have a proved universal lift; an original exact-functor map is invertible there exactly when every original nonnegative KMap, including K-zero, is bijective. The actual distinguished-row stabilization is a levelwise weak and all-integer stable equivalence, preserving whole weak-transformation tracks and the genuine double loop in degree zero. The actual AsSmall fiber and delooping homeomorphisms transport the original boundary across the specified unequal morphism universes. Original all-point connectivity and chosen-point HEP also prove stability of the literal cone-of-loop to loop-of-cone comparison, retaining its entire cylinder and signed boundary. No nonconnective theory is asserted. Compact families of the original coproduct cubes retain whole spatial boundaries, quotient-first separation, based units, supplied-null coherence and complete change-of-weak naturality; their normalized endpoint retains its explicitly supplied whole Theta comparison. Compatible duality reverses the full original quotient grid and yields dual approximation for the unchanged canonical KMap in every connective degree. For inverse-image weak classes, genuine fine incoming lifts and fine dual joint-cylinder data suffice without fine weak reflection; coarse exactness is proved by endpoint gluing and projection naturality. The literal comma and fine weak-arrow categories retain actual component pushouts and compatible opposite structures. Their identity-arrow diagonal and source are inverse on canonical KMaps, also with relative inverse-image weak classes. The original functor KMap factors through the actual target map; this first-leg equivalence does not assert target approximation or scheme fine localization."
