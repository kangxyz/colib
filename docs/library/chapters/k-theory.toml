[chapter]
id = "k-theory"
title = "Algebraic K-Theory"
order = 10
introduction = "Grothendieck presentations and the realized \\(Q\\)- and \\(S\\)-constructions define K-theory for exact and Waldhausen categories. Resolution, dévissage, localization, additivity and cofinality concern these abstract categories and their specified functors [@Quillen1973, Sections 2–5] and [@Waldhausen1985, Section 1]. Strict-square cone–loop constructions and finite Bass iteration retain their original maps and tracks. Ring and field applications begin with COL-0004 and COL-0378; scheme applications begin with COL-0285. Milnor symbols and residues have their own chapter, beginning with COL-0005."

[[sections]]
id = "grothendieck-groups"
title = "Grothendieck groups"
order = 10
introduction = "Object classes and their additivity relations give algebraic K-zero. The exact-category and abelian presentations agree on generators, and span weights relate them to the object loops of the Q-category."

[[sections.topics]]
id = "abelian-presentations"
title = "Short exact sequences and object classes"
start = "COL-0001"

[[sections.topics]]
id = "conflation-presentations"
title = "Conflation presentations and their maps"
start = "COL-0018"

[[sections.topics]]
id = "grothendieck-localization"
title = "Subcategory images and Serre localization"
start = "COL-0026"

[[sections.topics]]
id = "grothendieck-object-loops"
title = "Span weights and object loops"
start = "COL-0078"

[sections.transitions]
COL-0003 = "On the free abelian group of objects, a functor acts by \\(e_X\\mapsto e_{F(X)}\\).\nPreservation of short exact sequences sends each defining relation to a\ndefining relation, so this action descends to the quotient.\n"
COL-0018 = "The construction only needs a specified collection of pairs on which\nadditivity is imposed. In an exact category those pairs are its\nconflations. The free presentation then represents invariants additive\non that particular exact structure.\n"
COL-0019 = "For the standard exact structure on an abelian category, each conflation\nis a short exact sequence. The two presentations have the same relations\non the same objects, so sending each generator to its namesake gives\ninverse maps in both directions.\n"
COL-0024 = "If \\(F\\) preserves the selected conflations, the function\n\\(X\\mapsto[F(X)]\\) is additive on them. The universal property yields\nthe induced map, and its identity and composition laws are checked on\nthe object generators.\n"
COL-0025 = "For a short-exact-sequence-preserving \\(F\\), both routes through the\ncomparison send the class of \\(X\\) to that of \\(F(X)\\). The equality\non generators gives the naturality equation.\n"
COL-0026 = "The image of an inclusion is generated by the images of its object\nclasses. The comparison between the two presentations therefore\nidentifies the subgroup from the conflation presentation with the\nsame subgroup in the short-exact-sequence presentation.\n"
COL-0028 = "In the localization at a Serre class, an object of the class maps to\nzero. The subgroup generated by these objects is thus contained in\nthe kernel. The quotient calculation identifies the entire kernel\nand tracks the image of each original object.\n"
COL-0029 = "Taking the canonical Serre quotient as the target gives this\ncalculation on the canonical quotient functor. Its induced\nequivalence sends the residue class of \\([X]\\) to the class of the\nactual image of \\(X\\).\n"
COL-0078 = "The based loops of the \\(Q\\)-category multiply by composition.\nTo compare them with object classes, use the multiplicative form of\nthe algebraic Grothendieck group. A homomorphism out of this group is\ndetermined by its values on the objects, also for a group-valued target.\n"
COL-0079 = "For a span \\(X\\leftarrow U\\to Y\\) in \\(Q\\), the left deflation has\nkernel class \\([U]-[X]\\). In the pullback defining a composite,\nthe conflation relations add the two weights. This gives the\ncocycle on the span category.\n"
COL-0080 = "The cocycle takes values in a one-object groupoid, so it extends\nover localization at every \\(Q\\)-arrow. At zero, its values on\nthe canonical object loops recover the Grothendieck generators.\n"
COL-0086 = "Realizing the object loops takes these classes to the fundamental\ngroup at zero. Their conflation relations and commutativity give the\nmap from the algebraic group to homotopical \\(K_0\\).\n"

[[sections]]
id = "quillen-k-theory"
title = "Quillen K-theory"
order = 30
introduction = "Quillen's groups are \\(\\pi_{n+1}(BQ,0)\\). Their based maps and algebraic degree-zero comparison lead to Resolution, dévissage, Serre localization and the calculation for finite-support families."

[[sections.topics]]
id = "quillen-based-maps"
title = "Based Q-maps and K-groups"
start = "COL-0045"

[[sections.topics]]
id = "quillen-k-zero"
title = "Algebraic and homotopical K-zero"
start = "COL-0162"

[[sections.topics]]
id = "quillen-resolution"
title = "Admissible resolutions"
start = "COL-0235"

[[sections.topics]]
id = "quillen-localization"
title = "Dévissage and Serre localization"
start = "COL-0246"

[[sections.topics]]
id = "quillen-finite-support"
title = "Finite-support families"
start = "COL-0281"

[sections.transitions]
COL-0055 = "The \\(Q\\)-functor of an exact functor sends the original zero to a\nzero object of the target. Rebasing along its canonical isomorphism\nto the chosen target zero gives the based map used on\n\\(\\pi_{n+1}(BQ)\\).\n"
COL-0072 = "For composable exact functors, COL-0057 identifies the separately\nnormalized composite with the normalization of the composite.\nIts comparison component at zero gives a based nerve homotopy,\nso the corresponding group homomorphisms agree.\n"
COL-0162 = "The algebraic comparison sends an object to its canonical loop\nat zero. Every based path class in the realized nerve comes from\nthe groupoid completion by COL-0160. The Grothendieck comparison\nfor that completion then gives surjectivity onto \\(K_0\\).\n"
COL-0240 = "Faithfulness of the completion comparison in COL-0239 gives\ninjectivity on loops at zero. Via the factorization of COL-0162,\nthis is injectivity of the same Grothendieck-to-Quillen homomorphism.\n"
COL-0235 = "A length-one admissible resolution presents an ambient object by a\ndeflation from a resolving object with resolving kernel. The cover\nand its comparison maps give the contraction of the relevant\n\\(Q\\)-comma categories.\n"
COL-0236 = "Contractibility of the comma realizations is the hypothesis of\nQuillen's Theorem A. Applied to the inclusion, it gives a homotopy\nequivalence with that realized inclusion as forward map, hence the\nequivalence on the chosen based groups.\n"
COL-0237 = "Filter the ambient category by the maximum permitted resolution\nlength of an object. Adjacent strata reduce to the length-one\ncase. Objectwise finite resolutions exhaust the category, and the\nnerve comparison of COL-0238 passes to this union.\n"
COL-0246 = "For dévissage the input is a filtration by subobjects. Its factors\nlie in the chosen full abelian subcategory, and the layer\ndescription of the inclusion comma category in COL-0245 is the\none used for the classifying-space comparison.\n"
COL-0249 = "The Serre quotient takes objects of the Serre subcategory to zero.\nThis gives a comparison from its \\(Q\\)-classifying space to the\nhomotopy fiber of the normalized quotient. The comma transitions\ngive the comparison with the actual fiber.\n"
COL-0250 = "The based homotopy fiber has its path-space connecting map.\nTransporting that map back along the comparison with the Serre\nsubcategory gives the boundary in the connective K-sequence,\nwith the canonical inclusion and quotient maps.\n"
COL-0272 = "An actual additive Serre localization has a target equivalent to\nthe canonical quotient. Transport along this comparison, and along\nthe chosen small models in the essentially small case, expresses the\nsequence on the original localization maps.\n"
COL-0281 = "A finite-support family lies in the subcategory for some finite\nset of indices. The finite stages have the coordinate projections\nand singleton inclusions. On positive K-groups, these maps give\nthe coordinates and the finite sum that identify the direct sum.\n"
COL-0377 = "An identity natural automorphism acts by its complete normalized Q-track.\nTrivial loop transport on the Q-space gives the degree-zero source group law.\nThe Serre comparison intertwines this track with every point of the original\nfiber path, so the loop-shift sign gives the inverse in the boundary formula.\nTarget and chosen-model comparisons carry it to the original localization maps.\n"

[[sections]]
id = "waldhausen-k-theory"
title = "Waldhausen K-theory"
order = 40
introduction = "The realized S-construction gives based K-maps, additivity and the connective spectrum. Change of weak equivalences, approximation and cofinality are expressed through the original fiber, cone and exact-functor maps."

[[sections.topics]]
id = "waldhausen-based-maps"
title = "Realized S-maps and based homotopies"
start = "COL-0155"

[[sections.topics]]
id = "waldhausen-additivity"
title = "Additivity and the group law"
start = "COL-0218"

[[sections.topics]]
id = "iterated-s-and-stability"
title = "Iterated S-construction and stable groups"
start = "COL-0276"

