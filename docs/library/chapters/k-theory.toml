title = "Based Q-maps and K-groups"
start = "COL-0045"

[[sections.topics]]
id = "quillen-k-zero"
title = "Algebraic and homotopical K-zero"
start = "COL-0162"

[[sections.topics]]
id = "quillen-resolution"
title = "Admissible resolutions"
start = "COL-0235"

[[sections.topics]]
id = "quillen-localization"
title = "Dévissage and Serre localization"
start = "COL-0246"

[[sections.topics]]
id = "quillen-finite-support"
title = "Finite-support families"
start = "COL-0281"

[sections.transitions]
COL-0055 = '''
The \(Q\)-functor of an exact functor sends the original zero to a
zero object of the target. Rebasing along its canonical isomorphism
to the chosen target zero gives the based map used on
\(\pi_{n+1}(BQ)\).
'''
COL-0072 = '''
For composable exact functors, COL-0057 identifies the separately
normalized composite with the normalization of the composite.
Its comparison component at zero gives a based nerve homotopy,
so the corresponding group homomorphisms agree.
'''
COL-0162 = '''
The algebraic comparison sends an object to its canonical loop
at zero. Every based path class in the realized nerve comes from
the groupoid completion by COL-0160. The Grothendieck comparison
for that completion then gives surjectivity onto \(K_0\).
'''
COL-0240 = '''
Faithfulness of the completion comparison in COL-0239 gives
injectivity on loops at zero. Via the factorization of COL-0162,
this is injectivity of the same Grothendieck-to-Quillen homomorphism.
'''
COL-0235 = '''
A length-one admissible resolution presents an ambient object by a
deflation from a resolving object with resolving kernel. The cover
and its comparison maps give the contraction of the relevant
\(Q\)-comma categories.
'''
COL-0236 = '''
Contractibility of the comma realizations is the hypothesis of
Quillen's Theorem A. Applied to the inclusion, it gives a homotopy
equivalence with that realized inclusion as forward map, hence the
equivalence on the chosen based groups.
'''
COL-0237 = '''
Filter the ambient category by the maximum permitted resolution
length of an object. Adjacent strata reduce to the length-one
case. Objectwise finite resolutions exhaust the category, and the
nerve comparison of COL-0238 passes to this union.
'''
COL-0246 = '''
For dévissage the input is a filtration by subobjects. Its factors
lie in the chosen full abelian subcategory, and the layer
description of the inclusion comma category in COL-0245 is the
one used for the classifying-space comparison.
'''
COL-0249 = '''
The Serre quotient takes objects of the Serre subcategory to zero.
This gives a comparison from its \(Q\)-classifying space to the
homotopy fiber of the normalized quotient. The comma transitions
give the comparison with the actual fiber.
'''
COL-0250 = '''
The based homotopy fiber has its path-space connecting map.
Transporting that map back along the comparison with the Serre
subcategory gives the boundary in the connective K-sequence,
with the canonical inclusion and quotient maps.
'''
COL-0272 = '''
An actual additive Serre localization has a target equivalent to
the canonical quotient. Transport along this comparison, and along
the chosen small models in the essentially small case, expresses the
sequence on the original localization maps.
'''
COL-0281 = '''
A finite-support family lies in the subcategory for some finite
set of indices. The finite stages have the coordinate projections
and singleton inclusions. On positive K-groups, these maps give
the coordinates and the finite sum that identify the direct sum.
'''

COL-0377 = '''
An identity natural automorphism acts by its complete normalized Q-track.
Trivial loop transport on the Q-space gives the degree-zero source group law.
The Serre comparison intertwines this track with every point of the original
fiber path, so the loop-shift sign gives the inverse in the boundary formula.
Target and chosen-model comparisons carry it to the original localization maps.
'''


