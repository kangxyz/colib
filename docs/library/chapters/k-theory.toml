[chapter]
id = "k-theory"
title = "Algebraic K-Theory"
order = 11
introduction = "Grothendieck presentations and the realized \\(Q\\)- and \\(S\\)-constructions define K-theory for exact and Waldhausen categories. Resolution, dévissage, localization, additivity and cofinality concern these abstract categories and their specified functors [@Quillen1973, Sections 2–5] and [@Waldhausen1985, Section 1]. Strict-square cone–loop constructions and finite Bass iteration retain their original maps and tracks. Ring and field applications begin with COL-0004 and COL-0378; scheme applications begin with COL-0285. Milnor symbols and residues have their own chapter, beginning with COL-0005."

[[sections]]
id = "grothendieck-groups"
title = "Grothendieck groups"
order = 10
introduction = "For an exact category $\\mathcal E$, its Grothendieck group is generated by object classes subject to $[B]=[A]+[C]$ for every conflation $A\\rightarrowtail B\\twoheadrightarrow C$. Exact functors preserve these relations. We compare this presentation with the short-exact-sequence presentation in an abelian category and record the generator criteria used to identify induced maps."


[[sections.topics]]
id = "object-classes-and-additivity"
title = "Object classes and additivity"
start = "COL-0001"

[[sections.topics]]
id = "exact-structures-and-functoriality"
title = "Exact structures and functoriality"
start = "COL-0018"

[sections.transitions]
COL-0003 = "On the free abelian group of objects, a functor acts by \\(e_X\\mapsto e_{F(X)}\\).\nPreservation of short exact sequences sends each defining relation to a\ndefining relation, so this action descends to the quotient.\n"
COL-0018 = "The construction only needs a specified collection of pairs on which\nadditivity is imposed. In an exact category those pairs are its\nconflations. The free presentation then represents invariants additive\non that particular exact structure.\n"
COL-0019 = "For the standard exact structure on an abelian category, each conflation\nis a short exact sequence. The two presentations have the same relations\non the same objects, so sending each generator to its namesake gives\ninverse maps in both directions.\n"
COL-0024 = "If \\(F\\) preserves the selected conflations, the function\n\\(X\\mapsto[F(X)]\\) is additive on them. The universal property yields\nthe induced map, and its identity and composition laws are checked on\nthe object generators.\n"
COL-0025 = "For a short-exact-sequence-preserving \\(F\\), both routes through the\ncomparison send the class of \\(X\\) to that of \\(F(X)\\). The equality\non generators gives the naturality equation.\n"
COL-0026 = "The image of an inclusion is generated by the images of its object\nclasses. The comparison between the two presentations therefore\nidentifies the subgroup from the conflation presentation with the\nsame subgroup in the short-exact-sequence presentation.\n"
COL-0078 = "The based loops of the \\(Q\\)-category multiply by composition.\nTo compare them with object classes, use the multiplicative form of\nthe algebraic Grothendieck group. A homomorphism out of this group is\ndetermined by its values on the objects, also for a group-valued target.\n"

[[sections]]
id = "quillen-k-theory"
title = "The Q-construction and Quillen K-theory"
order = 20
introduction = "Quillen associates to an exact category $\\mathcal E$ the category $Q\\mathcal E$ and groups $K_n(\\mathcal E)=\\pi_{n+1}(BQ\\mathcal E,0)$ [@Quillen1973, Section 2]. Exact functors induce maps based at the zero object. The comparison in degree zero identifies the homotopical group with the Grothendieck group; its proof uses object loops and the Grothendieck cocycle."


[[sections.topics]]
id = "the-q-construction-and-induced-maps"
title = "The Q-construction and induced maps"
start = "COL-0045"

[[sections.topics]]
id = "the-degree-zero-comparison"
title = "The degree-zero comparison"
start = "COL-0079"

[sections.transitions]
COL-0055 = "The \\(Q\\)-functor of an exact functor sends the original zero to a\nzero object of the target. Rebasing along its canonical isomorphism\nto the chosen target zero gives the based map used on\n\\(\\pi_{n+1}(BQ)\\).\n"
COL-0072 = "For composable exact functors, COL-0057 identifies the separately\nnormalized composite with the normalization of the composite.\nIts comparison component at zero gives a based nerve homotopy,\nso the corresponding group homomorphisms agree.\n"
COL-0079 = "For a span \\(X\\leftarrow U\\to Y\\) in \\(Q\\), the left deflation has\nkernel class \\([U]-[X]\\). In the pullback defining a composite,\nthe conflation relations add the two weights. This gives the\ncocycle on the span category.\n"
COL-0080 = "The cocycle takes values in a one-object groupoid, so it extends\nover localization at every \\(Q\\)-arrow. At zero, its values on\nthe canonical object loops recover the Grothendieck generators.\n"
COL-0086 = "Realizing the object loops takes these classes to the fundamental\ngroup at zero. Their conflation relations and commutativity give the\nmap from the algebraic group to homotopical \\(K_0\\).\n"
COL-0162 = "The algebraic comparison sends an object to its canonical loop\nat zero. Every based path class in the realized nerve comes from\nthe groupoid completion by COL-0160. The Grothendieck comparison\nfor that completion then gives surjectivity onto \\(K_0\\).\n"
COL-0240 = "Faithfulness of the completion comparison in COL-0239 gives\ninjectivity on loops at zero. Via the factorization of COL-0162,\nthis is injectivity of the same Grothendieck-to-Quillen homomorphism.\n"
COL-0281 = "A finite-support family lies in the subcategory for some finite\nset of indices. The finite stages have the coordinate projections\nand singleton inclusions. On positive K-groups, these maps give\nthe coordinates and the finite sum that identify the direct sum.\n"

[[sections]]
id = "resolution-devissage-and-serre-localization"
title = "Resolution, dévissage and Serre localization"
order = 30
introduction = "Resolution and dévissage replace an exact category by a smaller category without changing its K-groups, under distinct hypotheses [@Quillen1973, Sections 4–5]. Resolution uses finite resolutions; dévissage uses finite filtrations. For a Serre subcategory $\\mathcal B\\subseteq\\mathcal A$, localization relates $K(\\mathcal B)$, $K(\\mathcal A)$ and $K(\\mathcal A/\\mathcal B)$. The degree-zero presentation and the homotopical fiber theorem are treated separately before their compatibility is asserted."


[[sections.topics]]
id = "serre-localization-in-degree-zero"
title = "Serre localization in degree zero"
start = "COL-0028"

[[sections.topics]]
id = "resolution-and-d-vissage"
title = "Resolution and d\u00e9vissage"
start = "COL-0235"

[[sections.topics]]
id = "the-localization-fiber-and-its-maps"
title = "The localization fiber and its maps"
start = "COL-0249"

[sections.transitions]
COL-0028 = "In the localization at a Serre class, an object of the class maps to\nzero. The subgroup generated by these objects is thus contained in\nthe kernel. The quotient calculation identifies the entire kernel\nand tracks the image of each original object.\n"
COL-0029 = "Taking the canonical Serre quotient as the target gives this\ncalculation on the canonical quotient functor. Its induced\nequivalence sends the residue class of \\([X]\\) to the class of the\nactual image of \\(X\\).\n"
COL-0235 = "A length-one admissible resolution presents an ambient object by a\ndeflation from a resolving object with resolving kernel. The cover\nand its comparison maps give the contraction of the relevant\n\\(Q\\)-comma categories.\n"
COL-0236 = "Contractibility of the comma realizations is the hypothesis of\nQuillen's Theorem A. Applied to the inclusion, it gives a homotopy\nequivalence with that realized inclusion as forward map, hence the\nequivalence on the chosen based groups.\n"
COL-0237 = "Filter the ambient category by the maximum permitted resolution\nlength of an object. Adjacent strata reduce to the length-one\ncase. Objectwise finite resolutions exhaust the category, and the\nnerve comparison of COL-0238 passes to this union.\n"
COL-0246 = "For dévissage the input is a filtration by subobjects. Its factors\nlie in the chosen full abelian subcategory, and the layer\ndescription of the inclusion comma category in COL-0245 is the\none used for the classifying-space comparison.\n"
COL-0249 = "The Serre quotient takes objects of the Serre subcategory to zero.\nThis gives a comparison from its \\(Q\\)-classifying space to the\nhomotopy fiber of the normalized quotient. The comma transitions\ngive the comparison with the actual fiber.\n"
COL-0250 = "The based homotopy fiber has its path-space connecting map.\nTransporting that map back along the comparison with the Serre\nsubcategory gives the boundary in the connective K-sequence,\nwith the canonical inclusion and quotient maps.\n"
COL-0272 = "An actual additive Serre localization has a target equivalent to\nthe canonical quotient. Transport along this comparison, and along\nthe chosen small models in the essentially small case, expresses the\nsequence on the original localization maps.\n"
COL-0377 = "An identity natural automorphism acts by its complete normalized Q-track.\nTrivial loop transport on the Q-space gives the degree-zero source group law.\nThe Serre comparison intertwines this track with every point of the original\nfiber path, so the loop-shift sign gives the inverse in the boundary formula.\nTarget and chosen-model comparisons carry it to the original localization maps.\n"

[[sections]]
id = "waldhausen-k-theory"
title = "The S-construction and Waldhausen K-theory"
order = 40
introduction = "For a Waldhausen category $\\mathcal C$, the S-construction gives the K-theory space $\\Omega|wS_\\bullet\\mathcal C|$ [@Waldhausen1985, Section 1.3]. Exact functors and weak natural transformations induce maps and homotopies. The degree-zero comparison records additivity on cofibration sequences; automorphisms give degree-one classes. When changing categories, the image in degree zero must be distinguished from positive-degree equivalence."


[[sections.topics]]
id = "realization-and-functoriality"
title = "Realization and functoriality"
start = "COL-0155"

[[sections.topics]]
id = "degree-zero-and-automorphism-classes"
title = "Degree zero and automorphism classes"
start = "COL-0269"

[sections.transitions]
COL-0156 = "A pointwise weak transformation compares the images of each\nquotient row. In the nerve direction its components give the\nsimplicial cylinder between the two exact-functor maps.\n"
COL-0157 = "When the two functors carry the chosen zero to the specified\ntarget zero by object equalities, the cylinder is constant on\nthat vertex. The resulting homotopy can then be applied to\nhomotopy groups at the equality-rebased point.\n"
COL-0158 = "Exactness sends the chosen source zero to a zero object. Its\nunique isomorphism to the target zero gives the rebasing used\nfor the canonical \\(K\\)-map, and the composition comparison\ntracks that same choice of vertex.\n"
COL-0179 = "For an equivalence exact in both directions, its unit and\ncounit give weak transformations on the \\(S\\)-models.\nTheir based comparisons make the two induced canonical\n\\(K\\)-maps mutual inverses.\n"
COL-0212 = "The product comparison has the two canonical projections\nas its forward coordinates. Under that comparison the\ncoproduct map gives the original group multiplication.\nCoproduct symmetry then gives commutativity, including in degree zero.\n"
COL-0269 = "In degree zero, the canonical loop of an object satisfies\nthe zero, weak-arrow and cofibration-pushout relations.\nThese are the relations of the object presentation, and\nthe comparison keeps the loop of each original object as\nits generator image.\n"
COL-0270 = "For an exact functor with genuine target factorization,\nthe original Grothendieck comparison identifies the\nimage-quotient class map with change of weak equivalences\nfollowed by the coarse value map.\n"
COL-0299 = "The weak-object square path of a composite is compared to\nthe concatenation of the two square paths by the composition\ncube. Normalizing at the actual object component gives the\nreversed product law for the weak-endomorphism \\(K_1\\) classes.\n"
COL-0357 = "On small models with strict forward zero preservation, the\nsame equivalence can be taken levelwise through the iterated\n\\(S\\)-construction. The normalized inverse and the original\nunit and counit provide the structure-compatible homotopies.\n"

[[sections]]
id = "additivity-approximation-and-comparison-theorems"
title = "Additivity, approximation and comparison theorems"
order = 50
introduction = "Additivity identifies the K-theory map of a cofibration sequence of functors with the sum of its two outer maps [@Waldhausen1985, Section 1.4]. Approximation supplies equivalences under lifting and weak-equivalence detection hypotheses. Comparison with exact-category K-theory and passage to bounded complexes then identify the appropriate Q- and S-constructions. Dense cofinality gives positive-degree equivalence and the stated injection in degree zero, not an unconditional equivalence in every degree."


[[sections.topics]]
id = "additivity"
title = "Additivity"
start = "COL-0218"

[[sections.topics]]
id = "comparison-approximation-and-cofinality"
title = "Comparison, approximation and cofinality"
start = "COL-0243"

[sections.transitions]
COL-0218 = "For a cofibration sequence \\(F\\hookrightarrow G\\twoheadrightarrow H\\)\nof exact functors, compare the middle row with the separated\nrow of quotient and subobject. Ordinary horizontal subdivision\nallows the three stages of this deformation to be taken\nrelative to the chosen zero.\n"
COL-0219 = "The deformation ends at the actual coproduct functor\n\\(H\\amalg F\\). The based comparison identifies its map\non the original groups with the product of the maps of\n\\(F\\) and \\(H\\) in subobject-then-quotient order.\n"
COL-0243 = "An exact category has its associated Waldhausen structure.\nReversed edgewise subdivision of the \\(S\\)-model gives the\nprescribed comparison with \\(Q\\). Its naturality compares\nthe original two \\(K\\)-maps of each exact functor.\n"
COL-0256 = "For an approximation functor, App1 detects weak maps and\nthe cofibration form of App2 gives the incoming lifts.\nWith the target two-out-of-three and the source joint data,\nthese lifts give the quotient-row comparisons used on the\noriginal delooping.\n"
COL-0257 = "For bounded termwise complexes with isomorphisms as weak\nmaps, term and cycle evaluations record the finite coordinates.\nTheir alternating Euler maps give the decomposition by\nacyclic complexes and the degree-zero single-term insertion.\n"
COL-0260 = "Upon changing the weak maps to quasi-isomorphisms, the\nacyclic factor is removed by the fiber comparison. With\nthe stated closure hypotheses on the terms, the remaining\nmap is the original degree-zero insertion on \\(K\\)-groups.\n"
COL-0268 = "For a dense full subcategory, coproduct complements supply\nthe grading by common-complement classes. The change-of-weak\nmap to this coarse model has the image of the original\ninclusion as its kernel, including the exact tail in degree zero.\n"
COL-0301 = "A weak transformation between cofibration sequences gives\ntwo ways to combine the deformation with the transformation\ntracks. The square compares the tracks on the middle rows with\nthose on the separated rows, retaining the once-reversed identity\nprefix and the half, quarter, quarter subdivision of time.\n"
COL-0302 = "For families of coproducts the product comparison must lift\nthe whole compact family of based cubes, including every\nprescribed face. These lifts give the unit and supplied-null\nsquares used for the coherence of the normalized endpoint.\n"
COL-0308 = "Compatible duality reverses the coordinates of the full\nquotient grid. The incoming lifting condition for the\nopposite comparison can be checked on the fine arrows.\nFor inverse-image weak classes, the passage to coarse exactness\nuses endpoint gluing and projection naturality as in COL-0306.\n"
COL-0309 = "For an exact functor \\(F\\), consider triples\n\\((A,B,F(A)\\xrightarrow{\\sim}B)\\). The source projection\nand the identity-arrow diagonal compare through the stored weak arrow.\nThe target projection then gives the factorization of the\noriginal \\(K\\)-map.\n"

[[sections]]
id = "waldhausen-fibration-and-boundary-maps"
title = "Waldhausen fibration and boundary maps"
order = 60
introduction = "Let $v\\subseteq w$ be two classes of weak equivalences on a Waldhausen category, and let $\\mathcal C^w$ denote its w-acyclic objects. Under the fibration hypotheses, the comparison $K(\\mathcal C,v)\\to K(\\mathcal C,w)$ has the acyclic K-theory as its homotopy fiber [@Waldhausen1985, Section 1.6]. A chosen null-homotopy of the acyclic composite specifies the fiber map and therefore the connecting homomorphism. The calculations below retain that choice when proving naturality and normalizing its sign."


[[sections.topics]]
id = "change-of-weak-equivalences"
title = "Change of weak equivalences"
start = "COL-0252"

[[sections.topics]]
id = "cone-comparisons-and-boundary-normalization"
title = "Cone comparisons and boundary normalization"
start = "COL-0288"

[sections.transitions]
COL-0252 = "Let \\(v\\subseteq w\\) be weak classes for the same cofibrations and\nchosen zero. On the full subcategory of \\(w\\)-acyclic objects,\nthe maps from zero give a nullhomotopy after changing from \\(v\\)\nto \\(w\\). The full reversed nullhomotopy is the path in the\ncanonical lift to the homotopy fiber.\n"
COL-0253 = "For relative quotient rows, compare the total row with its\ntail. The split fibers and their ordinal transitions identify\nthe homotopy fiber of the original row comparison, including\nits constant path and its components.\n"
COL-0254 = "To compare the acyclic model with the change-of-weak fiber,\napply the relative-row calculation using coarse two-out-of-three,\nextension, the joint cylinder and its second-endpoint section.\nThe comparison retains the same acyclic inclusion and the\nreversed nullhomotopy of COL-0252.\n"
COL-0259 = "With the acyclic realization identified with the fiber, its\npath-space boundary gives the connecting homomorphism on the\nacyclic \\(K\\)-groups. The resulting exact sequence includes\nthe \\(K_1\\)-to-\\(K_0\\) map and the surjective \\(K_0\\) tail.\n"
COL-0275 = "For two composable transformations, the three sides of the\nnerve triangle correspond to the two transformations and their\ncomposite. Keeping these sides as the original cylinders\nprovides the comparison between composition and concatenation.\n"
COL-0278 = "In the grading-coarse target the zero endotransformation is\nweak. It supplies a contraction of the normalized self-track\nrelative to both endpoints and the whole basepoint line.\nThe prescribed null-conjugate carries this contraction to\nthe parameter-looped target.\n"
COL-0288 = "At level \\(n+1\\) the cone-to-fiber comparison has connectivity\n\\(2n\\). This increasing range gives the stable comparison.\nFor the acyclic inclusion, its full null track supplies the\nmap from that cone to the coarse prespectrum.\n"
COL-0290 = "The image-quotient grading prespectrum is the unshifted target\nof the specified cone comparison. On stable degree zero,\nthe previous quotient calculation identifies that map,\nusing the original reversed null track in its construction.\n"
COL-0291 = "A functor exact for both weak classes induces a map of the\ncanonical fibers by carrying their entire paths. Under the\ntwo fiber comparison equivalences, naturality of the\npath-space connecting map gives the original boundary equation.\n"
COL-0294 = "Small-model transport uses homeomorphisms of deloopings and\nof the actual canonical fibers. Their effect on the\nstored paths carries the same boundary across the specified\nmorphism universes.\n"
COL-0296 = "Translation by an object's fine and coarse loops moves the\nfiber over the constant loop to the fiber over its coarse\nobject loop followed by the constant loop. When zero\nmorphisms are available, the identity-cofiber suffix gives\nthe specified comparison to the fiber over the object loop itself.\n"
COL-0297 = "For a displayed weak cofibration, its cofiber prism compares\nthe quotient prefix with the identity-cofiber suffix.\nIn the canonical fiber the quotient prefix is reversed.\nThe relative homotopy identifies the degree-one transport with\nthe standard unit removal on that component.\n"

[[sections]]
id = "delooping-and-stable-localization"
title = "Delooping and stable localization"
order = 70
introduction = "Iterating the S-construction produces a connective K-theory spectrum. Its stable homotopy groups in nonnegative degrees recover the original K-groups, and the structure maps provide the stated loop-space equivalences. We then stabilize the fibration sequence and compare cofibers with looped cofibers. Stable equivalence here is a statement about all stable homotopy groups; it is not a claim of levelwise equivalence. COL-0292 concerns categorical localization at stable equivalences, rather than a second fibration theorem."


[[sections.topics]]
id = "the-connective-spectrum"
title = "The connective spectrum"
start = "COL-0267"

[[sections.topics]]
id = "stable-localization"
title = "Stable localization"
start = "COL-0284"

[sections.transitions]
COL-0267 = "An additive grading of objects that is invariant under weak\nmaps defines a coarse model. Its realized values form the\nsubgroup that appears in the nerve comparison for the\ncoarse delooping.\n"
COL-0276 = "Finite iteration of the quotient-row construction supplies\nthe levels of the \\(S\\)-prespectrum. The zero-space comparison\nrecovers the original \\(K\\)-groups. At the chosen zero, general\nexact-functor maps use the same canonical rebasing as before.\n"
COL-0277 = "The weak-transformation cylinder and its composition triangle\nmust commute with the prespectrum structure maps. Retaining\nevery structure parameter gives the homotopies of the actual\nprespectrum maps and their relative composition comparison.\n"
COL-0282 = "Adding an initial row gives a contraction whose path-fiber\ncomparison identifies each original loop structure map.\nThe comparison includes path components as well as positive\nbased homotopy groups.\n"
COL-0283 = "For the resulting connective Omega-spectrum, the nonnegative\nstable groups are computed by the original \\(K\\)-groups.\nConnectivity gives zero in the negative degrees, and the\ncomparison uses the same exact-functor maps.\n"
COL-0284 = "Iterating \\(S\\) gives the stable version of the same acyclic\ncomparison under the fibration hypotheses. Under the\noriginal group comparisons, the stable fiber boundary is\nthe negative of the transported connective boundary,\nincluding its degree-one endpoint.\n"
COL-0292 = "An original exact-functor map acts on stable groups by its\nnonnegative \\(K\\)-maps and the zero maps in negative degrees.\nThus bijectivity of all the original \\(K\\)-maps, including\n\\(K_0\\), is the criterion for this map in the stable localization.\n"
COL-0293 = "Distinguished-row stabilization uses the actual quotient-row\ntranspose and, in degree zero, the original double loop.\nIts compatibility with weak transformations is an equation\nof whole tracks through these structure maps.\n"
COL-0295 = "Parameter looping can be applied before or after taking\nthe reduced cone. The comparison comes from the original\ncylinder and the fiber-loop transpose, which determine its\ncompatibility with the signed boundary.\n"
COL-0321 = "A complete based self-track gives a degree-raising operation\non finite based cubes. Its successor comparison has the\ninverse sign, so alternating the stage operations gives\nthe stable map. The original \\(S\\)-comparison transports\nthat operation to the canonical \\(K\\)-groups.\n"

[[sections]]
id = "bass-delooping-diagrams-and-functoriality"
title = "Bass delooping: diagrams and functoriality"
order = 80
introduction = "The Bass construction iterates a cone-loop operation on strict diagrams. Its maps must be compatible with the diagram square and with the null-homotopy that defines the cone map. The results establish functoriality, interchange and finite iteration for these data. Laurent coefficient actions provide one source of seeds. These are abstract constructions used later for schemes, not a statement of the Bass fundamental theorem for rings."


[[sections.topics]]
id = "cone-loop-iteration"
title = "Cone-loop iteration"
start = "COL-0338"

[[sections.topics]]
id = "functoriality-and-interchange"
title = "Functoriality and interchange"
start = "COL-0514"

[[sections.topics]]
id = "tensor-inputs"
title = "Tensor inputs"
start = "COL-0528"

[[sections.topics]]
id = "laurent-coefficient-seeds"
title = "Laurent coefficient seeds"
start = "COL-0587"

[sections.transitions]
COL-0354 = "In the reduced quotient, the basepoint fibre includes the inverse\nimages of the basepoints under the endpoint maps. These closed\nfibres enter the \\(T_1\\) verification for the cone and double\ncylinder. Looping preserves the resulting separation condition,\nwhich can then be propagated through the finite iterates.\n"
COL-0514 = "The strict-square construction also transports four compatible moving corner maps.\nKeeping both quotient heights separate from the moving parameter gives the whole cone\naction. Its four generator formulas characterize that action uniquely, providing the\nrecognition input used later by the tensor-generated Bass recipe.\n"
COL-0516 = "The four-corner action can now be assembled over an indexing category. Literal zero\npreservation fixes the transported null endpoints; the specified inverse index\ninterchange gives the natural cone track and its original source-null formula.\nSource-seed transport additionally retains the stated scalar-track intertwining\ncondition, rather than supplying an unproved seed compatibility.\n"
COL-0517 = "The original row interchange then descends through the reduced span, cone and old\nparameter loop. Its finite Bass iteration is computed recursively, with point and\nordinary naturality laws carried by the recursion. Induction proves the all-stage\ntwo-structure exchange from the initial equation, without assuming a generated trace.\n"
COL-0519 = "A based row interchange also constructs the original distinguished-row refinement,\nwith an explicit degree-zero double loop. Its comparison, pointwise maps and whole\nhomotopies are coefficient-natural under their stated exchange and all-time row-square\nhypotheses. This supplies the actual refinement needed by the subsequent strength maps.\n"
COL-0521 = "The refined inclusions, glue and nullhomotopies now descend to actual pushout and\ncone strengths. Their coefficient-natural comparison and source-null equations survive\nthe explicit row/old-loop coordinate isomorphism, producing the original first-Bass\nstrength without claiming a generated trace or stability of that strength.\n"
COL-0523 = "The original loop strength next preserves the actual cone action at every unchanged\ntime. Natural whole tracks and their intertwining maps are consequently closed under\ncone, loop and Bass transport, supplying the local action data needed before the\nconstructed row-cell successor and its separate finite iteration.\n"
COL-0525 = "The whole-cell comparison now passes through the original cone and Bass maps.\nIts computed endpoints yield the next cell without changing its time slices, and\nits comparison with the actual next track proves coefficient naturality. This\nlocal successor construction precedes the separate generated finite iteration.\n"
COL-0527 = "The whole-cell successor now iterates on every finite stage of the original Bass\ndiagram. The recursion retains the full naturality and time-slice comparison, not\nonly endpoint equalities. The separate generated-trace construction must still\nidentify these recursively produced cells with its geometric generators.\n"
COL-0528 = "The finite row-cell iterator now realizes an independently defined generator\ntrace. The induction changes the starting diagram at each successor and thus\nretains the whole construction, rather than checking only a final endpoint.\nIdentification and geometric instantiation of these generated recipes remain\nseparate steps before the final localization comparison.\n"
COL-0529 = "The abstract finite row construction now has its actual Waldhausen starting\ntranspose and coefficient-natural unit track. Both use the existing native\nzero-preserving exact category directly. The independently realized tensor row\ncell and its geometric returned action remain separate inputs to strictification.\n"
COL-0530 = "The original independently specified first-row transformation cell now has an\nordered double-cylinder realization and a whole-spectrum track. Both cell times\nremain visible, together with the extra loop coordinate in degree zero. These\nsupply actual inputs for later unit-row strictification, without asserting a\ngeometric tensor qualification or localization conclusion.\n"
COL-0531 = "Conjugate the specified returned action by its actual return isomorphism. The\nintertwining equation identifies it with the original unit only after this\nconstruction. Its first-row realization and the unchanged finite Bass iteration\nthen retain the complete cell, its time coordinates and index naturality.\n"
COL-0577 = "The index comparison preserves the actual maps. For zero-preserving model diagrams, exact categorical equivalences also give stable equivalences at every finite Bass stage."

[[sections]]
id = "bass-delooping-normalization-and-telescopes"
title = "Bass delooping: normalization and telescopes"
order = 90
introduction = "Finite cone-loop constructions admit several normalizations. To pass from one to another, a comparison must preserve both the underlying maps and their selected null-homotopies. After finite-stage comparison, homotopy-colimit reindexing identifies the associated telescopes. The stable comparison results below supply the abstract transport used in the geometric localization argument."


[[sections.topics]]
id = "normalization-and-its-boundary"
title = "Normalization and its boundary"
start = "COL-0549"

[[sections.topics]]
id = "telescopes-and-stable-comparison"
title = "Telescopes and stable comparison"
start = "COL-0576"

[sections.transitions]
COL-0549 = "The returned-action recursion already supplies whole row cells. Before specializing it geometrically, normalize an arbitrary supplied self-cell with the original inverse-prefix cancellation. Composing the resulting prespectrum map with the refined cone inclusion gives the same boundary interface used by finite scheme stages."
COL-0552 = "COL-0549 constructs the normalized operation without identifying a prescribed null. Keep the\nentire original null and apply the moving-prefix prism. Its structure-compatible lift compares\nthe normalized refined boundary with the actual null/unit/null seed.\n"
COL-0553 = "The normalized boundary lands in the computed row-compatible cone target. To compare it with the\ncurrent finite Bass stage, construct the actual suspension evaluation and retain the literal\nsuccessor transport. The unit-counit triangle then identifies the backward leg exactly.\n"
COL-0554 = "The backward triangle fixes the row target and its successor transport. The `forward` side must\nstill come from the original current seed: retain its right-associated null/unit/null word and\nprove naturality at every time before assembling the natural transformation.\n"
COL-0565 = "The finite Model topology and loop-strength comparisons make the strict Bass stage map stably invertible at every finite stage."
COL-0567 = "The same finite stage maps also preserve each prescribed null track at its unchanged time, supplying the comparison needed for null-based lifts."
