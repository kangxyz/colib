[chapter]
id = "voevodsky-motives"
title = "Voevodsky’s Motives"
order = 54
introduction = '''
Voevodsky’s triangulated category of effective motives
\(DM^{\mathrm{eff}}_-(k)\) is the full subcategory of the bounded-above
derived category of Nisnevich sheaves with transfers whose cohomology
sheaves are \(\mathbb A^1\)-invariant. The singular complex gives the
motive of a smooth scheme. The reduced multiplicative group and derived
torus sections enter the Tate twist.
[@Voevodsky2000TriangulatedMotives, Sections 3.1–3.2]
'''

[[sections]]
id = "effective-motives"
title = "Effective motives and smooth representatives"
order = 10
introduction = '''
Use the standard t-structure on the derived category of Nisnevich sheaves
with transfers. Exact sheafification of the signed singular complex gives
the effective motive of each smooth transfer representable. Over a perfect
field the total singular construction gives the left adjoint to the
effective inclusion.
'''

[[sections]]
id = "tate-twists-and-cancellation"
title = "Tate twists and cancellation"
order = 20
introduction = '''
The unit section of \(\mathbb G_m\) splits off the base summand.
COL-1045 gives the integral cancellation map on signed singular complexes.
Compare these complexes with derived torus sections to transport this map
to the effective category.
'''

[sections.transitions]
COL-1044 = '''
Evaluate the singular representatives of COL-1042 after exterior product
with the torus. The Nisnevich cohomological dimensions of a smooth test
scheme and its product with \(\mathbb G_m\) give a common finite bound.
'''
COL-1046 = '''
Use the reduced summand of the derived torus sections. On a smooth
representative the adjunction unit is the singular map of COL-1045.
Uniformly bounded direct sums and projective resolutions extend this
calculation to every effective motive.
'''

[[sections]]
id = "geometric-motives"
title = "Geometric Motives and Tate Inversion"
order = 30
introduction = '''
The singular motives of smooth schemes generate the effective geometric
category inside \(DM_-^{\mathrm{eff}}(k)\). Cancellation identifies morphisms
after raising the Lefschetz stage and allows inverse twists. The symmetric
tensor is characterized on the original smooth motives by their product.
'''

[sections.transitions]
COL-1224 = '''
The Lefschetz twist preserves the subcategory generated by the smooth
motives. Integral cancellation in COL-1046 makes its transition maps
on Hom groups bijective, so the construction of COL-1235 applies.
'''
COL-1239 = '''
The effective Lefschetz twist agrees with right tensoring by the
Lefschetz object, with its signed shift comparison. Its identity
self-braiding supplies the hypothesis of COL-1304.
'''

[[sections]]
id = "motivic-purity-and-gysin"
title = "Motivic Purity and the Gysin Triangle"
order = 40
introduction = '''
For a smooth closed immersion, the complementary open gives a
relative motive and its distinguished triangle. The two fibre maps of
the deformation compare the relative motive with support on the zero
section of the normal bundle. The normalized Thom comparison identifies
that motive with the twisted motive of the centre.
'''

[sections.transitions]
COL-1298 = '''
The deformation comparison changes support on the centre into support
on the zero section. A local frame of the normal bundle then permits
the line-pair orientations to be multiplied and glued.
'''
COL-1225 = '''
Compose COL-1305 with the normalized comparison of COL-1298.
This gives the purity map on the original pair and fixes its direction.
'''
COL-1226 = '''
The purity map from COL-1225 identifies the third object of the relative
triangle. Composing the quotient with purity gives the Gysin morphism.
Composing the boundary with inverse purity gives the residue.
'''
COL-1240 = '''
For the diagonal of a pure \(d\)-dimensional smooth scheme, the
ambient dimension is \(2d\) and the centre has dimension \(d\).
The same quotient and boundary describe the diagonal triangle.
'''

[[sections]]
id = "motivic-coniveau"
title = "The Coniveau Spectral Sequence"
order = 50
introduction = '''
Nest closed supports by their codimension and apply represented
cohomology to the localization triangles of the complementary opens.
The adjacent support groups give the first page. The support filtration
on the absolute group gives the stable terms.
'''
