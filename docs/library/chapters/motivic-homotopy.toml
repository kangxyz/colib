[chapter]
id = "motivic-homotopy"
title = "Motivic Homotopy Theory"
order = 57
introduction = '''
The unstable theory uses pointed simplicial presheaves on the smooth
Nisnevich site. It develops the pointed \(\mathbb A^1\)-homotopy category,
space-level Eilenberg–Mac Lane representatives and the Tate suspension
of a pointed space. Strict \(\mathbb A^1\)-invariance for cohomology with
transfers is proved in COL-1029.

COL-1115 starts the construction of Tate prespectra in Motivic Stable
Homotopy Theory by using the space-level suspension at each degree.
'''

[[sections]]
id = "pointed-simplicial-presheaves"
title = "Pointed simplicial presheaves"
order = 10
introduction = "The reduced cone and the native simplicial circle give two descriptions of suspension. Their comparison retains the quotient map from the cone."

[[sections]]
id = "eilenberg-mac-lane-representatives"
title = "Nisnevich Eilenberg–Mac Lane representatives"
order = 20
introduction = '''Use the Nisnevich points of COL-1010 and the K-injective comparison of COL-1014 to represent the actual integral and cone-coefficient motivic cohomology groups.'''

[[sections]]
id = "affine-line-representatives"
title = "A¹-localization of representatives"
order = 25
introduction = '''
Use the native affine line as the interval. The parameter coproduct
extends \(\mathbb A^1\)-invariance on smooth representables to all pointed cylinders.
With COL-1033, the integral and finite motivic representatives compute
the same groups after \(\mathbb A^1\)-localization.
'''

[[sections]]
id = "tate-sphere-and-suspension"
title = "The Tate quotient and suspension"
order = 30
introduction = '''Point the native affine line and multiplicative group at one. The Laurent open gives the Tate quotient and its cone maps. The target of the affine-line collapse is the reduced suspension used in COL-1009.'''

[sections.transitions]
COL-1020 = '''
Pass the two pushouts of COL-1017 to a Nisnevich fiber. The simplicial
cone contracts, and the Laurent open remains a monomorphism. These
facts identify the actual collapse to the quotient as a weak equivalence.
'''
COL-1035 = '''
Smashing with the Tate quotient gives a functor on the pointed Nisnevich
homotopy category. The proof uses the wedge and quotient pushouts on each
fiber.
'''
COL-1038 = '''
The affine-line term is contractible after \(\mathbb A^1\)-localization.
Over a perfect field the reduced cochain triangles give the connecting
isomorphism and the comparison for the actual cone collapse.
'''
COL-1036 = '''
The short exact sequence of the Laurent-open quotient gives a connecting
map on reduced cochains. It carries the torus coordinate of COL-1034 to
the Tate class in bidegree \((2,1)\).
'''

[[sections]]
id = "reduced-cohomology-operations"
title = "Operations on reduced cohomology"
order = 40
introduction = '''The finite coefficient triangle of COL-1018 supplies the positive Bockstein. Shifted postcomposition gives its action on the reduced hypercohomology of pointed simplicial presheaves.'''
