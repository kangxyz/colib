[chapter]
id = "milnor-k-theory"
title = "Milnor K-Theory"
order = 11
introduction = '''The graded Steinberg quotient gives ordered Milnor symbols and their field maps. Tame residues over \(k(X)\) give bounded lifts of finite residue data and describe finite separable norms through the residue at infinity. In residue characteristic zero, local norm–residue formulas assemble into the Dedekind pushforward square, linking the rational calculation to curve reciprocity and weighted affine endpoint identities. In degree two, the symbols give a map to the stable Steinberg kernel and vanish over finite fields.'''

[[sections]]
id = "milnor-symbols-field-change"
title = "Symbols and field change"
order = 10
introduction = '''The tensor algebra on a field's multiplicative group, modulo the homogeneous Steinberg ideal, presents the Milnor ring. Ordered symbols describe its multiplication and the maps induced by field homomorphisms. In a polynomial root field, finite families of polynomial representatives for symbol entries can be fixed before changing coefficients. Over algebraic extensions, finite intermediate fields suffice to represent classes and witness equalities that hold after extension.'''

[[sections.topics]]
id = "graded-milnor-symbols"
title = "The graded quotient and its symbols"
start = "COL-0005"

[[sections.topics]]
id = "milnor-field-change"
title = "Field change and finite representatives"
start = "COL-0115"

[sections.transitions]
COL-0006 = '''
The Steinberg tensors are homogeneous of degree two. Their
two-sided ideal is homogeneous, so the degree summands of
the tensor algebra descend to the quotient.
'''
COL-0007 = '''
In degree two, the ideal relations come from the degree-two
generators with only degree-zero scalar multiples. Thus the
degree-two component has a presentation using the tensor square
and its Steinberg submodule.
'''
COL-0008 = '''
For units \(a,b\), the relation \(a+b=1\) gives \(b=1-a\).
Conversely, a pair \(a,1-a\) with both entries units satisfies
that same relation, so both indexing conventions span the
same submodule.
'''
COL-0009 = '''
The comparison of relation submodules identifies both
quotient presentations on the original tensor \(a\otimes b\).
This specifies the comparison on each ordered pair.
'''
COL-0013 = '''
An ordered tuple of units gives a tensor in its tuple degree.
Equivalently, its class is the product of the degree-one
classes in that order in the graded quotient.
'''
COL-0014 = '''
The additive group used in each tensor slot is the
multiplicative group of units. Tensor linearity therefore
turns multiplication in one coordinate into addition of
symbols. A Steinberg pair in adjacent coordinates is
annihilated by the two-sided ideal.
'''
COL-0022 = '''
Multiplication of the tensor representatives concatenates
the two ordered tuples. The empty tuple is the degree-zero
unit, so multiplication by a degree-zero class gives the
corresponding integer scalar action.
'''
COL-0042 = '''
Ordered tuples generate each degree. Coordinate additivity
extends a tuple function to the tensor power, and vanishing on
adjacent Steinberg pairs kills its relations. The resulting
homogeneous map is determined by the original tuple values.
'''
COL-0115 = '''
A field map preserves unit multiplication and sends
\(a,1-a\) to the corresponding Steinberg pair in the target.
It acts on every ordered symbol and hence gives the
homogeneous transport. The graded ring transport combines
these maps using concatenation of tuples.
'''
COL-0226 = '''
Evaluating a split polynomial at an element expresses its
nonzero value as a product of a base coefficient and linear
factors. Coordinate additivity expands its symbol, and the
Steinberg identities reduce the extension entries to the
mixed symbols with a single final extension unit.
'''
COL-0227 = '''
In the root field of a monic irreducible polynomial of degree
\(d\), every unit in a finite symbol expression has a reduced
polynomial representative of degree below \(d\). Collecting
these finitely many representatives before changing the
coefficient field gives one family that can be evaluated at
the root of every subsequent scalar factor.
'''
COL-0228 = '''
When \(d=p\) is prime and the base is perfect, the finite
family of representatives can be split over the prime-to-\(p\)
field of COL-0225. Coprime-degree irreducibility keeps the
original polynomial irreducible there, so the mixed-symbol
expansion lands in the root field of the whole coefficient image.
'''
COL-0263 = '''
A finite expression in symbols over an algebraic extension
uses finitely many units. They generate a finite intermediate
field, and a single enlargement accommodates finitely many
classes and any prescribed finite coefficient field.
'''
COL-0264 = '''
Equality requires the defining relations as well as the
representatives. A relation witness involves only finitely
many coefficients, so a finite enlargement can realize
vanishing and equality already at that stage.
'''

[[sections]]
id = "milnor-residues-and-specialization"
title = "Tame residue and specialization"
order = 20
introduction = '''The shift map of a discrete valuation gives tame residue, which lowers degree, and specialization at a chosen uniformizer, which preserves degree. The residue of a product with a ring-unit symbol uses the reduction of that symbol and acquires the sign \((-1)^m\) when the degree-\(m\) symbol is on the right. Under a compatible local map, the ramification index scales residue and a change of uniformizer gives a unit correction to specialization. Completion identifies the original and completed residues through the induced residue-field isomorphism.'''

[[sections.topics]]
id = "milnor-tame-residues"
title = "Tame residues and symbol calculations"
start = "COL-0122"

[[sections.topics]]
id = "uniformizer-specialization"
title = "Specialization and unramified maps"
start = "COL-0132"

[[sections.topics]]
id = "ramification-and-completion"
title = "Ramification and completion"
start = "COL-0140"

[sections.transitions]
COL-0122 = '''
For a DVR with uniformizer \(\pi\), the tame convention puts
\(\pi\) in the last slot, with the preceding ring units
reduced to the residue field. A principal unit reduces to
\(1\). Vanishing in the shift ring permits this reduction in
any slot, including when the other entries are fractions.
'''
COL-0125 = '''
For repeated uniformizers, the degree-two identity replacing
a repeated entry by the sign unit reduces the calculation to
one uniformizer and copies of \(-1\). This accounts for the
minus-one tuple in the residue.
'''
COL-0127 = '''
Multiplication by a ring-unit tuple in the left factor
retains that tuple as a reduced coefficient of the residue.
This permits a calculation with an arbitrary homogeneous
class in the other factor.
'''
COL-0129 = '''
Moving a degree-\(m\) unit class from the right to the left
uses graded commutativity. After taking residue, the other
degree has decreased by one. The difference between the two
parities is \(m\), giving the right-action factor \((-1)^m\).
'''
COL-0109 = '''
A field map into the valuation ring gives ring units from
field units. The ring-unit calculation extends from tuples
to every base-field class by homogeneous symbol generation.
'''
COL-0139 = '''
In degree one, the fraction-field unit represents its class
in \(K_1\) and the target is \(K_0=\mathbb Z\). The residue
therefore measures the exponent of the uniformizer, with
the actual ring units giving order zero.
'''
COL-0133 = '''
Lift the entries of a residue-field symbol to ring units
and append a uniformizer. The last-slot formula returns
the given symbol. These lifts give surjectivity on the
groups generated by the symbols, with the uniformizer
itself covering degree zero.
'''
COL-0132 = '''
Write a nonzero fraction-field entry as \(\pi^r u\), with
\(u\) a ring unit. The main component of the shift map
reduces these unit parts and preserves the tuple degree.
Its value on a uniformizer entry is zero.
'''
COL-0116 = '''
The main component comes from the multiplicative shift
construction. Passing to homogeneous components therefore
identifies specialization of a product with the product
of the two specializations.
'''
COL-0135 = '''
For a coefficient field in the valuation ring, each nonzero
coefficient has order zero. Its specialization is literal
residue-field transport. A retraction of the residue-field
embedding then splits Milnor transport into the fraction field.
'''
COL-0130 = '''
A uniformizer-preserving map carries \(\pi^r u\) to the
corresponding power of the target uniformizer times the
image unit. Taking unit parts therefore commutes with
reduction along the local map.
'''
COL-0131 = '''
The same uniformizer equation has exponent one and trivial
unit correction. Thus on the residue component the map
gives the unramified naturality square.
'''
COL-0140 = '''
For an actual equation \(j(\pi)=u\rho^e\), a unit contributes
order zero and the uniformizer contributes \(e\) times the
target order. This gives the factor \(e\) in the degree-one
residue square.
'''
COL-0143 = '''
In all degrees, one can apply the shift-ring comparison
to the entries in an ordered tuple and extend by their
generation property. The power \(\rho^e\) contributes the
same factor \(e\) to residue, while \(u\) enters the main
component.
'''
COL-0150 = '''
The specified residue identifies with the canonical residue
on each side. Transporting the degreewise formula through
these identifications gives the ramification square for the
canonical maps.
'''
COL-0151 = '''
The main component retains the unit correction from
\(j(\pi)=u\rho^e\). It is a right product of the transported
residue with the symbol of \(\bar u\). On a class of residue
zero this term vanishes, giving independence of the uniformizer
for specialization on the residue kernel.
'''
COL-0168 = '''
Completion carries the original uniformizer to a uniformizer
and identifies the residue fields. Applying unramified
naturality to the actual fraction-field lift gives the
completed residue comparison in both directions on the
residue group.
'''

[[sections]]
id = "milnor-norms-and-rational-residues"
title = "Norms and rational residues"
order = 30
introduction = '''For a finite torsion-free local map of DVRs with a prime-degree Galois extension of fraction fields, the generic degree annihilates the norm–residue difference. In residue characteristic zero a coprime annihilator forces equality. Over \(k(X)\), the polynomial degree filtration bounds lifts of finite residue data, and the negative sum of their simple norms gives the residue at infinity. The simple norm also computes the chosen norm in each monic irreducible presentation of a finite separable extension, and these presentations give its tower law.'''

[[sections.topics]]
id = "milnor-norm-residue"
title = "Norm and residue for prime Galois extensions"
start = "COL-0261"

[[sections.topics]]
id = "rational-residues"
title = "Polynomial degree bounds and rational residues"
start = "COL-0344"

[[sections.topics]]
id = "finite-separable-milnor-norms"
title = "Finite separable norm presentations and towers"
start = "COL-0396"

[[sections.topics]]
id = "inseparable-milnor-norms"
title = "Inseparable norms and finite towers"
start = "COL-1022"

[sections.transitions]
COL-0261 = '''
Write \(\delta(x)\) for the residue of the chosen generic norm of \(x\) minus the residue-field norm of its residue. Let \(\ell\) be the generic degree of the prime Galois extension. Restricting the generic norm back to the upper fraction field gives a sum of conjugates. The ramified residue formula of COL-0150 and the residue-field trace show that the ramification index annihilates the restricted error. Applying the residue-field norm multiplies by the residue degree. The product of these two degrees is \(\ell\), so \(\ell\,\delta(x)=0\).
'''
COL-0289 = '''
In residue characteristic zero, use the completed
normalization branches and the classwise mixed-symbol
expansion to obtain an auxiliary annihilator of
\(\delta(x)\) prime to \(\ell\). Bézout with the
prime annihilation of COL-0261 gives \(\delta(x)=0\).
'''
COL-0344 = '''
Over \(k(t)\), the polynomial filtration records the
degrees of the irreducible factors used in symbols.
Residues at the points of degree \(d\) detect the new
classes at that stage and allow a lift supported at one
such point.
'''
COL-0345 = '''
Assembling the finite residue vectors gives the quotient
by the constant image. The constant retraction prescribes
the remaining component, so a bound on the degrees of
the residue support gives a bounded lift with specified
constant value.
'''
COL-0346 = '''
The infinity residue is the negative sum of the simple
norms of the finite residues. Thus an infinity coordinate
is compatible with the finite data exactly when it cancels
that sum. Prescribing the constant component fixes the
lift within the given degree bound.
'''
COL-0396 = '''
The simple norm in the preceding infinity formula is negative
infinity residue on a single-residue lift. For a finite separable
extension, the original recursive norm equals this simple norm
in every actual polynomial presentation. The canonical relative
factor then relates the presentations in a tower and identifies
the composite with the norm of the total extension.
'''
COL-1021 = '''
Changing the coefficient field by an isomorphism carries
each polynomial residue and the residue at infinity to
their counterparts. This permits the finite separable
norms to be compared in a common universe and transported
back to the original Milnor groups.
'''
COL-1022 = '''
A purely inseparable change of the coefficient field can make
the compositum separable. The image of a selected minimal
polynomial is then a power of one irreducible factor, with
exponent the original inseparable degree. Applying the weighted
norm formula at each selected step compares the two tower
expressions after restriction.
'''
COL-1024 = '''
The purely inseparable trace in COL-1022 bounds the local
norm–residue error by the prime fraction-field degree. A
mixed-symbol expansion after an extension of coprime degree
gives a second annihilator over the complete DVR. Together
the two annihilators give the integral local square.
'''
COL-1027 = '''
The original finite-place and infinity formulas give the purely
inseparable prime diamond. Induct on purely inseparable towers and
compare the separable and purely inseparable parts in their actual
compositum. The simple Frobenius calculation then connects this
factorization to the original recursion in every finite tower.
'''

[[sections]]
id = "milnor-norms-on-curves"
title = "Norms and residues on curves"
order = 40
introduction = '''Rational reciprocity in COL-0346 and the finite separable tower law in COL-0396 prepare the curve calculations. The complete DVR square passes to all original branches, and finite support assembles the local formulas into a Dedekind square. Over the polynomial base, inversion supplies the infinity term. The constant-image result and linear specialization then give the full weighted endpoint sums.'''

[[sections.topics]]
id = "dvr-branch-pushforward"
title = "DVR norms and finite-support pushforward"
start = "COL-1001"

[[sections.topics]]
id = "curve-reciprocity-and-endpoints"
title = "Curve reciprocity and affine endpoint norms"
start = "COL-1004"

[sections.transitions]
COL-1001 = '''
A polynomial presentation of the extension induces an isomorphism of integral closures. Over a complete DVR of residue characteristic zero, norm naturality from COL-0396 carries the square for the quotient field and its integral closure to the specified field and closure.
'''
COL-1002 = '''
The completed fraction tensor product separates the original branches of a finite torsion-free Dedekind model. The complete square for finite extensions applies in each coordinate. The residue-field maps of completion identify those terms with norms of residues at the original localizations.
'''
COL-1003 = '''
At a height-one prime of the base, the all-branch sum runs over the points that contract to that prime. Since a Milnor class has finitely many nonzero residues, these local identities assemble into a square of total residues and pushforward.
'''
COL-1004 = '''
For \(k[X]\to S\) with \(k\) of characteristic zero, the finite residue pushforward and the residue-field norm towers identify the affine sum with the finite part of rational reciprocity. Inverting \(X\) brings the infinity term into the same local norm–residue formula.
'''
COL-1005 = '''
Before taking norms to \(k\) and summing, the affine pushforward retains the residue at each polynomial prime. If the affine residue vector on \(S\) vanishes, every finite residue of the field norm vanishes. Bass–Tate exactness then puts that norm in the constant image.
'''
COL-1006 = '''
A global-unit symbol has constant norm in positive degree by the affine residue calculation and in degree zero by surjectivity of constant restriction. At \(X=c\), appending \(X-c\) in the last slot relates that constant norm to the sum over the original branches above \(c\).
'''

[[sections]]
id = "milnor-degree-two"
title = "Degree-two applications"
order = 50
introduction = '''In degree two, ordered symbols map to the central kernel of the stable Steinberg-to-elementary map, compatibly with field change. Over a finite field \(k\), the symbol relations give \(K_2^M(k)=0\). Surjectivity of the Milnor comparison then gives the Quillen \(K_2\) calculation in COL-0280.'''

[sections.transitions]
COL-0255 = '''
The tensor-square presentation in COL-0007 describes degree two. The descent principle in COL-0042 constructs the kernel map from a bilinear rule on ordered pairs of units that vanishes on Steinberg pairs. It sends \(\{a,b\}\) to the stable word \(h(a)h(b)h(ab)^{-1}\) with the positive rank-three commutator normalization. Field change carries that word to the one for the transported units.
'''
COL-0279 = '''
Over a finite field it suffices to compute the degree-two
symbols, since they generate the integral homogeneous group.
The finite-field calculation gives zero for each such symbol.
'''
