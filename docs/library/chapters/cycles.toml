[chapter]
id = "cycles"
title = "Cycles and Correspondences"
order = 50
introduction = '''
A finite correspondence is a signed cycle on a product whose integral supports
are finite and surjective over components of the source. Composition and graph
cycles turn these groups into the category used by COL-0368. Exterior extension
then describes what happens to a correspondence and its graphs when a parameter
is added or changed. See [@MVW2006, Lecture 1].
'''

[[sections]]
id = "finite-correspondences"
title = "Finite correspondences and the graph functor"
order = 10
introduction = '''
Start with the support condition on a fiber product. Over a field, compose two
such cycles by intersecting along the middle factor and pushing forward to the
outer product. Full diagonal cycles give the identities on the smooth objects
of COL-0340, and graphs send their scheme morphisms to correspondences.
'''

[[sections.topics]]
id = "cycles-and-composition"
title = "Admissible cycles and composition"
start = "COL-0374"

[[sections.topics]]
id = "category-and-graphs"
title = "The category and graph functor"
start = "COL-0366"

[sections.transitions]
COL-0374 = '''
For \(X\) and \(Y\) over a common base, admissibility is a condition on each
integral support in \(X\times Y\) over that base. Finite support gives an
integer linear combination of admissible primes.
'''
COL-0363 = '''
For two prime correspondences over a field, the incidence Tor cycle supplies
the multiplicities before finite pushforward. Extend the calculation to signed
cycles by additivity in both factors.
'''
COL-0364 = '''
The two triple compositions push forward the same combined-diagonal Tor cycle.
Equality on primes extends to arbitrary signed cycles.
'''
COL-0365 = '''
Sum the diagonals of the source components. When a prime is composed with that
sum, its own component contributes the prime and the other incidences are empty.
'''
COL-0366 = '''
The smooth separated finite-type objects of COL-0340 have finitely many generic
points. Use the associative pairing and the full diagonal sums to obtain the
preadditive category.
'''
COL-0367 = '''
For a morphism of smooth schemes, take the graph on each irreducible source
component and sum with coefficient one. The identity gives the diagonal sum
already used by COL-0366. The Tor composition calculation for two such graphs
gives the graph of their composite.
'''

COL-1088 = '''
Reverse the original graph of a finite flat morphism using the whole fundamental
cycle. Its full finite pushforward gives the actual transfer degree. Retain
this entire degree, including its inseparable factor.
'''
COL-1091 = '''
For a universally injective map, finite pushforward is injective because every
residue-degree weight is nonzero. The graph is therefore mono. Cancel it in
the already proved graph-transpose identity to obtain the opposite actual
Tor-composition identity without replacing the self-fiber product by its reduction.
'''

[[sections]]
id = "exterior-parameters"
title = "Exterior extension and graph interchange"
order = 20
introduction = '''
Extend a correspondence along a geometrically integral smooth parameter by
using the same parameter on its source and target. The comparison with full
graph cycles handles a fixed parameter. The incidence calculation handles a
morphism between parameters, as needed for the simplex operators in COL-0397.
'''

[[sections.topics]]
id = "exterior-extension"
title = "Exterior extension and full graphs"
start = "COL-0386"

[[sections.topics]]
id = "parameter-change"
title = "Changing the parameter"
start = "COL-0387"

[sections.transitions]
COL-0386 = '''
The product of an admissible prime support with the parameter is integral.
Its diagonal parameter support supplies the exterior prime, with the same
integer coefficient.
'''
COL-0388 = '''
The source components of a product with the parameter are indexed by the
original source components. Match each exterior graph prime to its product
graph prime, then sum. This also identifies the full diagonal.
'''
COL-0387 = '''
For a morphism of parameters, a graph component can contribute only when its
source image contains the exterior support's source image. The graph projection
on that component is an open immersion and gives the unique lift in the
matching incidence scheme.
'''
COL-0389 = '''
Select the matching component by the support image. The regular equations on
its incidence scheme give Tor coefficient one. Both composites then push
forward the same cycle with the same residue-field degrees.
'''

[[sections]]
id = "relative-principal-cuts"
title = "Relative principal cuts"
order = 30
introduction = '''
A principal equation on an integral support defines a zero scheme with its
original multiplicities. Finiteness over the source gives the support for a
finite correspondence. Pulling the cut across a closed polynomial face
requires comparing the weighted cycles on the two zero schemes.
'''

[sections.transitions]
COL-1040 = '''
The Laurent coordinate on a torus support is a unit. A power of this
coordinate can dominate the positive and negative Laurent exponents in
integral equations for another unit on the same support.
'''
COL-1041 = '''
A cut whose components have generic image can be restricted along a
Cartesian closed face of the source. The local comparison uses the Euler
lengths of the two principal equations in the original support stalk.
'''
COL-1043 = '''
Use the closed-face comparison on both endpoints of a polynomial
family of principal cuts. A common power bound makes the construction
finite on the original signed correspondence.
'''
[[sections]]
id = "cartier-correspondences"
title = "Cartier divisor correspondences"
order = 55
introduction = '''
The original Cartier stalk quotients determine the fundamental cycles of
whole closed zero schemes, including their nilpotent multiplicities. Under
finite flatness over the source, their unchanged source-target maps give
native finite correspondences. Cycle transport retains every residue degree
and adds coefficients of coincident images; the ambient map need not be finite.


These are cycle and correspondence identities before applying a coefficient presheaf. COL-1211 and COL-1105 in Presheaves and Sheaves with Transfers supply their homotopy-invariant action-theoretic consequences, as in [@MVW2006, Lecture 7, Lemma 7.5 and Corollary 7.17].
'''

[sections.transitions]
COL-1072 = '''
The literal signed Cartier identity of COL-1066 restricts through the
original open immersion with every quotient length unchanged. Its native
correspondence image retains the same normalized correction function.
'''
COL-1079 = '''
The geometric section producer now supplies the pair and every whole
finite-flat zero scheme internally. The two original section kernels give
the original graph correspondences, leaving only the compatible root/frame
and the separate polynomial endpoint comparison to be supplied.
'''

[[sections]]
id = "principal-polynomial-families"
title = "Principal polynomial families"
order = 60
introduction = '''
The literal polynomial \(t f+(1-t)\) preserves normalization on the full
boundary. Its actual unit open excludes nonzero principal-cycle supports
from that boundary. Properness and quasi-affineness then prove finiteness
of those supports. Smooth relative dimension one supplies source-component
dominance, giving an actual signed finite correspondence with its residue
degrees. Endpoint Tor comparisons remain necessary for a correspondence
homotopy.
'''

[[sections.topics]]
id = "principal-families-and-local-cuts"
title = "Principal families and local cuts"
start = "COL-1214"

[[sections.topics]]
id = "finite-images-and-residue-degrees"
title = "Finite images and residue degrees"
start = "COL-1062"

[[sections.topics]]
id = "signed-support-identities"
title = "Signed support identities"
start = "COL-1077"

[[sections.topics]]
id = "whole-endpoint-fibers"
title = "Whole endpoint fibres and fundamental cycles"
start = "COL-1081"

[[sections.topics]]
id = "global-zero-one-endpoints"
title = "Global zero and one endpoints"
start = "COL-1092"

[sections.transitions]
COL-1216 = '''
Carry forward the actual finite supports of COL-1214. Smooth relative
dimension one forces their images to be source components. The original
source-target maps therefore give finite-correspondence points, and their
native finite pushforwards retain every order and residue-degree factor.
'''
COL-1218 = '''
The polynomial correspondence has literal numerator and denominator
functions. Cut them by the actual endpoint stalk map. The signed difference
of their full quotient lengths recovers zero and the original order at the
two endpoints; comparison with graph-incidence Tor coefficients remains separate.
'''
COL-1220 = '''
The endpoint section is Cartier, so its actual stalk kernel has a regular
generator. The nonzero specialized equation then makes the weighted native
endpoint stalk Tor sum equal to the full cut length of COL-1218. Identifying
these local modules and weights with the original graph incidence and its
finite pushforwards is the remaining coefficient comparison.
'''
COL-1049 = '''
Return to the original graph composite rather than substituting its reduced
fibre. The full graph pullback is the actual outer ambient, and flat change
of rings removes the redundant projection from its Tor modules. Unchanged
residue fields preserve their entire lengths in every degree. Original
orders and finite-image residue-degree sums still have to be transported.
'''
COL-1053 = '''
Keep the original rational function rather than choosing a new principal
cycle. Its actual stalk fraction gives the numerator and denominator whose
localized full quotient lengths recover every codimension-one order visible
from that stalk. The polynomial chart and endpoint specializations still
need to be identified with this fraction.
'''
COL-1056 = '''
Choose a genuine affine fraction of the original curve function. The actual
polynomial chart transports that same function to its literal numerator
and denominator, so their nonzero endpoint germs are proved rather than
supplied. The signed local Tor values now recover zero and the original
order; finite-image residue-degree transport remains separate.
'''
COL-1062 = '''
Transport full principal cuts through a finite image without assuming
flatness of its support. The native norm formula retains both the generic
residue degree and every fibre-point degree, summing all coincident images.
Identifying these maps with the actual principal family remains necessary.
'''
COL-1065 = '''
Use the actual principal-component map and its native integral image.
Quasi-finite fibres supply coheight one; the original pointwise and generic
degrees therefore give the coefficient formula without a fibre-codimension
certificate. The signed principal coefficient is unchanged throughout.
'''
COL-1068 = '''
Use the literal parameter equation of the original endpoint rather than a
supplied nonzero section. The actual graph Cartesian square identifies its
full kernel, and original support dominance proves its image is nonzero.
'''
COL-1070 = '''
The same full parameter ideal computes the actual native incidence Tor
coefficient. Surjective transported stalk maps preserve degree-zero full
lengths; regularity and the original finite Tor bound evaluate the Euler
sum without flatness of the integral support.
'''
COL-1071 = '''
The original endpoint Cartier geometry also produces coheight one at every
incidence generic point. The unchanged signed principal coefficient and
both original residue-degree factors now give the actual image-incidence
coefficient formula, without a separate coheight or nonvanishing premise.
'''
COL-1074 = '''
Expand the actual outer finite incidence pushforward and then sum every
original principal component. This retains all source and image collisions
in the whole endpoint-graph pairing. The remaining comparison is with the
original local-prime/order weights and whole endpoint cycles.
'''
COL-1077 = '''
At each original local prime, native Euler lengths recover the signed
principal order and the full endpoint cut. Keep both numerator and
denominator so the sign and every canceled term remain explicit.
'''
COL-1078 = '''
The original polynomial chart supplies the required regularity and finite
cut lengths. Its zero endpoint has signed weight zero, and its one endpoint
has the order of the original rational function on the curve.
'''
COL-1080 = '''
The actual stalk-spectrum map identifies the surviving local-prime terms
with the original principal-cycle supports. This removes the local indexing
mismatch while leaving the incidence and source-fiber reindexing explicit.
'''
COL-1081 = '''
Going down over the normal base puts every generic point of the actual
full endpoint fiber over the original base generic point. This yields
its placement in the finite incidence target without assuming component
flatness or replacing the fiber by its reduction.
'''
COL-1083 = '''
Use this generic-point placement in the actual endpoint pullback square.
The original source fibers now give an explicit bijection, and the native
residue-degree tower preserves both factors and every outer image test.
The original local lengths still have to be inserted into this sum.
'''
COL-1084 = '''
The original polynomial cylinder now supplies the coordinates, normal
base ring and actual endpoint pullback squares needed in COL-1083.
Its canonical fiber map retains the original support map and both
residue-degree factors without extra comparison certificates.
'''
COL-1086 = '''
At the literal endpoint, the actual Tor Euler coefficient equals the full
incidence stalk length. The native incidence cycle therefore is the whole
fundamental cycle, and its original graph-fiber isomorphism lets native
finite pushforward carry all multiplicities and collisions at once.
'''
COL-1089 = '''
Insert the original full source-fiber lengths and both residue degrees into
COL-1086. Native finite pushforward now identifies the whole endpoint graph
pairing with the signed sum of original source endpoint fundamental cycles.
'''
COL-1092 = '''
On the actual affine curve chart, the original principal supports give zero
at the zero endpoint and the original curve order at one. The fraction and
polynomial identity are constructed, while coheight one is still explicit.
'''
COL-1090 = '''
The actual finite dominant endpoint support lies over a generic base point.
The generic-fiber stalk comparison and smooth relative dimension produce
coheight one in the original retained curve and its actual chart.
'''
COL-1096 = '''
Transport the entire signed support-cut sum through the actual open chart.
Original ambient supports, full quotient lengths and the literal endpoint
equation remain unchanged, giving the global ambient zero and one values.
'''
COL-1097 = '''
The actual whole source-support endpoint is closed in the original curve.
Its full fundamental-cycle coefficient is the original support-cut length,
including off-image points. Finite signed summation identifies every original
curve coefficient; an internally chosen affine chart evaluates coheight-one
points at zero and one.
'''
COL-1100 = '''
Full boundary normalization places every contributing original support endpoint
in curve codimension one. The source-cycle identities now hold globally.
Canonical pullback and outer-map comparisons carry them to the original
finite correspondence: zero at zero, and the original principal pushforward
at one, without taking a rational-equivalence quotient.
'''
