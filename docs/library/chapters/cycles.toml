[chapter]
id = "cycles"
title = "Cycles and Correspondences"
order = 20
introduction = "Cycle constructions depend on precise local multiplicities and pushforward degrees. The first section establishes the affine length-degree calculation that will supply finite-flat correspondence coefficients. Geometric correspondence and composition constructions have their subsequent source owners."

[[sections]]
id = "finite-algebra-coefficients"
title = "Finite-algebra coefficients"
order = 10
introduction = 'For a finite algebra over a field, its dimension is the sum of the lengths of its prime localizations weighted by residue-field degrees. The local restriction-of-scalars formula precedes the local-algebra specialization and the global finite sum. The general local-base finite-algebra chain then identifies the closed fibre and proves [@stacks, Tag 02M0] for finite algebras using native localized modules and residue degrees, without Noetherianity. The determinant comparison then gives finite-algebra norm products with local lengths and equality of unit norms in polynomial evaluation fibres. Closed-fibre norm base change then gives residue norms for finite free local algebras and integral DVR norms with a proved uniformizer exponent. Henselian normalization and Eisenstein binomials then determine the exact unit coefficient and determinant sign of uniformizer norms in residue degree one and prime field degree. The ordinary field norm also scales native integer DVR orders by the actual residue degree for all nonzero field elements, without perfectness, henselianity or an invertible ramification exponent.'
