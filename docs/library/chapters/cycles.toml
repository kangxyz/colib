[chapter]
id = "cycles"
title = "Cycles and Correspondences"
order = 20
introduction = "Cycle constructions depend on precise local multiplicities and pushforward degrees. The first section establishes the affine length-degree calculation that will supply finite-flat correspondence coefficients. Geometric correspondence and composition constructions have their subsequent source owners."

[[sections]]
id = "finite-algebra-coefficients"
title = "Finite-algebra coefficients"
order = 10
introduction = 'Local lengths and residue-field degrees give the multiplicities of finite algebras. The same localized lengths weight the factors in the determinant norm. For DVR extensions the closed fibre determines the norm on residues, and uniformizer calculations retain the unit coefficient and sign.'

[[sections.topics]]
id = "lengths-and-residue-degrees"
title = "Lengths and residue degrees"
