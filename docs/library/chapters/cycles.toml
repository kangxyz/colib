[chapter]
id = "cycles"
title = "Cycles and Correspondences"
order = 50
introduction = '''
A finite correspondence is a signed cycle on a product whose integral supports
are finite and surjective over components of the source. Composition and graph
cycles turn these groups into the category used by COL-0368. Exterior extension
then describes what happens to a correspondence and its graphs when a parameter
is added or changed. See [@MVW2006, Lecture 1].
'''

[[sections]]
id = "finite-correspondences"
title = "Finite correspondences and the graph functor"
order = 10
introduction = '''
Start with the support condition on a fiber product. Over a field, compose two
such cycles by intersecting along the middle factor and pushing forward to the
outer product. Full diagonal cycles give the identities on the smooth objects
of COL-0340, and graphs send their scheme morphisms to correspondences.
'''

[[sections.topics]]
id = "cycles-and-composition"
title = "Admissible cycles and composition"
start = "COL-0374"

[[sections.topics]]
id = "category-and-graphs"
title = "The category and graph functor"
start = "COL-0366"

[sections.transitions]
COL-0374 = '''
For \(X\) and \(Y\) over a common base, admissibility is a condition on each
integral support in \(X\times Y\) over that base. Finite support gives an
integer linear combination of admissible primes.
'''
COL-0363 = '''
For two prime correspondences over a field, the incidence Tor cycle supplies
the multiplicities before finite pushforward. Extend the calculation to signed
cycles by additivity in both factors.
'''
COL-0364 = '''
The two triple compositions push forward the same combined-diagonal Tor cycle.
Equality on primes extends to arbitrary signed cycles.
'''
COL-0365 = '''
Sum the diagonals of the source components. When a prime is composed with that
sum, its own component contributes the prime and the other incidences are empty.
'''
COL-0366 = '''
The smooth separated finite-type objects of COL-0340 have finitely many generic
points. Use the associative pairing and the full diagonal sums to obtain the
preadditive category.
'''
COL-0367 = '''
The graph of a morphism is summed over the irreducible source components, each
with coefficient one. The composition calculation for these graphs gives
functoriality.
'''

[[sections]]
id = "exterior-parameters"
title = "Exterior extension and graph interchange"
order = 20
introduction = '''
Extend a correspondence along a geometrically integral smooth parameter by
using the same parameter on its source and target. The comparison with full
graph cycles handles a fixed parameter. The incidence calculation handles a
morphism between parameters, as needed for the simplex operators in COL-0397.
'''

[[sections.topics]]
id = "exterior-extension"
title = "Exterior extension and full graphs"
start = "COL-0386"

[[sections.topics]]
id = "parameter-change"
title = "Changing the parameter"
start = "COL-0387"

[sections.transitions]
COL-0386 = '''
The product of an admissible prime support with the parameter is integral.
Its diagonal parameter support supplies the exterior prime, with the same
integer coefficient.
'''
COL-0388 = '''
The source components of a product with the parameter are indexed by the
original source components. Match each exterior graph prime to its product
graph prime, then sum. This also identifies the full diagonal.
'''
COL-0387 = '''
For a morphism of parameters, a graph component can contribute only when its
source image contains the exterior support's source image. The graph projection
on that component is an open immersion and gives the unique lift in the
matching incidence scheme.
'''
COL-0389 = '''
Select the matching component by the support image. The regular equations on
its incidence scheme give Tor coefficient one. Both composites then push
forward the same cycle with the same residue-field degrees.
'''
