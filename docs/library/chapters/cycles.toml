[chapter]
id = "cycles"
title = "Cycles and Correspondences"
order = 50
introduction = 'Finite integer cycles on products form correspondence groups. Tor multiplicities define composition, and componentwise graph cycles connect the resulting category to smooth schemes. The route from correspondences to transfer presheaves follows [@MVW2006, Lectures 1 and 2], followed here by Nisnevich sheafification. The smooth schemes and ordinary Nisnevich topology are in COL-0340; the local length formula for finite-pushforward multiplicities is COL-0181. The reduced torus input in COL-0384 and COL-0385 now begins Motivic Cohomology; its transfer singular chains and canonical complex are COL-0397 and COL-0398.'

[[sections]]
id = "finite-correspondences"
title = "Finite correspondences and the graph functor"
order = 10
introduction = 'Finite integer cycles on products define correspondence groups. Incidence Tor multiplicities give their composition, and componentwise diagonal and graph cycles connect them to smooth schemes over a field.'

[[sections.topics]]
id = "cycles-and-composition"
title = "Cycles and composition"
start = "COL-0374"

[[sections.topics]]
id = "category-and-graphs"
title = "The category and graph functor"
start = "COL-0366"

[sections.transitions]
COL-0374 = '''
For schemes over a common base, the support condition selects the integral
components that can carry a finite correspondence. Finite support makes a cycle
an integer linear combination of these components, including when its source
is not quasi-compact.
'''
COL-0363 = '''
Now let the base be a field and the factors be smooth, with the middle and target
separated. For admissible points in two successive products, the incidence Tor
construction gives a correspondence between the outer factors. The finite-sum
presentation in COL-0374 extends this value to signed cycles in both arguments.
'''
COL-0364 = '''
For three prime correspondences, the two compositions are finite pushforwards of
the same combined-diagonal triple Tor cycle. Their equality on these generators,
followed by additive extensionality in all three arguments, gives associativity
for the signed cycles of COL-0363.
'''
COL-0365 = '''
An identity must include every source component. Its graph is the sum of the
diagonal prime cycles, so the generic-point set must be finite. In composing a
prime correspondence with that sum, exactly one component contributes the
original prime and the other incidences are empty; biadditivity gives the unit
law for an arbitrary signed cycle.
'''
COL-0366 = '''
The smooth separated finite-type objects of COL-0340 have the finite generic-point
sets needed in COL-0365. On these objects, COL-0364 and COL-0365 supply the category laws,
while the two additive structures in COL-0363 supply preadditivity.
'''
COL-0367 = '''
For a morphism of smooth schemes, take the graph on each irreducible source
component and sum with coefficient one. The identity gives the diagonal sum
already used by COL-0366. The Tor composition calculation for two such graphs
gives the graph of their composite.
'''

[[sections]]
id = "transfers-nisnevich"
title = "Transfers and Nisnevich sheafification"
order = 20
introduction = 'Additive presheaves on the correspondence category have contravariant transfers, as in [@MVW2006, Lecture 2, Definition 2.1]. Graph restriction relates their Nisnevich descent to the ordinary smooth site of COL-0340. Local signed Čech exactness supplies the comparison needed for transfer-preserving sheafification. For the classical sheafification statement and its universal property, see [@MVW2006, Lecture 13, Theorem 13.1].'

[[sections.topics]]
id = "transfer-presheaves-and-sheaves"
title = "Transfer presheaves and sheaves"
start = "COL-0368"

[[sections.topics]]
id = "local-exactness-and-descent"
title = "Local exactness and descent"
start = "COL-0370"

[[sections.topics]]
id = "sheafification-and-comparison"
title = "Sheafification and comparison"
start = "COL-0372"

[sections.transitions]
COL-0368 = '''
An additive functor on the opposite of the category in COL-0366 turns each
signed correspondence into a homomorphism in the reverse direction. Its
functoriality and additivity give the transfer composition and integer-linearity
identities without changing the underlying cycles.
'''
COL-0369 = '''
Restriction along the graph functor of COL-0367 recovers an ordinary presheaf
on smooth schemes. The ordinary Nisnevich topology is the one in COL-0340. Its
sheaf condition is imposed on that restriction; morphisms still commute with
every correspondence, not only graph arrows.
'''
COL-0370 = '''
To compare descent on the two sites, consider a relation killed by composition
with the graph of a completely decomposed étale map. Lift its common finite
image over a pointed Nisnevich neighborhood. The resulting contraction writes
the restricted signed relation as the first Čech projection minus the second,
with the original multiplicities.
'''
COL-0371 = '''
The local boundary in COL-0370 turns compatibility for the two Čech projections
into compatibility for correspondence arrows. Additivity also handles finite
disjoint unions and the empty scheme. These facts compare sheafness for the
correspondence topology with the graph-restricted condition of COL-0369.
'''
COL-0372 = '''
Sheafify on the correspondence site. Preservation of addition in source arrows
gives transfers on the result, and COL-0371 gives ordinary Nisnevich descent.
With coefficients in universe \(u+1\) for a field in universe \(u\), the
canonical unit and its unique extension property give the stated adjunction.
'''
COL-0373 = '''
Restrict the unit of COL-0372 along the graph functor. It is locally bijective
and its target is an ordinary Nisnevich sheaf. Ordinary sheafification therefore
extends it to an isomorphism, with the direction and unit identity fixed by
that extension.
'''
COL-1028 = '''
On a homotopy-invariant presheaf, the marked representative comparison
tests the same sheafification on the entire affine cylinder. The
zero-section restriction identifies its sections with those on the base.
'''

[[sections]]
id = "transfer-homological-algebra"
title = "Homological algebra of transfers"
order = 30
introduction = 'The sectionwise quotient description first concerns additive presheaves. Passing through the Nisnevich reflection gives an abelian category with enough injectives. Sheafified signed representables then provide the first variable of transfer Ext; comparison with ordinary cohomology is a separate question.'

[sections.transitions]
COL-0390 = '''
For a morphism of the additive presheaves in COL-0368, evaluation preserves its
cokernel. The resulting group quotient keeps the transfer action because the
cokernel projection is natural for every signed correspondence.
'''
COL-0381 = '''
Cokernels in the sheaf category require the reflection of COL-0372. Its
finite-limit preservation gives an abelian category; exact filtered colimits
and a separator descend through the same adjunction, giving enough injectives.
'''
COL-0391 = '''
For a smooth scheme, lift its signed correspondence representable to the
coefficient universe and apply the reflector. The adjunction reduces maps out
of this sheaf to additive Yoneda, with evaluation at the full identity cycle.
'''
COL-0392 = '''
Use the sheafified representable of COL-0391 as the first Ext variable.
Covariance of that representable and contravariance of Ext give restriction
along each signed correspondence. This defines transfer Ext without identifying
it with the cohomology of an underlying ordinary sheaf.
'''

[[sections]]
id = "exterior-parameters"
title = "Exterior parameters and graph incidence"
order = 50
introduction = 'A geometrically integral smooth parameter extends a prime correspondence by its diagonal parameter support, retaining the signed coefficients. Reindexing the graph components gives preservation of full graph and identity cycles. Changing the parameter identifies the unique matching graph incidence. Its common regular family computes the local Tor coefficient, and its finite support map gives graph interchange. Compatibility with arbitrary correspondence composition is a separate question.'

[sections.transitions]
COL-0386 = '''
For an integral correspondence support, take its relative product with the
parameter and use the same parameter coordinate on both sides. Geometric
integrality makes this a single integral support; its finite source projection
and component image allow the integer-linear extension of COL-0374.
'''
COL-0388 = '''
Apply the exterior operation of COL-0386 to each component of an actual graph.
The projection \(X\times_kT\to X\) identifies the source components by preimage,
and each exterior graph prime is the corresponding product graph prime with
coefficient one. Reindexing the finite sum gives the full graph equation;
the identity morphism then gives the full diagonal identity.
'''
COL-0387 = '''
COL-0388 keeps the parameter fixed. Now change it by a morphism and choose a
component of its graph whose source image contains the exterior source image.
The graph projection is an
open immersion, so the source map lifts uniquely into it. Together with the
parameter map on the exterior support, this lift identifies the actual incidence
scheme and retains its source-target finite map.
'''
COL-0389 = '''
In COL-0387 the matching source component was an explicit choice. Select it
from the image of the exterior support, and discard the other, empty incidences.
The matching isomorphism identifies the scheme and the finite map. To compare
its cycle, keep one ordered family of middle-diagonal equations through the
actual coefficient chart: the resulting Tor calculation gives coefficient one.
Both graph compositions then push forward the same exterior prime, with the
same residue-field degrees.
'''
