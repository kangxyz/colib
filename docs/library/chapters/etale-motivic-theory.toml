[chapter]
id = "etale-motivic-theory"
title = "Étale Motivic Theory"
order = 57
introduction = '''
Suslin rigidity is the first result organized here: a homotopy-invariant
presheaf with transfers killed by a fixed positive integer invertible in
the base field has the actual étale counit isomorphism of COL-1222.
The finite-correspondence geometry (COL-1088 and COL-1091) and transfer-action
foundations (COL-1211 and COL-1105) remain in their own chapters.
See [@MVW2006, Lecture 7, Theorem 7.20].

The ordinary sites and stalk computations remain in Étale Sites and
Cohomology. Rigidity alone does not assert an étale Tate identification
or the norm-residue theorem.
'''

[[sections]]
id = "etale-rigidity"
title = "Suslin Rigidity"
order = 10
introduction = '''
The conclusion of [@MVW2006, Lecture 7, Theorem 7.20] concerns a homotopy-invariant torsion presheaf with transfers. Apply the ordinary stalk/counit comparisons of COL-1108, the geometric finite-stage and action results, and polynomial-tail induction to prove invertibility of its actual étale counit. COL-1222 is the fixed common-exponent statement, not a derived or motivic comparison.
'''

[sections.transitions]
COL-1111 = '''
Lift the original markings through actual Frobenius base-change equivalences.
The original transfer inverse and initial neighborhood functor identify the
actual neighborhood pullback as an isomorphism. The same counit naturality
square therefore transports invertibility to a closed point with separable
residue, without changing the presheaf or assuming the stalk comparison.
'''
COL-1114 = '''
Affine closed geometric points already detect the actual smooth-site sheaf.
Combine this conservativity with the same Frobenius comparison and native
characteristic-zero residue separability. The global counit question is now
exactly the original structural-neighborhood restriction at closed separable
residues. COL-1222 supplies the geometric induction proving that map invertible.
'''
COL-1222 = '''
The relative-curve geometry and principal correspondence endpoints supply the same-stage transfer action comparison of COL-1105. Polynomial-tail induction turns this into the exact restriction condition of COL-1114. The ordinary counit computation of COL-1108 then yields the fixed-exponent rigidity theorem without a perfectness hypothesis.
'''
