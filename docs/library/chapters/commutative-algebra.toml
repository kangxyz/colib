[chapter]
id = "commutative-algebra"
title = "Commutative Algebra"
order = 15
introduction = "Module lengths, determinant norms, supports and localizations provide the local algebra used in multiplicity, transfer and cohomological constructions."

[[sections]]
id = "finite-algebra-coefficients"
title = "Finite-algebra lengths and norms"
order = 5
introduction = 'Local lengths and residue-field degrees give the multiplicities of finite algebras, as in [@stacks, Tag 02M0]. The same localized lengths weight the factors in the determinant norm; compare [@stacks, Tag 0GSX]. For DVR extensions the closed fibre determines the norm on residues, and uniformizer calculations retain the unit coefficient and sign. The length formula supplies finite-pushforward multiplicities for the correspondence constructions beginning with COL-0374.'

[[sections.topics]]
id = "lengths-and-residue-degrees"
title = "Lengths and residue degrees"
start = "COL-0010"

[[sections.topics]]
id = "determinant-norm-products"
title = "Determinants and norm products"
start = "COL-0182"

[[sections.topics]]
id = "closed-fibre-norms"
title = "Norms on the closed fibre"
start = "COL-0193"

[[sections.topics]]
id = "uniformizer-norms"
title = "Uniformizer coefficients and orders"
start = "COL-0197"

[sections.transitions]
COL-0010 = '''
Let \(R\to S\) be a local homomorphism with finite residue-field degree. Each simple
\(S\)-module is isomorphic to \(\kappa(S)\), whose \(R\)-length is
\([\kappa(S):\kappa(R)]\). Applying restriction of scalars to a composition series
therefore gives the degree that weights each simple factor.
'''
COL-0011 = '''
Take \(R=k\) and let \(S\) be a finite local \(k\)-algebra. Its \(k\)-length is its
dimension, and its length as an \(S\)-module counts the factors isomorphic to its
residue field.
'''
COL-0012 = '''
A finite \(k\)-algebra is Artinian. Its decomposition into the local algebras
\(S_{\mathfrak m}\) at its maximal ideals turns the local formula into a sum, with
the degree of \(\kappa(\mathfrak m)\) belonging to its own summand.
'''
COL-0180 = '''
For a finite algebra \(S\) over a local ring \(R\) with maximal ideal \(\mathfrak m\),
the closed fibre \(S/\mathfrak m S\) is finite over \(\kappa(R)\). Its maximal ideals
and residue fields determine those of \(S\) over \(\mathfrak m\), even when \(R\) is
not Noetherian.
'''
COL-0181 = '''
For a finite-length \(S\)-module \(M\), the simple factors supported at a maximal
ideal \(\mathfrak n\) are counted by the length of \(M_{\mathfrak n}\).
On restriction to \(R\), each such factor contributes
\([\kappa(\mathfrak n):\kappa(R)]\). This is the local-base calculation of
[@stacks, Tag 02M0].
'''
COL-0182 = '''
The length sum counts simple factors additively. To compute a norm, one takes the
determinant of multiplication and multiplies the contributions from the factors.
The field comparison identifies the determinant on finite-length modules with the
ordinary one under the canonical residue map.
'''
COL-0183 = '''
On a simple factor supported at \(\mathfrak n\), multiplication by \(x\) induces
multiplication by its residue \(\bar x\) on \(\kappa(\mathfrak n)\). Its determinant
over the base field is the residue-field norm. Grouping the factors with the same
support gives the exponent \(\operatorname{length}_{S_{\mathfrak n}}M_{\mathfrak n}\).
'''
COL-0184 = '''
For a finite free \(k[T]\)-algebra and a global unit \(u\), the determinant of
multiplication by \(u\) is a unit of \(k[T]\), hence belongs to \(k^\times\).
Determinant base change along each evaluation \(T\mapsto a\) identifies this
constant with the norm in that fibre.
'''
COL-0193 = '''
For a finite free local \(R\)-algebra \(S\), determinant base change along
\(R\to\kappa(R)\) gives the norm in \(S/\mathfrak m_RS\). Since this fibre is local,
the factor product has just the residue-field norm, raised to the length of the fibre.
'''
COL-0194 = '''
In a DVR extension, a relation \(\pi_R=u\pi_S^e\) with \(u\) a unit identifies the
extended maximal ideal with \((\pi_S^e)\). The length of \(S/(\pi_S^e)\) is \(e\),
which supplies the exponent in the residue of the integral norm.
'''
COL-0197 = '''
A monic binomial with constant coefficient a unit times a uniformizer is Eisenstein.
When the degree of the binomial is the field degree, the norm of its root is the
constant coefficient multiplied by the sign for that degree.
'''
COL-0198 = '''
In residue degree one, the local degree formula identifies the field degree with
the uniformizer exponent. Henselian normalization (COL-0195) can replace the extension
uniformizer by a unit multiple under the stated hypotheses. The norm of the
correcting unit is needed to recover the coefficient for the original uniformizer.
'''
COL-0199 = '''
In prime field degree, the equation \([L:K]=ef\) gives the residue-degree-one
case or the exponent-one case (COL-0196). If \(e=1\), the extension uniformizer
differs from the base uniformizer by a unit, and reduction of the unit norm uses the
closed-fibre formula.
'''
COL-0201 = '''
The integer order of the norm depends on the residue degree. The comparison
relates the orders of \(x\) and \(N_{L/K}(x)\) for every \(x\in L^\times\), including
negative orders, using the intrinsic DVR orders of the two fields from COL-0200.
'''

[[sections]]
id = "principal-euler"
title = "Principal Euler length and associativity"
order = 10
introduction = "The native scalar periodic complex fixes the cokernel-minus-kernel convention. Exact-sequence additivity and support finiteness lead to prime-filtration sums and localized multiplicities, followed by intrinsic local associativity including dimension zero."

[sections.transitions]
COL-0170 = '''
Write \(\chi_x(M)=\ell(M/xM)-\ell(0:_M x)\) when both lengths are finite.
For a short exact sequence of modules, the kernel and cokernel sequence for
multiplication by \(x\) gives the alternating length sum. Finiteness at the
two ends also gives finiteness for the middle module.
'''
COL-0171 = '''
Applying additivity along a prime filtration requires finite principal homology
for the successive factors. Over a Noetherian ring, the support condition
passes control from the ambient scalar cokernel to the subquotients.
'''
COL-0172 = '''
Localize a prime filtration at a minimal point \(\mathfrak p\) of the support.
Only factors labelled by \(\mathfrak p\) survive, and each surviving factor
has length one over \(R_{\mathfrak p}\). Thus the number of these factors
equals \(\ell_{R_{\mathfrak p}}(M_{\mathfrak p})\).
'''
COL-0173 = '''
Over the local ring, a closed-point factor has finite length and its two
principal homology lengths cancel. In the dimension-at-most-one calculation,
the surviving prime-quotient Euler terms therefore carry the localized
multiplicities just computed.
'''

[[sections]]
id = "adic-completion"
title = "Adic completion and actual local branches"
order = 20
introduction = "The canonical finite-algebra tensor map, Chinese remainder decomposition and positive-power comparison identify actual completed local branches. Explicit quotient evaluations fix the maps and completed-base scalar actions. Native fraction-field pushouts then identify the completed fraction tensor product over all original branches, with the original localization and completion coordinates."

[[sections.topics]]
id = "finite-algebra-completions"
title = "Completion and integral branches"
start = "COL-0185"

[[sections.topics]]
id = "completed-fraction-fields"
title = "Fraction fields of completed branches"
start = "COL-0190"

[sections.transitions]
COL-0186 = '''
At each finite quotient level, the Chinese remainder maps give the coordinates
for a product of comaximal ideals. The comparisons with positive powers and with
localization at a maximal ideal specify how these coordinates pass to completions.
'''
COL-0187 = '''
Suppose the ideal factors as \(\prod_i\mathfrak m_i^{e_i}\), with distinct
maximal ideals and \(e_i>0\). The Chinese remainder comparison separates the
factors, the positive-power comparison replaces each \(\mathfrak m_i^{e_i}\)
by \(\mathfrak m_i\), and localization identifies the resulting branch completion.
'''
COL-0188 = '''
In a Dedekind domain, normalized prime factors of the nonzero ideal provide the
index set and the exponents in this factorization. Thus each coordinate of the
completion comes from the corresponding original localization.
'''
COL-0189 = '''
For a finite algebra \(R\to S\) with Dedekind target and nonzero extended ideal,
COL-0185 first identifies the completed-base tensor product with the completion
of \(S\). Composing with the branch equivalence specifies the completed-base
action on every branch and makes branch finiteness follow from the finite product.
'''
COL-0190 = '''
To pass from the integral tensor product to fraction fields, use the specified
fraction-field maps on both sides of the finite-product equivalence. A fraction
coordinate is determined by the images of its numerator and denominator,
which ties the new equivalence to the integral one.
'''
COL-0191 = '''
For the Dedekind branches, the original localizations and their completions
provide the DVRs in this construction. The local scalar maps and the
injectivity supplied by torsion-freeness determine the fraction maps.
'''
COL-0192 = '''
The integral decomposition in COL-0189 supplies the product coordinates, and
COL-0191 supplies the compatible DVR fraction actions. The resulting fraction
equivalence sends an original element to its original localization and
completion image in every branch.
'''

[[sections]]
id = "henselian-ramification"
title = "Henselian roots, ramification and DVR orders"
order = 30
introduction = "Simple-root Hensel lifting supplies residue-one roots for invertible exponents and normalizes actual uniformizer equations. The native local fundamental identity identifies the supplied ramification exponent and residue degree with the actual fraction-field degree, without a separate norm-order model. The existing fraction order is then identified with the actual negative valuation logarithm, including integer powers, poles and independence of a chosen irreducible."

[sections.transitions]
COL-1204 = '''
Over a strictly henselian base, extend the local root calculation of COL-0195
to an arbitrary finite algebra. Its native henselian product decomposition
has strictly henselian local factors. Roots in these factors recombine into
a root in the original algebra, including nonreduced finite boundaries.
'''
COL-0196 = '''
For a finite torsion-free extension of DVRs, let \(e\) be the exponent in the
given uniformizer equation and \(f\) the residue-field degree. The local
degree formula compares \(ef\) with the fraction-field degree. A prime degree
forces one of the two positive factors to be one.
'''
COL-0200 = '''
The uniformizer equation describes the order of a chosen element. To compare
arbitrary fractions, including poles, identify the intrinsic integer order
with the negative logarithm of the maximal-ideal valuation. This gives the
same normalization for powers and inverses.
'''

[[sections]]
id = "charpoly-branches"
title = "Characteristic polynomials and exact branch multiplicities"
order = 40
introduction = "Actual multiplication characteristic polynomials connect scalar extension, integral closures and DVR residue reduction. A supplied tensor decomposition yields the integral product identity; normalized factor counts then prove the exact ramification-weighted residue-branch multiplicities with all relative residue degrees retained."

[sections.transitions]
COL-1230 = '''
For a monic polynomial \(p\), multiplication by its root in the complete
quotient algebra has characteristic polynomial \(p\). Evaluating the
scalar-minus-root determinant gives \(N(a-\bar T)=p(a)\); retaining the
complete quotient is essential even when \(p\) is reducible.
'''
COL-0203 = '''
Under a tensor-product decomposition, multiplication by \(1\otimes x\) acts
on the factor indexed by \(i\) as multiplication by the \(i\)-th image of \(x\).
The characteristic polynomial of this block diagonal map is the product of
the characteristic polynomials of the factor maps.
'''
COL-0204 = '''
Over a DVR the integral multiplication map can be extended to the fraction
field or reduced to the closed fibre. In the fibre, the uniformizer exponent
counts the copies of the residue multiplication map in the length filtration.
This gives its power in the reduced characteristic polynomial.
'''
COL-0205 = '''
The tensor product supplies the product identity after extending scalars to
the fraction field. For compatible integral elements, both polynomials are
images of integral multiplication characteristic polynomials. Injectivity of
the coefficient map descends the identity to the DVR.
'''
COL-0206 = '''
In the reduced identity, several factors may have the same monic irreducible
polynomial. Normalized factor multiplicity adds their exponents. A power of
a squarefree polynomial prescribes the sum above each irreducible factor.
'''
COL-0207 = '''
For a branch indexed by \(i\), the exponent is its ramification exponent times
the degree of its residue field over the simple subfield generated by the
chosen residue. Applying the factor count to the reduced integral identity
gives the sum of these weights above each irreducible factor.
'''

[[sections]]
id = "sylow-field-reduction"
title = "Sylow fixed fields and normal prime subfields"
order = 50
introduction = "Sylow fixed fields control small-degree splitting, and fixed subgroups give normal prime subfields inside actual polynomial branches. The resulting degree comparisons govern irreducibility after coefficient extension and the simultaneous splitting of finite families."

[[sections.topics]]
id = "sylow-descent"
title = "Sylow descent and embedded branches"
start = "COL-0208"

[[sections.topics]]
id = "normal-prime-subfields"
title = "Normal prime subfields"
start = "COL-0210"

[[sections.topics]]
id = "polynomial-degree-comparisons"
title = "Polynomial factors and simultaneous splitting"
start = "COL-0222"

[sections.transitions]
COL-0209 = '''
When passing to an irreducible factor after coefficient extension, its
\(\operatorname{AdjoinRoot}\) quotient supplies the actual branch field. A
root in the specified splitting overfield gives the algebra embedding used
to compare that branch with the fixed fields.
'''
COL-0210 = '''
In a finite Galois \(p\)-extension, the fixing subgroup of a nontrivial
intermediate field is proper. An index-\(p\) overgroup is normal, so its
fixed field is normal of degree \(p\) and is contained in the given intermediate field.
'''
COL-0211 = '''
An embedded field is identified with its range in the Galois extension.
The normal subfield found in that range can be transported back along this
equivalence, with its degree and the remaining extension degree preserved.
'''
COL-0221 = '''
In characteristic zero the normal prime subextension is separable, so a
primitive element presents it by its minimal polynomial. The corresponding
root-field embedding lands in the original field via the transported inclusion.
'''
COL-0222 = '''
Let \(f\) be monic irreducible with normal root field. In the root field of an
irreducible scalar factor, the class of the root induces a map from the
original root field. The original roots carried by this map split the scalar
image of \(f\) in the literal factor root field.
'''
COL-0223 = '''
In characteristic zero a normal root field of prime degree \(p\) is Galois.
The automorphisms of a scalar-factor root field restrict to the original
Galois group. Their order gives the factor degree, hence is either \(1\) or \(p\).
'''
COL-0224 = '''
For a finite coefficient extension \(L/K\), let \(\alpha\) be the root of an
irreducible factor of the scalar image of \(f\). The degree of \(L(\alpha)/K\)
is divisible by \(\deg f\) through \(K(\alpha)\), and is \([L:K]\) times
the factor degree through \(L\). Coprimality then forces the factor degree
to be divisible by \(\deg f\).
'''
COL-0225 = '''
Over a perfect base, take the splitting field of the product of the finite
family and then the fixed field of a Sylow \(p\)-subgroup. The remaining
extension upstairs has \(p\)-power degree, so splitting descends for each
member of degree below \(p\). The degree of the fixed field over the base
is prime to \(p\), which also preserves monic irreducible degree-\(p\) polynomials.
'''
