[chapter]
id = "motivic-cohomology"
title = "Motivic Cohomology"
order = 55
introduction = '''The reduced transfer torus supplies the coefficients of the Suslin–Voevodsky complex. Algebraic-simplex chains, transfer-preserving Nisnevich sheafification and the specified cochain shift define \(\mathbb Z(q)\). Its ordinary underlying complex defines motivic cohomology by unbounded derived Hom, and projective evaluation computes these groups at the base field. The correspondence category and its Nisnevich reflection remain in COL-0366 and COL-0372; the ordinary simplex construction and general hypercohomology remain in COL-0348, COL-0395 and COL-0342.'''

[[sections]]
id = "reduced-transfer-tori"
title = "Split tori and their reduced transfer quotients"
order = 10
introduction = 'Relative powers of the native multiplicative group have actual identity-coordinate inclusions. Their graph correspondences define the relations in the reduced torus presheaf of [@MVW2006, Lecture 2, Definition 2.12, pp. 15–16].'

[sections.transitions]
COL-0384 = '''
Before forming a quotient of correspondence groups, fix the geometric maps:
the multiplicative group is the native base change, its base point represents
one, and its powers are relative products of smooth-site objects.
'''
COL-0385 = '''
Over a field, apply the graph functor to each identity-coordinate inclusion
from COL-0384 and then postcompose signed correspondences with that graph.
The cokernel of the sum of these maps has, section by section, the quotient
by all their images. Naturality of the projection fixes its transfer action.
'''

[[sections]]
id = "transfer-singular-complexes"
title = "Singular complexes with transfers"
order = 20
introduction = 'For an additive transfer presheaf \(P\), the terms \(P(U\times_k\Delta_k^r)\) retain the actual exterior correspondence action. Graph cofaces give the differential, and the Nisnevich reflection of COL-0372 applies to its terms and maps.'

[sections.transitions]
COL-0397 = '''
The quotient in COL-0385 is a presheaf with transfers, so its singular chains
must respect every correspondence. First construct these chains for an arbitrary
transfer presheaf. The ordinary comparison identifies their graph restriction
with COL-0348 on the same literal product sections; COL-0373 then compares the
two sheafifications.
'''

[[sections]]
id = "affine-line-invariance"
title = "Strict affine-line invariance"
order = 25
introduction = '''Use the ordinary Nisnevich projection on smooth schemes with transfer coefficients. Over a perfect field, homotopy invariance of the coefficient sheaf gives invariance of ordinary cohomology in each degree.'''

[sections.transitions]
COL-1029 = '''
The degree-zero comparison is restriction of sections. For positive degrees,
the proof uses the entire affine cylinder over each generic base open and
the original puncture along a smooth Cartier divisor.
'''

[[sections]]
id = "canonical-motivic-complexes"
title = "Canonical motivic complexes"
order = 30
introduction = 'Insert the reduced torus \(\widetilde L_q\) into the transfer singular construction. The canonical complex uses the signed shift by \(-q\); its comparison with the placement in degrees \(q-r\) specifies the factor \((-1)^{qr}\).'

[sections.transitions]
COL-0398 = '''
Write \(S_q(P)\) for the sheafified placement of the chains of COL-0397 in
degrees \(q-r\), with their original alternating differential. The signed
shift \(S_0(P)[-q]\) has the same occupied terms but multiplies the differential
by \((-1)^q\). Multiplication by \((-1)^{qr}\) in chain degree \(r\) gives
the comparison. Apply it to the reduced torus of COL-0385.
'''

[[sections]]
id = "motivic-hypercohomology"
title = "Motivic hypercohomology and base-field evaluation"
order = 40
introduction = 'Forget transfers from the actual signed complex to obtain \(K_q\) on the ordinary smooth Nisnevich site. Derived Hom from the free representing sheaf defines \(H^{p,q}(X,\mathbb Z)\). At the base object, the projectivity supplied by COL-0343 turns the definition into the literal sections-complex calculation of COL-0394.'

[sections.transitions]
COL-0399 = '''
Forgetting transfers applies to every term and to the signed differential in
COL-0398. Use that entire complex as the second derived-Hom variable in
COL-0342. A morphism \(f\colon X\to Y\) acts by precomposition with the
free-sheaf map associated to \(f\).
'''
COL-0400 = '''
For \(X=\operatorname{Spec}k\), COL-0343 supplies projectivity of the same
free representing sheaf. The comparison of COL-0394 therefore applies to
\(K_q\) in every integer degree. Its target is the cohomology of actual
sections of \(K_q\), not a replacement definition of the motivic groups.
'''

[[sections]]
id = "weight-one-norm"
title = "The geometric norm in weight one"
order = 50
introduction = 'For the reduced one-dimensional torus, the determinant norm takes signed finite correspondences to ordinary global units. Its boundary-one divisor kernel gives a quasi-isomorphism of the sheafified singular chain complexes.'

[sections.transitions]
COL-0401 = '''
Take the weight-one quotient of COL-0385 and forget its transfers. On integral
affine sources the forward torus coordinate has a determinant norm; the
identity-coordinate relation has norm one. Ordinary naturality extends this
map to the smooth site. The kernel must be compared with actual boundary-one
rational functions before passing from the norm to a quasi-isomorphism.
'''

[[sections]]
id = "weight-one-comparison"
title = "Units and the signed weight-one comparison"
order = 60
introduction = 'The unshifted norm target is still a singular complex. Its projection maps identify the simplicial units sheaf with constant units. Combining its contraction with the canonical signed shift gives the weight-one comparison and its effect on unbounded hypercohomology.'

[sections.transitions]
COL-0402 = '''
The target of COL-0401 records units on every product with a simplex. To
replace it by units in degree zero, use pullback along the actual projections,
then check that these isomorphisms respect all simplex operators.
'''
COL-0403 = '''
Compose the norm of COL-0401 with the contraction of COL-0402 before extending
chains into cochains. The source of the final map must be the signed complex
of COL-0398. Its ordinary comparison therefore carries the same shift and
the same differential sign through the composite.
'''
COL-0404 = '''
Apply the derived-Hom definition of COL-0399 to the particular map in
COL-0403. Postcomposition keeps the representing-sheaf restriction maps;
the shift by minus one changes degree p to p minus one. For a single sheaf,
the existing comparison with ordinary Ext identifies the resulting groups.
'''

COL-1008 = '''
At the base field, COL-0400 computes the hypercohomology of the actual source
of COL-0403. Its degree-one target is \(k^\times\). Track a literal point cycle
through the sheafification and signed-shift coordinates. The determinant norm
then determines both the forward map and its rational graph inverse.
'''

COL-1007 = '''
At the base field, the normalized integral comparison of COL-1008 sends the literal
rational graph to its unit. The original coefficient cone has positive
integral insertion, and degree-two integral weight-one cohomology vanishes.
Its exact sequence therefore reduces the finite computation to that same
unit group modulo actual powers. Retain the graph and norm formulas when
passing to the quotient, including at level zero and in positive characteristic.
'''

[[sections]]
id = "milnor-motivic-comparison"
title = "Low-degree comparison with motivic cohomology"
order = 65
introduction = '''
The original base-field motivic groups are computed from signed singular
chains by COL-0400. In weight zero, the structural graph gives the integer
degree. In weight one, the geometric norm of COL-1008 reads the rational
graph class as its unit. These calculations identify the first two native
Milnor groups with their diagonal motivic groups. COL-1026 gives the
comparison in all weights.
'''

[sections.transitions]
COL-1023 = '''
Under these identifications the empty Milnor symbol gives the structural
graph with coefficient one. A one-entry symbol gives the rational graph
with that coordinate.
'''

[[sections]]
id = "diagonal-motivic-comparison"
title = "Milnor K-theory and diagonal motivic cohomology"
order = 70
introduction = '''The base-field evaluation of COL-0400 identifies the diagonal with the homology of actual reduced torus cycles. Finite field extensions give pushforward on these cycles. Rational graphs and the Milnor relations connect the resulting groups with the Milnor K-theory of the base field.'''

[sections.transitions]
COL-1025 = '''
Finite pushforward preserves the signed cycles and the identity-coordinate
relations of COL-0385. Compare its two face maps on the full endpoint fibers
before applying the base-field comparison of COL-0400 to define the
derived transfer.
'''
COL-1026 = '''
The Milnor relations give the symbol map on rational graphs. The weighted
endpoint comparison shows that closed-point norms kill the boundary.
Finite pushforward in COL-1025 expresses each closed point as the
pushforward of its rational graph over its residue field.
'''
