[chapter]
id = "motivic-cohomology"
title = "Motivic Cohomology"
order = 55
introduction = '''
The coefficient in weight \(q\) is the reduced transfer presheaf of the
\(q\)-fold multiplicative group. Its sheafified singular chains, with the
signed weight shift, form \(\mathbb Z(q)\). Ordinary Nisnevich
hypercohomology defines the groups, and evaluation at the base field leads
to the norm in weight one and the comparison with Milnor \(K\)-theory.
See [@MVW2006, Lectures 3–5].
'''

[[sections]]
id = "reduced-transfer-tori"
title = "Reduced transfer tori"
order = 10
introduction = '''
Use the actual products of \(\mathbb G_m\) and the maps that insert the
unit \(1\) in one coordinate. Quotient the signed representable by the
images of those maps to obtain the reduced coefficient \(\widetilde L_q\).
See [@MVW2006, Lecture 2, Definition 2.12, pp. 15–16].
'''

[sections.transitions]
COL-0384 = '''
The relative products and the unit sections determine the coordinate
inclusions used to define the quotient.
'''
COL-0385 = '''
Postcompose correspondences with the graph of each coordinate inclusion.
The cokernel of their sum quotients out precisely the images of all
identity-coordinate maps.
'''

[[sections]]
id = "canonical-motivic-complexes"
title = "The signed motivic complex and its cohomology sheaves"
order = 20
introduction = '''
Apply the transfer singular construction of COL-0397 to \(\widetilde L_q\).
The shift by \(-q\) and its signed comparison with the placement in degrees
\(q-r\) fix the canonical complex \(\mathbb Z(q)\).
'''

[sections.transitions]
COL-0398 = '''
The sheafified term in chain degree \(r\) lies in cochain degree \(q-r\).
The signed shift multiplies the differential by \((-1)^q\).
Multiplication by \((-1)^{qr}\) in chain degree \(r\) identifies this shift
with the alternating-differential placement of COL-0397.
'''
COL-1031 = '''
Exact sheafification identifies the cohomology sheaf in degree \(i\leq q\)
with sheafification of raw singular homology in degree \(q-i\).
Use COL-1030 and COL-1028 for homotopy invariance, then COL-1029 for
ordinary cohomology over a perfect field.
'''

[[sections]]
id = "motivic-hypercohomology"
title = "Motivic cohomology and field evaluation"
order = 30
introduction = '''
Forget transfers from the signed complex to obtain \(K_q\). Its ordinary
Nisnevich hypercohomology defines \(H^{p,q}(X,\mathbb Z)\).
At \(X=\operatorname{Spec}k\), projectivity of the free representing sheaf
computes these groups by the complex of sections.
'''

[sections.transitions]
COL-0399 = '''
Apply the derived-Hom construction of COL-0342 to \(K_q\).
For \(f\colon X\to Y\), pullback is precomposition with the map of free
representing sheaves for \(f\).
'''
COL-0400 = '''
Use projectivity at the base object from COL-0343 in the comparison of
COL-0394. It identifies derived evaluation with the cohomology of actual
sections, using the same signed complex in both calculations.
'''

[[sections]]
id = "weight-one-norm"
title = "The geometric norm in weight one"
order = 40
introduction = '''
The determinant norm reads a signed correspondence to \(\mathbb G_m\)
as a global unit. Rational functions equal to one along the boundary
describe the kernel and give the unshifted quasi-isomorphism.
See [@MVW2006, Lecture 4].
'''

[sections.transitions]
COL-0401 = '''
Take the weight-one quotient of COL-0385. The determinant norm sends
the identity-coordinate relation to one, so it descends to that quotient.
The boundary-one divisor comparison identifies its kernel.
'''

[[sections]]
id = "weight-one-comparison"
title = "Weight-one cohomology and units"
order = 50
introduction = '''
Identify the simplicial units sheaf with constant units and apply the
canonical weight shift. The resulting comparison computes weight-one
hypercohomology. At the base field it identifies the rational graph with
its unit and computes finite coefficients by reduction modulo powers.
'''

[[sections.topics]]
id = "weight-one-signed-comparison"
title = "The units sheaf and the weight shift"
start = "COL-0402"

[[sections.topics]]
id = "weight-one-cohomology-calculations"
title = "Cohomology and field calculations"
start = "COL-0404"

[sections.transitions]
COL-0402 = '''
The norm target is the simplicial sheaf of units on the simplex products.
The product projections identify its terms with constant units and
respect the simplex operators.
'''
COL-0403 = '''
Compose the geometric norm with the units comparison, then carry the
composite through the signed placement of COL-0398.
'''
COL-0404 = '''
Postcompose the derived Hom of COL-0399 with the weight-one comparison.
The shift by minus one gives ordinary cohomology of units in degree
\(p-1\), with the original restriction maps.
'''
COL-1008 = '''
At the base field, evaluate by COL-0400 and trace the rational graph through
COL-0403. Its determinant norm is the original unit, and the
rational graph gives the inverse on that unit.
'''
COL-1007 = '''
Apply the coefficient cone to COL-1008. Positive integral
insertion and degree-two vanishing give units modulo powers in degree one,
with the inherited norm and graph formulas.
'''

[[sections]]
id = "milnor-motivic-comparison"
title = "Milnor symbols in weights zero and one"
order = 60
introduction = '''
The structural graph in weight zero gives the integer degree.
In weight one the rational graph records its unit by the geometric norm.
These two calculations identify the first two diagonal groups with
the corresponding Milnor \(K\)-groups.
'''

[sections.transitions]
COL-1023 = '''
The empty symbol corresponds to the structural graph with coefficient one.
The one-entry symbol corresponds to the rational graph at that coordinate.
'''

[[sections]]
id = "diagonal-motivic-comparison"
title = 'Milnor \(K\)-theory on the motivic diagonal'
order = 70
introduction = '''
Base-field evaluation identifies \(H^{q,q}(k,\mathbb Z)\) with homology of
reduced torus cycles. Finite pushforward supplies corestriction, and the
rational graph symbol identifies the diagonal in every weight with
Milnor \(K\)-theory. See [@MVW2006, Lecture 5].
'''

[sections.transitions]
COL-1025 = '''
Finite pushforward respects the signed cycles and the identity-coordinate
relations of COL-0385. Compare its two face maps before using COL-0400
to obtain corestriction on the diagonal groups.
'''
COL-1026 = '''
The Milnor relations give the rational graph symbol. The weighted endpoint
calculation shows that closed-point norms kill the boundary, and the
corestriction of COL-1025 expresses each closed point as a pushforward
of its rational graph over the residue field.
'''
