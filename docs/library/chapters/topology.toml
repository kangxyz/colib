id = "homotopy-colimits"
title = "Homotopy invariance of colimits"
order = 25
introduction = "Homotopy extension controls pushouts and sequential colimits. Compactness gives the filtered realization and reduced telescope comparisons, and a double-cylinder construction gives the finite excision range."

