[sections.transitions]
COL-0062 = '''
The coend presents a point by a simplex and its barycentric
coordinates. Equivalently, one can take the point in the realized
representable simplex and then realize the map classifying that simplex.
'''
COL-0063 = '''
The cylinder comparison is first computed on representables.
To extend it through the colimit presentation of a simplicial set,
one needs colimit preservation by each of the two cylinder functors.
On the topological side, exponentiation by the locally compact interval
is the right adjoint.
'''
COL-0065 = '''
For a representable \(n\)-simplex, the product prism is covered by
cells obtained by splitting one barycentric coordinate at the
interval height. The height and the vanishing split coordinates
describe the common faces of adjacent cells.
'''
COL-0067 = '''
On each closed prism cell, the inverse sends the split coordinates
to the corresponding point of the realized standard prism. Agreement
on the common faces lets these inverse charts glue to a continuous map.
'''
COL-0068 = '''
The canonical comparison is an isomorphism on standard simplices
by the prism calculation. The two colimit-preserving cylinder
constructions extend that comparison along the representable
presentation of an arbitrary simplicial set.
'''
COL-0069 = '''
The realized interval parameter takes the vertex \(\delta_1\) to
\(0\) and \(\delta_0\) to \(1\). This orientation determines which
topological inclusion corresponds to each simplicial endpoint.
'''
COL-0070 = '''
The endpoint identities turn the realization of a simplicial
homotopy into a homotopy on the topological cylinder. If the
simplicial homotopy is constant on the chosen vertex cylinder,
the entire corresponding interval is fixed at its realized point.
'''
COL-0081 = '''
An edge is a map out of the standard simplicial interval. Its
realization composed with the interval parametrization gives
the path, with the vertex orientation fixed by COL-0060.
'''
COL-0083 = '''
In the real two-simplex, the concatenation of the two short
edges and the long edge have the same endpoints. Convex
interpolation supplies an endpoint-fixed homotopy, whose image
under the specified simplex map gives the triangle relation.
'''
COL-0090 = '''
For a family of simplicial sets, each simplex of the degreewise
coproduct carries a summand index. Realization preserves this
coproduct, with the same index on each realized inclusion.
'''
COL-0091 = '''
The constant simplicial set on \(A\) is a coproduct of copies of
the simplicial point, indexed by \(A\). Its realization is
therefore the discrete union of the corresponding vertex points.
'''
COL-0098 = '''
Homotopy extension for a simplex attachment uses a retraction
from the simplex cylinder to its bottom and boundary cylinder.
The radial formula gives this retraction in the finite barycentric model.
'''
COL-0099 = '''
The radial defect identifies a strict superlevel region containing
the boundary. Restricting the radial deformation to this region
gives a boundary-fixed collar retraction.
'''
COL-0101 = '''
The affine map toward the barycenter scales the maximal defect by
three quarters. It moves the boundary into the interior while
keeping it in the collar. Together with radial segments, this
reduces path connectedness of the overlap to that of the boundary.
'''
COL-0102 = '''
The defect has value one on the attaching boundary. It thus
extends across the attachment by the value one on the old
space, and the strict superlevel region becomes a neighborhood
of the old-space image.
'''
COL-0103 = '''
The radial deformation fixes the boundary pointwise, so its maps
agree with the identity on the old space along the pushout locus.
On the open collar the resulting retraction is onto the old-space image.
'''
COL-0105 = '''
The collar and the disjoint simplex interiors cover the attachment.
Subdividing paths in this cover reduces the generators to
geometric-simplex paths and collar paths. The collar retraction
and its endpoint tracks express the latter using the old space.
'''
COL-0106 = '''
In dimension at least two, every collar–interior overlap is
path-connected and the interior is simply connected. The chart
argument of COL-0097 gives fullness on the collar, which retracts
to the old space.
'''
COL-0159 = '''
Realized skeletal attachments are iterated geometric pushouts.
Compact paths factor through a finite stage, and the fullness
of higher-dimensional attachments lets their classes be
represented in a stage containing all edges.
'''
COL-0108 = '''
The two boundary points of a one-simplex are its two endpoints.
For a parametrized graph attachment, paths from an interior
point toward these endpoints give the anchors that must be
compared with the original vertex and edge data.
'''
COL-0213 = '''
The simplex cylinder retraction gives the extension step at
each attaching cell. Applying it along the relative skeletal
cell complex and passing to the colimit yields homotopy extension
for the actual realized monomorphism.
'''
COL-0233 = '''
Simplicial replacement is assembled skeletally from the
diagram entries. Realized homotopy equivalences on those entries
give equivalences through the attaching pushouts and then on the
sequential colimit by COL-0215.
'''
COL-0242 = '''
For a general bisimplicial set, outer skeletal attachments use
the full rows and their degeneracy unions. Rowwise equivalences
can therefore be propagated through the latching pushouts.
The diagonal comparison transports the result to the iterated
realization.
'''
COL-0216 = '''
For ordinary twofold subdivision, the first-half endpoint gives
the map of realizations. Contractibility on subdivided representables
and the cellular comparisons extend its homotopy equivalence to
arbitrary simplicial sets.
'''
COL-0241 = '''
Reversing the first half of the ordinal join gives the edgewise
construction. Its forward comparison is induced by the second-half
endpoint, with the degenerate chosen vertex carried to the original one.
'''
COL-0220 = '''
For products, the canonical realization map is tested on compact
parameter spaces. Lifts of based cubes and of their boundary-fixed
homotopies give the comparison on homotopy groups.
'''

