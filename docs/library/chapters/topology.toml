[sections.transitions]
COL-0215 = '''
For a sequential diagram the homotopy extension step is
applied at each successor. The extensions give compatible
homotopies on the colimit comparison, starting from the
objectwise equivalences.
'''
COL-0238 = '''
A simplex of a nerve is a finite string of composable arrows.
Arrow surjectivity puts its arrows into stages, and eventual
object equality puts the incidence conditions into a common
stage. Faithfulness controls equality of the resulting strings.
'''
COL-0247 = '''
For arbitrary filtered simplicial diagrams, compact homotopy
lifting and extension uses the given realized transitions.
The resulting comparison concerns every realized leg into the
specified colimit.
'''
COL-0287 = '''
In a pushout comparison, the double cylinder records a path
between the two summands. Connectivity of the two attaching
maps bounds the connectivity of its gap by \(r+1\leq p+q\).
Point homotopy extension transfers this bound to the map from
the reduced cone into the inclusion fiber.
'''
COL-0339 = '''
A sequence of based spaces can be glued using cylinders between
successive stages, with the basepoint rays collapsed. For loop
prespectra the structure maps must descend through both kinds
of identifications, and the stage inclusions carry the resulting
adjacent-stage homotopies.
'''
COL-0350 = '''
For \(T_1\) stages, compact maps into the reduced telescope can
be represented up to relative homotopy in a finite stage.
Applying the same reduction to relative homotopies compares
representatives in a common later stage. These two statements
give the homotopy colimit comparison and its stable-group version.
'''
