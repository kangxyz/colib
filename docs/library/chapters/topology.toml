title = "Arrow paths and groupoid completion"
start = "COL-0084"

[[sections.topics]]
id = "comma-categories-and-fibers"
title = "Adjunctions, comma categories and fibers"
start = "COL-0231"

[sections.transitions]
COL-0053 = '''
If \(F\colon\mathcal C\to\mathcal D\) is a functor, the vertex of
\(X\) maps to the vertex of \(F(X)\). Thus the realized nerve map has the
basepoint equality required to act on the shifted homotopy groups.
'''
COL-0054 = '''
A target vertex may be specified independently of \(F(X)\). An isomorphism
\(F(X)\cong Y\) gives the transport to \(Y\), which fixes the basepoint
of the resulting homotopy-group map.
'''
COL-0058 = '''
A natural transformation gives maps at both ends of a simplicial cylinder.
At \(X\), the cylinder follows its component at \(X\). If that component
is the equality transport, the realized homotopy fixes the specified
vertex and can be used on based groups.
'''
COL-0084 = '''
A morphism \(u\colon X\to Y\) is a simplex of dimension one in the nerve.
Its realization, parametrized by the standard interval, gives a path
whose endpoints are the vertices of \(X\) and \(Y\).
'''
COL-0085 = '''
For composable arrows the nerve gives a two-simplex. Its triangle homotopy
identifies the concatenation of the two arrow paths with the path of the
composite, relative to the two outer vertices.
'''
COL-0092 = '''
Arrow-path classes are invertible in the fundamental groupoid. The
universal property of localization at all arrows therefore extends
the arrow-path functor from the original category to its groupoid completion.
'''
COL-0093 = '''
The localization functor also has a realized nerve map. On an original
arrow this map sends the arrow path to the path of the localized arrow,
so the two routes to the fundamental groupoid agree by the corresponding
comparison on these generators.
'''
COL-0161 = '''
To compare paths between original vertices, it helps to identify the
zero-skeleton inside the realization. In degree \(n\) its simplices
are the degenerate simplices of the original vertices, giving the
constant simplicial set on the objects.
'''
COL-0160 = '''
A path between vertices is represented up to endpoint-fixed homotopy
in a finite skeleton. The graph representatives express its class by
original arrows and their inverses, which are morphisms in the completion.
'''
COL-0239 = '''
Surjectivity identifies every path class with a completed arrow.
To test equality of two completed representatives, factor the relative
homotopy through a finite skeleton and use the decoder there. This gives
faithfulness and makes the comparison on based loops an isomorphism.
'''
COL-0231 = '''
The unit and counit of an adjunction are natural transformations from
an identity to one composite and from the other composite to an identity.
Realizing their nerve homotopies exhibits the adjoint functors as
homotopy inverses on the two classifying spaces.
'''
COL-0232 = '''
Comma categories measure the comparison for a general functor. If their
classifying spaces are contractible on the specified side, the realized
functor itself is the forward map of Quillen's Theorem A.
'''
COL-0248 = '''
For a target arrow, the comma construction has a transition functor.
When all of these transitions are realization homotopy equivalences, the
realized comma category at each target object compares to the homotopy
fiber of the realized map. The identity arrow specifies the vertex
for the based version of the comparison.
'''

[[sections]]
id = "homotopy-groups"
title = "Homotopy groups"
order = 20
introduction = "Pointed continuous maps act on actual generalized-loop homotopy quotients. Their group homomorphisms retain the existing multiplication and degree conventions."

[[sections.topics]]
id = "based-loop-maps"
title = "Based maps and homotopies"
start = "COL-0052"

[[sections.topics]]
id = "local-paths-and-stages"
title = "Local paths and sequential stages"
start = "COL-0087"

[[sections.topics]]
id = "pushout-paths"
title = "Paths in topological pushouts"
start = "COL-0094"

[sections.transitions]
COL-0071 = '''
A homotopy fixed at the specified basepoint gives a homotopy after
postcomposing any generalized loop. On the entire cube boundary the loop
is at that point, so the new homotopy is relative to the boundary and
gives equality in the based quotient.
'''
COL-0217 = '''
For an unbased homotopy equivalence, an equality of the chosen image
basepoint with the target basepoint specifies the forward homomorphism.
The inverse at the level of homotopy groups uses the equivalence data.
'''
COL-0087 = '''
Given an open cover of the image of a path, a subordinate subdivision
expresses the path as a concatenation of paths in single cover members.
This reduces generation of the path groupoid to the local arrows.
'''
COL-0088 = '''
In a sequential colimit, the compact image of a path is contained in
one stage under the \(T_1\) and injectivity hypotheses. With closed
successor embeddings, the factorization into a stage is continuous.
'''
COL-0089 = '''
For endpoints already in stage \(k\), factor the path continuously
through a stage at least \(k\). Fullness of the transition functors
then gives a path class in stage \(k\) with the same image.
'''
COL-0094 = '''
A cellular step is a pushout along an attaching locus. When the
attaching map is a closed embedding, its cobase change gives the
closed embedding of the other summand needed for a sequential tower.
'''
COL-0095 = '''
Away from the embedded attaching locus, a point of the attaching
summand is untouched by the identifications of the pushout. Its open
complement chart is therefore represented injectively, with image
disjoint from the opposite summand.
'''
COL-0097 = '''
For paths covered by \(U\) and disjoint simply connected charts,
subdivide into pieces lying in the cover members. If each chart
meets \(U\) in a path-connected subset, a piece in a chart between
points of the intersection can be replaced relative to its endpoints
by a path in \(U\).
'''


COL-0515 = '''
A homotopy under a source determines a specific basepoint track for a displayed
comparison. COL-0515 retains that track for nonabelian fundamental groups and
proves invariance of all target-local-system chains in the stated common
universe. The comparison and its homotopy are supplied; no comparison existence
or classical CW uniqueness theorem is asserted.
'''

[[sections]]
id = "geometric-realization"
title = "Geometric realization"
order = 30
introduction = "Coordinate comparisons retain the chosen realization, finite vertex sets, actual maps and interval orientation."

