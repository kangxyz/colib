[chapter]
id = "topology"
title = "Topology"
order = 40
introduction = "Geometric realizations and based homotopy groups retain their actual spaces, points and universe bounds."

[[sections]]
id = "classifying-spaces"
title = "Classifying spaces"
order = 10
introduction = "The realized nerve provides based homotopy groups, the comparison with groupoid completion, and the realized functors and comma-to-fiber maps of Quillen's Theorems A and B."

