[chapter]
id = "k-theory-rings-schemes"
title = "Algebraic K-Theory of Rings and Schemes"
order = 12
introduction = "Ring, field and scheme applications of general algebraic K-theory. The dimension calculation and the Quillen theory of module categories precede the geometric results. The comparison with Milnor symbols uses the Steinberg representatives of COL-0255. The finite-field calculations also use the vanishing result of COL-0279. The general chapter develops the abstract exact-category and Waldhausen constructions used here."

[[sections]]
id = "k-zero-of-fields"
title = '\(K_{0}\) of fields'
order = 10
introduction = '''Dimension identifies the Grothendieck group of finite-dimensional vector spaces with the integers. The standard exact structure gives the same map on the conflation presentation.'''

[sections.transitions]
COL-0020 = '''
For finite-dimensional vector spaces, the conflations of the
standard exact structure are the short exact sequences.
The comparison of COL-0019 identifies their object generators,
so the dimension computation applies to the conflation
presentation with the same normalization on the field.
'''

[[sections]]
id = "quillen-k-theory-of-rings"
title = "Quillen K-theory of rings and fields"
order = 30
introduction = '''Projective completion identifies its actual path components with the original exact \(K_0\). The original Milnor comparison identifies degree-two Quillen K-theory in characteristic zero. Over finite fields the degree-two groups vanish.'''

[sections.transitions]
COL-0378 = '''
Direct sum makes the isomorphism groupoid of finite projective modules symmetric monoidal.
Simultaneous translation of pairs then gives the actual completion category.
Its components record virtual projective classes; splitting of the inherited conflations
compares these classes with the original exact Grothendieck group.
'''

COL-0280 = '''
Over finite fields the original Milnor comparison is
surjective. The integral vanishing of the source in
COL-0279 therefore gives vanishing of both native
Quillen groups in degree two.
'''

[[sections]]
id = "g-theory-of-rings"
title = "G-theory of rings"
order = 40
introduction = '''Localization of finite modules over a Noetherian ring gives a connective sequence with an annihilator support condition. For a principal closed subset, dévissage identifies the supported group with the G-theory of the quotient ring.'''

[sections.transitions]
COL-0274 = '''
If \(r^nM=0\), the finite filtration by \(r^iM\) has
quotients annihilated by \(r\). Those factors are
modules over \(R/(r)\). Dévissage identifies the
supported term through the original restriction-of-scalars
map, so the localization boundary transports through
that same equivalence.
'''

[[sections]]
id = "k-theory-of-schemes"
title = "K-theory of schemes"
order = 50
introduction = '''Vector bundles and coherent sheaves give the scheme K-to-G comparison. Perfect complexes give open-support fibers and scalar boundary classes, and bounded-above flat models give pullback and affine coefficient prespectra.'''

[[sections.topics]]
id = "scheme-k-and-g"
title = "Vector bundles and coherent sheaves"
start = "COL-0285"

[[sections.topics]]
id = "relative-open-support"
title = "Open restriction and the supported fiber"
start = "COL-0230"

[[sections.topics]]
id = "scalar-cones"
title = "Scalar cones and the relative boundary"
start = "COL-0303"

[[sections.topics]]
id = "derived-restriction-image"
title = "Derived restriction image and fine localization"
start = "COL-0307"

[[sections.topics]]
id = "auxiliary-support"
title = "Auxiliary support and excision"
start = "COL-0331"

[[sections.topics]]
id = "flat-perfect-pullback"
title = "Flat perfect models and arbitrary pullback"
start = "COL-0322"

[[sections.topics]]
