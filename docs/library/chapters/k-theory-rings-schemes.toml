[sections.transitions]
COL-0286 = '''
On a quasi-compact regular scheme with the resolution
property, a coherent sheaf has a finite resolution by
finite locally free sheaves. Resolution applies to
the exact inclusion in COL-0285, so the comparison
uses that inclusion on \(K\)-groups.
'''
COL-0230 = '''
For perfect complexes, an open immersion
\(j\colon U\hookrightarrow X\) gives ordinary restriction
\(j^*\) on actual cochain complexes. Exactness for the
fine Waldhausen structures gives its canonical \(K\)-map.
'''
COL-0298 = '''
Write \(w_j\) for the weak class detected by quasi-isomorphisms
after \(j^*\). An object is acyclic for \(w_j\) exactly when
its restriction is acyclic. The corresponding support
category thus identifies with the acyclic category for
the change from the fine weak class to \(w_j\).
'''
COL-0300 = '''
For this change of weak equivalences, the identity-cone
cylinder and extension give the acyclic-to-fiber comparison.
Its inclusion and path-space boundary give the relative
exact sequence, with a degree-zero tail in the coarse
relative theory.
'''
COL-0303 = '''
Let a global scalar \(r\) act on a perfect complex \(P\)
and suppose it restricts to a unit on \(U\). Its signed cone
restricts to an acyclic complex. The scalar cylinder presents
that cone as an actual cofiber, so additivity applies to the
map from the identity sequence to the scalar sequence.
'''
COL-0316 = '''
Passing to positive-dimensional generalized loops carries
the full additivity square to a square of cubes with two
independent times. The fine identity and scalar cofiber
paths give its coarse edges, which identify the boundary
routes with the stipulated orientation.
'''
COL-0317 = '''
The coproduct in the sum comparison is ordered with
the quotient first. The normalized endpoint and the reversed
null path of the supported cone supply the two coordinates
of a cube in the canonical homotopy fiber.
'''
COL-0304 = '''
In degree one, take the independently defined forward scalar
loop. Its canonical fiber comparison gives the object class
of the signed cone. With the boundary of COL-0300, the cone
enters with positive sign.
'''
COL-0305 = '''
On \(U\) the scalar acts by the given global-unit
automorphism. The forward scalar class restricts to its
fine \(K_1\) class. The rank-one comparison identifies
the unit coordinate for structure sheaves and in the
affine and relative Laurent cases.
'''
COL-0320 = '''
On an original subdivision cube, the return path uses
the prescribed inverse inclusion and projection class.
The coordinate-zero connecting map compares its normalized
cube with the canonical fiber cube of the actual acyclic cone.
'''
COL-0324 = '''
The complete scalar tracks give raw and zero-normalized
self-track operations. Transport of the stored paths compares
these operations with the prescribed return on every
subdivision cube, preserving the positive cone image.
'''
COL-0329 = '''
The subdivision inputs represent every connective
\(K\)-class. Thus the cube calculation and injectivity of
the supported-to-fiber comparison identify the relative
boundary of the two scalar operations as homomorphisms
in each connective degree.
'''
COL-0307 = '''
For fine restriction, one needs roofs for the actual
restricted derived morphisms and a complement for a perfect
complex on the open. For a quasi-compact open in a qcqs
scheme, the roofs have global perfect denominators becoming
quasi-isomorphisms on the open. The complements give
stabilizations that are derived restrictions of global complexes.
'''
COL-0314 = '''
The derived image consists of the actual complexes on
the open that are derived-isomorphic to restrictions.
The roof hypothesis supplies its exact structure and the
incoming lifts used by approximation for the relative
restriction corestriction.
'''
COL-0315 = '''
Perfect complements give density of that image in the
fine category on the open. The cofinality comparison
identifies its positive groups with the fine groups and
its degree-zero group with the subgroup of actual
restriction classes.
'''
COL-0318 = '''
Under the roof and complement hypotheses, the positive
comparison inverses carry the relative boundary to the
fine theory on the open. In degree zero the exact tail
ends at the actual global restriction image. This is
also the degree-zero image of the connective spectrum map.
'''
COL-0319 = '''
The supported category identifies with the relative
acyclic category by the original exact flattening.
Iterating \(S\) transports the fiber map with its
inclusion coordinate and the entire original null path.
'''
COL-0330 = '''
For a quasi-compact open in a qcqs scheme, the geometric
roofs and complements of COL-0307 supply the preceding
hypotheses. The coarse connective spectrum maps to the
fine open spectrum with the positive isomorphisms and
the degree-zero restriction image just described.
'''
COL-0331 = '''
Fix an auxiliary open \(T\subseteq X\) and start with
perfect complexes acyclic on \(T\). Detect weak equivalences
by restriction along \(j\). The acyclic objects for the
new class are then the perfect complexes acyclic on
\(T\cup j(U)\), by the actual support flattening.
'''
COL-0332 = '''
When \(T\cup j(U)=X\), restriction and extension by zero
give exact adjoint functors on the supported categories.
Their unit and counit are quasi-isomorphisms, so the
induced realization maps are homotopy inverses.
'''
COL-0333 = '''
Suppose \(W=T\cup j(U)\) is quasi-compact in a qcqs
scheme. The supported roof has a perfect source
acyclic on \(T\), and its two legs are chain maps on \(X\).
For a perfect \(E\) on \(U\) with the prescribed support,
the stabilized extension restricts to \(E\oplus E[1]\),
with the shifted complement carrying the same support.
'''
COL-0334 = '''
The supported roofs give the exact derived-image model
and its incoming lifts. The shifted complements give
cofinality of the image, so coarse restriction is an
isomorphism in positive degrees and has exactly the
fine restriction image in degree zero.
'''
COL-0335 = '''
With the same compact union, the actual coarse spectrum
realizes this image comparison. The union-support
identification carries the whole acyclic nullhomotopy
and its fiber lift, also after canonical zero rebasing.
'''
COL-0336 = '''
Forgetting auxiliary support is the inclusion of one
supported category into the other. It commutes with
change of weak equivalences and the relative boundary.
When \(U\) and \(W\) are compact, this yields the fine
boundary square through the positive comparison inverses.
'''
COL-0337 = '''
At the prespectrum level, support inclusion carries
every time of the original nullhomotopy. The resulting
fiber square compares the signed stable boundaries,
whose relation to the connective boundaries retains
the minus sign in the \(K_1\)-to-\(K_0\) degree.
'''
COL-0322 = '''
For a morphism \(f\colon Y\to X\), termwise pullback
takes bounded finite locally free complexes on \(X\)
to such complexes on \(Y\). Flat quotients control
the inherited exact sequences and give the exact
pullback functor on these models.
'''
COL-0323 = '''
For arbitrary perfect complexes, an upper term bound
and flatness of the terms give a model for termwise
pullback. A bounded-above flat augmentation can use
the given cohomological bound, which exists for perfect
complexes on a quasi-compact space.
'''
COL-0325 = '''
On a quasi-compact ringed space, a map from a flat
model to a perfect complex factors through a cofibration
with flat perfect quotient followed by a quasi-isomorphism.
This supplies App2 for the literal inclusion of the
bounded-above flat models.
'''
COL-0326 = '''
Termwise pullback on the flat models composes by the
geometric pullback comparison, with exactness from
the flat quotients. When the morphism target \(X\)
is quasi-compact, the inverse of the inclusion comparison
on \(X\) gives the resulting pullback on all-perfect
\(K\)-theory.
'''
COL-0328 = '''
For a flat morphism or an open immersion, the flat-model
pullback square commutes with the literal inclusions
by the actual geometric natural isomorphism. This
identifies the transported map with the previously
defined exact pullback or fine restriction map.
'''
COL-0351 = '''
The same inclusion has a canonically zero-normalized
prespectrum map. On a compact ringed space its connective
\(K\)-isomorphisms identify the stable map as an
equivalence. Flat pullback carries the inclusion square
by a whole based prespectrum homotopy.
'''
COL-0352 = '''
The composition and unit isomorphisms of termwise
pullback satisfy the pseudofunctor coherence equations.
Restricting this pseudofunctor along \(\operatorname{Spec}\)
gives the affine coefficient diagram, with its identity
and composition transports.
'''
COL-0355 = '''
Evaluation at the identity of \(R\) identifies the
cocartesian sections with the original coefficient
fiber. Restriction along a ring map is literal
precomposition and preserves the chosen pointwise
zero. These exact restrictions give the strict
coefficient prespectrum after small models and
iteration of \(S\).
'''
COL-0380 = '''
For an open immersion \(j\colon U\hookrightarrow\operatorname{Spec}R\), impose
acyclicity after \(j^*\) on identity evaluation in COL-0355. Restricting its
categorical equivalence preserves the original sections and complexes. Their
independently chosen zeros are compared by a canonical normalization isomorphism,
which makes the actual evaluation a strict model map with coherent inverse tracks.
'''
COL-0358 = '''
For a fixed commutative ring \(R\), the evaluation equivalence of COL-0355,
followed by the small-model lift, gives the specified prespectrum map.
Normalize its actual categorical inverse at the chosen zero. The original
unit and counit then give whole inverse homotopies, hence level equivalences
and isomorphisms of stable homotopy groups in every integer degree.
'''
COL-0381 = '''
With fixed-ring evaluation in COL-0358 established, every ring map has an actual
coefficient comparison with normalized geometric pullback. Reverse the total-to-split
comparison and then compose with the total-to-whiskered comparison to recover the
original relative comparison from the geometric split route to the whiskered route. The identity coefficient route contracts to the
constant evaluation track. These are whole relative homotopies, retaining the
basepoint and independent structure coordinates. Actual perfect inclusion preserves
the relative tracks; only termwise perfect pullback naturality requires flatness.
'''
COL-0382 = '''
The supported evaluation of COL-0380 lands in bounded-flat perfect complexes.
For a quasi-compact scheme \(X\), bounded-flat replacement preserves acyclicity
on any open \(U\), including that of the admissible quotient. Thus the literal
inclusion into all supported perfect complexes satisfies approximation. Its
original \(K\)-map determines a stable equivalence, and the support-forgetting
square retains a whole coherent homotopy.
'''
COL-0383 = '''
Keep acyclicity on an auxiliary open \(T\), but test weak equivalences after
restriction to a second open \(U\). The same supported replacement of COL-0382
still gives approximation, with its original admissible quotient. Retargeting
the actual cylinder to this larger weak class compares the relative K-groups;
canonical zero normalization retains the whole change-of-weak square.
'''
COL-0501 = '''
The actual supported affine coefficient reindexing preserves support across every
specified open square. Its geometric comparison retains the inverse original
cocartesian transition. Exactness and literal preservation of the chosen zero give
the strict model diagram on fixed coefficient pullbacks and its full iterated-S
prespectrum functor. The identity-algebra object remains its actual pullback.
'''
COL-0359 = '''
Fully faithful identity evaluation lifts a global-unit
automorphism to the actual affine cocartesian sections.
For a commutative ring \(R\), the Laurent coordinate
\(T\) gives this action over \(R[T,T^{-1}]\).
Evaluation along a Laurent ring map identifies the two
directions with multiplication by the images of \(T\)
and \(T^{-1}\), and coefficient reindexing preserves
the whole isomorphism strictly.
'''
COL-0360 = '''
Reindex the forward unit of COL-0359 along the constant
inclusion \(c_R\colon R\to R[T,T^{-1}]\).
The zero-preserving exact section map and its unit
isomorphism give a based self-homotopy of the induced
prespectrum map. The strict coefficient square carries
the entire track, with homotopy time independent of the
structure coordinate and, in degree zero, the input-loop
coordinate.
'''
COL-0361 = '''
The two polynomial charts map \(R[X]\) to
\(R[T,T^{-1}]\) by \(X\mapsto T\) on the right
and \(X\mapsto T^{-1}\) on the bottom. Both source
composites are \(c_R\). In the mapping cone of the
strict-square comparison, let \(N\) be its source-cylinder
nullhomotopy and \(V\) the forward track of COL-0360
followed by cone inclusion. The loop is the reverse of
\(N\), followed by \(V\) followed by \(N\), with
right-associated concatenation. Naturality of both tracks
gives the coefficient-natural one-step Bass seed.
'''
COL-0379 = '''
To use the Laurent square of COL-0361 with a fixed affine open over
\(R\), retain the specified structure arrow \(R\to A\) at every corner.
Both routes from \(A\) to \(A[t,t^{-1}]\) are the coefficient inclusion,
although the two polynomial charts have opposite coordinates. Forgetting
\(R\) recovers the ring square, while its actual algebra arrows also
induce the contravariant maps between the chosen open pullbacks.
'''
COL-0503 = '''
The fixed-base Laurent square also acts on sections acyclic over the specified pullback open.
The forward coordinate gives the same unit track on these sections, while the original cone
cylinder supplies its null legs. Carrying both tracks through the actual support inclusion
compares the constructed supported seed with the ambient section seed before any affine
evaluation or nonconnective localization comparison.
'''
COL-0362 = '''
Iterate the strict polynomial and Laurent Bass functor
on the affine section prespectrum, carrying the proved
Laurent seed at every transition. Each original stage
is \(T_1\), and finite Bass separation propagates this to
all stages. The reduced quotient telescope therefore
has the canonical signed stable-group colimit comparison
of COL-0350, now natural for every coefficient map.
'''

COL-0375 = '''
The finite stages in COL-0362 retain more than \(T_1\) separation.
Their chosen points have the homotopy extension property. At level
\(n+i+2\), stage \(i\) has singleton homotopy sets in degrees below
\(n+2\), at every point. For a map from stage \(i\) to stage \(j\),
finite cone-fiber excision gives connectivity \(2n+2\) at level
\(n+\max(i,j)+2\). This increasing bound makes the original
source-to-cone-fiber comparison a stable equivalence.
'''
COL-0376 = '''
For a coefficient map \(f\colon R\to S\), apply COL-0375 to
