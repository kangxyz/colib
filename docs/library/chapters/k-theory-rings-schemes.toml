[chapter]
id = "k-theory-rings-schemes"
title = "Algebraic K-theory of rings and schemes"
order = 12
introduction = "Ring, field and scheme applications of general algebraic K-theory. Separate sections cover dimension, native Milnor K-theory, Quillen K-theory of module categories, and geometric K-theory. Abstract exact-category and Waldhausen theorems remain in the general chapter."

[[sections]]
id = "k-zero-of-fields"
title = "K₀ of fields"
order = 10
introduction = "Dimension computes the Grothendieck groups of native finite-dimensional vector spaces. The abelian and exact-structure presentations keep their original object classes and canonical comparison."

[[sections]]
id = "milnor-k-theory"
title = "Milnor K-theory"
order = 20
introduction = "The canonical graded object is the Steinberg quotient of the tensor algebra on the multiplicative group of a field. We first construct its homogeneous groups, then compare the degree-two component with the ordered-pair presentation. Ordered tuple symbols then expose coordinate additivity and adjacent Steinberg and sign identities directly on those homogeneous groups. Direct split evaluation and native reduced representatives give finite signed mixed-symbol expansions in the same homogeneous group. Finite witnesses precede all coefficient fields and actual factors; over a perfect base, a prime-degree root-field class then acquires its expansion in the root field of the whole coefficient image after one actual finite coprime extension. Native weak degree bounds and the shifted former strict bounds remain distinct. The literature references identify the defining relations and the scope of each comparison. Canonical DVR residues extend to actual completion through the native fraction-field lift and residue-field identification, preserving and reflecting residue vanishing. The native Milnor K₂ map sends ordered symbols directly to actual stable Steinberg kernel words, preserving field maps and the positive commutator marking. Native integral Milnor K₂ vanishes over every finite field, including F₂ and F₃. For finite torsion-free local DVR extensions of prime Galois fraction-field degree with characteristic-zero base residue field, actual completed normalization branches and classwise coprime-degree descent prove equality of the native chosen norm-residue composites."

[[sections]]
id = "quillen-k-theory-of-rings"
title = "Quillen K-theory of rings and fields"
order = 30
introduction = "Apply general Quillen K-theory to the actual finite-projective and finite-module categories. The ring and field constructions retain the original scalar-extension maps, stable completion and canonical Milnor comparison. The implemented characteristic-zero case of Matsumoto's theorem identifies Milnor K₂ with the original Quillen K₂. Steinberg's theorem gives vanishing over finite fields, including F₂ and F₃. These are ring and field theorems, not general categorical axioms."

[[sections]]
id = "g-theory-of-rings"
title = "G-theory of rings"
order = 40
introduction = "For native finite modules over a commutative Noetherian ring, actual localization at any multiplicative set gives the connective G-localization sequence with uniform-annihilator support. Powers of an element give principal closed support, and the original fraction-field K-map is retained definitionally. Actual quotient restriction and finite image devissage identify principal supported G-theory with G of the quotient ring, retaining the canonical closed pushforward and open localization sequence."

[[sections]]
id = "k-theory-of-schemes"
title = "K-theory of schemes"
order = 50
introduction = "Native vector bundles and coherent sheaves define upper small-model connective K-theory and G-theory. Their actual inclusion gives the canonical comparison, compatible with strictly functorial open restriction. On a quasi-compact regular scheme with the resolution property, actual finite resolutions prove this canonical K-to-G map is an equivalence in every nonnegative degree. Separately, open restriction of native perfect complexes induces its original canonical Waldhausen K-map. The open-detected weak structure has its acyclic category exactly equivalent to actual perfect complexes acyclic on the open, preserving canonical K-maps. Scalar cones and the positive Laurent coordinate retain their actual native maps. The actual scalar cylinder and signed quotient give the full identity-to-scalar based-additivity square, with all four whole faces and its two-time chosen-zero surface. For an arbitrary open immersion and a scalar restricting to a specified unit, the original relative connecting map sends the independently defined forward scalar K₁ class to the positive supported K₀ class of its actual signed mapping cone. This is a relative degree-one scalar formula, not a fine-open, Laurent-coordinate, Bass-sign or all-degree scalar formula. The independent fine K₁ class of the actual native global-unit automorphism is invariant under object isomorphisms and compatible with inversion and canonical fine restriction. The original coarse restriction sends the independently defined forward scalar class to this fine unit class, with actual rank-one comparisons, affine polynomial/Laurent specializations over every commutative ring and native relative Laurent specializations over every scheme. The scalar-cofiber class restricts to the inverse unit class. The original canonical fiber comparison and the full connective long exact sequence are proved for the relative coarse structure, including its K₀ tail. This does not identify relative coarse K-theory with fine perfect-complex K-theory on the open, assert surjectivity of fine open restriction on K₀, or give nonconnective localization."
