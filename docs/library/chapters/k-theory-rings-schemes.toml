[chapter]
id = "k-theory-rings-schemes"
title = "Algebraic K-Theory of Rings and Schemes"
order = 12
introduction = "Ring, field and scheme applications of general algebraic K-theory. Separate sections cover dimension, native Milnor K-theory, Quillen K-theory of module categories, and geometric K-theory. Abstract exact-category and Waldhausen theorems remain in the general chapter."

[[sections]]
id = "k-zero-of-fields"
title = '\(K_{0}\) of fields'
order = 10
introduction = "Dimension computes the Grothendieck groups of native finite-dimensional vector spaces. The abelian and exact-structure presentations keep their original object classes and canonical comparison."

[[sections]]
id = "milnor-k-theory"
title = "Milnor K-theory"
order = 20
introduction = 'The canonical graded object is the Steinberg quotient of the tensor algebra on the multiplicative group of a field. We first construct its homogeneous groups, then compare the degree-two component with the ordered-pair presentation. Ordered tuple symbols then expose coordinate additivity and adjacent Steinberg and sign identities directly on those homogeneous groups. Direct split evaluation and native reduced representatives give finite signed mixed-symbol expansions in the same homogeneous group. Finite witnesses precede all coefficient fields and actual factors; over a perfect base, a prime-degree root-field class then acquires its expansion in the root field of the whole coefficient image after one actual finite coprime extension. Native weak degree bounds and the shifted former strict bounds remain distinct. The literature references identify the defining relations and the scope of each comparison. Canonical DVR residues extend to actual completion through the native fraction-field lift and residue-field identification, preserving and reflecting residue vanishing. The native Milnor \(K_{2}\) map sends ordered symbols directly to actual stable Steinberg kernel words, preserving field maps and the positive commutator marking. Native integral Milnor \(K_{2}\) vanishes over every finite field, including \(F_{2}\) and \(F_{3}\). For finite torsion-free local DVR extensions of prime Galois fraction-field degree with characteristic-zero base residue field, actual completed normalization branches and classwise coprime-degree descent prove equality of the native chosen norm-residue composites.'

[[sections]]
id = "quillen-k-theory-of-rings"
title = "Quillen K-theory of rings and fields"
order = 30
introduction = '''Apply general Quillen K-theory to the actual finite-projective and finite-module categories. The ring and field constructions retain the original scalar-extension maps, stable completion and canonical Milnor comparison. The implemented characteristic-zero case of Matsumoto's theorem identifies Milnor \(K_{2}\) with the original Quillen \(K_{2}\). Steinberg's theorem gives vanishing over finite fields, including \(F_{2}\) and \(F_{3}\). These are ring and field theorems, not general categorical axioms.'''

[[sections]]
id = "g-theory-of-rings"
title = "G-theory of rings"
order = 40
introduction = "For native finite modules over a commutative Noetherian ring, actual localization at any multiplicative set gives the connective G-localization sequence with uniform-annihilator support. Powers of an element give principal closed support, and the original fraction-field K-map is retained definitionally. Actual quotient restriction and finite image devissage identify principal supported G-theory with G of the quotient ring, retaining the canonical closed pushforward and open localization sequence."

[[sections]]
id = "k-theory-of-schemes"
title = "K-theory of schemes"
order = 50
introduction = '''Native vector bundles and coherent sheaves define upper small-model connective K-theory and G-theory. Their actual inclusion gives the canonical comparison, compatible with strictly functorial open restriction. On a quasi-compact regular scheme with the resolution property, actual finite resolutions prove this canonical K-to-G map is an equivalence in every nonnegative degree. Separately, open restriction of native perfect complexes induces its original canonical Waldhausen K-map. The open-detected weak structure has its acyclic category exactly equivalent to actual perfect complexes acyclic on the open, preserving canonical K-maps. Scalar cones and the positive Laurent coordinate retain their actual native maps. The actual scalar cylinder and signed quotient give the full identity-to-scalar based-additivity square, with all four whole faces and its two-time chosen-zero surface. For an arbitrary open immersion and a scalar restricting to a specified unit, the original relative connecting map sends the independently defined forward scalar \(K_{1}\) class to the positive supported \(K_{0}\) class of its actual signed mapping cone. This is a relative degree-one scalar formula, not a fine-open, Laurent-coordinate, Bass-sign or all-degree scalar formula. The independent fine \(K_{1}\) class of the actual native global-unit automorphism is invariant under object isomorphisms and compatible with inversion and canonical fine restriction. The original coarse restriction sends the independently defined forward scalar class to this fine unit class, with actual rank-one comparisons, affine polynomial/Laurent specializations over every commutative ring and native relative Laurent specializations over every scheme. The scalar-cofiber class restricts to the inverse unit class. The original canonical fiber comparison and the full connective long exact sequence are proved for the relative coarse structure, including its \(K_{0}\) tail. This does not identify relative coarse K-theory with fine perfect-complex K-theory on the open, assert surjectivity of fine open restriction on \(K_{0}\), or give nonconnective localization. Given the precise global-perfect-model derived roof property, actual relative restriction induces a K-equivalence onto its honest derived image in every connective degree. The constructed opposite joint data, both endpoint orientations and genuine strict incoming lifts discharge the categorical approximation hypotheses. Inclusion recovers the original restriction K-map. Geometric roofs and complement/density remain separate. Actual native roofs and actual perfect-complement existence construct honest-image cofinality. The original inclusion and relative restriction are injective in every connective degree and bijective in positive degrees; degree zero identifies precisely the actual fine restriction image. With those explicit geometric inputs, the original fine boundary is uniquely determined by its relative composite, the three recurring positions and honest image tail are exact, and the actual coarse-to-fine prespectrum has this same stable-group profile. The actual acyclic-to-coarse-fiber map is a stable equivalence. COL-0319 transports it to the actual supported prespectrum with the original projection, whole nullhomotopy and structure maps, including coherent canonical rebasing and the original level-one K-map. Geometric existence and comparison to a separately prescribed image-cover spectrum remain separate. Independently, the actual scalar additivity cube retains its two times, four whole faces, fine paths, corners and oriented boundary homotopy. Actual sum normalization and the canonical fiber lift agree on every original subdivision cube. COL-0320 constructs the actual prescribed return, whole canonical-fiber homotopy and original connecting comparison with positive cone sign on every original subdivision cube, including \(n = 0\). COL-0324 identifies this prescribed return with the actual raw and normalized scalar K-operation through whole native AsSmall path transport. Genuine flat-morphism pullback is proved perfect and exact on the original functor, and whole scalar-unit tracks give finite restriction including \(\pi_{1}\), all-integer signed stable restriction and actual K-operation restriction. Both operations have the positive cone image under the original connecting map on every original subdivision cube, including \(n = 0\). The scalar-cone canonical-null square and rotated pasting are constructed. COL-0329 proves that the actual forward subdivision inputs cover every original connective K-class, including degree zero. Literal scalar projection descent therefore identifies the normalized and raw scalar self-track relative boundary as the positive supported cone homomorphism in every natural degree. Only the open immersion, scalar, specified unit and their restriction equality are required. The target remains the relative-open coarse theory, not fine perfect K-theory on the open. Fine/global qcqs transport, Bass and negative-degree boundaries, the independent flat-unit canonical-null family and object/row \(K_{1}\) applications remain separate. COL-0323 and COL-0325 construct the genuine bounded-above stalkwise-flat locally-perfect model, its exact/Waldhausen structure, actual joint cylinders and literal inclusion. Relative projective factorization and exact sheafification give the strict App2 triangle with a flat perfect quotient. Under CompactSpace alone, the literal inclusion K-map is bijective in every natural degree, including zero, and remains the forward map of the comparison equivalence. The upper-bound-only model is not replaced by finite-amplitude or globally finite-free complexes. Arbitrary pullback, supported comparison and global localization remain separate. COL-0322 constructs actual arbitrary bounded-vector-bundle pullback and its original canonical K-maps. COL-0326 constructs bounded-above flat perfect pullback and transports its canonical K-map through the literal inclusion equivalence to arbitrary perfect pullback, with compactness only on the target. Identity, composition and genuine contravariant functors retain the actual comparison maps. COL-0328 proves equality with independently constructed flat-morphism pullback and ordinary open restriction through the literal-inclusion natural-isomorphism square, in all natural degrees including zero. Its open-pair square assumes compactness only on the target scheme and target open. Coarse restriction is identified only after its canonical map to fine open K-theory. Supported/relative-pair maps and whole-prespectrum comparison remain separate.'''
