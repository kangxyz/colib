[chapter]
id = "k-theory-rings-schemes"
title = "Algebraic K-Theory of Rings and Schemes"
order = 12
introduction = "Ring, field and scheme applications of general algebraic K-theory. Separate sections cover dimension, native Milnor K-theory, Quillen K-theory of module categories, and geometric K-theory. Abstract exact-category and Waldhausen theorems remain in the general chapter."

[[sections]]
id = "k-zero-of-fields"
title = '\(K_{0}\) of fields'
order = 10
introduction = '''Dimension identifies the Grothendieck group of finite-dimensional vector spaces with the integers. The standard exact structure gives the same map on the conflation presentation.'''

[sections.transitions]
COL-0020 = '''
For finite-dimensional vector spaces, the conflations of the
standard exact structure are the short exact sequences.
The comparison of COL-0019 identifies their object generators,
so the dimension computation applies to the conflation
presentation with the same normalization on the field.
'''

[[sections]]
id = "milnor-k-theory"
title = "Milnor K-theory"
order = 20
introduction = '''The graded Steinberg quotient gives the Milnor symbols and their field maps. Their DVR residues, specialization and norm comparisons lead to bounded residue prescription over rational function fields and the degree-two applications.'''

