[chapter]
id = "k-theory-rings"
title = "Algebraic K-Theory of Rings"
order = 12
introduction = '''
For a ring $R$, let $\mathcal P(R)$ denote the exact category of finitely generated projective
right $R$-modules. The connective K-groups of $R$ are $K_n(R)=K_n(\mathcal P(R))$, defined by
Quillen's $Q$-construction [@Quillen1973, §2]. For a commutative Noetherian ring, the abelian
category $\mathcal M(R)$ of finitely generated modules instead defines
$G_n(R)=K_n(\mathcal M(R))$. These are different inputs to the same construction; their groups
are not identified without a comparison theorem.

The first section relates projective $K_0$ and the positive K-groups to group completion and the
plus construction. Change of rings compares tensor extension with matrix-image base change.
Over a field, dimension computes $K_0$ and Matsumoto's theorem identifies
$K_2$ with Milnor $K_2$. The last two sections apply localization and dévissage to the G-theory
of a localized ring and to the residue fields of a Dedekind domain.
'''

[[sections]]
id = "quillen-k-theory-of-rings"
title = "Projective modules and the plus construction"
order = 10
introduction = '''
The isomorphism groupoid $\mathcal S(R)$ of $\mathcal P(R)$ is symmetric monoidal under direct
sum. Its group completion has components indexed by
\[
\pi_0\bigl(B(\mathcal S(R)^{-1}\mathcal S(R))\bigr)\cong K_0(R),
\qquad [(A,B)]\longmapsto [B]-[A].
\]
Write $C_0(R)$ for the zero component in the specified projective completion model and let
$E(R)\subseteq \mathrm{GL}_{\infty}(R)$ be the stable elementary subgroup. The map
$B\mathrm{GL}_{\infty}(R)\to C_0(R)$ is a homological plus construction with respect to $E(R)$:
it surjects on $\pi_1$ with kernel $E(R)$ and is an isomorphism on homology with target local
coefficients in the stated universe.

The comparison with the Quillen $Q$-construction gives a homotopy equivalence
\[
K_0(R)_{\mathrm{disc}}\times C_0(R)\simeq\Omega BQ\mathcal P(R).
\]
It uses the specified completion component, not an arbitrary choice of plus model. The forward
comparison is natural up to homotopy; a natural inverse or a multiplicative splitting is not
asserted.
'''

[[sections.topics]]
id = "components"
title = "Virtual projective modules"
start = "COL-0378"

[[sections.topics]]
id = "plus-construction"
title = "The stable general linear group and its plus construction"
start = "COL-0513"

[[sections.topics]]
id = "q-loop-comparison"
title = "Comparison with the Quillen K-theory space"
start = "COL-0602"

[sections.transitions]
COL-0378 = 'Every short exact sequence in $\mathcal P(R)$ splits, so the direct-sum relations give the same Grothendieck group as the exact-category relations. The first component of $(A,B)$ is the denominator, giving the sign $[B]-[A]$; compare [@WeibelKBook, IV, Lemma 4.3.1].'
COL-0513 = 'The group-completion calculation gives $K_0$. On the zero component, the map from the stable general linear group exhibits the elementary subgroup as the kernel on $\pi_1$; the local-coefficient comparison supplies the homological plus property.'
COL-0602 = 'The comparison from the projective completion to the Quillen loop space restricts to a homotopy equivalence on the zero components, with its basepoint homotopy preserved.'
COL-0606 = 'The continuous $K_0$ map labels the open components of the loop space. Translating by a chosen loop in each component gives the product decomposition, with the identity representative chosen at zero.'

[[sections]]
id = "projective-base-change"
title = "Change of rings"
order = 15
introduction = '''
A ring map \(R\to S\) changes the coefficients of finite projective right modules
without a flatness hypothesis. Tensoring with \(S\) and applying the ring map
entrywise to representing idempotents give naturally isomorphic exact functors.
The comparison identifies their maps on Quillen groups, not merely the
isomorphism class of each image.
'''

[[sections]]
id = "k-zero-of-fields"
title = "$K_0$ of a field"
order = 20
introduction = '''
For a field $F$, every finitely generated module is a finite-dimensional vector space and is
projective. Dimension gives the isomorphism
\[
K_0(F)\xrightarrow{\sim}\mathbb Z,\qquad [V]\longmapsto\dim_F V,
\]
whose inverse sends $1$ to $[F]$. This calculation applies to the presentations by short exact
sequences and by conflations of the standard exact structure.
'''

[sections.transitions]
COL-0020 = 'In the standard exact structure the conflations are the short exact sequences. Under the comparison of the Grothendieck presentations (COL-0019), the class of a vector space, and hence its dimension, is unchanged.'

[[sections]]
id = "matsumoto-theorem"
title = "Matsumoto's theorem"
order = 30
introduction = '''
For every field $F$, the natural symbol map is an isomorphism
\[
K_2^M(F)\xrightarrow{\sim} K_2(F).
\]
The presentation by Steinberg symbols and the stable Steinberg group are developed separately
in the Milnor K-theory chapter. Here the target is Quillen $K_2$, in the projective-module and
finite-module presentations. In the finite-module presentation, the positive normalization sends
$\{a,b\}$ to the scalar action of $a$ on the positive $K_1$-class of $b$.

The classical Steinberg-kernel presentation is [@Matsumoto1969, §5, Theorem 5.10 and Corollary 5.11];
compare [@WeibelKBook, III, Theorem 6.1]. The formal comparison covers finite fields as well, including $\mathbb F_2$ and $\mathbb F_3$, by using the vanishing of their
Milnor $K_2$.
'''

[[sections.topics]]
id = "comparison"
title = "The natural symbol isomorphism"
start = "COL-0262"

[[sections.topics]]
id = "finite-fields"
title = "Finite-field vanishing"
start = "COL-0280"

[sections.transitions]
COL-0262 = 'The comparison uses the ordered-symbol map of COL-0255. The formula on ordered symbols fixes the sign convention, and the map commutes with extension of scalars.'
COL-0280 = 'For a finite field, COL-0279 gives $K_2^M(F)=0$. The symbol isomorphism gives the corresponding vanishing of Quillen $K_2$; the same holds in the stated finite-module G-theory presentation.'

[[sections]]
id = "g-theory-of-rings"
title = "G-theory of a localized ring"
order = 40
introduction = '''
Let $R$ be a commutative Noetherian ring and let $S\subseteq R$ be a multiplicative submonoid.
Write $\mathcal T_S\subseteq \mathcal M(R)$ for the Serre subcategory of modules annihilated
by some element of $S$. Localization gives a connective long exact sequence
\[
\cdots\longrightarrow G_{n+1}(S^{-1}R)\xrightarrow{\partial}
K_n(\mathcal T_S)\longrightarrow G_n(R)\longrightarrow G_n(S^{-1}R)\longrightarrow\cdots
\]
ending in $K_0(\mathcal T_S)\to G_0(R)\to G_0(S^{-1}R)\to0$
[@Quillen1973, §5, Theorem 5].

For $S=\{1,r,r^2,\ldots\}$, dévissage identifies $K_n(\mathcal T_S)$ with $G_n(R/(r))$
[@Quillen1973, §5, Theorem 4]. The closed-to-ambient map is restriction of scalars and the
open restriction is localization at $r$. The sequence does not require $r$ to be a
nonzerodivisor.
'''

[sections.transitions]
COL-0273 = 'Finite generation implies that an $S$-torsion module is killed by a single element of $S$. Thus $\mathcal T_S$ is the kernel of localization, and the Serre localization theorem applies.'
COL-0274 = 'If $r^mM=0$, the filtration by $r^iM$ has quotients that are $R/(r)$-modules. Dévissage identifies the term with support, and transporting the connecting map through that isomorphism preserves the specified sign.'

[[sections]]
id = "dedekind-residue-localization"
title = "Residue localization over Dedekind domains"
order = 55
introduction = '''
Let $R$ be a Dedekind domain with fraction field $F$. A finitely generated torsion module is a
finite direct sum of its primary parts. Dévissage identifies the K-groups of each primary
subcategory with the G-groups of its residue field. In the resulting localization sequence the
boundary out of $G_*(F)$ takes values in the direct sum of the residue-field groups
[@Quillen1973, §5, Corollary to Theorem 5]. Naturality identifies each residue coordinate
with the connecting map for the discrete valuation ring $R_{\mathfrak p}$, in the specified
degrees.
'''

[sections.transitions]
COL-0604 = 'Under the direct-sum isomorphism, membership in the image of generic localization is detected by the vanishing of each residue coordinate in the stated degrees. Lifting an arbitrary finite family of residue-field $G_1$ classes from $G_2(F)$ requires injectivity of $G_1(R)\to G_1(F)$.'
COL-0605 = 'If all residue fields are finite, their $G_2$ groups vanish. Exactness gives injectivity of $G_2(R)\to G_2(F)$; it does not give the $G_1$ injectivity used for the preceding lifting statement.'
COL-0609 = 'Localizing at a height-one prime gives a morphism of localization sequences. The residue coordinate agrees with the local discrete valuation ring boundary after scalar extension.'
COL-0610 = 'The coordinate comparison transfers the kernel criterion and the conditional $G_1$-class lifting statement to the local boundaries, with the same injectivity hypothesis.'
