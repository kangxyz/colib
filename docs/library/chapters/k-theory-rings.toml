[chapter]
id = "k-theory-rings"
title = "Algebraic K-Theory of Rings"
order = 12
introduction = "Let $R$ be a ring. Quillen K-theory applies the Q-construction to the exact category $\\mathcal P(R)$ of finite projective modules. Its degree-zero group records virtual projective modules, whereas the stable general linear group describes a different entry point through the plus construction. For a Noetherian ring, the abelian category of finite modules gives G-theory; it must not be confused with projective K-theory without an appropriate comparison theorem.\n\nWe first study projective completion and its zero component, then compute $K_0$ over a field. Matsumoto's theorem identifies $K_2^M(F)$ with Quillen $K_2(F)$; the symbol presentation itself remains in the Milnor K-theory chapter. Finally, localization and dévissage give the connective G-theory sequence for a principal closed/open pair. The results here do not assert a general decomposition of the entire K-theory space or a Bass fundamental theorem."

[[sections]]
id = "quillen-k-theory-of-rings"
title = "Projective modules and the plus construction"
order = 10
introduction = "Direct sum makes the isomorphism groupoid of $\\mathcal P(R)$ symmetric monoidal. Its group-completion category has objects represented by pairs $(A,B)$, with virtual class $[B]-[A]$. The first result identifies its components with $K_0(\\mathcal P(R))$.\n\nWrite $C_0(R)$ for the specified zero component of this completion and $E(R)\\subseteq GL_\\infty(R)$ for the stable elementary subgroup. The second result proves that the specified map $BGL_\\infty(R)\\to C_0(R)$ satisfies the homological plus-construction conditions: it kills precisely $E(R)$ on fundamental groups and preserves homology with all target local systems in the stated universe. It does not yet identify the full completion with $K_0(R)\\times BGL_\\infty(R)^+$."

[[sections.topics]]
id = "components"
title = "Virtual projective modules"
start = "COL-0378"

[[sections.topics]]
id = "plus-construction"
title = "The zero component and stable general linear group"
start = "COL-0513"

[sections.transitions]
COL-0378 = "Since every short exact sequence of projective modules splits, the direct-sum relations agree with the exact-category Grothendieck relations. The denominator is the first coordinate, explaining the sign $[B]-[A]$; compare [@WeibelKBook, IV, Lemma 4.3.1]."
COL-0513 = "The component calculation does not determine higher homotopy. To study the zero component, use the stable general linear map. Its surjection on fundamental groups has elementary kernel; the local-coefficient chain comparison then supplies the homological plus certificate."

[[sections]]
id = "k-zero-of-fields"
title = "$K_0$ of fields"
order = 20
introduction = "For a field $k$, every finite module is a finite-dimensional vector space. Dimension is additive on short exact sequences, so it induces\n\\[K_0(\\mathcal V_k)\\longrightarrow\\mathbb Z,\\qquad [V]\\longmapsto\\dim_kV.\\]\nThe class of $k$ gives its inverse. The two results below concern the short-exact-sequence and conflation presentations of this same invariant, not distinct K-theories."

[sections.transitions]
COL-0020 = "The standard exact structure has exactly the short exact sequences as conflations. COL-0019 identifies the object generators, so the dimension isomorphism carries over with $[k]\\mapsto1$ unchanged."

[[sections]]
id = "matsumoto-theorem"
title = "Matsumoto's theorem"
order = 30
introduction = "For a field $F$, Matsumoto's theorem gives\n\\[K_2^M(F)\\xrightarrow{\\sim}K_2(F).\\]\nThe Milnor symbol relations and stable Steinberg construction belong to the independent Milnor K-theory chapter. Here the comparison is made with the specified projective and finite-module Quillen groups. Its positive normalization sends $\\{a,b\\}$ to the scalar action of $a$ on the positive $K_1$-class of $b$.\n\nThe stable Steinberg-kernel presentation is [@Matsumoto1969, Section 5, Theorem 5.10 and Corollary 5.11]; compare [@WeibelKBook, III, Theorem 6.1]. The implementation treats finite fields separately using Milnor $K_2$ vanishing. Thus the statement includes every field, including $\\mathbb F_2$ and $\\mathbb F_3$."

[[sections.topics]]
id = "comparison"
title = "The natural symbol isomorphism"
start = "COL-0262"

[[sections.topics]]
id = "finite-fields"
title = "Finite-field vanishing"
start = "COL-0280"

[sections.transitions]
COL-0262 = "The ordered-symbol map of COL-0255 is the comparison map, not merely an unspecified abstract isomorphism. Its compatibility with scalar extension fixes both naturality and the sign convention."
COL-0280 = "For finite $F$, COL-0279 proves $K_2^M(F)=0$. Surjectivity of the same symbol comparison therefore gives $K_2(F)=0$ in each of the two Quillen models."

[[sections]]
id = "g-theory-of-rings"
title = "G-theory and localization"
order = 40
introduction = "Let $R$ be a commutative Noetherian ring and $S\\subseteq R$ a multiplicative submonoid. Let $\\mathcal T_S$ be the full subcategory of finite modules annihilated by some element of $S$. Localization gives the connective exact sequence\n\\[\\cdots\\longrightarrow G_{n+1}(S^{-1}R)\\xrightarrow{\\partial}K_n(\\mathcal T_S)\\longrightarrow G_n(R)\\longrightarrow G_n(S^{-1}R)\\longrightarrow\\cdots.\\]\nIts degree-zero tail ends in $G_0(S^{-1}R)\\to0$. For $S=\\{1,r,r^2,\\ldots\\}$, dévissage identifies the supported term with $G(R/(r))$. This is the principal closed/open localization sequence; no regular-element hypothesis is required."

[sections.transitions]
COL-0273 = "Finite generation turns elementwise S-torsion into annihilation by one element of S. The supported exact category is therefore the kernel of finite-module localization. The Serre-localization theorem from the general K-theory chapter applies to this actual functor."
COL-0274 = "If $r^nM=0$, the filtration by $r^iM$ has successive quotients annihilated by $r$, hence finite $R/(r)$-modules. Dévissage identifies the supported group through restriction of scalars. Transporting the localization boundary through that equivalence yields the closed/open sequence with the same sign."
