name: Colib CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner-profile:
        description: Runner profile for this CI run
        type: choice
        options: [ec2, hosted]
        default: ec2

permissions:
  contents: read

concurrency:
  # Keep attempts on the same ref in order.
  group: Colib CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/lean-ci.yml
    with:
      package-directory: .
      build-targets: Colib
      runner-labels: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && format('["colib-ci-run-{0}-{1}"]', github.run_id, github.run_attempt) || '["ubuntu-24.04"]' }}
      native-memory-mib: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 57344 || 13824 }}
      lake-threads: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 8 || 4 }}
      lint-workers: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 8 || 4 }}
      job-timeout-minutes: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 90 || 360 }}
      reuse-build-host: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) }}
      build-job-timeout-minutes: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 240 || 0 }}
      build-compiler-minutes: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && vars.COLIB_PARALLEL_RUNNER_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 180 || 0 }}
