name: Colib Cache Export
on:
  push:
    branches: [codex/etale-rigidity-frontier-20261112]
    paths: [.github/workflows/ci.yml]
permissions:
  contents: read
  actions: read
jobs:
  export-existing-caches:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore exact existing Stacks checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/ci-checkpoints/stacks.tar.zst
          key: colib-layered-v2-stacks-9845031f79bc7a61f7dbb6e27f1a12150a1eb35aae1effb4cf01a27c9a8cf840-65b205160caa63a3e8e99a118f603473c7e543428fbdba01b7932797f505742d
          fail-on-cache-miss: true
      - name: Restore exact existing Colib checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/ci-checkpoints/root.tar.zst
          key: colib-layered-v2-root-9845031f79bc7a61f7dbb6e27f1a12150a1eb35aae1effb4cf01a27c9a8cf840-refs/heads/codex/etale-rigidity-frontier-20261112-43174463891-1-build
          fail-on-cache-miss: true
      - name: Record archive hashes without compilation
        run: |
          sha256sum .lake/ci-checkpoints/stacks.tar.zst .lake/ci-checkpoints/root.tar.zst
          stat -c '%n %s bytes' .lake/ci-checkpoints/stacks.tar.zst .lake/ci-checkpoints/root.tar.zst
      - name: Export existing checkpoints only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: existing-colib-stacks-checkpoints
          path: |
            .lake/ci-checkpoints/stacks.tar.zst
            .lake/ci-checkpoints/root.tar.zst
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
