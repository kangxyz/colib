name: One-time existing Stacks artifact handoff

on:
  push:
    branches: [work/native-simple-norm-base-change]

permissions:
  contents: read

concurrency:
  group: Colib CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    name: Package existing artifact only, no compilation
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the exact successful bootstrap artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: 13599536563
          repository: kangxyz/colib
          run-id: 42429239364
          github-token: ${{ github.token }}
          path: input
          merge-multiple: true
      - name: Verify checkpoint identity and split the existing archive
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, tarfile
          from pathlib import Path
          
          source = Path('input/stacks.tar.zst')
          assert source.stat().st_size == 1229142025
          subprocess.run(['zstd', '-q', '-t', str(source)], check=True)
          process = subprocess.Popen(['zstd', '-q', '-dc', str(source)], stdout=subprocess.PIPE)
          try:
              with tarfile.open(fileobj=process.stdout, mode='r|') as archive:
                  header = next(iter(archive))
                  assert header.name == 'checkpoint.json' and header.isreg()
                  assert 0 < header.size < 256 * 1024**2
                  raw = archive.extractfile(header).read()
          finally:
              process.stdout.close()
              process.terminate()
              process.wait()
          metadata = json.loads(raw)
          assert metadata['layer'] == 'stacks'
          assert metadata['context'] == '9845031f79bc7a61f7dbb6e27f1a12150a1eb35aae1effb4cf01a27c9a8cf840'
          assert metadata['generation'] == '506a959c1f173224f685f78f368b631ddd14571264fc693d4ad4ae89b2e9d73d'
          entries = metadata['entries']
          assert len(entries) == 85320
          semantic = [{k: v for k, v in e.items() if k != 'mtime_ns'} for e in entries]
          assert hashlib.sha256(json.dumps(semantic, sort_keys=True, separators=(',', ':')).encode()).hexdigest() == metadata['generation']
          providers = [
              'StacksFrontier/AlgebraicGeometry/Chow/MilnorNorm/MilnorExactSequence',
              'StacksFrontier/AlgebraicGeometry/MeromorphicGenericPointDecomposition/Globalization',
          ]
          index = {e['path']: e for e in entries}
          coverage = []
          for module in providers:
              for suffix in ('.olean', '.olean.hash', '.trace'):
                  path = '.lake/packages/Stacks/.lake/build/lib/lean/' + module + suffix
                  entry = index[path]
                  assert entry['size'] > 0
                  coverage.append(entry)
          Path('metadata').mkdir()
          Path('metadata/checkpoint.json').write_bytes(raw)
          Path('parts').mkdir()
          parts = []
          archive_hash = hashlib.sha256()
          with source.open('rb') as stream:
              while chunk := stream.read(384 * 1024**2):
                  number = len(parts)
                  name = f'stacks.part-{number:03d}'
                  Path('parts', name).write_bytes(chunk)
                  archive_hash.update(chunk)
                  parts.append({'name': name, 'bytes': len(chunk), 'sha256': hashlib.sha256(chunk).hexdigest()})
          assert len(parts) == 4
          report = {
              'source_run_id': 42429239364,
              'source_commit': 'dd077748e9c5efe8980ff42cc1dcb8cfc0e05086',
              'source_artifact_id': 13599536563,
              'source_artifact_zip_sha256': '68435ae972fa0e3791df4970de51fa76056b6c8e1bc932f77c9184e67f4adf79',
              'transport': 'Pinned official actions/download-artifact; existing artifact only, no compilation',
              'archive': source.name,
              'archive_bytes': source.stat().st_size,
              'archive_sha256': archive_hash.hexdigest(),
              'checkpoint_sha256': hashlib.sha256(raw).hexdigest(),
              'generation': metadata['generation'],
              'context': metadata['context'],
              'entries': len(entries),
              'provider_coverage': coverage,
              'parts': parts,
          }
          Path('metadata/PARTS.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload manifest and transport checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rational-stacks-metadata
          path: metadata/
          compression-level: 0
          if-no-files-found: error
      - name: Upload existing archive part 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rational-stacks-part-000
          path: parts/stacks.part-000
          compression-level: 0
          if-no-files-found: error
      - name: Upload existing archive part 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rational-stacks-part-001
          path: parts/stacks.part-001
          compression-level: 0
          if-no-files-found: error
      - name: Upload existing archive part 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rational-stacks-part-002
          path: parts/stacks.part-002
          compression-level: 0
          if-no-files-found: error
      - name: Upload existing archive part 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rational-stacks-part-003
          path: parts/stacks.part-003
          compression-level: 0
          if-no-files-found: error
