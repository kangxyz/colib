name: EC2 runner pilot

on:
  workflow_dispatch:
    inputs:
      verify-handoff:
        type: boolean
        default: false
        description: Verify workspace continuity across two jobs
      stacks-modules:
        type: string
        default: ''
        description: Space-separated Stacks module names to build on EC2
      stacks-cache-key:
        type: string
        default: ''
        description: Exact Stacks cache key to export as an artifact without compiling

permissions:
  contents: read

concurrency:
  group: >-
    ${{ inputs.stacks-cache-key != '' && format('Colib Stacks export-{0}', github.ref) ||
        inputs.stacks-modules != '' && 'Colib Stacks EC2' || format('Colib CI-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  export-stacks:
    name: Export Stacks cache
    if: ${{ inputs.stacks-cache-key != '' && github.repository == 'kangxyz/colib' && github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STACKS_ARCHIVE: .lake/ci-checkpoints/stacks.tar.zst
    steps:
      - name: Restore the requested Stacks checkpoint
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.STACKS_ARCHIVE }}
          key: ${{ inputs.stacks-cache-key }}
          fail-on-cache-miss: true
      - name: Verify the exact cache hit and record the archive digest
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          sha256sum "$STACKS_ARCHIVE"
      - name: Upload the Stacks checkpoint artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-stacks
          path: ${{ env.STACKS_ARCHIVE }}
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error

  warm-stacks:
    if: ${{ inputs.stacks-cache-key == '' && inputs.stacks-modules != '' }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    uses: ./.github/workflows/lean-ci.yml
    with:
      stacks-only: true
      build-targets: ${{ inputs.stacks-modules }}
      runner-labels: '["self-hosted","linux","x64","colib-ec2"]'
      native-memory-mib: 57344
      lake-threads: 8
      lint-workers: 8
      build-job-timeout-minutes: 240
      build-compiler-minutes: 180

  probe:
    if: inputs.stacks-cache-key == '' && inputs.stacks-modules == '' && vars.COLIB_SELF_HOSTED_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, colib-ec2]
    timeout-minutes: 25
    outputs:
      host-runner: ${{ runner.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check host resources and native scope support
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cat /etc/os-release
          nproc
          free -h
          df -h /
          python3 -c 'import tomllib; print("Python TOML support available")'
          gh --version
          zstd --version
          sudo systemd-run --scope --quiet --collect \
            --property=MemoryMax=256M --property=MemorySwapMax=0 /bin/true
      - name: Measure GitHub endpoints
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            https://github.com/kangxyz/colib \
            https://api.github.com/repos/kangxyz/colib \
            https://raw.githubusercontent.com/kangxyz/colib/main/lean-toolchain; do
            for sample in 1 2 3; do
              curl --fail --silent --show-error --location \
                --connect-timeout 15 --max-time 60 --output /dev/null \
                --write-out "sample=$sample endpoint=$endpoint dns=%{time_namelookup}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n" \
                "$endpoint"
            done
          done
      - name: Measure a fresh repository clone
        shell: bash
        run: |
          set -euo pipefail
          time git clone --depth 1 --single-branch --branch main \
            https://github.com/kangxyz/colib.git "$RUNNER_TEMP/colib-network-probe"
          git -C "$RUNNER_TEMP/colib-network-probe" rev-parse HEAD
      - name: Measure a bounded Lean release download
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's|^leanprover/lean4:v\([0-9][0-9A-Za-z.+-]*\)$|\1|p' lean-toolchain)
          test -n "$version"
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 180 --range 0-16777215 \
            --max-filesize 16777216 --output "$RUNNER_TEMP/lean-download-probe" \
            --write-out 'release_http=%{http_code} bytes=%{size_download} seconds=%{time_total} bytes_per_second=%{speed_download}\n' \
            "https://github.com/leanprover/lean4/releases/download/v$version/lean-$version-linux.tar.zst"
      - name: Resolve the package toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake --version
      - name: Leave a workspace marker for the second job
        if: ${{ inputs.verify-handoff }}
        run: |
          grep -Fxq 'colib-ci-runner-v1' /etc/colib-ci-runner-mode
          sudo systemctl restart colib-ci-expiry.timer
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .same-host-probe

  handoff:
    name: Verify runner-local handoff
    needs: probe
    if: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && inputs.verify-handoff }}
    runs-on: [self-hosted, linux, x64, colib-ec2]
    timeout-minutes: 5
    steps:
      - name: Check the runner and workspace from the first job
        shell: bash
        env:
          HOST_RUNNER: ${{ runner.name }}
          BUILD_RUNNER: ${{ needs.probe.outputs.host-runner }}
        run: |
          test "$HOST_RUNNER" = "$BUILD_RUNNER"
          cmp .same-host-probe <(printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -f .same-host-probe
