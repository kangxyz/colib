name: Dependency warmup

on:
  workflow_dispatch:
    inputs:
      dependency:
        description: Pinned dependency to build
        type: choice
        options: [Mathlib, Stacks]
        required: true
      modules:
        description: Space-separated Lean module names in the selected dependency
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: Colib EC2
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  CI_CHECKPOINT_PATH: .lake/ci-checkpoints
  LAKE_NO_CACHE: 'true'
  LAKE_ARTIFACT_CACHE: 'false'

jobs:
  prepare:
    name: Check warmup request
    if: ${{ github.repository == 'kangxyz/colib' && github.ref_type == 'branch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      modules: ${{ steps.validate.outputs.modules }}
    steps:
      - name: Validate modules before starting EC2
        id: validate
        env:
          ENABLED: ${{ vars.COLIB_DEPENDENCY_WARMUP_ENABLED }}
          DEPENDENCY: ${{ inputs.dependency }}
          MODULES: ${{ inputs.modules }}
        run: |
          if [[ "$ENABLED" != true ]]; then
            echo '::error::The dependency warmup fleet has not been enabled.'
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re

          modules = list(dict.fromkeys(os.environ['MODULES'].split()))
          namespaces = {'Mathlib': {'Mathlib'}, 'Stacks': {'Stacks', 'StacksCore', 'StacksFrontier'}}
          allowed = namespaces[os.environ['DEPENDENCY']]
          if not modules or any(module.split('.')[0] not in allowed or not
                  re.fullmatch(r"[A-Za-z_][A-Za-z0-9_']*(?:\.[A-Za-z_][A-Za-z0-9_']*)*", module)
                  for module in modules):
              raise SystemExit('Specify one or more module names in the selected dependency.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('modules=' + ' '.join(modules), file=output)
          PY

  compile:
    name: Compile dependency modules
    needs: prepare
    runs-on: colib-dependency-warmup
    timeout-minutes: 240
    env:
      DEPENDENCY: ${{ inputs.dependency }}
      MODULES: ${{ needs.prepare.outputs.modules }}
      COMPILER_SCOPE: colib-warmup-${{ github.run_id }}-${{ github.run_attempt }}.scope
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize build paths and deadline
        run: |
          mkdir -p "$CI_CHECKPOINT_PATH"
          printf 'LAKE_CACHE_DIR=%s/lake-native-cache\nMATHLIB_CACHE_DIR=%s/mathlib-cache\nBUILD_DEADLINE=%s\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$(( $(date +%s) + 210 * 60 ))" >> "$GITHUB_ENV"
      - name: Configure pinned Lean
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci-cache/configure-lean.sh
      - name: Fetch pinned dependency sources
        timeout-minutes: 10
        run: lake env true
      - name: Validate the Stacks checkpoint context
        id: stacks-context
        if: inputs.dependency == 'Stacks'
        run: |
          python3 .github/ci-cache/checkpoint.py supported --root . --materialized
          python3 .github/ci-cache/checkpoint.py context --root . --github-output "$GITHUB_OUTPUT"
          revision=$(jq -er '.packages[] | select(.name == "Stacks") | .rev' lake-manifest.json)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Restore the cached Stacks checkpoint
        id: restore-stacks
        if: inputs.dependency == 'Stacks'
        continue-on-error: true
        uses: ./.github/actions/restore-checkpoint
        with:
          directory: ${{ env.CI_CHECKPOINT_PATH }}
          layer: stacks
          key: colib-layered-v2-stacks-${{ steps.stacks-context.outputs.stacks_context }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: colib-layered-v2-stacks-${{ steps.stacks-context.outputs.stacks_context }}-
      - name: Apply the Stacks checkpoint and published baseline
        if: inputs.dependency == 'Stacks'
        continue-on-error: true
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          STACKS_REVISION: ${{ steps.stacks-context.outputs.revision }}
          STACKS_CONTEXT: ${{ steps.stacks-context.outputs.stacks_context }}
        run: python3 -u .github/ci-cache/restore_stacks.py
      - name: Acquire the official Mathlib cache
        timeout-minutes: 15
        run: |
          if [[ "$DEPENDENCY" == Mathlib ]]; then
            read -r -a modules <<< "$MODULES"
            lake exe cache get "${modules[@]}"
          else
            lake exe cache get
          fi
      - name: Build the selected dependency modules
        id: build
        continue-on-error: true
        run: |
          read -r -a modules <<< "$MODULES"
          package=$DEPENDENCY
          if [[ "$package" == Mathlib ]]; then package=mathlib; fi
          targets=()
          for module in "${modules[@]}"; do targets+=("@$package/+$module"); done
          seconds=$(( BUILD_DEADLINE - $(date +%s) ))
          (( seconds > 0 ))
          if (( seconds > 180 * 60 )); then seconds=$((180 * 60)); fi
          available=$(( $(getconf _PHYS_PAGES) * $(getconf PAGE_SIZE) / 1048576 - 2048 ))
          (( available > 0 ))
          memory=57344
          if (( available < memory )); then memory=$available; fi
          printf 'Compiler memory %s MiB, Lake threads 8, cutoff %s seconds.\n' "$memory" "$seconds"
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          sudo --preserve-env systemd-run --scope --quiet --collect --unit="$COMPILER_SCOPE" \
            --uid="$(id -u)" --gid="$(id -g)" --property="MemoryMax=${memory}M" --property=MemorySwapMax=0 \
            /usr/bin/env "PATH=$PATH" LEAN_NUM_THREADS=8 \
            timeout --signal=INT --kill-after=60s "$seconds" \
            lake --verbose --no-ansi --log-level=info build "${targets[@]}" 2>&1 \
            | python3 -u .github/ci-cache/filter_lake_log.py
      - name: Stop the compiler scope before packing outputs
        id: quiesce
        if: ${{ always() && steps.build.outputs.attempted == 'true' }}
        timeout-minutes: 3
        run: |
          if [[ "$(sudo systemctl show -p LoadState --value "$COMPILER_SCOPE")" != not-found ]]; then
            sudo systemctl stop "$COMPILER_SCOPE" ||
              test "$(sudo systemctl show -p LoadState --value "$COMPILER_SCOPE")" = not-found
          fi
      - name: Pack completed Stacks outputs
        id: pack-stacks
        if: ${{ always() && !cancelled() && inputs.dependency == 'Stacks' && steps.quiesce.outcome == 'success' }}
        run: |
          python3 .github/ci-cache/checkpoint.py pack --root . --layer stacks \
            --output "$CI_CHECKPOINT_PATH/stacks.tar.zst" --github-output "$GITHUB_OUTPUT"
      - name: Save the Stacks checkpoint for subsequent builds
        if: ${{ always() && !cancelled() && steps.pack-stacks.outcome == 'success' && (steps.pack-stacks.outputs.changed == 'true' || steps.restore-stacks.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.CI_CHECKPOINT_PATH }}/stacks.tar.zst
          key: colib-layered-v2-stacks-${{ steps.stacks-context.outputs.stacks_context }}-${{ steps.pack-stacks.outputs.generation }}
      - name: Upload the Stacks checkpoint
        if: ${{ always() && !cancelled() && steps.pack-stacks.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.build.outcome == 'success' && 'build-stacks' || 'build-stacks-partial' }}
          path: ${{ env.CI_CHECKPOINT_PATH }}/stacks.tar.zst
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - name: Stage the Mathlib module closure
        if: inputs.dependency == 'Mathlib' && steps.build.outcome == 'success' && steps.quiesce.outcome == 'success'
        run: |
          read -r -a modules <<< "$MODULES"
          staged="$RUNNER_TEMP/mathlib-staged"
          mkdir -p "$staged"
          lake exe cache stage! --staging-dir="$staged" "${modules[@]}"
          MATHLIB_CACHE_DIR="$staged" lake exe cache lookup "${modules[@]}"
          tar -cf "$RUNNER_TEMP/mathlib-cache.tar" -C "$staged" .
      - name: Upload the Mathlib cache
        if: inputs.dependency == 'Mathlib' && steps.build.outcome == 'success' && steps.quiesce.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-mathlib
          path: ${{ runner.temp }}/mathlib-cache.tar
          compression-level: 0
          if-no-files-found: error
      - name: Report the compiler result
        if: ${{ always() && !cancelled() }}
        env:
          RESULT: ${{ steps.build.outcome }}
        run: |
          printf '## %s warmup\n\nModules\n\n`%s`\n\nBuild result **%s**\n' \
            "$DEPENDENCY" "$MODULES" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success
